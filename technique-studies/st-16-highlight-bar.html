:root{ color-scheme:only light;
  --ground:#FFFFFF; --ink:#15140F; --grey:#7E7D75; --grey-2:#B6B5AD;
  --hair:rgba(18,16,12,.17); --hair-2:rgba(18,16,12,.08);
  --disp:'Geist','Helvetica Neue',Arial,sans-serif;
  --text:'Geist','Helvetica Neue',Arial,sans-serif; --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --accent:#C40021; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#fff;height:100%;}
body{font-family:var(--text);color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.68;overflow:hidden;}
a{color:inherit;text-decoration:none;}
button{font:inherit;}
.plate{position:fixed;inset:18px;border:1px solid var(--hair);display:grid;grid-template-columns:400px 1fr;grid-template-rows:minmax(0,1fr);background:#fff;}
.notes{border-right:1px solid var(--hair);padding:clamp(48px,8vh,84px) 36px 26px 36px;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden auto;scrollbar-width:none;}
.notes::-webkit-scrollbar{display:none;}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);margin:0 0 clamp(14px,2.6vh,26px);}
.lede{font-family:var(--disp);font-weight:600;font-size:clamp(24px,min(2.5vw,4.1vh),38px);line-height:1.04;letter-spacing:-.02em;margin:0 0 clamp(14px,2.6vh,26px);max-width:16ch;}
.body{font-size:clamp(12.5px,1.6vh,14px);line-height:1.62;max-width:40ch;color:var(--ink);}
.body p{margin:0 0 12px;} .body p:last-child{margin:0;}
.meta{margin-top:auto;padding-top:clamp(12px,2vh,18px);border-top:1px solid var(--hair);display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;}
.meta h2{margin:0 0 6px;font-family:var(--mono);font-weight:400;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);}
.meta .nm{font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:-.01em;line-height:1.15;}
.meta .ro{font-family:var(--mono);font-size:11px;color:var(--grey);letter-spacing:.04em;margin-top:2px;line-height:1.5;}
.meta .tags{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:6px;}
.meta .tags span{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:lowercase;color:var(--ink);border:1px solid var(--hair);padding:2px 6px;}
.ctl{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;}
.ctl button{all:unset;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey);border:1px solid var(--hair);padding:6px 10px;line-height:1;}
.ctl button:hover,.ctl button:focus-visible{color:var(--ink);border-color:var(--ink);}
.ctl button.on{color:#fff;background:var(--ink);border-color:var(--ink);}
.figure{position:relative;min-width:0;min-height:0;}
.cvwrap{position:absolute;inset:0;} .cvwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
.log{position:absolute;right:28px;top:96px;width:236px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);line-height:20px;font-variant-numeric:tabular-nums;}
.log .lh{display:flex;justify-content:space-between;align-items:baseline;color:var(--grey);letter-spacing:.2em;margin-bottom:4px;line-height:20px;}
.log .r{display:grid;grid-template-columns:24px 44px 44px 1fr;gap:0 10px;white-space:nowrap;cursor:pointer;outline:none;position:relative;transition:opacity .2s;margin:0 -6px;padding:0 6px;}
.log .r span:nth-child(n+2){color:var(--grey);}
.log .r.on,.log .r:focus-visible{background:var(--hair-2);} .log .r.on span:nth-child(4),.log .r:focus-visible span:nth-child(4){color:var(--ink);}
.log .r.blank span{color:var(--grey-2);}
.log .read{margin-top:12px;padding-top:10px;border-top:1px solid var(--hair);text-transform:none;letter-spacing:0;font-family:var(--text);font-size:11.5px;line-height:1.55;color:var(--ink);min-height:64px;}
.log .read b{font-weight:400;display:block;letter-spacing:.16em;text-transform:uppercase;font-size:9.5px;color:var(--grey);margin-bottom:4px;}
.log .read code{font-family:var(--mono);font-size:10px;color:var(--grey);display:block;white-space:pre-wrap;margin-top:6px;letter-spacing:0;line-height:1.5;}
.log .fid{margin-top:12px;padding-top:10px;border-top:1px solid var(--hair);}
.log .fid .fh{color:var(--grey);letter-spacing:.2em;margin-bottom:2px;}
.log .fid .fr{display:grid;grid-template-columns:1fr 44px;gap:0 10px;}
.log .fid .fr span:last-child{text-align:right;color:var(--ink);}
.log .fid .fr.sum span{color:var(--ink);}
.log .fid .bar{height:2px;background:var(--hair-2);margin:6px 0 2px;position:relative;}
.log .fid .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);}
.tb{position:absolute;right:0;bottom:0;display:grid;grid-template-columns:auto auto;border-left:1px solid var(--hair);border-top:1px solid var(--hair);font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey);background:#fff;z-index:4;}
.tb div{padding:7px 14px;border-bottom:1px solid var(--hair-2);border-right:1px solid var(--hair-2);white-space:nowrap;}
.tb div:nth-child(2n){border-right:0;color:var(--ink);} .tb div:nth-last-child(-n+2){border-bottom:0;}
.tb .mark{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:-.01em;text-transform:none;color:var(--ink);border-right:0;}
.spec{position:fixed;inset:18px 18px 18px auto;width:min(560px,60vw);background:#fff;border-left:1px solid var(--hair);z-index:50;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .25s cubic-bezier(.2,.7,.2,1);}
.spec.open{transform:none;}
.spec .sh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--hair);font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);}
.spec .sh span b{font-weight:400;color:var(--ink);}
.spec .sh button{all:unset;cursor:pointer;color:var(--grey);letter-spacing:.18em;text-transform:uppercase;font-size:10px;padding:4px 0 4px 14px;} .spec .sh button:hover{color:var(--ink);}
.spec pre{margin:0;padding:18px;overflow:auto;font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--ink);flex:1;white-space:pre;tab-size:2;}
.spec pre .k{color:var(--grey);} .spec pre .s{color:var(--accent);} .spec pre .n{color:#1E6FE0;}
.spec pre .hl{background:rgba(196,0,33,.07);}
@media (max-width:960px){
  body{overflow:auto;} .plate{position:static;margin:12px;display:block;}
  .notes{border-right:0;border-bottom:1px solid var(--hair);padding:60px 22px 26px;overflow:visible;} .notes .meta{margin-top:26px;}
  .figure{display:flex;flex-direction:column;} .cvwrap{position:relative;height:70vh;min-height:320px;}
  .log{position:static;width:auto;padding:6px 22px 14px;border-top:1px solid var(--hair-2);}
  .tb{position:static;grid-template-columns:1fr;border-left:0;font-size:8.5px;} .tb .mark{grid-column:1!important;} .tb div{white-space:normal;padding:6px 22px;border-right:0;}
  .spec{width:100vw;inset:0;}
}
/* live plates: extra controls in the notes column */
.meta .params{grid-column:1/3;margin-top:4px;display:grid;gap:6px;}
.meta .prow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);}
.meta .prow .pv{color:var(--ink);font-variant-numeric:tabular-nums;text-align:right;letter-spacing:.04em;}
.meta .prow input{grid-column:1/3;margin:0;width:100%;}
.meta .prow input[type=range]{accent-color:var(--ink);height:16px;}
.meta .prow input[type=text]{font:inherit;font-family:var(--mono);font-size:13px;letter-spacing:.04em;text-transform:none;color:var(--ink);background:#fff;border:1px solid var(--hair);padding:5px 8px;border-radius:0;}
.meta .prow input:focus-visible{outline:1px solid var(--ink);outline-offset:1px;}
.meta .livehud{grid-column:1/3;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);line-height:1.6;font-variant-numeric:tabular-nums;white-space:pre-wrap;min-height:16px;}
.meta .ctl button.on{color:#fff;background:var(--ink);border-color:var(--ink);}
/* measured plates (ST-13 on): the instrument. Additions only; everything above is the ST-11 shell, and each part below is cut from one of its parts:
   a group label is the track log's header row, a group break is the log's hairline, a slider is the fidelity bar with a square handle,
   presets, choices and the Motion / Live toggles are toolbar buttons, a color is a flat chip framed the way the figure is framed. */
:root{--ar:1.00000;}
.mp{grid-column:1/3;min-width:0;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);line-height:20px;font-variant-numeric:tabular-nums;}
.mp .livehud{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);line-height:1.6;font-variant-numeric:tabular-nums;white-space:pre-wrap;min-height:48px;}
.mp .grp{margin-top:12px;padding-top:10px;border-top:1px solid var(--hair);min-width:0;}
.mp .gh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 4px;font:inherit;font-weight:400;letter-spacing:.2em;color:var(--grey);}
.mp .gh span:last-child{text-align:right;letter-spacing:.12em;} .mp .gh span.v{color:var(--ink);}
.mp .prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:baseline;color:var(--grey);margin-top:4px;}
.mp .prow .pv{color:var(--ink);text-align:right;letter-spacing:.04em;}
.mp .prow .ph{grid-column:1/3;font-family:var(--text);font-size:11px;line-height:1.45;letter-spacing:0;text-transform:none;color:var(--grey);padding-bottom:4px;}
.mp .prow input{grid-column:1/3;margin:0;width:100%;min-width:0;}
.mp .prow input[type=text]{font:inherit;font-family:var(--mono);font-size:13px;line-height:1.3;letter-spacing:.04em;text-transform:none;color:var(--ink);background:#fff;border:1px solid var(--hair);padding:5px 8px;border-radius:0;margin:2px 0 4px;}
.mp .prow input[type=text]:hover{border-color:var(--grey-2);}
.mp .prow input[type=text]:focus-visible{outline:1px solid var(--ink);outline-offset:1px;}
/* slider: a hairline for the range, a 2 px ink rule up to the value, a flat ink square on it */
.mp .prow input[type=range]{--t:9px;-webkit-appearance:none;appearance:none;height:16px;padding:0;background:transparent;border:0;border-radius:0;cursor:ew-resize;touch-action:pan-y;}
.mp .prow input[type=range]::-webkit-slider-runnable-track{height:16px;border:0;border-radius:0;background:linear-gradient(var(--ink),var(--ink)) 0 50%/calc(var(--t)/2 + (100% - var(--t))*var(--f,0)) 2px no-repeat,linear-gradient(var(--hair),var(--hair)) 0 50%/100% 1px no-repeat;}
.mp .prow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:var(--t);height:var(--t);margin-top:calc((16px - var(--t))/2);border:0;border-radius:0;background:linear-gradient(var(--ink),var(--ink)) 50% 50%/9px 9px no-repeat;}
.mp .prow input[type=range]::-moz-range-track{height:1px;border:0;background:var(--hair);}
.mp .prow input[type=range]::-moz-range-progress{height:2px;background:var(--ink);}
.mp .prow input[type=range]::-moz-range-thumb{width:9px;height:9px;border:0;border-radius:0;background:var(--ink);}
.mp .prow input[type=range]:focus-visible{outline:1px solid var(--ink);outline-offset:2px;}
.mp .prow input[type=range]:disabled{opacity:.35;cursor:default;}
@media (pointer:coarse){ .mp .prow input[type=range]{--t:28px;height:28px;} .mp .prow input[type=range]::-webkit-slider-runnable-track{height:28px;} .mp .prow input[type=range]::-webkit-slider-thumb{margin-top:0;} }
.ctl button[hidden]{display:none;}   /* the compare button has no reference to show here; the shell hides it, and all:unset must not undo that (same line as the T&T shell) */
/* toolbar buttons inside the instrument: presets and choices */
.mp .ctl{margin:4px 0 2px;}
.mp .prow .ctl{grid-column:1/3;margin:2px 0 4px;}
/* color: one flat chip per palette; the one in use takes an ink frame at the figure's 2 px stand-off */
.mp .pal{display:flex;flex-wrap:wrap;gap:10px;padding:6px 3px 4px;}
.mp .pal button{all:unset;cursor:pointer;display:flex;border:1px solid var(--hair);outline:1px solid transparent;outline-offset:2px;}
.mp .pal button b{display:block;width:10px;height:16px;}
.mp .pal button:hover,.mp .pal button:focus-visible{border-color:var(--ink);}
.mp .pal button.on{border-color:var(--ink);outline-color:var(--ink);}
/* fidelity: the live benchmark, a ruled table in the log */
.log .fid.mpf .fr{grid-template-columns:minmax(0,1fr) auto;}
.log .fid.mpf details{margin-top:2px;}
.log .fid.mpf summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;color:var(--grey);outline:none;}
.log .fid.mpf summary::-webkit-details-marker{display:none;}
.log .fid.mpf summary::after{content:'+';color:var(--ink);}
.log .fid.mpf details[open] summary::after{content:'\2212';}
.log .fid.mpf summary:hover,.log .fid.mpf summary:focus-visible{color:var(--ink);}
.log .fid.mpf .fp{display:flex;justify-content:space-between;color:var(--grey);letter-spacing:.2em;margin-top:8px;padding-top:6px;border-top:1px solid var(--hair);}
.log .fid.mpf .fp span:last-child{letter-spacing:.12em;}
.log .fid.mpf .fmt .bar{height:1px;margin:0 0 2px;}
.log .fid.mpf .fnote{margin-top:10px;padding-top:8px;border-top:1px solid var(--hair);text-transform:none;letter-spacing:0;font-family:var(--text);font-size:11.5px;line-height:1.55;color:var(--grey);}
@media (min-width:961px){
  .log{right:22px;width:248px;padding:0 6px;overflow:hidden auto;scrollbar-width:thin;scrollbar-color:var(--grey-2) transparent;}
  .tb{max-width:100%;} .tb div:nth-child(2n+3){white-space:normal;}   /* a long method or source line wraps inside the figure column */
}
@media (max-width:960px){
  .cvwrap{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--hair-2);height:min(70vh,calc((100vw - 58px)*var(--ar) + 68px));}
  .mp.away{padding:14px 22px 20px;border-bottom:1px solid var(--hair-2);}
}
