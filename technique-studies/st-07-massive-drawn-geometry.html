:root{ color-scheme:only light;
  --ground:#FFFFFF; --ink:#15140F; --grey:#7E7D75; --grey-2:#B6B5AD;
  --hair:rgba(18,16,12,.17); --hair-2:rgba(18,16,12,.08);
  --disp:'Geist','Helvetica Neue',Arial,sans-serif;
  --text:'Geist','Helvetica Neue',Arial,sans-serif; --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --accent:#C40021; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#fff;height:100%;}
body{font-family:var(--text);color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.68;overflow:hidden;}
a{color:inherit;text-decoration:none;}
button{font:inherit;}
.plate{position:fixed;inset:18px;border:1px solid var(--hair);display:grid;grid-template-columns:400px 1fr;grid-template-rows:minmax(0,1fr);background:#fff;}
.notes{border-right:1px solid var(--hair);padding:clamp(48px,8vh,84px) 36px 26px 36px;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden auto;scrollbar-width:none;}
.notes::-webkit-scrollbar{display:none;}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);margin:0 0 clamp(14px,2.6vh,26px);}
.lede{font-family:var(--disp);font-weight:600;font-size:clamp(24px,min(2.5vw,4.1vh),38px);line-height:1.04;letter-spacing:-.02em;margin:0 0 clamp(14px,2.6vh,26px);max-width:16ch;}
.body{font-size:clamp(12.5px,1.6vh,14px);line-height:1.62;max-width:40ch;color:var(--ink);}
.body p{margin:0 0 12px;} .body p:last-child{margin:0;}
.meta{margin-top:auto;padding-top:clamp(12px,2vh,18px);border-top:1px solid var(--hair);display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;}
.meta h2{margin:0 0 6px;font-family:var(--mono);font-weight:400;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);}
.meta .nm{font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:-.01em;line-height:1.15;}
.meta .ro{font-family:var(--mono);font-size:11px;color:var(--grey);letter-spacing:.04em;margin-top:2px;line-height:1.5;}
.meta .tags{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:6px;}
.meta .tags span{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:lowercase;color:var(--ink);border:1px solid var(--hair);padding:2px 6px;}
.ctl{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;}
.ctl button{all:unset;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey);border:1px solid var(--hair);padding:6px 10px;line-height:1;}
.ctl button:hover,.ctl button:focus-visible{color:var(--ink);border-color:var(--ink);}
.ctl button.on{color:#fff;background:var(--ink);border-color:var(--ink);}
.figure{position:relative;min-width:0;min-height:0;}
.cvwrap{position:absolute;inset:0;} .cvwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
.log{position:absolute;right:28px;top:96px;width:236px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);line-height:20px;font-variant-numeric:tabular-nums;}
.log .lh{display:flex;justify-content:space-between;align-items:baseline;color:var(--grey);letter-spacing:.2em;margin-bottom:4px;line-height:20px;}
.log .r{display:grid;grid-template-columns:24px 44px 44px 1fr;gap:0 10px;white-space:nowrap;cursor:pointer;outline:none;position:relative;transition:opacity .2s;margin:0 -6px;padding:0 6px;}
.log .r span:nth-child(n+2){color:var(--grey);}
.log .r.on,.log .r:focus-visible{background:var(--hair-2);} .log .r.on span:nth-child(4),.log .r:focus-visible span:nth-child(4){color:var(--ink);}
.log .r.blank span{color:var(--grey-2);}
.log .read{margin-top:12px;padding-top:10px;border-top:1px solid var(--hair);text-transform:none;letter-spacing:0;font-family:var(--text);font-size:11.5px;line-height:1.55;color:var(--ink);min-height:64px;}
.log .read b{font-weight:400;display:block;letter-spacing:.16em;text-transform:uppercase;font-size:9.5px;color:var(--grey);margin-bottom:4px;}
.log .read code{font-family:var(--mono);font-size:10px;color:var(--grey);display:block;white-space:pre-wrap;margin-top:6px;letter-spacing:0;line-height:1.5;}
.log .fid{margin-top:12px;padding-top:10px;border-top:1px solid var(--hair);}
.log .fid .fh{color:var(--grey);letter-spacing:.2em;margin-bottom:2px;}
.log .fid .fr{display:grid;grid-template-columns:1fr 44px;gap:0 10px;}
.log .fid .fr span:last-child{text-align:right;color:var(--ink);}
.log .fid .fr.sum span{color:var(--ink);}
.log .fid .bar{height:2px;background:var(--hair-2);margin:6px 0 2px;position:relative;}
.log .fid .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);}
.tb{position:absolute;right:0;bottom:0;display:grid;grid-template-columns:auto auto;border-left:1px solid var(--hair);border-top:1px solid var(--hair);font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey);background:#fff;z-index:4;}
.tb div{padding:7px 14px;border-bottom:1px solid var(--hair-2);border-right:1px solid var(--hair-2);white-space:nowrap;}
.tb div:nth-child(2n){border-right:0;color:var(--ink);} .tb div:nth-last-child(-n+2){border-bottom:0;}
.tb .mark{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:-.01em;text-transform:none;color:var(--ink);border-right:0;}
.spec{position:fixed;inset:18px 18px 18px auto;width:min(560px,60vw);background:#fff;border-left:1px solid var(--hair);z-index:50;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .25s cubic-bezier(.2,.7,.2,1);}
.spec.open{transform:none;}
.spec .sh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--hair);font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);}
.spec .sh span b{font-weight:400;color:var(--ink);}
.spec .sh button{all:unset;cursor:pointer;color:var(--grey);letter-spacing:.18em;text-transform:uppercase;font-size:10px;padding:4px 0 4px 14px;} .spec .sh button:hover{color:var(--ink);}
.spec pre{margin:0;padding:18px;overflow:auto;font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--ink);flex:1;white-space:pre;tab-size:2;}
.spec pre .k{color:var(--grey);} .spec pre .s{color:var(--accent);} .spec pre .n{color:#1E6FE0;}
.spec pre .hl{background:rgba(196,0,33,.07);}
@media (max-width:960px){
  body{overflow:auto;} .plate{position:static;margin:12px;display:block;}
  .notes{border-right:0;border-bottom:1px solid var(--hair);padding:60px 22px 26px;overflow:visible;} .notes .meta{margin-top:26px;}
  .figure{display:flex;flex-direction:column;} .cvwrap{position:relative;height:70vh;min-height:320px;}
  .log{position:static;width:auto;padding:6px 22px 14px;border-top:1px solid var(--hair-2);}
  .tb{position:static;grid-template-columns:1fr;border-left:0;font-size:8.5px;} .tb .mark{grid-column:1!important;} .tb div{white-space:normal;padding:6px 22px;border-right:0;}
  .spec{width:100vw;inset:0;}
}
</style>
</head>

      const body=8.6, ow=1.3; const capH=32, skH=capH-body-2*ow-1.4; const base=P(0.384,0.148)[1]-0.6-body/2-ow; let x=P(0.384,0)[0]+body/2+ow;
      const strokes=[];
      for(let k=0;k<word.length;k++){ const ch=word[k]; const gu=skH/8; const sx=skw[k]/8; for(const sk of G[ch]){ const pts=sk.map(p=>{ const yy=base-(9-p[1])*gu; const xx=x+(p[0]-1)*sx+(base-yy)*0.2; return [xx,yy]; }); let D=dense(pts,false,2.5); D=waver(D,0.7,0.12,false); D=waver(D,0.3,0.45,false); strokes.push(D); } x+=adv[k]; }
      TXT.lineCap='round'; TXT.lineJoin='round'; TXT.strokeStyle=INK;
      for(const D of strokes){ TXT.lineWidth=body+2*ow; path(TXT,D,false); TXT.stroke(); }
      TXT.save(); TXT.globalCompositeOperation='destination-out'; for(const D of strokes){ TXT.lineWidth=body; path(TXT,D,false); TXT.stroke(); } TXT.restore();
      KEY.save(); KEY.setTransform(1,0,0,1,0,0); KEY.drawImage(TXT.canvas,0,0); KEY.restore();
    }
    // ================= pass 1 (drawn last, composited under): the blue plate =================
    { // torn polygon around the screen glass
      const [tl,tr,br,bl]=MS; const q=0.58; const qz=v=>Math.round(v/q)*q;
      const nzL=mkNoise(), nzR=mkNoise(), nzT=mkNoise();
      const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
      const nL=Math.ceil(Math.hypot(bl[0]-tl[0],bl[1]-tl[1])/q), nR=Math.ceil(Math.hypot(br[0]-tr[0],br[1]-tr[1])/q);
      const left=[]; for(let i=0;i<=nL;i++){ const t=i/nL; const p=lerp(tl,bl,t); const inset=8.5*Math.pow(1-t,0.9)-5*sstep(0.8,1,t) + 1.2*nzL(p[1]*0.08) + (rnd()<0.55?qz(rr(-0.9,0.9)):0); left.push([p[0]+qz(inset),p[1]]); }
      const right=[]; for(let i=0;i<=nR;i++){ const t=i/nR; const p=lerp(tr,br,t); const off=-1.2-2.2*t+0.4*nzR(p[1]*0.09)+(rnd()<0.2?qz(rr(-0.58,0.58)):0); right.push([p[0]+qz(off),p[1]]); }
      const top=[]; { const n=Math.ceil((tr[0]-tl[0])/q); for(let i=0;i<=n;i++){ const t=i/n; const p=lerp(left[0],right[0],t); const gap=1.0*sstep(0.35,0,t)+0.3*nzT(p[0]*0.1); top.push([p[0],p[1]+qz(gap)+0.9]); } }
      const foot=[[P(0.219,0.393)[0]+0.4,bl[1]+0.5],[P(0.226,0.393)[0],bl[1]-1.2],[P(0.231,0.393)[0],bl[1]-3.5]];
      const plate=[...top,...right.slice(1),[br[0]+1.4,br[1]+0.5],...foot,...left.slice().reverse().slice(0,-1)];
      // tie the left edge's bottom to the foot: replace the lowest left points that sit above the foot
      PLT.fillStyle=BLUE; PLT.strokeStyle=BLUE; PLT.lineWidth=1.15; PLT.lineJoin='round';
      path(PLT,plate,true); PLT.fill(); PLT.stroke();
      PLT.save(); path(PLT,plate,true); PLT.clip();
      // ---- screen ink lattice ----
      PLT.strokeStyle=PLT.fillStyle='#000'; PLT.lineCap='round'; PLT.lineJoin='round';
      const pitch=9.8, cols=18, rows=9; const gx0=P(0.335,0)[0], gy0=P(0,0.235)[1]; const SW3=3.0;
      const node=[]; for(let j=0;j<=rows;j++){ node.push([]); for(let i=0;i<=cols;i++)node[j].push([gx0+i*pitch+rr(-1.1,1.1),gy0+j*pitch+rr(-1.1,1.1)]); }
      const st=(a,b,wd)=>{ PLT.lineWidth=wd||SW3; PLT.beginPath(); PLT.moveTo(a[0],a[1]); PLT.lineTo(b[0],b[1]); PLT.stroke(); };
      const dot=(p,r)=>{ PLT.beginPath(); PLT.arc(p[0],p[1],r,0,7); PLT.fill(); };
      const dens=i=>i<10?1:i<14?0.6:0.35;
      // top row: a dotted rule with a few breaks
      for(let i=1;i<cols;i++){ if(rnd()<0.85*dens(i)+0.1){ st(node[0][i],node[0][i+1]); } if(rnd()<0.8)dot(node[0][i],2.2); }
      // random-walk paths on the lattice, stroked as one round-joined polyline each
      const DIRS=[[1,0],[-1,0],[0,1],[0,-1]]; const used=new Set();
      const walk=(i,j)=>{ const pts=[[i,j]]; let d=DIRS[rnd()*4|0]; const L=1+(rnd()*4|0); for(let n=0;n<L;n++){ if(rnd()<0.55)d=DIRS[rnd()*4|0]; let ni=i+d[0],nj=j+d[1]; if(ni<0||ni>cols||nj<1||nj>rows){ d=[-d[0],-d[1]]; ni=i+d[0]; nj=j+d[1]; if(ni<0||ni>cols||nj<1||nj>rows)break; } const k=Math.min(i+j*100,ni+nj*100)+':'+Math.max(i+j*100,ni+nj*100); if(used.has(k))break; used.add(k); i=ni; j=nj; pts.push([i,j]); if(rnd()>dens(i)+0.25)break; } return pts; };
      const NP=150; for(let k=0;k<NP;k++){ const i=(rnd()<0.75?rnd()*10:10+rnd()*9)|0, j=1+(rnd()*rows|0); const w=walk(i,j); if(w.length<2)continue;
        PLT.lineWidth=SW3*rr(0.9,1.1); PLT.beginPath(); { const ps=w.map(q=>node[q[1]][q[0]]); PLT.moveTo(ps[0][0],ps[0][1]); for(let n=1;n<ps.length-1;n++){ const a=[ps[n][0]+(ps[n-1][0]-ps[n][0])*0.3,ps[n][1]+(ps[n-1][1]-ps[n][1])*0.3], b=[ps[n][0]+(ps[n+1][0]-ps[n][0])*0.3,ps[n][1]+(ps[n+1][1]-ps[n][1])*0.3]; PLT.lineTo(a[0],a[1]); PLT.quadraticCurveTo(ps[n][0],ps[n][1],b[0],b[1]); } const e=ps[ps.length-1]; PLT.lineTo(e[0],e[1]); } PLT.stroke();
        for(const q of w){ if(rnd()<0.7)dot(node[q[1]][q[0]],rnd()<0.5?2.4:1.9); }
        if(rnd()<0.6){ const q=w[w.length-1]; const p=node[q[1]][q[0]]; const dd=DIRS[rnd()*4|0]; const e=[p[0]+dd[0]*5,p[1]+dd[1]*5]; st(p,e); dot(e,2.3); } }
      // four open-square glyphs (the "5"-like loops)
      for(let k=0;k<4;k++){ const i=[3,7,11,15][k], j=[2,5,3,6][k]; const a=node[j][i],b=node[j][i+1],c=node[j+1][i+1],d=node[j+1][i]; PLT.lineWidth=SW3; PLT.beginPath(); PLT.moveTo(b[0],b[1]); PLT.lineTo(a[0],a[1]); PLT.lineTo(d[0],d[1]); PLT.lineTo(c[0],c[1]); PLT.lineTo(c[0]+3,c[1]-4); PLT.stroke(); dot(b,2.4); }
      for(let k=0;k<6;k++)dot([gx0+rr(0,cols*pitch),gy0+rr(0,rows*pitch)],rr(1.5,2.3));
      PLT.restore();
      // ---- knock-outs: stepped masses on a 2-px cell grid → smoothed loops ----
      const CELL=1.15;
      const mass=(cx,cy,test,ext)=>{ const n=Math.ceil(ext/CELL)*2+2; const g=[]; for(let j=0;j<n;j++){ g.push(new Uint8Array(n)); for(let i=0;i<n;i++){ const x=cx+(i-n/2+0.5)*CELL, y=cy+(j-n/2+0.5)*CELL; g[j][i]=test(x-cx,y-cy)?1:0; } }
        // boundary edges of the cell union, chained into a loop
        const edges=new Map(); const key=(x,y)=>x.toFixed(2)+','+y.toFixed(2); const X=i=>cx+(i-n/2)*CELL, Y=j=>cy+(j-n/2)*CELL;
        for(let j=0;j<n;j++)for(let i=0;i<n;i++){ if(!g[j][i])continue; const up=j>0&&g[j-1][i], dn=j<n-1&&g[j+1][i], lf=i>0&&g[j][i-1], rt=i<n-1&&g[j][i+1];
          if(!up)edges.set(key(X(i),Y(j)),[X(i+1),Y(j)]); if(!rt)edges.set(key(X(i+1),Y(j)),[X(i+1),Y(j+1)]); if(!dn)edges.set(key(X(i+1),Y(j+1)),[X(i),Y(j+1)]); if(!lf)edges.set(key(X(i),Y(j+1)),[X(i),Y(j)]); }
        let start=null; for(const [k,v] of edges){ start=k; break; } if(!start)return []; const loop=[]; let cur=start; let guard=0; while(guard++<5000){ const nx=edges.get(cur); if(!nx)break; loop.push(nx); const k=key(nx[0],nx[1]); if(k===start)break; cur=k; }
        // Catmull-Rom smooth of the staircase
        const m=loop.length; const out=[]; for(let i=0;i<m;i++){ const a=loop[(i-1+m)%m],b=loop[i],c=loop[(i+1)%m],d=loop[(i+2)%m]; for(let k=0;k<3;k++){ const t=k/3,t2=t*t,t3=t2*t; out.push([0.5*((2*b[0])+(-a[0]+c[0])*t+(2*a[0]-5*b[0]+4*c[0]-d[0])*t2+(-a[0]+3*b[0]-3*c[0]+d[0])*t3),0.5*((2*b[1])+(-a[1]+c[1])*t+(2*a[1]-5*b[1]+4*c[1]-d[1])*t2+(-a[1]+3*b[1]-3*c[1]+d[1])*t3)]); } } return out; };
      const disc=(x,y,r)=>x*x+y*y<r*r; const rect=(x,y,x0,y0,x1,y1)=>x>=x0&&x<=x1&&y>=y0&&y<=y1;
      const rot=(x,y,a)=>[x*Math.cos(a)-y*Math.sin(a),x*Math.sin(a)+y*Math.cos(a)];
      const c1=P(0.404,0.241), c2=P(0.353,0.295), c3=P(0.504,0.300), c4=P(0.676,0.301);
      const masses=[
        mass(c1[0],c1[1],(x,y)=>(disc(x,y+3,9.5)&&y<3.5)||rect(x,y,-4,2,4,8)||rect(x,y,-11,-2,11,2.5),14),
        mass(c2[0],c2[1],(x,y)=>{ if(!disc(x/12,y/17,1))return false; if(x>4)return false; if(rect(x,y,-1,-13,5,-7))return false; if(rect(x,y,1,-2,5,4))return false; if(rect(x,y,-3,9,5,13))return false; return true; },20),
        mass(c3[0],c3[1],(x,y)=>{ const [px,py]=rot(x,y,-0.45); if(rect(px,py,-8,-23,8,23)||rect(px,py,-23,-8,23,8))return true; if(disc(px-15,py-15,7)||disc(px+14,py+13,6))return true; if(rect(px,py,-20,10,-12,18)&&!rect(px,py,-17,13,-15,15))return true; return false; },28),
        mass(c4[0],c4[1],(x,y)=>disc(x/15,y/21,1)&&!(rect(x,y,-16,-5,-10,1))&&!(x<-7&&y>10)&&!(rect(x,y,-15,-19,-7,-11)),24)

      KEY.save(); path(KEY,MS,true); KEY.clip(); KEY.lineWidth=1.15; KEY.lineJoin='round'; for(const m of masses){ if(m.length){ path(KEY,waver(m,0.12,0.4,true),true); KEY.stroke(); } } KEY.restore();
    }

    const ctx=canvas.getContext('2d'); ctx.setTransform(dpr*S,0,0,dpr*S,0,0); ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,U,V);

<script>
(function(){
"use strict";
const S=window.STUDY; if(!S){document.body.textContent='no STUDY';return;}
const cv=document.getElementById('cv'), wrap=cv.parentElement, rowsEl=document.getElementById('rows'), ctrEl=document.getElementById('ctr'), readTxt=document.getElementById('readtxt'), readCode=document.getElementById('readcode'), fidEl=document.getElementById('fid'), tbEl=document.getElementById('tb'), specEl=document.getElementById('spec'), specPre=document.getElementById('specpre');
let ctx=cv.getContext('2d'), W=0,H=0,DPR=1;
const INK='#15140F', INK50='rgba(21,20,15,0.5)', INK30='rgba(21,20,15,0.3)', GREY='#7E7D75', PAPER='#FFFFFF';
const FONT=(s)=>`${s}px "Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace`;
const hasLS=('letterSpacing' in ctx); const track=(s,em)=>{ if(hasLS)ctx.letterSpacing=(s*em).toFixed(2)+'px'; };
const px=v=>Math.round(v)+0.5; const clamp=(v,a,b)=>v<a?a:v>b?b:v; const lerp=(a,b,t)=>a+(b-a)*t; const smooth=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const mobile=()=>innerWidth<=960;
function text(s,x,y,size,em,col,al){ ctx.font=FONT(size); track(size,em||0); ctx.fillStyle=col||INK; ctx.textAlign=al||'left'; ctx.textBaseline='alphabetic'; ctx.fillText(s,x,y); if(hasLS)ctx.letterSpacing='0px'; }
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---------- copy column ---------- */
(function(){ const el=document.getElementById('copy'); const tags=(S.spec.techniques||[]).map(t=>`<span>${esc(t.id)}</span>`).join('');
  el.innerHTML=`<p class="kicker">${esc(S.kicker)}</p><h1 class="lede">${esc(S.lede)}</h1><div class="body">${(S.body||[]).map(p=>`<p>${esc(p)}</p>`).join('')}</div>
  <div class="meta"><div><h2>Study</h2><div class="nm">${esc(S.title)}</div><div class="ro">${esc(S.code)} · sheet ${S.sheet} / ${S.of||8}</div></div><div><h2>Reference</h2><div class="ro">${esc(S.source)}</div></div>
  <div style="grid-column:1/3"><h2>Techniques read</h2><div class="tags">${tags}</div><div class="ctl"><button id="bMode" type="button" title="cycle rebuild / reference / split (R)">Rebuild</button><button id="bReread" type="button" title="re-run the read (space)">Re-read</button><button id="bSpec" type="button" title="open the machine-readable spec (S)">Spec ⇥</button></div></div></div>`; })();
/* ---------- title block ---------- */
tbEl.innerHTML=`<div class="mark" style="grid-column:1/3">${esc(S.series||'STUDIES')}</div><div>Figure</div><div>FIG. ${esc(S.fig)} — ${esc(S.title)} · ${esc(S.code)}</div><div>Method</div><div>${esc(S.method)}</div><div>Source</div><div>${esc(S.source)}</div><div>Plate</div><div>${esc(S.code)} · ${S.spot.join(' · ')}</div><div>Sheet</div><div>${S.sheet} / ${S.of||8} · 2026</div>`;
/* ---------- spec panel ---------- */
const specJSON=JSON.stringify(S.spec,null,2);
function hlJSON(s){ return esc(s).replace(/("(?:[^"\\]|\\.)*")(\s*:)?|(-?\d+(?:\.\d+)?(?:e[+-]?\d+)?)|\b(true|false|null)\b/g,(m,str,col,num,lit)=>{ if(str)return col?`<span class="k">${str}</span>${col}`:`<span class="s">${str}</span>`; if(num)return `<span class="n">${num}</span>`; return `<span class="n">${lit}</span>`; }); }
specPre.innerHTML=hlJSON(specJSON); document.getElementById('specid').textContent=S.id;
function openSpec(o){ specEl.classList.toggle('open',o); specEl.setAttribute('aria-hidden',o?'false':'true'); document.getElementById('bSpec').classList.toggle('on',o); }
document.getElementById('bSpec').onclick=()=>openSpec(!specEl.classList.contains('open')); document.getElementById('specclose').onclick=()=>openSpec(false);
document.getElementById('speccopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(specJSON); document.getElementById('speccopy').textContent='Copied'; setTimeout(()=>document.getElementById('speccopy').textContent='Copy',1200);}catch(e){} };
function hlTech(id){ const lines=specJSON.split('\n'); let out=[],on=false,depth=0; for(const ln of lines){ if(!on&&ln.includes(`"id": "${id}"`)){ on=true; depth=ln.search(/\S/); } if(on){ out.push(`<span class="hl">${hlJSON(ln)}</span>`); if(ln.search(/\S/)<=depth&&/^\s*\},?$/.test(ln))on=false; } else out.push(hlJSON(ln)); } specPre.innerHTML=out.join('\n'); const h=specPre.querySelector('.hl'); if(h&&specEl.classList.contains('open'))h.scrollIntoView({block:'center'}); }

/* ---------- art: rendered once per layout into an offscreen canvas at DPR ---------- */
let art=null, artKey='', artBusy=false, artDone=false;
let fig={x:0,y:0,w:0,h:0}; const ar=S.ref.h/S.ref.w;
function layout(){ const r=wrap.getBoundingClientRect(); DPR=Math.min(2,devicePixelRatio||1); W=r.width; H=r.height; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0);
  const mob=mobile(); const tbh=mob?0:tbEl.getBoundingClientRect().height; const left=mob?16:40, top=mob?34:78, right=mob?16:(40+236+28), bottom=(mob?34:60)+tbh;
  let bw=W-left-right, bh=H-top-bottom; let fw=bw, fh=fw*ar; if(fh>bh){ fh=bh; fw=fh/ar; }
  fig={x:Math.round(left+(bw-fw)/2),y:Math.round(top+(bh-fh)/2),w:Math.round(fw),h:Math.round(fh)}; if(mob){ fig.x=Math.round(left+(bw-fw)/2); }
  const k=fig.w+'x'+fig.h+'@'+DPR; if(k!==artKey){ artKey=k; renderArt(); } placePoints(); }
function renderArt(){ const c=document.createElement('canvas'); c.width=Math.round(fig.w*DPR); c.height=Math.round(fig.h*DPR); const x=c.getContext('2d'); x.setTransform(DPR,0,0,DPR,0,0); x.fillStyle='#fff'; x.fillRect(0,0,fig.w,fig.h); artBusy=true; artDone=false; const key=artKey;
  const finish=()=>{ if(key!==artKey)return; art=c; artBusy=false; artDone=true; dirty=true; computeFidelity(); };
  try{ const r=S.render(c,fig.w,fig.h,DPR,finish); if(r!==false&&S.render.length<5)finish(); }catch(e){ console.error(e); finish(); } }

/* ---------- points (trackers) ---------- */
const P=(S.points||[]).slice(0,10).map((p,i)=>({num:10+i*2,u:p.u,v:p.v,d:p.d||'—',label:p.label||'',t:p.t||null,dir:p.dir||null,lock:-1,x:0,y:0}));
let links=[];
function placePoints(){ const Sz=9; for(const t of P){ t.x=fig.x+t.u*fig.w; t.y=fig.y+t.v*fig.h; }
  // label side: given dir or away from the frame centre; labels sit clear of the box on a short elbow
  for(const t of P){ let dx,dy; if(t.dir){ dx=t.dir[0]; dy=t.dir[1]; } else { dx=t.u<0.5?-1:1; dy=t.v<0.35?-1:(t.v>0.65?1:0); if(dy===0)dy=(t.u<0.5?1:-1)*0; }
    const L=Sz+22; const ex=t.x+dx*L, ey=t.y+(dy||0)*L*0.7; t.sx=dx; t.sy=dy||0; t.ex=ex; t.ey=ey; const lw=22,lh=14; t.lab={x:dx<0?ex-6-lw:ex+6,y:ey-lh/2,w:lw,h:lh}; }
  // MST over the points (Prim)
  const n=P.length; links=[]; if(n>1){ const inT=new Array(n).fill(false); inT[0]=true; for(let k=1;k<n;k++){ let best=1e18,bi=-1,bj=-1; for(let i=0;i<n;i++)if(inT[i])for(let j=0;j<n;j++)if(!inT[j]){ const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y); if(d<best){best=d;bi=i;bj=j;} } inT[bj]=true; links.push([bi,bj]); } } }
/* ---------- track log ---------- */
const rows=P.map((t,i)=>{ const r=document.createElement('div'); r.className='r blank'; r.tabIndex=0; r.innerHTML='<span></span><span></span><span></span><span></span>'; r.onmouseenter=()=>setHover(t); r.onmouseleave=()=>setHover(null); r.onfocus=()=>setHover(t); r.onblur=()=>setHover(null); r.onclick=()=>{ select(t); }; rowsEl.appendChild(r); return r; });
function rowText(r,t,uv,done){ const s=r.children; s[0].textContent=String(t.num); s[1].textContent=uv?uv[0].toFixed(3):'—'; s[2].textContent=uv?uv[1].toFixed(3):'—'; s[3].textContent=done?t.d:'—'; r.classList.toggle('blank',!done); }
rows.forEach((r,i)=>rowText(r,P[i],null,false));
let hover=null, selected=null, dirty=true;
function setHover(t){ hover=t; rows.forEach((r,i)=>r.classList.toggle('on',P[i]===(hover||selected))); showRead(hover||selected); dirty=true; }
function select(t){ selected=(selected===t)?null:t; rows.forEach((r,i)=>r.classList.toggle('on',P[i]===(hover||selected))); showRead(selected||hover); if(selected&&selected.t)hlTech(selected.t); dirty=true; }
function showRead(t){ if(!t){ readTxt.textContent='Hover or select a point.'; readCode.textContent=''; return; } const tech=(S.spec.techniques||[]).find(q=>q.id===t.t); readTxt.textContent=`${t.num} · ${t.d} — ${t.label}`; readCode.textContent=tech?(tech.params?Object.entries(tech.params).map(([k,v])=>`${k}: ${typeof v==='object'?JSON.stringify(v):v}`).join('\n'):''):''; }

/* ---------- reference / compare ---------- */
const refImg=new Image(); let refReady=false; const hasRef=!!window.__REF.data; refImg.onload=()=>{ refReady=true; dirty=true; computeFidelity(); }; if(hasRef)refImg.src=window.__REF.data; else { document.getElementById('bMode').hidden=true; fidEl.innerHTML='<div class="fh">Fidelity · ref ↔ rebuild</div><div class="fr"><span>Reference held locally · not published</span><span>—</span></div>'; }
let mode=0; const MODES=['Rebuild','Reference','Split']; let splitX=0.5;
function setMode(m){ mode=(m+3)%3; document.getElementById('bMode').textContent=MODES[mode]; document.getElementById('bMode').classList.toggle('on',mode!==0); dirty=true; }
document.getElementById('bMode').onclick=()=>setMode(mode+1);
/* ---------- fidelity: global statistics, reference vs rebuild (composition-independent) ---------- */
function stats(src,sw,sh){ const n=96; /* box-filter both sources the same way: 4× intermediate, high-quality resample, so thin lines and beads average into tone instead of point-sampling */ const m=document.createElement('canvas'); m.width=n*4; m.height=n*4; const mx=m.getContext('2d'); mx.imageSmoothingEnabled=true; mx.imageSmoothingQuality='high'; mx.drawImage(src,0,0,sw,sh,0,0,n*4,n*4); const c=document.createElement('canvas'); c.width=n; c.height=n; const x=c.getContext('2d',{willReadFrequently:true}); x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high'; x.drawImage(m,0,0,n*4,n*4,0,0,n,n); const d=x.getImageData(0,0,n,n).data;
  const lab=new Float32Array(n*n*3); const lum=new Float32Array(n*n); const f=v=>v>0.04045?Math.pow((v+0.055)/1.055,2.4):v/12.92; const g=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116;
  for(let i=0;i<n*n;i++){ const r=f(d[i*4]/255),gg=f(d[i*4+1]/255),b=f(d[i*4+2]/255); const X=(r*0.4124+gg*0.3576+b*0.1805)/0.95047, Y=r*0.2126+gg*0.7152+b*0.0722, Z=(r*0.0193+gg*0.1192+b*0.9505)/1.08883; const fx=g(X),fy=g(Y),fz=g(Z); lab[i*3]=116*fy-16; lab[i*3+1]=500*(fx-fy); lab[i*3+2]=200*(fy-fz); lum[i]=lab[i*3]/100; }
  const hist3=new Float32Array(8*8*8), histL=new Float32Array(32);
  for(let i=0;i<n*n;i++){ const L=clamp(lab[i*3]/100,0,0.999), a=clamp((lab[i*3+1]+100)/200,0,0.999), b=clamp((lab[i*3+2]+100)/200,0,0.999); hist3[((L*8)|0)*64+((a*8)|0)*8+((b*8)|0)]+=1; histL[(L*32)|0]+=1; }
  for(let i=0;i<hist3.length;i++)hist3[i]/=n*n; for(let i=0;i<32;i++)histL[i]/=n*n;
  let edge=0,grain=0; for(let y=1;y<n-1;y++)for(let x2=1;x2<n-1;x2++){ const k=y*n+x2; edge+=Math.abs(lum[k+1]-lum[k-1])+Math.abs(lum[k+n]-lum[k-n]); grain+=Math.abs(lum[k]*4-lum[k+1]-lum[k-1]-lum[k+n]-lum[k-n]); } edge/=(n-2)*(n-2); grain/=(n-2)*(n-2);
  let sa=0,sb=0,sc=0; for(let i=0;i<n*n;i++){ sa+=Math.hypot(lab[i*3+1],lab[i*3+2]); } sa/=n*n; // mean chroma
  return {hist3,histL,edge,grain,chroma:sa}; }
let fidelity=null;
function computeFidelity(){ if(!art||!refReady)return; try{ const A=stats(refImg,refImg.naturalWidth,refImg.naturalHeight), B=stats(art,art.width,art.height);
  const inter=(p,q)=>{ let s=0; for(let i=0;i<p.length;i++)s+=Math.min(p[i],q[i]); return s; };
  const ratio=(a,b)=>1-Math.abs(a-b)/Math.max(a,b,1e-6);
  const pal=inter(A.hist3,B.hist3), tone=inter(A.histL,B.histL), edge=ratio(A.edge,B.edge), grain=ratio(A.grain,B.grain), chroma=ratio(A.chroma,B.chroma);
  const sum=(pal*0.3+tone*0.25+edge*0.2+grain*0.15+chroma*0.1);
  fidelity={pal,tone,edge,grain,chroma,sum};
  const pc=v=>String(Math.round(v*100)).padStart(2,'0')+' %';
  fidEl.innerHTML=`<div class="fh">Fidelity · ref ↔ rebuild</div><div class="fr"><span>Palette · Lab 8³ ∩</span><span>${pc(pal)}</span></div><div class="fr"><span>Tone · L histogram ∩</span><span>${pc(tone)}</span></div><div class="fr"><span>Edge density</span><span>${pc(edge)}</span></div><div class="fr"><span>Grain · HF energy</span><span>${pc(grain)}</span></div><div class="fr"><span>Chroma · mean</span><span>${pc(chroma)}</span></div><div class="bar"><i style="width:${(sum*100).toFixed(1)}%"></i></div><div class="fr sum"><span>Optical match</span><span>${pc(sum)}</span></div>`; }catch(e){ console.info('fidelity',e); } }

/* ---------- chrome ---------- */
let phase='pre', pt=0, lastNow=performance.now(); const READ=reduced?0.01:2.8;
function headPos(t){ return smooth(0,READ,t); }
function drawChrome(){ ctx.strokeStyle=INK50; ctx.lineWidth=0.5; ctx.strokeRect(px(fig.x),px(fig.y),fig.w,fig.h);
  ctx.beginPath(); for(const q of [0.25,0.5,0.75]){ const X=px(fig.x+fig.w*q), Y=px(fig.y+fig.h*q); ctx.moveTo(X,fig.y+0.5); ctx.lineTo(X,fig.y+3.5); ctx.moveTo(X,fig.y+fig.h-0.5); ctx.lineTo(X,fig.y+fig.h-3.5); ctx.moveTo(fig.x+0.5,Y); ctx.lineTo(fig.x+3.5,Y); ctx.moveTo(fig.x+fig.w-0.5,Y); ctx.lineTo(fig.x+fig.w-3.5,Y); } ctx.stroke();
  ctx.strokeStyle=INK; ctx.lineWidth=0.75; const g=2,l=10; const X0=fig.x-g, X1=fig.x+fig.w+g, Y0=fig.y-g, Y1=fig.y+fig.h+g;
  ctx.beginPath(); ctx.moveTo(X0+0.5,Y0-l); ctx.lineTo(X0+0.5,Y0+0.5); ctx.lineTo(X0-l,Y0+0.5); ctx.moveTo(X1-0.5,Y0-l); ctx.lineTo(X1-0.5,Y0+0.5); ctx.lineTo(X1+l,Y0+0.5); ctx.moveTo(X0+0.5,Y1+l); ctx.lineTo(X0+0.5,Y1-0.5); ctx.lineTo(X0-l,Y1-0.5); ctx.moveTo(X1-0.5,Y1+l); ctx.lineTo(X1-0.5,Y1-0.5); ctx.lineTo(X1+l,Y1-0.5); ctx.stroke();
  text(`FIG. ${S.fig} — ${S.title} · ${S.code}`.toUpperCase(),fig.x+14,fig.y-14,9.5,0.18,INK50);
  let st=''; if(phase==='read')st='READING · '+String(Math.round(headPos(pt)*100)).padStart(3,'0')+' %'; else if(phase==='hold')st=mode===1?'REFERENCE':(mode===2?'SPLIT':'HELD'); else st='RENDERING…'; text(st,fig.x+fig.w-14,fig.y-14,9.5,0.18,INK,'right');
  const by=fig.y+fig.h+18; ctx.font=FONT(9.5); track(9.5,0.16); const lab='PLATE · ', s2=` ${S.code} CORE `; const w1=ctx.measureText(lab).width, w2=ctx.measureText(s2).width; if(hasLS)ctx.letterSpacing='0px';
  text(lab,fig.x,by,9.5,0.16,GREY); const sx=fig.x+w1+2, sy=by-7.5; ctx.fillStyle=`rgb(${S.spot.join(',')})`; ctx.fillRect(Math.round(sx),Math.round(sy),7,7); ctx.strokeStyle=INK; ctx.lineWidth=0.5; ctx.strokeRect(Math.round(sx)+0.5,Math.round(sy)+0.5,7,7);
  text(s2,sx+11,by,9.5,0.16,GREY); text(S.spot.join(' · '),sx+11+w2,by,9.5,0.16,INK);
  if(!mobile()){ const rs=`${P.length} POINTS · U,V NORMALISED TO FRAME · ${hasRef?'R REF · ':''}S SPEC`; ctx.font=FONT(9.5); track(9.5,0.16); const rw=ctx.measureText(rs).width, leftEnd=sx+11+w2+ctx.measureText(S.spot.join(' · ')).width; if(hasLS)ctx.letterSpacing='0px'; const rx=fig.x+fig.w; if(rx-rw>leftEnd+24)text(rs,rx,by,9.5,0.16,GREY,'right'); } }
function drawArt(y1){ if(!art)return; ctx.save(); ctx.beginPath(); ctx.rect(fig.x,fig.y,fig.w,Math.max(0,y1-fig.y)); ctx.clip();
  const drawRef=(x0,x1)=>{ if(!refReady)return; ctx.save(); ctx.beginPath(); ctx.rect(x0,fig.y,x1-x0,fig.h); ctx.clip(); ctx.drawImage(refImg,fig.x,fig.y,fig.w,fig.h); ctx.restore(); };
  if(mode===0){ ctx.drawImage(art,fig.x,fig.y,fig.w,fig.h); }
  else if(mode===1){ drawRef(fig.x,fig.x+fig.w); if(!refReady)ctx.drawImage(art,fig.x,fig.y,fig.w,fig.h); }
  else { const sx=fig.x+fig.w*splitX; ctx.drawImage(art,fig.x,fig.y,fig.w,fig.h); drawRef(fig.x,sx); ctx.strokeStyle=INK; ctx.lineWidth=0.75; ctx.beginPath(); ctx.moveTo(px(sx),fig.y); ctx.lineTo(px(sx),fig.y+fig.h); ctx.stroke(); text('REF',sx-6,fig.y+14,9,0.16,INK,'right'); text('REBUILD',sx+6,fig.y+14,9,0.16,INK,'left'); }
  ctx.restore(); }
function boxEdge(dx,dy,Sz){ const m=Math.max(Math.abs(dx),Math.abs(dy))||1; return Sz/m; }
function drawTrackers(tNow){ const Sz=9; const hov=hover||selected; const dim=!!hov;
  const st=P.map(t=>{ if(t.lock<0)return {a:0}; const e=tNow-t.lock; return {a:1,grow:smooth(0,0.18,e),lead:clamp(e/0.12,0,1),cnt:clamp(e/0.24,0,1)}; });
  ctx.lineWidth=0.4; for(const [ia,ib] of links){ const a=P[ia],b=P[ib],sa=st[ia],sb=st[ib]; if(!sa.a||!sb.a)continue; const al=clamp((tNow-Math.max(a.lock,b.lock))/0.16,0,1); if(al<=0)continue;
    const dx=b.x-a.x,dy=b.y-a.y,m=Math.hypot(dx,dy)||1; const ux=dx/m,uy=dy/m; const ea=boxEdge(ux,uy,Sz),eb=boxEdge(ux,uy,Sz); if(m<ea+eb+4)continue; const hot=hov&&(hov===a||hov===b);
    ctx.strokeStyle=hot?INK:(dim?INK30:INK50); ctx.lineWidth=hot?0.6:0.4; ctx.beginPath(); ctx.moveTo(a.x+ux*ea,a.y+uy*ea); ctx.lineTo(a.x+ux*(ea+(m-ea-eb)*al),a.y+uy*(ea+(m-ea-eb)*al)); ctx.stroke(); }
  ctx.font=FONT(11); if(hasLS)ctx.letterSpacing='0px'; ctx.textAlign='center'; ctx.textBaseline='middle';
  P.forEach((t,i)=>{ const s=st[i]; if(!s.a)return; const hot=hov===t; const col=hot?INK:(dim?INK30:INK);
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(t.x,t.y,hot?2.4:1.7,0,6.2832); ctx.fill();
    if(s.grow>0){ const sz=lerp(2,Sz,s.grow); ctx.strokeStyle=col; ctx.lineWidth=hot?1.0:0.7; ctx.strokeRect(px(t.x-sz),px(t.y-sz),Math.round(sz*2),Math.round(sz*2));
      if(hot){ ctx.beginPath(); const X0=px(t.x-sz),Y0=px(t.y-sz),X1=X0+Math.round(sz*2),Y1=Y0+Math.round(sz*2); ctx.moveTo(X0-4,Y0);ctx.lineTo(X0,Y0);ctx.lineTo(X0,Y0-4); ctx.moveTo(X1+4,Y0);ctx.lineTo(X1,Y0);ctx.lineTo(X1,Y0-4); ctx.moveTo(X0-4,Y1);ctx.lineTo(X0,Y1);ctx.lineTo(X0,Y1+4); ctx.moveTo(X1+4,Y1);ctx.lineTo(X1,Y1);ctx.lineTo(X1,Y1+4); ctx.stroke(); } }
    if(s.lead>0&&s.grow>0.99){ const bx=t.x+t.sx*Sz, by=t.y+t.sy*Sz*(t.sy?1:0); const k=s.lead; ctx.strokeStyle=col; ctx.lineWidth=0.5; ctx.beginPath(); ctx.moveTo(bx,t.sy?by:t.y); ctx.lineTo(lerp(bx,t.ex,k),lerp(t.sy?by:t.y,t.ey,k)); if(k>=1){ ctx.lineTo(t.ex+t.sx*6,t.ey); } ctx.stroke(); }
    if(s.cnt>0&&s.lead>=1){ ctx.fillStyle=PAPER; ctx.fillRect(Math.round(t.lab.x),Math.round(t.lab.y),t.lab.w,t.lab.h); ctx.fillStyle=col; ctx.font=FONT(11); const n=Math.round(lerp(0,t.num,s.cnt)); ctx.fillText(String(n).padStart(2,'0'),t.lab.x+t.lab.w/2,t.lab.y+t.lab.h/2+0.5); } });
  ctx.textAlign='left'; ctx.textBaseline='alphabetic'; }
let pointer=null;
function drawHover(){ if(pointer&&mode!==2){ ctx.strokeStyle=INK30; ctx.lineWidth=0.5; ctx.beginPath(); ctx.moveTo(px(pointer.x),fig.y); ctx.lineTo(px(pointer.x),fig.y+fig.h); ctx.moveTo(fig.x,px(pointer.y)); ctx.lineTo(fig.x+fig.w,px(pointer.y)); ctx.stroke(); text(`U ${((pointer.x-fig.x)/fig.w).toFixed(3)}  V ${((pointer.y-fig.y)/fig.h).toFixed(3)}`,fig.x+6,fig.y+14,9,0.16,GREY); }
  const t=hover||selected; if(t){ const l1=`${t.num} · U ${t.u.toFixed(3)} · V ${t.v.toFixed(3)} · ${t.d}`; const l2=t.label; ctx.font=FONT(10); track(10,0.08); const w2=ctx.measureText(l2).width; if(hasLS)ctx.letterSpacing='0px'; const PW=Math.max(168,Math.ceil(w2)+16), PH=32; const Sz=9;
    let X=t.u>0.6?t.x-Sz-12-PW:t.x+Sz+12; let Y=t.y-PH/2; X=clamp(X,fig.x+2,fig.x+fig.w-PW-2); Y=clamp(Y,fig.y+2,fig.y+fig.h-PH-2);
    ctx.fillStyle=PAPER; ctx.fillRect(Math.round(X),Math.round(Y),PW,PH); ctx.strokeStyle=INK; ctx.lineWidth=0.5; ctx.strokeRect(px(X),px(Y),PW,PH); text(l1.toUpperCase(),X+8,Y+13,10,0.08,INK); text(l2,X+8,Y+27,10,0.08,INK); } }

/* ---------- loop ---------- */
function startRead(){ for(const t of P)t.lock=-1; rows.forEach((r,i)=>rowText(r,P[i],null,false)); ctrEl.textContent=`0 / ${P.length}`; phase='read'; pt=0; dirty=true; }
function frame(now){ requestAnimationFrame(frame); const dt=Math.min(0.05,(now-lastNow)/1000); lastNow=now; let work=false;
  if(phase==='pre'){ if(artDone)startRead(); }
  if(phase==='read'){ pt+=dt; work=true; const y=fig.y+fig.h*headPos(pt); let n=0; for(const t of P){ if(t.lock<0&&t.y<=y)t.lock=pt; if(t.lock>=0)n++; } ctrEl.textContent=`${n} / ${P.length}`;
    rows.forEach((r,i)=>{ const t=P[i]; if(t.lock<0)return; const e=clamp((pt-t.lock)/0.24,0,1); rowText(r,t,[t.u*e,t.v*e],e>=1); });
    if(pt>=READ+0.3){ phase='hold'; for(const t of P)if(t.lock<0)t.lock=pt; rows.forEach((r,i)=>rowText(r,P[i],[P[i].u,P[i].v],true)); ctrEl.textContent=`${P.length} / ${P.length}`; dirty=true; } }
  else if(phase==='hold'){ for(const t of P)if(t.lock>=0&&pt-t.lock<0.4)work=true; pt+=dt; }
  if(!work&&!dirty)return; dirty=false;
  ctx.clearRect(0,0,W,H);
  if(phase==='read'){ const y=fig.y+fig.h*headPos(pt); drawArt(y); ctx.strokeStyle=INK; ctx.lineWidth=0.75; ctx.beginPath(); ctx.moveTo(fig.x-14,px(y)); ctx.lineTo(fig.x+fig.w+14,px(y)); ctx.stroke(); }
  else drawArt(fig.y+fig.h);
  drawChrome(); drawTrackers(pt); drawHover(); }
requestAnimationFrame(frame);

/* ---------- input ---------- */
cv.addEventListener('mousemove',e=>{ const r=cv.getBoundingClientRect(); const x=e.clientX-r.left,y=e.clientY-r.top; pointer=(x>=fig.x&&x<=fig.x+fig.w&&y>=fig.y&&y<=fig.y+fig.h)?{x,y}:null; if(mode===2&&pointer)splitX=clamp((x-fig.x)/fig.w,0,1);
  let h=null; for(const t of P){ if(Math.hypot(t.x-x,t.y-y)<14)h=t; } if(h!==hover)setHover(h); dirty=true; });
cv.addEventListener('mouseleave',()=>{ pointer=null; if(hover)setHover(null); dirty=true; });
cv.addEventListener('click',()=>{ if(hover)select(hover); });
document.getElementById('bReread').onclick=()=>startRead();
addEventListener('keydown',e=>{ if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return; if((e.key==='r'||e.key==='R')&&hasRef)setMode(mode+1); else if(e.key==='s'||e.key==='S')openSpec(!specEl.classList.contains('open')); else if(e.key===' '){ e.preventDefault(); startRead(); } else if(e.key==='Escape')openSpec(false); });
let rto=null; addEventListener('resize',()=>{ clearTimeout(rto); rto=setTimeout(()=>{ layout(); dirty=true; },120); });
layout();
window.__study={S,fig:()=>fig,art:()=>art,fidelity:()=>fidelity,setMode};
})();
</script>
