<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Forced light, all three legs, inside the frame as well as outside it:
     the meta, color-scheme on :root (in the style file) and an explicit
     background on html AND body. -->
<meta name="color-scheme" content="light">
<title>D2 · Circled-glyph specimen</title>
<!-- Exactly one style file. It owns this lens's families, its @font-face
     rules and the token vocabulary its CSS is written against. -->
<link rel="stylesheet" href="../_styles/display-specimen.css">
<style>
/* ---------------------------------------------------------------------------
   D2 · Circled-glyph specimen — ref Konsumed
   This lens owns its CSS outright. In the monolith these rules lived in a
   1,481-selector stylesheet shared with the chrome and twenty-six other
   lenses, scoped only by an "#gl" prefix convention that nothing
   enforced. Ownership here was established by matching every parsed rule in
   the document against every element inside this lens's frame, so what is
   below is exactly what the browser was applying and nothing else.
   --------------------------------------------------------------------------- */
html, body { background:#fff; }
body {
  /* The plate is composed at its design width. The host renders the fragment
     at exactly this width and CSS-scales it; opened alone by double-click it
     centres itself rather than reflowing, because a lens reflowed into a
     different measure is a different composition. */
  width:1100px; margin:0 auto;
}
.lens-frame {
  /* The monolith's .lens-frame drew a 1px border. The chrome does not draw a
     border round a specimen any more — it lays a mat and puts crop marks
     outside the corners — so only the clipping and the paint containment
     survive. The crop is load-bearing: T1's display O is genuinely cropped
     by this edge. */
  position:relative; overflow:hidden; background:#fff; contain:paint;
}
#gl{ --tile:#111111; --cream:#efe9df; --cream-2:#8f8a80; --hair:rgba(239,233,223,.16); --hot:#ff4a1c;
  --f-disp:"Archivo Black","Anton",Impact,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace; --f-hand:"Caveat",cursive;
  position:relative; width:100%; background:var(--tile); color:var(--cream); overflow:hidden; isolation:isolate;
  container-type:inline-size; padding:3.2cqw 3.6cqw 2.8cqw; }
#gl *{ box-sizing:border-box; }
#gl .gl-row{ display:flex; align-items:baseline; justify-content:space-between; gap:2cqw;
  font-family:var(--f-mono); font-size:clamp(9px,1.05cqw,12px); letter-spacing:.14em; text-transform:uppercase; color:var(--cream); }
#gl .gl-row.head{ padding-bottom:1.3cqw; border-bottom:1px solid var(--hair); }
#gl .gl-row.foot{ max-width:none; margin:0; padding:1.3cqw 0 0; border-top:1px solid var(--hair); color:var(--cream-2); font-size:clamp(9px,1.05cqw,12px); letter-spacing:.14em; }
#gl .gl-row .dim{ color:var(--cream-2); }
#gl .gl-row .star{ font-family:var(--f-mono); color:var(--hot); font-size:1.15em; letter-spacing:0; margin-left:.9em; position:relative; top:.06em; }
#gl .gl-row .ver{ margin-left:.9em; }
#gl .gl-grid{ display:grid; grid-template-columns:repeat(9,1fr); grid-auto-rows:1fr; margin:2.2cqw 0 2.4cqw; position:relative; z-index:2; }
#gl .gl-cell{ position:relative; aspect-ratio:1/1.12; display:flex; align-items:center; justify-content:center; }
#gl .gl-cell .g{ font-family:var(--f-disp); font-size:6.1cqw; line-height:1; color:var(--cream); font-variant-numeric:lining-nums;
  transform:translateY(.02em); user-select:none; }
#gl .gl-cell.num .g{ font-variant-numeric:lining-nums tabular-nums; }
#gl .gl-cell .ix{ position:absolute; left:8%; top:6%; font-family:var(--f-mono); font-size:clamp(7px,.72cqw,9px); color:var(--cream-2); letter-spacing:.06em; opacity:.7; }
#gl .gl-mark{ position:absolute; inset:0; overflow:visible; pointer-events:none; z-index:3; }
#gl .gl-mark svg{ position:absolute; overflow:visible; }
#gl .gl-mark svg{ filter:url(#gl-marker); }
#gl .gl-mark path{ fill:var(--hot); stroke:none; }
#gl .gl-note{ position:absolute; z-index:4; font-family:var(--f-hand); font-weight:600; color:var(--hot);
  font-size:clamp(14px,2cqw,24px); line-height:1; white-space:nowrap; pointer-events:none; filter:url(#gl-marker-t); }
#gl .gl-grain{ position:absolute; inset:-4%; z-index:1; pointer-events:none; opacity:.16; mix-blend-mode:screen;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.15' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),
                   url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='.028' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='table' tableValues='0 .55'/></feComponentTransfer></filter><rect width='100%25' height='100%25' filter='url(%23m)'/></svg>"); }
#gl .gl-grain::after{ content:""; position:absolute; inset:0; opacity:.5;
  background:repeating-linear-gradient(112deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px), linear-gradient(100deg, transparent 30%, rgba(255,255,255,.05) 48%, transparent 66%); }
#gl .gl-row, #gl .gl-grid{ position:relative; z-index:2; }
.foot{ max-width:var(--maxw); margin:40px auto 0; padding: 30px var(--pad) 80px; border-top:1px solid var(--line);
  display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
  font-family:var(--f-mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3); }

@media (prefers-reduced-motion:no-preference){
  #gl .gl-mark svg, #gl .gl-note{ opacity:1; animation:gl-fade .35s ease both; animation-delay:var(--d,0s); }
}

@media(max-width:560px){
  #gl .gl-cell .g{ font-size:7.2cqw; }
}

/* the @keyframes this lens names. In the monolith these seven lived in
   one document-global namespace where two lenses could silently share an
   animation; inside a fragment the namespace is the fragment. */
@keyframes gl-fade{ from{ opacity:0; } to{ opacity:1; } }
</style>
</head>
<body>
<div class="lens-frame">
<div id="gl">
      <div class="gl-row head">
        <span>Konsumed <span class="dim">—</span> Display <span class="dim ver">· v1.2</span></span>
        <span>A–Z 0–9 <span class="dim">·</span> 36 glyphs</span>
      </div>

      <div class="gl-grid" id="gl-grid"></div>
      <div class="gl-mark" id="gl-mark"></div>
      <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
        <!-- paint-marker signature: hand waver (fine displacement) + slight dilate (wet edge). Markers don't starve — no pinholes. Static seed. -->
        <filter id="gl-marker" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.08 0.09" numOctaves="2" seed="23" result="j"/>
          <feDisplacementMap in="SourceGraphic" in2="j" scale="1.6" result="w"/>
          <feMorphology in="w" operator="dilate" radius="0.35"/>
        </filter>
        <!-- same hand for the scrawled notes: waver only (Caveat already carries its own weight) -->
        <filter id="gl-marker-t" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.09 0.1" numOctaves="2" seed="29" result="j"/>
          <feDisplacementMap in="SourceGraphic" in2="j" scale="1.1"/>
        </filter>
      </defs></svg>

      <div class="gl-row foot">
        <span>Set in caps <span class="dim">·</span> Units 1000 UPM</span>
        <span>Proof 03 <span class="dim">·</span> 08.26<span class="star">✱</span></span>
      </div>
      <div class="gl-grain"></div>
    </div>
</div>

<!-- Shared engines. Reuse, don't redefine: the monolith carried fifteen
     copies of mulberry32, three of the field builder, six of the dot screen
     and two of the paper tooth. Classic <script src>, relative, so this
     document opens by double-click with no server and no build step. -->
<script src="../_engines/rng.js"></script>
<script src="../_engines/scene.js"></script>
<script>

(function(){
  'use strict';
  const GL = {};
  GL.chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('');
  GL.grid = document.getElementById('gl-grid');
  GL.mark = document.getElementById('gl-mark');
  GL.root = document.getElementById('gl');

  // build 9×4 grid
  GL.cells = GL.chars.map((ch,i)=>{
    const c=document.createElement('div');
    c.className='gl-cell'+(i>=26?' num':'');
    c.innerHTML='<span class="ix">'+String(i+1).padStart(2,'0')+'</span><span class="g">'+ch+'</span>';
    GL.grid.appendChild(c); return c;
  });

  // seeded rng
  var mulberry = Comp.mulberry32;   /* was a local mulberry32 — see _engines/rng.js */

  // catmull-rom → cubic bezier path string
  function smooth(pts){
    let d='M'+pts[0][0].toFixed(2)+' '+pts[0][1].toFixed(2);
    for(let i=0;i<pts.length-1;i++){
      const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
      const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6];
      const c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
      d+=' C'+c1[0].toFixed(2)+' '+c1[1].toFixed(2)+' '+c2[0].toFixed(2)+' '+c2[1].toFixed(2)+' '+p2[0].toFixed(2)+' '+p2[1].toFixed(2);
    }
    return d;
  }

  // one wobbly elliptical pass → dense polyline. rx, ry in px; rot deg; sweep in turns; start angle; wobble amplitude
  function loosePts(cx,cy,rx,ry,rot,rnd,opt){
    const start=opt.start, sweep=opt.sweep, N=Math.round(64*sweep)+8, wob=opt.wob;
    const pts=[]; const rr=rot*Math.PI/180;
    // low-frequency drift so the second pass doesn't sit on the first
    const ph1=rnd()*6.28, ph2=rnd()*6.28, dx=(rnd()-.5)*rx*.16, dy=(rnd()-.5)*ry*.16;
    // per-vertex jitter is sampled at low frequency (every 6th vertex) so the hand shakes, the line doesn't fizz
    let jit=0, jitN=0;
    for(let i=0;i<=N;i++){
      if(i%6===0){ jitN=(rnd()-.5)*wob*.6; } jit+= (jitN-jit)*.35;
      const t=start+ (i/N)*sweep*Math.PI*2;
      const k=1 + Math.sin(t*2+ph1)*wob*.55 + Math.sin(t*3.3+ph2)*wob*.35 + jit;
      const ex=Math.cos(t)*rx*k, ey=Math.sin(t)*ry*(k*.98+.02);
      const x=cx+dx+ex*Math.cos(rr)-ey*Math.sin(rr), y=cy+dy+ex*Math.sin(rr)+ey*Math.cos(rr);
      pts.push([x,y]);
    }
    return pts;
  }
  // PRESSURE RIBBON: a polyline becomes a filled outline whose width varies along the stroke —
  // heavier where the hand slows (start of the loop, the far side), thinner where it speeds up; tapered exit
  function ribbon(pts, base, rnd, opt){
    opt=opt||{}; const n=pts.length; const L=[], R=[]; const ph=rnd()*6.28, ph2=rnd()*6.28;
    const inA=opt.taperIn==null?.08:opt.taperIn, outA=opt.taperOut==null?.22:opt.taperOut;
    for(let i=0;i<n;i++){
      const p0=pts[Math.max(0,i-1)], p1=pts[Math.min(n-1,i+1)];
      let tx=p1[0]-p0[0], ty=p1[1]-p0[1]; const l=Math.hypot(tx,ty)||1; tx/=l; ty/=l;
      const t=i/(n-1);
      let w=base*(0.62+0.38*Math.sin(t*3.6+ph)*Math.sin(t*3.6+ph)) * (1+0.22*Math.sin(t*13+ph2));
      if(t<inA) w*=0.45+0.55*(t/inA);                 // marker touches down: slightly narrower first contact
      if(t>1-outA) w*=Math.max(.18,Math.pow((1-t)/outA,.7)); // lifts off: taper
      const hw=w/2; L.push([pts[i][0]-ty*hw, pts[i][1]+tx*hw]); R.push([pts[i][0]+ty*hw, pts[i][1]-tx*hw]);
    }
    return smooth(L)+' L'+smooth(R.reverse()).slice(1)+' Z';
  }

  // marks spec: cell index (0-based), kind, options
  GL.spec = [
    {i:0,  kind:'circle', rot:-8,  sx:1.02, sy:.92, w:2.8, note:{t:'keep', dx:.62, dy:-.30, r:-6}},
    {i:6,  kind:'circle', rot:11,  sx:.94,  sy:1.0, w:2.6},
    {i:8,  kind:'circle', rot:-14, sx:1.12, sy:1.02,w:3.0, note:{t:'alt?', dx:.55, dy:.42, r:5}},
    {i:11, kind:'underline', w:2.7},
    {i:14, kind:'circle', rot:6,   sx:.96,  sy:.9,  w:2.6},
    {i:16, kind:'circle', rot:-5,  sx:1.06, sy:1.06,w:2.9, note:{t:'ss02', dx:-.72, dy:.46, r:-4}},
    {i:19, kind:'circle', rot:16,  sx:.9,   sy:.98, w:2.5},
    {i:22, kind:'circle', rot:-10, sx:1.16, sy:.9,  w:2.8},
    {i:24, kind:'arrow',  w:2.7},
    {i:29, kind:'circle', rot:9,   sx:.98,  sy:1.0, w:2.6, note:{t:'tail ↗', dx:.74, dy:.40, r:5}},
    {i:32, kind:'circle', rot:-12, sx:.92,  sy:1.08,w:2.9},
    {i:34, kind:'circle', rot:4,   sx:1.04, sy:.94, w:2.5}
  ];

  function ns(tag){ return document.createElementNS('http://www.w3.org/2000/svg',tag); }

  GL.render = function(){
    GL.mark.innerHTML='';
    GL.root.querySelectorAll('.gl-note').forEach(n=>n.remove());
    const R=GL.root.getBoundingClientRect();
    const rnd=mulberry(20260815);
    let delay=0.15;

    GL.spec.forEach(s=>{
      const cell=GL.cells[s.i]; const cr=cell.getBoundingClientRect();
      const g=cell.querySelector('.g').getBoundingClientRect();
      const cx=g.left+g.width/2-R.left, cy=g.top+g.height/2-R.top;
      // marker width scales with the tile (a 3px nib on a 1000px tile)
      const w=s.w*Math.max(.7,R.width/1000);
      const svg=ns('svg'); svg.setAttribute('width',R.width); svg.setAttribute('height',R.height);
      svg.setAttribute('viewBox','0 0 '+R.width+' '+R.height);
      svg.style.left='0'; svg.style.top='0'; svg.style.width=R.width+'px'; svg.style.height=R.height+'px';
      const paths=[];
      // dense polyline helper for straight-ish strokes with hand tremor
      const lineTo=(a,b,N,amp)=>{ const pts=[]; const ph=rnd()*6; for(let i=0;i<=N;i++){ const t=i/N;
        pts.push([a[0]+(b[0]-a[0])*t+Math.sin(t*7+ph)*amp, a[1]+(b[1]-a[1])*t+Math.cos(t*5+ph)*amp*.9]); } return pts; };

      if(s.kind==='circle'){
        const rx=(g.width*.62+cr.width*.16)*s.sx, ry=(g.height*.58+cr.height*.06)*s.sy;
        // pass 1: nearly full loop, ends overlapping the start; pass 2 (only some cells): shorter loop, offset start — the doubled pass
        const st=rnd()*6.28;
        paths.push({d:ribbon(loosePts(cx,cy,rx,ry,s.rot,rnd,{start:st, sweep:1.06+rnd()*.08, wob:.045}), w, rnd, {taperIn:.05,taperOut:.14}), a:.96});
        if(s.dbl!==false && rnd()<.7){
          paths.push({d:ribbon(loosePts(cx,cy,rx*(1+(rnd()-.5)*.09),ry*(1+(rnd()-.5)*.09),s.rot+(rnd()-.5)*8,rnd,{start:st+1.1+rnd()*.9, sweep:.62+rnd()*.3, wob:.06}), w*.82, rnd, {taperIn:.1,taperOut:.3}), a:.9});
        }
      }
      else if(s.kind==='underline'){
        const x0=cx-g.width*.72, x1=cx+g.width*.92, y=g.bottom-R.top+cr.height*.07;
        paths.push({d:ribbon(lineTo([x0,y],[x1,y+2],26,1.7), w, rnd, {taperIn:.05,taperOut:.16}), a:.96});
        paths.push({d:ribbon(lineTo([x1-6,y+w*2.2],[x0+10,y+w*1.6],26,1.5), w*.86, rnd, {taperIn:.05,taperOut:.3}), a:.9});
      }
      else if(s.kind==='arrow'){
        // arrow from lower-right space pointing at the glyph, drawn in two strokes (shaft, then a chevron head)
        const ax=cx+g.width*.98, ay=cy+g.height*.66, bx=cx+g.width*.42, by=cy+g.height*.18;
        paths.push({d:ribbon(lineTo([ax,ay],[bx,by],20,1.4), w, rnd, {taperIn:.05,taperOut:.12}), a:.96});
        const ang=Math.atan2(by-ay,bx-ax), L=g.width*.24;
        const h1=[bx-Math.cos(ang-.5)*L, by-Math.sin(ang-.5)*L], h2=[bx-Math.cos(ang+.55)*L*1.05, by-Math.sin(ang+.55)*L*1.05];
        const head=lineTo(h1,[bx,by],8,.6).concat(lineTo([bx,by],h2,8,.6).slice(1));
        paths.push({d:ribbon(head, w*.95, rnd, {taperIn:.12,taperOut:.22}), a:.94});
      }

      paths.forEach(p=>{
        const el=ns('path'); el.setAttribute('d',p.d);
        el.setAttribute('fill-opacity',String(p.a));
        svg.appendChild(el);
      });
      svg.style.setProperty('--d',delay.toFixed(2)+'s'); delay+=.11;
      GL.mark.appendChild(svg);

      if(s.note){
        const n=document.createElement('span'); n.className='gl-note'; n.textContent=s.note.t;
        n.style.left=(cx+cr.width*s.note.dx)+'px'; n.style.top=(cy+cr.height*s.note.dy)+'px';
        n.style.transform='translate(-50%,-50%) rotate('+s.note.r+'deg)';
        n.style.setProperty('--d',delay.toFixed(2)+'s');
        GL.root.appendChild(n);
      }
    });
  };

  // QA: measure the grid — every column width and every row height must agree within 1px
  GL.audit = function(){
    const cells=GL.cells.map(c=>c.getBoundingClientRect());
    const cols=[...new Set(cells.slice(0,9).map(r=>Math.round(r.width*10)/10))];
    const rows=[...new Set([0,9,18,27].map(i=>Math.round(cells[i].height*10)/10))];
    const gaps=[...new Set(cells.slice(1,9).map((r,i)=>Math.round((r.left-cells[i].right)*10)/10))];
    return {colWidths:cols, rowHeights:rows, gaps, even:cols.length===1&&rows.length===1};
  };
  let raf=0;
  function schedule(){ cancelAnimationFrame(raf); raf=requestAnimationFrame(GL.render); }
  Comp.paint(schedule, { threshold: 0 });
  window.GLlens = GL;
})();

</script>
<!-- The one contract a fragment owes the host: height and ready over
     postMessage, and a real stop on lens:pause. -->
<script src="../../../learn/fragment-boot.js"></script>
</body>
</html>
