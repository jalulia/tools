<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Forced light, all three legs, inside the frame as well as outside it:
     the meta, color-scheme on :root (in the style file) and an explicit
     background on html AND body. -->
<meta name="color-scheme" content="light">
<title>B3 · Event wristband / calendar</title>
<!-- Exactly one style file. It owns this lens's families, its @font-face
     rules and the token vocabulary its CSS is written against. -->
<link rel="stylesheet" href="../_styles/riso-xerox.css">
<style>
/* ---------------------------------------------------------------------------
   B3 · Event wristband / calendar — ref Festa Solar
   This lens owns its CSS outright. In the monolith these rules lived in a
   1,481-selector stylesheet shared with the chrome and twenty-six other
   lenses, scoped only by an "#festa" prefix convention that nothing
   enforced. Ownership here was established by matching every parsed rule in
   the document against every element inside this lens's frame, so what is
   below is exactly what the browser was applying and nothing else.
   --------------------------------------------------------------------------- */
html, body { background:#fff; }
body {
  /* The plate is composed at its design width. The host renders the fragment
     at exactly this width and CSS-scales it; opened alone by double-click it
     centres itself rather than reflowing, because a lens reflowed into a
     different measure is a different composition. */
  width:1100px; margin:0 auto;
}
.lens-frame {
  /* The monolith's .lens-frame drew a 1px border. The chrome does not draw a
     border round a specimen any more — it lays a mat and puts crop marks
     outside the corners — so only the clipping and the paint containment
     survive. The crop is load-bearing: T1's display O is genuinely cropped
     by this edge. */
  position:relative; overflow:hidden; background:#fff; contain:paint;
}
#festa{ --paper:#dedbd3; --orange:#e0541f; --orange-d:#c4441420; --toner:#16140f; --blue:#2f56d6;
  --rule:#b9b5a7; --rule-2:#a9a596;
  position:relative; width:100%; aspect-ratio:1/0.98; background:var(--paper); overflow:hidden; isolation:isolate;
  container-type:inline-size; }
#festa *{ box-sizing:border-box; }
#festa .layer{ position:absolute; }
#festa .cal{ position:absolute; inset:-6%; z-index:0; pointer-events:none; transform:perspective(1400px) rotateX(1.2deg) rotate(-2.4deg);
  background-image:
    linear-gradient(0deg, var(--rule) 1px, transparent 1px),
    linear-gradient(90deg, var(--rule) 1px, transparent 1px),
    linear-gradient(90deg, var(--rule-2) 1px, transparent 1px);
  background-size:100% 108px, 140px 100%, 100% 100%;
  background-position:0 -1px, -1px 0, 0 0; }
#festa .cal2{ position:absolute; inset:-6%; z-index:0; pointer-events:none; opacity:.55; transform:perspective(1400px) rotateX(1.2deg) rotate(-2.4deg);
  background-image:linear-gradient(0deg, var(--rule-2) 1px, transparent 1px);
  background-size:100% 276px; background-position:0 45px; }
#festa .light{ position:absolute; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(110% 95% at 18% 10%, rgba(255,255,255,.20), rgba(255,255,255,0) 58%),
             linear-gradient(135deg, rgba(0,0,0,0) 40%, rgba(45,35,25,.24) 100%); }
#festa .tooth{ position:absolute; inset:0; z-index:8; pointer-events:none; mix-blend-mode:multiply; opacity:.55; background-repeat:repeat; background-size:180px 180px; }
#festa .day{ position:absolute; z-index:2; font-family:"Archivo",sans-serif; font-size:2.6cqw; font-weight:400;
  color:var(--toner); letter-spacing:.01em; white-space:nowrap; }
#festa .day .num{ position:relative; font-weight:500; margin-left:.5em; }
#festa .day em{ color:#8f8a7c; font-style:normal; font-size:.82em; }
#festa .d1{ left:9%; top:16.5%; }
#festa .d2{ left:60%; top:7.5%; }
#festa .d3{ left:8%; top:82%; }
#festa .d4{ left:70%; top:82%; }
#festa .circ{ position:absolute; left:-36%; top:-64%; width:178%; height:242%; overflow:visible; z-index:2; }
#festa .ink{ position:absolute; z-index:3; overflow:visible; }
#festa .ink svg{ display:block; width:100%; height:auto; overflow:visible; }
#festa .globe{ right:26%; top:16%; width:15%; }
#festa .drink{ left:22%; bottom:20%; width:9%; }
#festa .connector{ left:52%; top:9%; width:14%; height:8%; z-index:2; }
#festa .hand{ position:absolute; z-index:3; font-family:"Caveat",cursive; color:var(--toner); line-height:.92; filter:url(#festaMarker); }
#festa .salve{ left:14%; top:23%; font-size:3.4cqw; font-weight:600; letter-spacing:.22em; text-transform:uppercase; transform:rotate(-7deg); }
#festa .praia{ right:8%; bottom:31%; font-size:3.4cqw; font-weight:600; letter-spacing:.22em; text-transform:uppercase; transform:rotate(-7deg); text-align:right; color:var(--toner); }
#festa .band{ position:absolute; left:5%; width:92%; height:9.6%; display:flex; z-index:5;
  filter:drop-shadow(1px 1.5px 1px rgba(40,25,10,.42)) drop-shadow(4px 7px 7px rgba(40,25,10,.22)); }
#festa .b1{ top:32%; transform:rotate(-1.4deg); }
#festa .b2{ top:41.4%;  transform:rotate(-1.0deg); z-index:6; }
#festa .b3{ top:50.6%; transform:rotate(-1.6deg); }
#festa .b3::before{ content:""; position:absolute; left:0; right:0; top:0; height:14%; z-index:6; pointer-events:none;
  background:linear-gradient(180deg, rgba(40,25,10,.28), rgba(40,25,10,0)); }
#festa .tyvek{ position:relative; flex:1; background:var(--orange); overflow:hidden;
  border-radius:0; display:flex; align-items:center; justify-content:center; }
#festa .tyvek .fib{ position:absolute; inset:0; z-index:5; width:100%; height:100%; pointer-events:none; }
#festa .tyvek::before{ content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,.12)); }
#festa .bandtype{ position:relative; z-index:4; display:flex; align-items:center; gap:.4cqw;
  padding-left:0; white-space:nowrap; }
#festa .bt{ font-family:"Anton",sans-serif; font-size:6.4cqw; line-height:.8; color:var(--toner);
  letter-spacing:.006em; transform:scaleX(.98); transform-origin:center; }
#festa .burst{ width:4.4cqw; height:4.4cqw; flex:none; }
#festa .bandmeta{ display:none; position:relative; z-index:4; margin-left:auto; padding-right:2.6cqw; white-space:nowrap;
  font-family:var(--f-mono); font-size:2.3cqw; font-weight:600; letter-spacing:.08em;
  color:#2a1c10; text-transform:uppercase; opacity:.72; }
#festa .stub{ position:relative; width:11%; background:#f6f4ee; border-radius:0;
  box-shadow:inset 3px 0 6px -4px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center; }
#festa .lstub{ width:8%; justify-content:center; box-shadow:inset -3px 0 6px -4px rgba(0,0,0,.25); }
#festa .lstub .serial{ font-family:var(--f-mono); font-size:1.15cqw; letter-spacing:.06em; color:#25211b; writing-mode:vertical-rl; transform:rotate(180deg); opacity:.85; }
#festa .stub .barcode{ width:70%; height:50%; }
#festa .stub .sn{ position:absolute; bottom:6%; left:0; right:0; text-align:center;
  font-family:var(--f-mono); font-size:1.15cqw; letter-spacing:.1em; color:#25211b; }
#festa .perf{ position:absolute; top:0; bottom:0; width:.9cqw; z-index:7; pointer-events:none;
  background:radial-gradient(circle at 50% 50%, var(--paper) 0 .22cqw, rgba(60,40,20,.35) .26cqw, transparent .34cqw) 0 0/.9cqw 1.05cqw repeat-y; }
#festa .stub .perf{ left:-.45cqw; }
#festa .lstub .perf{ right:-.45cqw; left:auto; }
#festa .grain{ position:absolute; inset:-6%; z-index:9; pointer-events:none; opacity:.14; mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

@media (prefers-reduced-motion: no-preference){
  #festa .tw{ animation:festaTw 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  #festa .tw.b{ animation-delay:1.1s; }
}

@media (max-width:560px){
  #festa .bandmeta{ display:none; }
}

/* the @keyframes this lens names. In the monolith these seven lived in
   one document-global namespace where two lenses could silently share an
   animation; inside a fragment the namespace is the fragment. */
@keyframes festaTw{ 0%,100%{ opacity:.35; } 50%{ opacity:1; } }

<!-- Shared engines. Reuse, don't redefine: the monolith carried fifteen
     copies of mulberry32, three of the field builder, six of the dot screen
     and two of the paper tooth. Classic <script src>, relative, so this
     document opens by double-click with no server and no build step. -->
<script src="../_engines/raster.js"></script>

<script>
/* ===== FESTA SOLAR: tyvek fibre engine + paper tooth ===== */
(function(){
var festaMulberry = Comp.mulberry32;   /* was a local mulberry32 — see _engines/rng.js */
/* spun-polyethylene: thousands of short, slightly curved fibres (light and dark), a soft diagonal sheen, two crinkle creases */
function festaTyvek(cv, cssW, cssH, seed){
  const dpr=Comp.dpr(2), W=Math.round(cssW*dpr), H=Math.round(cssH*dpr); cv.width=W; cv.height=H;
  const x=cv.getContext('2d'), rnd=festaMulberry(seed);
  x.clearRect(0,0,W,H);
  const N=Math.round(W*H/38);
  x.lineCap='round';
  for(let i=0;i<N;i++){
    const px=rnd()*W, py=rnd()*H, len=4+rnd()*22, a=(rnd()-.5)*1.1+(rnd()<.5?0:Math.PI), light=rnd()<.55;
    const al=light?0.05+rnd()*.10:0.04+rnd()*.09;
    x.strokeStyle=light?'rgba(255,238,220,'+al+')':'rgba(70,25,8,'+al+')';
    x.lineWidth=0.6+rnd()*1.1;
    x.beginPath(); x.moveTo(px,py);
    x.quadraticCurveTo(px+Math.cos(a)*len*.5+(rnd()-.5)*4, py+Math.sin(a)*len*.5+(rnd()-.5)*4, px+Math.cos(a)*len, py+Math.sin(a)*len); x.stroke();
  }
  // soft sheen: a low, wide diagonal highlight from the top-left lamp
  let g=x.createLinearGradient(0,0,W*.6,H); g.addColorStop(0,'rgba(255,255,255,.16)'); g.addColorStop(.35,'rgba(255,255,255,.05)'); g.addColorStop(.6,'rgba(255,255,255,0)'); g.addColorStop(1,'rgba(0,0,0,.08)');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  // crinkle creases: light rim + dark trough, near-diagonal, one or two per band
  for(let k=0;k<2;k++){
    const cx=W*(0.15+rnd()*.7), tilt=(rnd()-.5)*W*.12;
    x.lineWidth=1.2; x.strokeStyle='rgba(255,240,225,.28)'; x.beginPath(); x.moveTo(cx,0); x.quadraticCurveTo(cx+tilt*.5+(rnd()-.5)*10,H*.5,cx+tilt,H); x.stroke();
    x.strokeStyle='rgba(60,20,5,.20)'; x.beginPath(); x.moveTo(cx+2,0); x.quadraticCurveTo(cx+tilt*.5+2+(rnd()-.5)*10,H*.5,cx+tilt+2,H); x.stroke();
  }
}
/* paper tooth tile: per-pixel value + faint horizontal fibres, cached once, multiplied over the calendar */
/* the calendar's stock is _engines/paper.js — same 180px tile, same seed. */
function festaTooth(){ return Comp.paperTile({ size:180, seed:4242, base:234, amp:21, fibres:54, fibre:'rgba(120,110,95,.12)' }); }
let toothURL=null;
function festaRun(){
  const root=document.getElementById('festa'); if(!root) return;
  if(!toothURL){ toothURL=festaTooth(); }
  const t=root.querySelector('.tooth'); if(t) t.style.backgroundImage='url('+toothURL+')';
  root.querySelectorAll('.tyvek .fib').forEach((cv,i)=>{ const r=cv.parentElement.getBoundingClientRect(); if(r.width) festaTyvek(cv, r.width, r.height, 101+i*37); });
}
Comp.paint(festaRun, { debounce: 300 });
})();
</script>
