<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- The forced-light contract: meta, color-scheme:light on :root in
     ../learn/tokens.css, and an explicit background on both html and body.
     No theme toggle. The archive is one page across many entities. -->
<meta name="color-scheme" content="light">
<meta name="description" content="The encyclopedia — techniques, atoms, styles, explorations and couplings, indexed as one archive.">
<title>Encyclopedia</title>
<link rel="stylesheet" href="../learn/tokens.css">
<link rel="stylesheet" href="../learn/shell.css">
<link rel="stylesheet" href="../learn/fonts/fonts.css">
</head>
<body data-mode="catalogue" data-index="open" data-apparatus="closed">

<a class="skip" href="#view">Skip to the entry</a>

<!-- R1 MASTHEAD — one markup; condenses below 840. -->
<header class="mast">
  <button type="button" class="ctl" id="idxbtn" aria-pressed="true" aria-expanded="true"
          aria-controls="rail">Index <kbd>/</kbd></button>
  <span class="brand" id="brand"></span>
  <span class="crumb" id="crumb"></span>
  <span class="sp"></span>
  <span class="pos" id="pos"></span>
  <nav class="switch" id="switch" aria-label="Tool"></nav>
  <button type="button" class="ctl" id="edbtn" aria-pressed="false"
          aria-controls="app">Source <kbd>e</kbd></button>
  <button type="button" class="ctl" id="helpbtn" aria-label="Keyboard shortcuts">?</button>
</header>

<main class="frame">
  <!-- R2 INDEX -->
  <aside class="rail" id="rail" aria-label="Index">
    <input class="find" id="find" type="search" autocomplete="off" aria-label="Search the archive">
    <div class="chips" id="chips" role="group" aria-label="Editorial status"></div>
    <div class="count" id="count"></div>
    <ul class="spine" id="spine"></ul>
  </aside>

  <!-- R3 ENTRY -->
  <section class="col">
    <div class="colw" id="view" tabindex="-1"></div>
  </section>
</main>

<!-- R4 APPARATUS -->
<aside class="app" id="app" aria-label="Apparatus">
  <div class="app-head">
    <div class="app-tabs" id="app-tabs" role="tablist"></div>
    <span class="file" id="app-file"></span>
  </div>
  <div class="app-body" id="app-body"></div>
  <div class="con" id="con" aria-live="polite"></div>
  <div class="app-foot" id="app-foot"></div>
</aside>

<button type="button" class="pill" id="pill" aria-controls="rail">
  <span class="car" aria-hidden="true">▲</span> Index <span class="n"></span>
</button>

<dialog class="help" id="help" aria-label="Keyboard shortcuts">
  <div class="hd"><span class="lab">Keyboard</span>
    <button type="button" class="ctl" id="helpclose">Close</button></div>
  <dl id="help-keys"></dl>
</dialog>

<!-- Classic scripts only — no module, no fetch, no CDN. The encyclopedia
     carries every lane an entry might declare: glsl, canvas2d, fragment, audio.
     Engines load BEFORE swatches.js so `Comp.mulberry32` / `Comp.dotScreen` /
     `Comp.paperTooth` are already registered when the atom shelves paint.
     The manifest is last because registering it is what boots the shell. -->
<script src="../learn/shell.js"></script>
<script src="../learn/plot.js"></script>
<script src="../learn/views.js"></script>
<script src="../learn/adapters/glsl.js"></script>
<script src="../learn/adapters/canvas2d.js"></script>
<script src="../learn/adapters/fragment.js"></script>
<script src="../learn/adapters/audio.js"></script>
<!-- shared engines — the six that back the atom swatches on #/atoms and every
     lens fragment beneath. rng first so mulberry32 is defined by the time
     paper.js and field.js look for it on Comp. -->
<script src="content/_engines/rng.js"></script>
<script src="content/_engines/raster.js"></script>
<script src="content/_engines/paper.js"></script>
<script src="content/_engines/halftone.js"></script>
<script src="content/_engines/field.js"></script>
<script src="content/_engines/scene.js"></script>
<script src="swatches.js"></script>
<script src="manifest.js"></script>
</body>
</html>
