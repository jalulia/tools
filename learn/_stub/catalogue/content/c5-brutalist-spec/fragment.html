<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>C5 · Brutalist spec sheet</title>
<!-- A fragment declares its own type. The style owns the faces; the fragment
     links the one file for its style and never expects the host to define
     var(--f-display) for it. -->
<link rel="stylesheet" href="../_styles/document-system.css">
<style>
  html, body { margin: 0; background: var(--ground); }
  body { width: 1100px; }
  .plate { position: relative; width: 1100px; height: 900px; overflow: hidden; }

  .hd { position:absolute; left:56px; top:56px; width:988px; display:flex;
        border-bottom:3px solid #141210; padding-bottom:10px;
        font-family:var(--f-mono); font-size:34px; letter-spacing:.1em; color:#141210; }
  .hd span { margin-left:auto; font-size:20px; align-self:end; }
  table { position:absolute; left:56px; top:150px; width:600px; border-collapse:collapse;
          font-family:var(--f-mono); font-size:16px; color:#141210; }
  td { border-bottom:1px solid #141210; padding:14px 8px; }
  td:last-child { text-align:right; color:#5a5a5a; }
  .dia { position:absolute; right:56px; top:170px; width:340px; height:340px;
         border:2px solid #141210;
         background: repeating-linear-gradient(45deg,#141210 0 1px,transparent 1px 14px); }
  .foot { position:absolute; left:56px; bottom:56px; font-family:var(--f-mono); font-size:14px;
          letter-spacing:.24em; }
</style>
</head><body>
<div class="plate">

  <div class="hd">SPEC / 04<span>REV C</span></div>
  <table>
    <tr><td>SUBSTRATE</td><td>Bone 120 gsm, uncoated</td><td>±3%</td></tr>
    <tr><td>PROCESS</td><td>Two-drum risograph</td><td>2 pass</td></tr>
    <tr><td>REGISTER</td><td>Deliberate offset</td><td>2.4 mm</td></tr>
    <tr><td>SCREEN</td><td>Ordered, 4×4</td><td>34 lpi</td></tr>
    <tr><td>TRIM</td><td>Crop marks outside the plate</td><td>6 mm</td></tr>
  </table>
  <div class="dia"></div>
  <div class="foot">DOCUMENT &amp; SYSTEM · NO ORNAMENT</div>
</div>

<script src="../../../../fragment-boot.js"></script>
</body></html>
