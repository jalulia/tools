<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>E1 · Editorial type-stack</title>
<!-- A fragment declares its own type. The style owns the faces; the fragment
     links the one file for its style and never expects the host to define
     var(--f-display) for it. -->
<link rel="stylesheet" href="../_styles/display-specimen.css">
<style>
  html, body { margin: 0; background: var(--ground); }
  body { width: 1100px; }
  .plate { position: relative; width: 1100px; height: 900px; overflow: hidden; }

  .stack { position:absolute; left:70px; top:96px; }
  .l1 { font-family:var(--f-display); font-size:190px; line-height:.84; color:#141210; }
  .l2 { font-family:var(--f-text); font-style:italic; font-size:96px; line-height:1;
        color:#7a7268; margin-left:230px; }
  .l3 { font-family:var(--f-display); font-size:150px; line-height:.9; color:#141210; }
  .l4 { font-family:var(--f-text); font-style:italic; font-size:78px; color:#7a7268; margin-left:120px; }
  .foot { position:absolute; left:70px; bottom:64px; font-family:var(--f-mono); font-size:14px;
          letter-spacing:.24em; color:#7a7268; }
</style>
</head><body>
<div class="plate">

  <div class="stack">
    <div class="l1">FORM</div><div class="l2">follows</div>
    <div class="l3">AVAILABLE</div><div class="l4">materials</div>
  </div>
  <div class="foot">SPECIMEN · 4 SIZES · ONE FAMILY</div>
</div>

<script src="../../../../fragment-boot.js"></script>
</body></html>
