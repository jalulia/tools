<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>C1 · Heavy-ink riso block</title>
<!-- A fragment declares its own type. The style owns the faces; the fragment
     links the one file for its style and never expects the host to define
     var(--f-display) for it. -->
<link rel="stylesheet" href="../_styles/riso-xerox.css">
<style>
  html, body { margin: 0; background: var(--ground); }
  body { width: 1100px; }
  .plate { position: relative; width: 1100px; height: 900px; overflow: hidden; }

  .block { position:absolute; left:64px; top:64px; width:700px; height:772px; background:#141210;
           clip-path: polygon(0 0, 100% 0, 96% 62%, 100% 100%, 0 100%); }
  .stamp { position:absolute; right:120px; top:70px; width:110px; height:110px; border-radius:50%;
           background:#c8341f; color:#f0ece2; font-family:var(--f-mono); font-size:22px;
           display:grid; place-items:center; text-align:center; transform:rotate(-4deg); line-height:1.1; }
  .word { position:absolute; left:104px; top:430px; font-family:var(--f-display); font-size:120px;
          line-height:.92; color:#e7e3d9; }
  .spec { position:absolute; right:64px; top:300px; writing-mode:vertical-rl;
          font-family:var(--f-mono); font-size:14px; letter-spacing:.2em; color:#141210; }
</style>
</head><body>
<div class="plate">

  <div class="block"></div>
  <div class="stamp">01<br>50</div>
  <div class="word">HEAVY<br>TEXTURE</div>
  <div class="spec">BONE 120 GSM · DRUM 01 BLACK · DRUM 02 BRICK</div>
</div>

<script src="../../../../fragment-boot.js"></script>
</body></html>
