<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>B2 · Riso brush poster</title>
<!-- A fragment declares its own type. The style owns the faces; the fragment
     links the one file for its style and never expects the host to define
     var(--f-display) for it. -->
<link rel="stylesheet" href="../_styles/riso-xerox.css">
<style>
  html, body { margin: 0; background: var(--ground); }
  body { width: 1100px; }
  .plate { position: relative; width: 1100px; height: 900px; overflow: hidden; }

  .ink { position:absolute; left:0; top:0; width:1100px; height:330px; background:#e8531f;
         clip-path: polygon(0 0, 100% 0, 100% 78%, 62% 92%, 24% 74%, 0 88%); }
  .word { position:absolute; left:64px; top:360px; font-family:var(--f-display);
          font-size:250px; line-height:.86; color:#141210; letter-spacing:-.02em; }
  .word::after { content:'GRACE'; position:absolute; left:6px; top:4px; color:#e8531f;
                 mix-blend-mode:multiply; z-index:-1; }
  .rule { position:absolute; left:64px; top:660px; width:972px; height:2px; background:#141210; }
  .cap { position:absolute; left:64px; top:690px; font-family:var(--f-mono); font-size:15px;
         letter-spacing:.2em; color:#141210; }
</style>
</head><body>
<div class="plate">

  <div class="ink"></div>
  <div class="word">GRACE</div>
  <div class="rule"></div>
  <div class="cap">CREATIVE CHURCH · TWO DRUM · 2.4 MM OFF REGISTER</div>
</div>

<script src="../../../../fragment-boot.js"></script>
</body></html>
