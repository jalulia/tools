<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>CRX-01 · Instrument typology</title>
<!-- A fragment declares its own type. The style owns the faces; the fragment
     links the one file for its style and never expects the host to define
     var(--f-display) for it. -->
<link rel="stylesheet" href="../_styles/instrument-drawing.css">
<style>
  html, body { margin: 0; background: var(--ground); }
  body { width: 1100px; }
  .plate { position: relative; width: 1100px; height: 900px; overflow: hidden; }

  body { background:#faf8f3; }
  svg { display:block; }
</style>
</head><body>
<div class="plate">

  <svg viewBox="0 0 1100 900" width="1100" height="900" aria-label="Instrument typology plate">
    <g fill="none" stroke="#141210" stroke-width="1.4">
      <rect x="80" y="80" width="940" height="740"/>
      <line x1="80" y1="150" x2="1020" y2="150"/>
      <g transform="translate(180,340)">
        <circle r="110"/><circle r="72"/><circle r="8"/>
        <line x1="-140" y1="0" x2="140" y2="0" stroke-dasharray="6 5"/>
        <line x1="0" y1="-140" x2="0" y2="140" stroke-dasharray="6 5"/>
      </g>
      <g transform="translate(520,340)">
        <rect x="-110" y="-110" width="220" height="220"/>
        <rect x="-72" y="-72" width="144" height="144"/>
        <line x1="-140" y1="140" x2="140" y2="-140" stroke-dasharray="6 5"/>
      </g>
      <g transform="translate(860,340)">
        <polygon points="0,-115 100,58 -100,58"/>
        <polygon points="0,-72 62,36 -62,36"/>
      </g>
      <g stroke-width="1">
        <line x1="180" y1="500" x2="180" y2="540"/><line x1="520" y1="500" x2="520" y2="540"/>
        <line x1="180" y1="520" x2="520" y2="520"/>
      </g>
    </g>
    <g font-family="var(--f-mono)" font-size="15" fill="#141210" letter-spacing="2">
      <text x="100" y="122">TYPOLOGY · 03 FORMS · SCALE 1:2 · DIMENSIONS IN MILLIMETRES</text>
      <text x="300" y="516">340 mm</text>
      <text x="140" y="620">01 CIRCULAR</text><text x="480" y="620">02 SQUARE</text>
      <text x="820" y="620">03 TRIANGULAR</text>
    </g>
  </svg>
</div>

<script src="../../../../fragment-boot.js"></script>
</body></html>
