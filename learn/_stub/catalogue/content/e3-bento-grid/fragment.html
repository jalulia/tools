<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>E3 · Bento grid</title>
<!-- A fragment declares its own type. The style owns the faces; the fragment
     links the one file for its style and never expects the host to define
     var(--f-display) for it. -->
<link rel="stylesheet" href="../_styles/layout-systems.css">
<style>
  html, body { margin: 0; background: var(--ground); }
  body { width: 1100px; }
  .plate { position: relative; width: 1100px; height: 900px; overflow: hidden; }

  .g { position:absolute; inset:64px; display:grid; gap:16px;
       grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); }
  .t { background:#e7e3d9; border:1px solid #cfc9bb; font-family:var(--f-display);
       font-size:52px; display:grid; place-items:center; color:#141210; }
  .a { grid-column: span 2; grid-row: span 2; background:#1f3fd6; color:#f2f0ea; }
  .b { grid-column: span 2; }
  .c { grid-row: span 2; background:#141210; }
  .f { background:#e8531f; color:#f2f0ea; }
  .cap { position:absolute; left:64px; bottom:24px; font-family:var(--f-mono); font-size:13px;
         letter-spacing:.22em; color:#7a7268; }
</style>
</head><body>
<div class="plate">

  <div class="g">
    <div class="t a">NOW</div><div class="t b">THEN</div><div class="t c"></div>
    <div class="t d">LIGHT</div><div class="t e"></div><div class="t f">2026</div>
  </div>
  <div class="cap">HISTORICAL · SUPERSEDED BY E2 MODULAR GRID</div>
</div>

<script src="../../../../fragment-boot.js"></script>
</body></html>
