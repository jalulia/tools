<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- The forced-light contract, part 1 of 3: the meta. Part 2 is
     color-scheme:light on :root and part 3 is an explicit background on both
     html and body — both in ../learn/tokens.css. There is no theme toggle:
     the page is always light and the stage declares its own ground. -->
<meta name="color-scheme" content="light">
<meta name="description" content="The Book of Shaders adapted onto the press bench: the book's chapters as a live GLSL stage, with the chapters the book left as stubs written here.">
<title>The Book of Shaders</title>
<link rel="stylesheet" href="../learn/tokens.css">
<link rel="stylesheet" href="../learn/shell.css">
<link rel="stylesheet" href="../learn/fonts/fonts.css">
</head>
<body data-mode="course" data-index="open" data-apparatus="closed">

<a class="skip" href="#view">Skip to the chapter</a>

<!-- R1 MASTHEAD — one markup at every width. It condenses in CSS, never in a
     second hand-authored file (PLAN §5.10). -->
<header class="mast">
  <button type="button" class="ctl" id="idxbtn" aria-pressed="true" aria-expanded="true"
          aria-controls="rail">Index <kbd>/</kbd></button>
  <span class="brand" id="brand"></span>
  <span class="crumb" id="crumb"></span>
  <span class="sp"></span>
  <span class="pos" id="pos"></span>
  <nav class="switch" id="switch" aria-label="Tool"></nav>
  <button type="button" class="ctl" id="edbtn" aria-pressed="false"
          aria-controls="app">Edit <kbd>e</kbd></button>
  <button type="button" class="ctl" id="helpbtn" aria-label="Keyboard shortcuts">?</button>
</header>

<main class="frame">
  <!-- R2 INDEX -->
  <aside class="rail" id="rail" aria-label="Index">
    <input class="find" id="find" type="search" autocomplete="off" aria-label="Search chapters">
    <div class="chips" id="chips" role="group" aria-label="Editorial status"></div>
    <div class="count" id="count"></div>
    <ul class="spine" id="spine"></ul>
  </aside>

  <!-- R3 ENTRY -->
  <section class="col">
    <div class="colw" id="view" tabindex="-1"></div>
  </section>
</main>

<!-- R4 APPARATUS — summoned, not resident. `e` opens it. -->
<aside class="app" id="app" aria-label="Apparatus">
  <div class="app-head">
    <div class="app-tabs" id="app-tabs" role="tablist"></div>
    <span class="file" id="app-file"></span>
  </div>
  <div class="app-body" id="app-body"></div>
  <div class="con" id="con" aria-live="polite"></div>
  <div class="app-foot" id="app-foot"></div>
</aside>

<button type="button" class="pill" id="pill" aria-controls="rail">
  <span class="car" aria-hidden="true">▲</span> Index <span class="n"></span>
</button>

<dialog class="help" id="help" aria-label="Keyboard shortcuts">
  <div class="hd"><span class="lab">Keyboard</span>
    <button type="button" class="ctl" id="helpclose">Close</button></div>
  <dl id="help-keys"></dl>
</dialog>

<!-- Six classic scripts. No module, no fetch, no CDN, no build step: under
     file:// a classic <script src> is the only thing that loads external data,
     and this tool has to open by double-click. The manifest is last because
     registering it is what boots the shell; it then injects one
     content/<id>/entry.js per chapter, in manifest order. -->
<script src="../learn/shell.js"></script>
<script src="../learn/plot.js"></script>
<script src="../learn/views.js"></script>
<script src="../learn/adapters/glsl.js"></script>
<script src="../learn/adapters/canvas2d.js"></script>
<script src="manifest.js"></script>
</body>
</html>
