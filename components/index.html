<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- The forced-light contract, part 1 of 3: the meta. Part 2 is
     color-scheme:light on :root and part 3 is an explicit background on both
     html and body — both in ../learn/tokens.css. No theme toggle: the page is
     always light and says so, and each specimen declares its own ground. -->
<meta name="color-scheme" content="light">
<meta name="description" content="A press bench for generated print, type and layout: each lens is a complete standalone document, trimmed onto a neutral mat and explained beside its reference decomposition.">
<title>Components — the lens library</title>
<link rel="stylesheet" href="../learn/tokens.css">
<link rel="stylesheet" href="../learn/shell.css">
<link rel="stylesheet" href="../learn/fonts/fonts.css">
</head>
<body data-mode="catalogue" data-index="open" data-apparatus="closed">

<a class="skip" href="#view">Skip to the entry</a>

<!-- R1 MASTHEAD — one markup. It condenses in CSS below 840; there is no
     separate phone header to drift out of step with this one. -->
<header class="mast">
  <button type="button" class="ctl" id="idxbtn" aria-pressed="true" aria-expanded="true"
          aria-controls="rail">Index <kbd>/</kbd></button>
  <span class="brand" id="brand"></span>
  <span class="crumb" id="crumb"></span>
  <span class="sp"></span>
  <span class="pos" id="pos"></span>
  <nav class="switch" id="switch" aria-label="Tool"></nav>
  <button type="button" class="ctl" id="edbtn" aria-pressed="false"
          aria-controls="app">Source <kbd>e</kbd></button>
  <button type="button" class="ctl" id="helpbtn" aria-label="Keyboard shortcuts">?</button>
</header>

<main class="frame">
  <!-- R2 INDEX -->
  <aside class="rail" id="rail" aria-label="Index">
    <input class="find" id="find" type="search" autocomplete="off" aria-label="Search lenses">
    <div class="chips" id="chips" role="group" aria-label="Editorial status"></div>
    <div class="count" id="count"></div>
    <ul class="spine" id="spine"></ul>
  </aside>

  <!-- R3 ENTRY -->
  <section class="col">
    <div class="colw" id="view" tabindex="-1"></div>
  </section>
</main>

<!-- R4 APPARATUS — summoned, not resident. A lens is its own document and
     cannot be read from this page; the pane names the file and offers to
     open it alone. That is the isolation working, not a limitation. -->
<aside class="app" id="app" aria-label="Apparatus">
  <div class="app-head">
    <div class="app-tabs" id="app-tabs" role="tablist"></div>
    <span class="file" id="app-file"></span>
  </div>
  <div class="app-body" id="app-body"></div>
  <div class="con" id="con" aria-live="polite"></div>
  <div class="app-foot" id="app-foot"></div>
</aside>

<button type="button" class="pill" id="pill" aria-controls="rail">
  <span class="car" aria-hidden="true">▲</span> Index <span class="n"></span>
</button>

<dialog class="help" id="help" aria-label="Keyboard shortcuts">
  <div class="hd"><span class="lab">Keyboard</span>
    <button type="button" class="ctl" id="helpclose">Close</button></div>
  <dl id="help-keys"></dl>
</dialog>

<!-- Five classic scripts. No module, no fetch, no CDN, no build step, so this
     page opens by double-click from ~/Downloads with no server. The manifest
     is last because registering it is what boots the shell. -->
<script src="../learn/shell.js"></script>
<script src="../learn/plot.js"></script>
<script src="../learn/views.js"></script>
<script src="../learn/adapters/fragment.js"></script>
<script src="manifest.js"></script>
</body>
</html>
