<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Forced light, all three legs, inside the frame as well as outside it:
     the meta, color-scheme on :root (in the style file) and an explicit
     background on html AND body. -->
<meta name="color-scheme" content="light">
<title>C4 · Wrapped ribbon type</title>
<!-- Exactly one style file. It owns this lens's families, its @font-face
     rules and the token vocabulary its CSS is written against. -->
<link rel="stylesheet" href="../_styles/display-specimen.css">
<style>
/* ---------------------------------------------------------------------------
   C4 · Wrapped ribbon type — ref Promoter Loops
   This lens owns its CSS outright. In the monolith these rules lived in a
   1,481-selector stylesheet shared with the chrome and twenty-six other
   lenses, scoped only by an "#rb" prefix convention that nothing
   enforced. Ownership here was established by matching every parsed rule in
   the document against every element inside this lens's frame, so what is
   below is exactly what the browser was applying and nothing else.
   --------------------------------------------------------------------------- */
html, body { background:#fff; }
body {
  /* The plate is composed at its design width. The host renders the fragment
     at exactly this width and CSS-scales it; opened alone by double-click it
     centres itself rather than reflowing, because a lens reflowed into a
     different measure is a different composition. */
  width:1100px; margin:0 auto;
}
.lens-frame {
  /* The monolith's .lens-frame drew a 1px border. The chrome does not draw a
     border round a specimen any more — it lays a mat and puts crop marks
     outside the corners — so only the clipping and the paint containment
     survive. The crop is load-bearing: T1's display O is genuinely cropped
     by this edge. */
  position:relative; overflow:hidden; background:#fff; contain:paint;
}
#rb{ --ground:#e4e0d8; --band:#0f0e0d; --cream:#efe6cf; --h:10cqw;
  position:relative; width:100%; aspect-ratio:1/0.92; overflow:hidden; isolation:isolate;
  background:radial-gradient(115% 100% at 42% 34%, #ede9e1 0%, #e2ded5 55%, #d3cec3 100%);
  container-type:inline-size; }
#rb *{ box-sizing:border-box; }
#rb .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
#rb .paper{ position:absolute; inset:-4%; z-index:9; pointer-events:none; opacity:.10; mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.05' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
#rb .seg{ position:absolute; left:50%; top:var(--y); width:160cqw; height:var(--h); margin-left:-80cqw; margin-top:calc(var(--h) / -2);
  transform:rotate(var(--r)); transform-origin:50% 50%;
  background:
    linear-gradient(180deg, rgba(255,255,255,.06) 0, rgba(255,255,255,0) 18%, rgba(0,0,0,0) 82%, rgba(0,0,0,.28) 100%),
    var(--band);
  display:flex; align-items:center; overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(239,230,207,.14), inset 0 -1px 0 rgba(0,0,0,.6); }
#rb .a, #rb .c, #rb .e{ --sx:-0.4px; --sy:6.7px; }
#rb .b, #rb .d{ --sx:5.6px; --sy:3.7px; }
#rb .sh{ background:transparent; overflow:visible; z-index:1; pointer-events:none;
  box-shadow:calc(var(--sx) * .35) calc(var(--sy) * .35) 2px rgba(30,22,14,.30), var(--sx) var(--sy) 12px rgba(30,22,14,.26); }
#rb .sh::before, #rb .sh::after{ display:none; }
#rb .x{ position:absolute; z-index:4; pointer-events:none; top:0; height:var(--h); width:44cqw; margin-left:-22cqw;
  left:calc(var(--f) * 160cqw); transform:rotate(var(--q)); background:transparent;
  box-shadow:calc(var(--xs) * .35) calc(var(--ys) * .35) 2px rgba(0,0,0,.45), var(--xs) var(--ys) 12px rgba(0,0,0,.5); }
#rb .a .x, #rb .c .x, #rb .e .x{ --xs:5.6px; --ys:3.7px; }
#rb .b .x, #rb .d .x{ --xs:-0.4px; --ys:6.7px; }
#rb .seg::before{ content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
  background:
    repeating-linear-gradient(90deg, rgba(239,230,207,.78) 0 2.5px, transparent 2.5px 6px) 0 9% / 100% 1.2px no-repeat,
    repeating-linear-gradient(90deg, rgba(0,0,0,.6) 0 2.5px, transparent 2.5px 6px) 0 calc(9% + 1.2px) / 100% 1px no-repeat,
    repeating-linear-gradient(90deg, rgba(239,230,207,.78) 0 2.5px, transparent 2.5px 6px) 0 91% / 100% 1.2px no-repeat,
    repeating-linear-gradient(90deg, rgba(0,0,0,.6) 0 2.5px, transparent 2.5px 6px) 0 calc(91% + 1.2px) / 100% 1px no-repeat; }
#rb .seg::after{ content:""; position:absolute; inset:0; z-index:3; pointer-events:none; opacity:.22; mix-blend-mode:screen;
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='60'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='.05 1.3' numOctaves='2' seed='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23w)'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.9 1.6' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23f)'/></svg>"); }
#rb .run{ display:flex; white-space:pre; will-change:transform; animation:rbSlide 52s linear infinite; }
#rb .run::before, #rb .run::after{ content:"PROMOTER · LOOPS · PROMOTER · LOOPS · PROMOTER · LOOPS · PROMOTER · LOOPS · ";
  font-family:"Anton","Archivo Black",Impact,sans-serif; font-size:6.3cqw; line-height:1; padding-top:.07em;
  color:var(--cream); letter-spacing:.075em; word-spacing:-.05em; }
#rb .a{ --y:14cqw; --r:-30deg; }
#rb .b{ --y:30cqw; --r:30deg; }
#rb .c{ --y:46cqw; --r:-30deg; }
#rb .d{ --y:62cqw; --r:30deg; }
#rb .e{ --y:78cqw; --r:-30deg; }
#rb .a.p1{ clip-path:inset(0 69.8% 0 0);    z-index:4; }
#rb .a.p2{ clip-path:inset(0 0 0 30%);      z-index:3; }
#rb .b.p1{ clip-path:inset(0 49.8% 0 0);    z-index:4; }
#rb .b.p2{ clip-path:inset(0 29.8% 0 50%);  z-index:3; }
#rb .b.p3{ clip-path:inset(0 0 0 70%);      z-index:4; }
#rb .c.p1{ clip-path:inset(0 49.8% 0 0);    z-index:3; }
#rb .c.p2{ clip-path:inset(0 0 0 50%);      z-index:4; }
#rb .d.p1{ clip-path:inset(0 69.8% 0 0);    z-index:3; }
#rb .d.p2{ clip-path:inset(0 49.8% 0 30%);  z-index:4; }
#rb .d.p3{ clip-path:inset(0 0 0 50%);      z-index:3; }
#rb .e.p1{ clip-path:inset(0 29.8% 0 0);    z-index:4; }
#rb .e.p2{ clip-path:inset(0 0 0 70%);      z-index:3; }
#rb .lab{ position:absolute; z-index:10; font-family:var(--f-mono); font-weight:500; font-size:clamp(9px,1.05cqw,12px);
  line-height:1; letter-spacing:.09em; text-transform:uppercase; color:#37342f; display:flex; align-items:center; gap:.7em; }
#rb .lab i{ font-style:normal; display:inline-block; width:.9em; height:.9em; border:1px solid #37342f; border-radius:50%; }
#rb .lab b{ font-weight:600; }
#rb .l1{ top:3.2%; right:3.2%; }
#rb .l2{ bottom:3.2%; left:3.2%; }
#rb .l2 em{ font-style:normal; font-size:1.25em; line-height:1; transform:translateY(-.06em); }

@media (prefers-reduced-motion: reduce){
  #rb .run{ animation:none; transform:translateX(-11%); }
}

/* the @keyframes this lens names. In the monolith these seven lived in
   one document-global namespace where two lenses could silently share an
   animation; inside a fragment the namespace is the fragment. */
@keyframes rbSlide{ to{ transform:translateX(-50%); } }
</style>
</head>
<body>
<div class="lens-frame">
<div id="rb" aria-label="A black tape ribbon woven over and under itself, printed with the repeating words Promoter Loops">
      <span class="sr">PROMOTER · LOOPS · repeated along a woven black tape.</span>

      <div class="seg sh a" aria-hidden="true"></div><div class="seg sh b" aria-hidden="true"></div><div class="seg sh c" aria-hidden="true"></div><div class="seg sh d" aria-hidden="true"></div><div class="seg sh e" aria-hidden="true"></div>

      <div class="seg a p1" aria-hidden="true"><div class="run"></div></div>
      <div class="seg a p2" aria-hidden="true"><div class="run"></div><i class="x" style="--f:.39;--q:60deg"></i></div>
      <div class="seg b p1" aria-hidden="true"><div class="run"></div></div>
      <div class="seg b p2" aria-hidden="true"><div class="run"></div><i class="x" style="--f:.606;--q:-60deg"></i></div>
      <div class="seg b p3" aria-hidden="true"><div class="run"></div></div>
      <div class="seg c p1" aria-hidden="true"><div class="run"></div><i class="x" style="--f:.39;--q:60deg"></i></div>
      <div class="seg c p2" aria-hidden="true"><div class="run"></div></div>
      <div class="seg d p1" aria-hidden="true"><div class="run"></div><i class="x" style="--f:.20;--q:-60deg"></i></div>
      <div class="seg d p2" aria-hidden="true"><div class="run"></div></div>
      <div class="seg d p3" aria-hidden="true"><div class="run"></div><i class="x" style="--f:.606;--q:-60deg"></i></div>
      <div class="seg e p1" aria-hidden="true"><div class="run"></div></div>
      <div class="seg e p2" aria-hidden="true"><div class="run"></div><i class="x" style="--f:.80;--q:60deg"></i></div>

      <span class="lab l1"><i></i><b>Tape 01</b> · 32 mm</span>
      <span class="lab l2"><em>↻</em>Repeat ×∞</span>
      <div class="paper"></div>
    </div>
</div>

<!-- Shared engines. Reuse, don't redefine: the monolith carried fifteen
     copies of mulberry32, three of the field builder, six of the dot screen
     and two of the paper tooth. Classic <script src>, relative, so this
     document opens by double-click with no server and no build step. -->


<!-- The one contract a fragment owes the host: height and ready over
     postMessage, and a real stop on lens:pause. -->
<script src="../../../learn/fragment-boot.js"></script>
</body>
</html>
