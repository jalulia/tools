<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Studies</a><span class="sep">/</span><b>Dithered candle</b><span class="code">ST-27</span></span><span class="pager"><a href="../../studies/st-26-fractal-frost/index.html">← ST-26</a><a class="pos" href="../../index.html#techniques"><span class="n">23</span>&nbsp;of 35</a><a href="../../studies/st-28-two-ink-woods/index.html">ST-28 →</a></span> <p class="kicker"><span>ST-27</span><span>light gradient</span></p><h1 class="title">Dithered candle</h1><p class="lede">Five inks and no blends: the flame lights the wax pool and the aura, and every gradient is a dot screen choosing between two neighboring inks.</p><div class="body"><p>The reference is a gradient illustration that was never allowed a blended pixel. Its palette is five inks, violet, lavender, lime, pink and near-black, with a pale white at the flame core and in the deep violet. The lighting has one source per candle. Each flame lights the wax pool under it, so the candle tops are lime pools with a lavender lip. Each flame lights a rim of lime in the aura around it, and the aura is deep violet near the candles and pale at the corners. The walls are lit just under the rim and fall away to a near-black foot on the nearer candle. The background lattice measures 5.7 px at -21 degrees; the candle dither is finer; the flame grain lies below the file's compression.</p><p>The rebuild keeps the fields smooth and puts the texture in one screen. Pools, aura, walls and flames are continuous values on short ramps of inks; one jittered lattice, mixed with per-pixel grain, gives every pixel a threshold, and the fractional ramp position is tested against it. Pitch, angle, jitter and grain set the screen. Sheet light, edge lift, aura size and depth, flame reach and lit rim set the light outside the candles; pool light, side light and wall fall set the candles. Spread, step down, girth and tilt set the pair; flame height, width, core height and sway set the flames.</p></div>
  <div class="accs"><details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>subject: two candles step right and 180 px lower, the nearer one drawn 1.5 times wider, so it stands in front; each top is an ellipse 0.27 of its radius tall</b></li><li><b>the flames: each an S-curved tongue 500 to 590 px tall that swings one way low and the other high; inside it a pink core in the lower 58 %, its foot split by the wick</b></li><li><b>light, from the flames outward: each flame lights its wax pool lime at the middle and lavender at the lip, and the pool's light spills past the wall; the flame lights a rim of the aura around itself; its light lifts the aura near it</b></li><li><b>the aura: the background is pale at the sheet's corners and pulled down toward violet in a tall oval around the candles</b></li><li><b>the walls: lit just under the rim, falling off down the wall; the nearest candle's foot sinks to near-black toward its middle while its sides keep violet; the front candle shades the one behind it near their overlap</b></li><li><b>ramps: background violet, lavender, lime; walls black, violet, lavender, lime; pool violet, lavender, lime; flame lime, lavender, pink, white</b></li><li><b>screen: one jittered dot lattice at 5.7 px and -21 degrees, finer on the candles and finer still in the flames; in the deep aura the light dots print the pale ink</b></li><li><b>ink: 10 % per-pixel density variation, a 0.64 px spread, a 0.6 px extra spread inside the flames</b></li></ol></div></details><details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>4</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="tone"><span class="vn">Tone</span><span class="vid">tone</span></button></li><li class="vr"><button type="button" data-t="edge"><span class="vn">Edge</span><span class="vid">edge</span></button></li><li class="vr"><button typ
