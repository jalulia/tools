<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Studies</a><span class="sep">/</span><b>Ripple field</b><span class="code">ST-39</span></span><span class="pager"><a href="../../studies/st-38-robot-on-the-line/index.html">← ST-38</a><a class="pos" href="../../index.html#techniques"><span class="n">35</span>&nbsp;of 35</a><a class="off" aria-disabled="true">→</a></span> <p class="kicker"><span>ST-39</span><span>grain stock</span></p><h1 class="title">Ripple field</h1><p class="lede">Two greens in concentric bands, every edge torn by one roughness field, under a clean-cut card.</p><div class="body"><p>Embroidery read as two flat greens, (16,141,71) and (44,153,92). Light bands 26 px wide repeat every 103.3 px from a center 68 px above the plate’s middle. The band boundary wanders by 4.5 px σ, with lumps 20 to 27 px long and 1 to 2 px teeth on top. The picture patches use the same material: flat thread colors, comb-toothed edges where 3.5 px thread columns overshoot, and a second color showing through along some columns. Yellow outline flowers 10.5 px wide are torn the same way. Only the prompt card is cut clean.</p><p>One roughness field at half resolution displaces every sampled edge: the ring function, the stitch beds and the flower canvas are read at the warped position, with a 0.7 px fray and 1.2/255 grain per pixel. Tear, lump size and teeth set the field. Thread scale sets the 3.5 px column width, 12 px stitch length and 4 px teeth together; thread relief sets each stitch’s flank and center contrast; show-through sets how many stitches take the second thread. Pitch, band width, swell and center move the ripple. The card has its own controls for corners, type size, type weight and softening, and the prompt and chip copy are editable.</p></div>
  <div class="accs"><details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>pass 1, field: one roughness field at half resolution, three components upsampled with Catmull-Rom: two warp components (3-octave value noise with a 28 px base lump plus 4 px tooth noise) and one band-swell component; it displaces every torn edge</b></li><li><b>pass 2, patches: four crisp rounded rects; each motif is drawn flat twice (first and second thread), then laid as a bed of capsule stitches on a satin lattice (3.5 px columns, 12 px stitches end to end) following the motif's direction field, each stitch a dark flank, the thread color and a lit center line; 27 % of stitches take the second thread</b></li><li><b>pass 3, flowers: yellow outline flowers stroked flat on a full canvas, 10.5 px line, five petal loops around a ring</b></li><li><b>pass 4, pixels: per pixel, the warped position (field plus 0.7 px fray) samples the ring function with a 2.75 px edge ramp, the stitch beds at 30 % of the tear, and the flower canvas through a satin comb; a faint satin on the patch grounds; 1.2/255 grain per pixel</b></li><li><b>pass 5, card: the prompt card, icon, chips and buttons drawn on their own layer; the mono type gets a 0.5 px ink stroke and a bright resample halo; the layer is blurred by 0.35 px σ and composited on top</b></li></ol></div></details><details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>4</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="edge"><span class="vn">Edge</span><span class="vid">edge</span></button></li><li class="vr"><button type="button" data-t="pull"><span class="vn">Pull</span><span class="vid">pull</span></button></li><li class="vr"><button type="button" data-t="grain"><span class="vn">Grain</span><span class="vid">grain</span></button></li><li class="vr"><button type="button" data-t="type"><span class="vn">Type</span><span class="vid">type</span></button></li></ul></div></details><details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">References 39 · an embroidered ripple ground with stitched picture patches and a prompt card, 2048×1152</p><div class="fid" id="fid"></div></div></details><details class="acc" name="notes" id="aStudy"><summary><span>Study</span></summary><div class="ab"><dl class="kv"><dt>Code</dt><dd>ST-39</dd><dt>Section</dt><dd>Studies</dd><dt>Family</dt><dd>grain stock</dd><dt>Spec</dt><dd><a href="spec.json">spec.json</a></dd></dl></div></details><details class="acc" name="notes" id="aPts"><summary><span>Callouts <i>10</i></span></summary><div class="ab"><ol class="steps"><li><b>KEY · Light band</b><span>u 0.15 · v 0.82 · edge</span></li><li><b>READ · Band pitch</b><span>u 0.50 · v 0.93 · pull</span></li><li><b>KEY · Flower patch</b><span>u 0.20 · v 0.35 · grain</span></li><li><b>KEY · Iris patch</b><span>u 0.80 · v 0.62 · grain</span></li><li><b>READ · Ringed patch</b><span>u 0.67 · v 0.33 · pull</span></li><li><b>READ · Spiral patch</b><span>u 0.30 · v 0.62 · edge</span></li><li><b>KEY · Outline flower</b><span>u 0.54 · v 0.28 · edge</span></li><li><b>KEY · Card</b><span>u 0.50 · v 0.50 · type</span></li><li><b>READ · Icon: a scalloped light-blue bloom with the little robot mark in navy.</b><span>u 0.26 · v 0.55 · type</span></li><li><b>READ · Send button: 75 px periwinkle tile with a 3 px arrow, 19 px from the card's right edge.</b><span>u 0.75 · v 0.56 · type</span></li></ol></div></details><details class="acc" name="notes" id="aRel"><summary><span>Related</span></summary><div class="ab"><div class="rel" id="rel"></div></div></details></div> {

    { id:'typeCap', label:'Type cap height', min:16, max:48, step:0.5, value:30, unit:'px', group:'Card', why:'Cap height of the prompt line; the chip text follows at 0.73×.', fmt:v=>(+v).toFixed(1)+' px', onChange(v){ const L=window.STUDY.live; if(L)L.set('typeCap',v,true); } },
    { id:'typeWeight', label:'Type weight', min:0, max:5, step:0.05, value:0.5, unit:'px', group:'Card', why:'Ink stroke added around the mono glyphs; 0 is JetBrains Mono Regular as loaded.', fmt:v=>(+v).toFixed(2)+' px', onChange(v){ const L=window.STUDY.live; if(L)L.set('typeWeight',v,true); } },
    { id:'cardSoft', label:'Card softening', min:0, max:3, step:0.05, value:0.35, unit:'px σ', group:'Card', why:'Resample blur on the whole card layer (edge, icon, chips, type), as the reference carries; 0 is crisp vector.', fmt:v=>(+v).toFixed(2)+' px σ', onChange(v){ const L=window.STUDY.live; if(L)L.set('cardSoft',v,true); } },
    { id:'seed', label:'Seed', min:1, max:999, step:1, value:5, unit:'', group:'Field', why:'Re-rolls the roughness field, the threads and the flower positions.', fmt:v=>(+v).toFixed(0), onChange(v){ const L=window.STUDY.live; if(L)L.set('seed',v,true); } },
    { id:'phase', label:'Phase', min:0, max:1, step:0.001, value:0, unit:'', group:'Motion', why:'Position along the loop: the bands move outward by one pitch per cycle.', fmt:v=>(+v).toFixed(3), onChange(v){ const L=window.STUDY.live; if(L)L.set('phase',v,true); } }
  ],
  hud:true,
  render(canvas,w,h,dpr,finish){ return window.__MP.mount(this,canvas,w,h,dpr,finish); }
