<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Studies</a><span class="sep">/</span><b>Fractal frost</b><span class="code">ST-26</span></span><span class="pager"><a href="../../studies/st-25-membrane/index.html">← ST-25</a><a class="pos" href="../../index.html#techniques"><span class="n">22</span>&nbsp;of 35</a><a href="../../studies/st-27-dithered-candle/index.html">ST-27 →</a></span> <p class="kicker"><span>ST-26</span><span>grain stock</span></p><h1 class="title">Fractal frost</h1><p class="lede">An escape-time fractal colored by a cyclic ramp, with field-line filaments held at a 4.6 px spacing and a smeared fur where the lines get too dense.</p><div class="body"><p>The reference is a render of the exterior of a Mandelbrot-type set. Every pixel carries a count of how long its orbit stayed near the set. The slowest pixels form a periwinkle ground network with navy rosettes along its arms. Faster pixels read a repeating ramp: a turquoise rim, white frost with a fine fur, royal blue, mint, then white again in the largest bays. White filaments cross the blue and mint bands at about 4.6 px apart. They follow the field lines, the curves along which the count changes fastest.</p><p>The rebuild iterates z² + c over a warped window near a branch point of the set. It keeps the smooth count, log|z| and the exit angles of the last four iterates. The count on a log scale picks the ramp color. The exit angle draws the field lines, and the number of lines per turn doubles or halves per pixel to hold the 4.6 px spacing. Where the lines are too dense, noise is smeared along the field direction instead. Zoom, rotation and pan move the window. Ground share, ramp cycles and spread set the bands. Filament spacing, bold share, width, striation and feather set the lines. Warp, warp scale and kink bend everything before the iteration.</p></div>
  <div class="accs"><details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>window: a 0.03-wide square of the parameter plane near a branch point of the Mandelbrot set, displaced before iteration by stretched value noise with a ridged part (13 px, 22 px scale), so the band edges and field lines kink</b></li><li><b>escape: z → z² + c to a bailout of 10^10; the smooth count μ, log|z| and the angles of z_n, z_n−1, z_n−2 and z_n−3 are kept; a coarse pass sets the count that makes 20 % of pixels ground</b></li><li><b>line density: |∇μ| is blurred 3 px; with log|z| it gives |∇θ|, and the level J = log2(2π / (4.6 px</b><span>|∇θ|)) picks the line set per pixel, blended between ⌊J⌋ and ⌊J⌋ + 1</span></li><li><b>ramp: d = 1.3</b><span>(log μ0 − log μ)^1.5, read on a 12-stop cyclic ramp; the ramp position moves with the field-line phase so band edges meet in fingers; a turquoise rim at d &lt; 0.028</span></li><li><b>filaments: every field line striates the band color; every second line, gated by a 26 px noise, prints bold, white on dark bands and royal on light ones</b></li><li><b>frost fur: where field lines are too dense to draw, a 2 px value noise is smeared 2 × 6 px along ∇μ and lit from the upper left</b></li><li><b>ground: a per-pixel draw through slate, steel, periwinkle and pale, darkening where the orbit stays longer, with navy specks gathered in 3 px rosettes; 6 levels of grain over everything</b></li></ol></div></details><details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>3</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="grain"><span class="vn">Grain</span><span class="vid">grain</span></button></li><li class="vr"><button type="button" data-t="edge"><span class="vn">Edge</span><span class="vid">edge</span></button></li><li class="vr"><button type="button" data-t="pull"><span class="vn">Pull</span><spa
