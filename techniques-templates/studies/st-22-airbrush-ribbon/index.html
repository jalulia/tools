<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Studies</a><span class="sep">/</span><b>Airbrush ribbon</b><span class="code">ST-22</span></span><span class="pager"><a href="../../studies/st-21-disc-stack/index.html">← ST-21</a><a class="pos" href="../../index.html#techniques"><span class="n">18</span>&nbsp;of 35</a><a href="../../studies/st-23-stitch-sampler/index.html">ST-23 →</a></span> <p class="kicker"><span>ST-22</span><span>light gradient</span></p><h1 class="title">Airbrush ribbon</h1><p class="lede">A translucent orange band coiled through black, with light added as sprayed glow.</p><div class="body"><p>Airbrush work like this is built from masks and gradients. A frisket cuts the band’s edge, which turns over in 1.5 px in the reference. The gun lays a gradient inside it: a pale glint at the top edge, a dark fold of [168,73,53] about 50 px below, then the saturated [254,71,24] face. Where the far side shows through the near side the tone drops to [115,65,48], as two orange gels would. The thin lines of light are a σ 1.3 px core over a σ 4 px skirt. The floor grid, 39 px at the foot, leaks blue into the black for 14 px past the band’s cut end.</p><p>The rebuild puts one helix on one axis. The band is sliced into rows; each slice carries its depth and surface angle, and an 18-stop ramp over that angle gives the color. Slices composite far to near as gels: Gel opacity sets how much the back shows through, Gel density how much a layer darkens the one behind. The light helices share the axis and add with a depth test, so they pass behind and in front of the band in order. Grid pitch and Horizon place the floor. Bloom and Scan grain finish the sheet; grain runs 1.45× stronger on the band, where the reference’s high-pass σ is 5.2 against 3.4 on the black.</p></div>
  <div class="accs"><details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>base: black, a blue haze from the horizon down, the floor grid drawn once at 1.5 px and glowed at 2.2 px and 9 px</b></li><li><b>spheres on the axis at depth zero: lambert discs lit from the right, a hard 1 px mask edge, a 6 px overspray halo</b></li><li><b>light helices on the same axis: gaussian cores splatted with a wide depth kernel, then a 3.8 px skirt and a 19 px skirt per channel</b></li><li><b>the band: sliced by rows into spans that carry depth and normal angle; per pixel the spans composite far to near as gels (opacity, tint, stacking), with the spheres and the helices inserted at their depth</b></li><li><b>cut end of the band: a 3 px and a 13 px blue edge light</b></li><li><b>one 7 px bloom at 4 %, then scan grain scaled 1.45× on the band</b></li></ol></div></details><details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>4</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="pull"><span class="vn">Pull</span><span class="vid">pull</span></button></li><li class="vr"><button type="button" data-t="glow"><span class="vn">Glow</span><span class="vid">glow</span></button></li><li class="vr"><button type="button" data-t="edge"><span class="vn">Edge</span><span class="vid">edge</span></button></li><li class="vr"><button type="button" data-t="grain"><span class="vn">Grain</span><span class="vid">grain</span></button></li></ul></div></details><details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">References 22 · 1980s airbrush illustration on black, 1000 × 675 px</p><div class="fid" id="fid"></div></div></details><details class="acc" name="notes" id="aStudy"><summary><span>Study</span></summary><div class="ab"><dl class="kv"><dt>Code</dt><dd>ST-22</dd><dt>Section</dt><dd>Studies</dd><dt>Family</dt><dd>light gradient</dd><dt>Spec</dt><dd><a href="spec.json">spec.json</a></dd></dl></div></details><details class="acc" name="notes" id="aPts"><summary><span>Callouts <i>10</i></span></summary><div class="ab"><ol class="steps"><li><b>KEY · Single-layer face: the ramp from the top glint through the dark fold to [254,71,24]</b><span>u 0.80 · v 0.25 · pull</span></li><li><b>KEY · Far side read through the near side: the stacked layer drops toward [115,65,48]</b><span>u 0.30 · v 0.45 · pull</span></li><li><b>READ · Light helix: a σ 1.3 px core over a σ 3.8 px skirt, added over black</b><span>u 0.44 · v 0.10 · glow</span></li><li><b>READ · Frisket edge: the band turns over in 1.3 px, then the glint starts</b><span>u 0.22 · v 0.07 · edge</span></li><li><b>KEY · Cut end: blue light at the edge, bleeding 14 px into the black below</b><span>u 0.88 · v 0.64 · glow</span></li><li><b>READ · Sphere on the axis: 18 px radius, lit from the right, L 47 at the left edge</b><span>u 0.04 · v 0.51 · pull</span></li><li><b>KEY · Floor grid, 39 px at the foot, rows closing as (y − horizon)²</b><span>u 0.15 · v 0.92 · grain</span></li><li><b>READ · The black: σ 2.6 scan grain with a 30 px mottle, not a flat fill</b><span>u 0.07 · v 0.18 · grain</span></li><li><b>READ · Helix passing behind the band: dimmed to 16 % and tinted by the gel</b><span>u 0.52 · v 0.55 · pull</span></li><li><b>READ · Bloom: 4 % of a 7 px blur, the haze every light throws past its edge</b><span>u 0.66 · v 0.85 · glow</span></li></ol></div></details><details class="acc" name="notes" id="aRel"><summary><span>Related</span></summary><div class="ab"><div class="rel" id="rel"></div></div></details></div> {
