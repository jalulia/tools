<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Studies</a><span class="sep">/</span><b>Stipple gouache</b><span class="code">ST-14</span></span><span class="pager"><a href="../../studies/st-13-grain-nocturne/index.html">← ST-13</a><a class="pos" href="../../index.html#techniques"><span class="n">12</span>&nbsp;of 35</a><a href="../../studies/st-15-phosphor-cell/index.html">ST-15 →</a></span> <p class="kicker"><span>ST-14</span><span>grain stock</span></p><h1 class="title">Stipple gouache</h1><p class="lede">Flat gouache shapes with dabbed edges, shaded by one 4 px thread lattice whose knots show through as primer specks.</p><div class="body"><p>The reference is gouache on fine canvas. Warp threads run straight down on a 4.0 px pitch; weft threads cross on about 4.4 px and wander by several pixels; at each crossing one thread lies on top. Each thread has its own brightness and sits a little off its grid line, so column means vary from 99 to 116 across the sky and the lattice never repeats cleanly at 8 px. Paint fills the valleys; the knots stand up through it and show as pale primer specks where the paint is thin. Shapes are edged with dabs in the neighboring color, three tones each, lit from the upper left, dense at the edge and thinning inward. The ground carries scattered sky-colored dabs, 13 px across, with a pale center.</p><p>The rebuild paints flat: the sky wash with its warm drift, the disc, the ground, the lobed shapes, then the dabs. Dry-brush streaks go into a mask that only the thread tops reach. One pixel pass builds the lattice, mixes in a 1.6 px tooth, adds two scales of paint-load drift and shades every paint by lattice height, with the valleys floored so the dark side stays shallow. Density, dab size and fringe depth set the stipple; pitch and weave depth set the canvas; Primer specks sets how many knots break through; Dry-brush streaks sets how much pale paint catches the thread tops.</p></div>
  <div class="accs"><details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>flat paint: sky wash with a 26-level warm drift toward the foot, disc, ground, lobed shapes</b></li><li><b>dry-brush streaks into a mask (they only catch thread tops)</b></li><li><b>dabs: three-tone discs lit from the upper left, in the neighboring color, dense at the edge and thinning inward; ground dabs in the sky color with a pale center</b></li><li><b>thread lattice: straight warp threads on a 4 px pitch, weft threads on 4.4 px that wander by up to 6 px, each thread set off its grid line by up to ±0.075 pitch and carrying its own brightness (±7 %); the top thread at each crossing sets the height, and its knots carry an exponential brightness tail (scale 0.04) so a few stand 2 to 3 times brighter; 45 % lattice, 55 % 1.6 px tooth</b></li><li><b>paint load: two scales of luminance drift, 160 px and 22 px</b></li><li><b>weave shading: valleys floored at 0.2 so the dark side is shallow; shapes are laid on 0.45 as thick as the sky wash</b></li><li><b>primer specks on the knots of the weave: strength per knot (cubed), more on dark paint and where the load is thin</b></li></ol></div></details><details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>5</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="weave"><span class="vn">Weave</span><span class="vid">weave</span></button></li><li class="vr"><button type="button" data-t="speck"><span class="vn">Speck</span><span class="vid">speck</span></button></li><li class="vr"><button type="button" data-t="dab"><span class="vn">Dab</span><span class="vid">dab</span></button></li><li class="vr"><button type="button" data-t="paint"><span class="vn">Paint</span><span class="vid">paint</span></button></li><li class="vr"><button type="button" data-t="streak"><span class="vn">Streak</span><span class="vid"
