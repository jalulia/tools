<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Studies</a><span class="sep">/</span><b>Spray seascape</b><span class="code">ST-33</span></span><span class="pager"><a href="../../studies/st-32-noise-atom/index.html">← ST-32</a><a class="pos" href="../../index.html#techniques"><span class="n">29</span>&nbsp;of 35</a><a href="../../studies/st-34-screened-pop/index.html">ST-34 →</a></span> <p class="kicker"><span>ST-33</span><span>grain stock</span></p><h1 class="title">Spray seascape</h1><p class="lede">Six flat inks laid edge to edge, every transition sprayed in crisp dots about 3 px across that thin out over 80 px from a frisket edge.</p><div class="body"><p>The reference is an airbrush seascape in six inks: sky blue, white, green, yellow, black and pink. No edge in it is drawn with a gradient. Where green shades a yellow hill, where pink meets the sky, where foam sits on the sea, the paint was sprayed through a frisket: round dots of one size, 3.2 px across on the green, whose number falls from solid to nothing over about 80 px (57 % cover to 1 % in four 20 px steps). Black does two jobs. It keys the silhouettes in lines about 2 px wide, and it sprays the shadowed undersides of the hills and pebbles. Each flat ink carries its own grain: the blue sky varies 7.5 levels with sparse light specks, the yellow only 2.</p><p>The rebuild lays the flats and friskets back to front: sky and wedge, islands, sea, six land masses, the beach and its pebbles. Each frisket then takes its sprays. A jittered lattice of candidate dots lands where a density field says, and every dot prints only inside its own frisket, so spray never crosses a keyline. Green rises from under each hill top, black hugs the undersides, white foam lies in rows across the sea. A small seated Mindgut robot is drawn into the same plates with a black key. Dot, falloff and grain are the airbrush. Side light, lit band and shadow spray place the paint on the land. The scene sliders rebuild the shore.</p></div>
  <div class="accs"><details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>flats: sky blue over sea blue at the horizon (0.462 of the height), a white wedge rising under the cloud band</b></li><li><b>sky spray: blue falling into the white over the falloff, a pink band along the wedge edge, sparse white dots up in the blue</b></li><li><b>islands: yellow domes on the horizon, green sprayed up from the waterline, a black key; keys run at the black key slider (0.75) times 1.5 px for islands, 2 px for land, 2.2 px for the horizon</b></li><li><b>sea: rows of white foam dots (stretched 1.7:1) widening and spacing out toward the shore, a white shore band, posts in the shallows, green over black with foam at the foot</b></li><li><b>land: six rounded masses back to front. Each is a frisket: yellow inside, green sprayed up from below over the falloff and bent by a slow noise into lobes, black sprayed along the shadowed underside at most 0.8 dense, a key only where it stands against sea or sky</b></li><li><b>beach: black sprayed up at the land's foot, white foam with blue and green spray, 32 black-rimmed blue pebbles with a green patch and black stipple under it</b></li><li><b>robot: mgRobot seated on the near hill, tilted to the slope, drawn into the white, yellow and pink plates with a black key and a green cast shadow</b></li><li><b>print: every dot and key is a coverage-weighted disc (1 px edge); each ink then takes its measured grain: a skewed pixel noise with a 2 px share, a 30 to 90 px mottle on blue and green, sparse light specks that cluster</b></li></ol></div></details><details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>5</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="grain"><span class="vn">Grain</span><span class="vid">grain</span></button></li><li class="vr"><button type="button" data-t="tone"><span     'The reference is an airbrush seascape in six inks: sky blue, white, green, yellow, black and pink. No edge in it is drawn with a gradient. Where green shades a yellow hill, where pink meets the sky, where foam sits on the sea, the paint was sprayed through a frisket: round dots of one size, 3.2 px across on the green, whose number falls from solid to nothing over about 80 px (57 % cover to 1 % in four 20 px steps). Black does two jobs. It keys the silhouettes in lines about 2 px wide, and it sprays the shadowed undersides of the hills and pebbles. Each flat ink carries its own grain: the blue sky varies 7.5 levels with sparse light specks, the yellow only 2.',
    'The rebuild lays the flats and friskets back to front: sky and wedge, islands, sea, six land masses, the beach and its pebbles. Each frisket then takes its sprays. A jittered lattice of candidate dots lands where a density field says, and every dot prints only inside its own frisket, so spray never crosses a keyline. Green rises from under each hill top, black hugs the undersides, white foam lies in rows across the sea. A small seated Mindgut robot is drawn into the same plates with a black key. Dot, falloff and grain are the airbrush. Side light, lit band and shadow spray place the paint on the land. The scene sliders rebuild the shore.'
  ],
