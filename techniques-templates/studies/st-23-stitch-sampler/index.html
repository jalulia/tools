<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Studies</a><span class="sep">/</span><b>Stitch sampler</b><span class="code">ST-23</span></span><span class="pager"><a href="../../studies/st-22-airbrush-ribbon/index.html">← ST-22</a><a class="pos" href="../../index.html#techniques"><span class="n">19</span>&nbsp;of 35</a><a href="../../studies/st-24-stipple-wave/index.html">ST-24 →</a></span> <p class="kicker"><span>ST-23</span><span>grain stock</span></p><h1 class="title">Stitch sampler</h1><p class="lede">Two threads, five stitch families, one 22.5 px grid.</p><div class="body"><p>A sampler is sewn row by row on a counted grid; here the grid is 22 to 23 px in every band. The bands: satin at 54°, a packed bar with loops 6.4 px apart, a lattice couched with a cross at each crossing, chevrons 9.5 px tall in rows 15 px apart, and herringbone. The thread is a twisted bundle 8 px across with three tones: a lit crown of [67,138,194] set off center that follows the 4.8 px twist, a body of [31,104,168], and dark flanks of [26,76,131]. Loose ends splay at the band edges, and each thread casts a soft shadow on the paper.</p><p>One thread primitive, laid on the grid by five generators. Stitch grid and Thread width set the counted base. Twist moves the crown along the bundle and striates the body. Fiber fuzz wobbles the silhouette by up to 1.4 px and throws hairs 3.5 px past it. One slow 90 px field hands clusters of stitches to the second thread; Second thread sets how often. Thread shadow blurs the coverage 2.2 px and offsets it 2 px; the threads are blurred 0.6 px to match the photograph’s softness. The wordmark is Mindgut copy in spaced caps with two stitched swatches below it.</p></div>
  <div class="accs"><details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>stitch list: band generators on the 22.5 px grid (satin runs at 54°, a packed bar whose loops sit 6.4 px apart, a couched lattice with cross knots, chevrons of 9.5 px amplitude in rows 15 px apart, herringbone), tufts at band ends, a needle with its loose loop</b></li><li><b>one color field (150 px) hands clusters of stitches to the second thread</b></li><li><b>rasterize each capsule in z order: coverage from the capsule distance, a 5.5 px twist moving the lit crown, dark flanks past 30 % of the radius, hairs within 3.5 px</b></li><li><b>needle body in steel over the threads</b></li><li><b>photographic softness: the thread layer blurred 0.6 px premultiplied; thread shadow: coverage blurred 2.2 px, offset 2 px, darkening the paper 6 %</b></li><li><b>paper: flat [246,246,246] as in the reference (grain optional); threads and type over it</b></li></ol></div></details><details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>3</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="pull"><span class="vn">Pull</span><span class="vid">pull</span></button></li><li class="vr"><button type="button" data-t="grain"><span class="vn">Grain</span><span class="vid">grain</span></button></li><li class="vr"><button type="button" data-t="edge"><span class="vn">Edge</span><span class="vid">edge</span></button></li></ul></div></details><details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">References 23 · embroidery sampler on white, 905 × 1181 px</p><div class="fid" id="fid"></div></div></details><details class="acc" name="notes" id="aStudy"><summary><span>Study</span></summary><div class="ab"><dl class="kv"><dt>Code</dt><dd>ST-23</dd><dt>Section</dt><dd>Studies</dd><dt>Family</dt><dd>grain stock</dd><dt>Spec</dt><dd><a href="spec.json">spec.json</a></dd></dl></div></details><details class="acc" name="notes" id="aPts"><summary><span>Callouts <i>10</i></span></summary><div class="ab"><ol class="steps"><li><b>KEY · Satin run at 54°</b><span>u 0.30 · v 0.22 · pull</span></li><li><b>KEY · Packed bar</b><span>u 0.50 · v 0.31 · grain</span></li><li><b>KEY · Couched lattice</b><span>u 0.45 · v 0.37 · pull</span></li><li><b>READ · Chevrons</b><span>u 0.40 · v 0.45 · pull</span></li><li><b>READ · Herringbone</b><span>u 0.50 · v 0.60 · pull</span></li><li><b>READ · Tuft</b><span>u 0.08 · v 0.31 · edge</span></li><li><b>KEY · Cluster of the second thread cut from the 90 px field</b><span>u 0.40 · v 0.24 · pull</span></li><li><b>READ · Thread shadow</b><span>u 0.25 · v 0.52 · edge</span></li><li><b>READ · Needle in steel with a loose loop of thread</b><span>u 0.88 · v 0.10 · edge</span></li><li><b>READ · Wordmark</b><span>u 0.50 · v 0.89 · pull</span></li></ol></div></details><details class="acc" name="notes" id="aRel"><summary><span>Related</span></summary><div class="ab"><div class="rel" id="rel"></div></div></details></div> {

    { id:'mix', label:'Second thread', min:0, max:2, step:0.01, value:0.8, unit:'×', group:'Thread', why:'Strength of the cluster field that hands a band\'s stitches to the other thread. 0 keeps each band one color.', fmt:v=>(+v).toFixed(2)+' ×', onChange(v){ const L=window.STUDY.live; if(L)L.set('mix',v,true); } },
    { id:'bands', label:'Bands', min:1, max:9, step:1, value:9, unit:'', group:'Sampler', why:'How many bands of the sampler are sewn, in order from the top.', fmt:v=>(+v).toFixed(0), onChange(v){ const L=window.STUDY.live; if(L)L.set('bands',v,true); } },
    { id:'needle', label:'Needle', min:0, max:1.6, step:0.01, value:1, unit:'×', group:'Sampler', why:'Length of the needle at the top right. 0 removes it and its loose thread.', fmt:v=>(+v).toFixed(2)+' ×', onChange(v){ const L=window.STUDY.live; if(L)L.set('needle',v,true); } },
    { id:'shadow', label:'Thread shadow', min:0, max:3, step:0.01, value:1, unit:'×', group:'Paper', why:'Darkening of the paper under each thread, blurred 2.2 px and offset 2 px.', fmt:v=>(+v).toFixed(2)+' ×', onChange(v){ const L=window.STUDY.live; if(L)L.set('shadow',v,true); } },
    { id:'paper', label:'Paper grain', min:0, max:3, step:0.01, value:0, unit:'×', group:'Paper', why:'Fine grain and 36 px mottle of the white. The reference paper is flat, so the default is 0.', fmt:v=>(+v).toFixed(2)+' ×', onChange(v){ const L=window.STUDY.live; if(L)L.set('paper',v,true); } },
