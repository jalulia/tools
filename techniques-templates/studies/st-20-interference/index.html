<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Studies</a><span class="sep">/</span><b>Interference</b><span class="code">ST-20</span></span><span class="pager"><a href="../../studies/st-19-fold-glow/index.html">← ST-19</a><a class="pos" href="../../index.html#techniques"><span class="n">16</span>&nbsp;of 35</a><a href="../../studies/st-21-disc-stack/index.html">ST-21 →</a></span> <p class="kicker"><span>ST-20</span><span>grain stock</span></p><h1 class="title">Interference</h1><p class="lede">Two ring systems summed and cut hard into six inks.</p><div class="body"><p>Two point sources 248 px apart each send out concentric rings at a 26.7 px pitch. Where the trains cross, their sum beats. On the line between the sources the crests line up into stacked lenses. To the sides they lock into a lattice of lozenges, 14.5 px between columns and 31 px between rows in the reference. In the corners both trains arrive nearly parallel and the lattice slides into long diagonal stripes. Each train’s amplitude fades with distance as (1 + r/147 px)^-1.75, so near a source its own rings win and read as clean circles.</p><p>The plate computes that sum per pixel and cuts it at fixed heights into seven bands: a core and a ring on each side of zero, a field on either side, and a thin line at the zero crossing that draws the grid between cells. Because the cuts are fixed and the waves fade, the area near a source swings through every band, while in the far corners only the beats of two weak trains reach a core. The ink set depends on the zone: red where the two trains run within 38 degrees of parallel and the sum is above the gate; a green trough set inside a capsule 193 px around the axis; black, white, blue and yellow everywhere else. The press is one dot screen. Each edge is read off the wave’s own slope: near a source the waves run steep and the edge prints crisp, with a mesh tooth and an ink rim; in the far beats they run slow and the same edge opens into a stippled ramp of dots that grow from one ink into the next. The zones hand over through that screen too, and every ink thins toward the paper as the waves weaken.</p></div>
  <div class="accs"><details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>sources placed on a tilted axis through the plate center</b></li><li><b>per pixel: lens bulge of the coordinates, then distance to each source</b></li><li><b>each source: cosine ring train, amplitude falling as (1 + r/R)^-decay; the trains are summed, so close to a source its own train swings past every cut and far out only beats reach the core cuts</b></li><li><b>zones: eye disc at each source; red set where the two trains run within a set angle of parallel and the sum is still strong (the far side of each source and the strip between them); green capsule by distance to the axis; outside</b></li><li><b>one hard cut into seven bands (trough core, trough ring, field, saddle line, field, crest ring, crest core), each zone with its own ink set</b></li><li><b>press: every edge read off the wave’s own slope (crisp near a source, a stippled ramp of growing dots in the slow far beats), the ink sets handed over through the same dot screen, inks thinned toward paper where the waves are weak, a mesh-tooth edge, an ink rim, faint mottle, one level of grain per pixel</b></li></ol></div></details><details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>3</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="pull"><span class="vn">Pull</span><span class="vid">pull</span></button></li><li class="vr"><button type="button" data-t="grain"><span class="vn">Grain</span><span class="vid">grain</span></button></li><li class="vr"><button type="button" data-t="edge"><span class="vn">Edge</span><span class="vid">edge</span></button></li></ul></div></details><details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">References 20 · two-source ring interference artwork, 720 × 734 px JPEG</p><div cla     { id:'gate', label:'Red gate', min:0, max:1.4, step:0.01, value:0.4, unit:'', group:'Zones', why:'Wave strength the red set also needs, which keeps it out of the far corners.', fmt:v=>(+v).toFixed(2), onChange(v){ const L=window.STUDY.live; if(L)L.set('gate',v,true); } },
    { id:'hole', label:'Eye', min:0, max:4, step:0.01, value:1, unit:'×', group:'Zones', why:'Flat green disc at the heart of each source.', fmt:v=>(+v).toFixed(2)+' ×', onChange(v){ const L=window.STUDY.live; if(L)L.set('hole',v,true); } },
    { id:'capsule', label:'Green capsule', min:0, max:2.2, step:0.01, value:0.85, unit:'×', group:'Zones', why:'Radius of the capsule around the sources where troughs print green.', fmt:v=>(+v).toFixed(2)+' ×', onChange(v){ const L=window.STUDY.live; if(L)L.set('capsule',v,true); } },
    { id:'wobble', label:'Zone wobble', min:0, max:1.2, step:0.01, value:0.3, unit:'', group:'Zones', why:'Low-frequency wander of the zone edges so they do not read as compass circles.', fmt:v=>(+v).toFixed(2), onChange(v){ const L=window.STUDY.live; if(L)L.set('wobble',v,true); } },
    { id:'stipple', label:'Stipple ramp', min:0, max:0.3, step:0.005, value:0.045, unit:'', group:'Print', why:'Width of the stippled ramp at every cut, in wave height. Where the waves run steep, near a source, the ramp is a hairline and the edge prints crisp; where they run slow, in the far beats, it opens into dots that grow from one ink into the next.', fmt:v=>(+v).toFixed(2), onChange(v){ const L=window.STUDY.live; if(L)L.set('stipple',v,true); } },
    { id:'dot', label:'Dot pitch', min:1.2, max:5, step:0.05, value:2.2, unit:'px', group:'Print', why:'Pitch of the one dot screen every ramp, every thinned ink and every zone hand-over prints through. Held at this size in screen pixels however large the plate is drawn.', fmt:v=>(+v).toFixed(2), onChange(v){ const L=window.STUDY.live; if(L)L.set('dot',v,true); } },
    { id:'cluster', label:'Dot shape', min:0, max:1, step:0.01, value:0.85, unit:'', group:'Print', why:'1 prints round clustered dots that grow and merge; 0 prints a stochastic stipple, one speck per pixel.', fmt:v=>(+v).toFixed(2), onChange(v){ const L=window.STUDY.live; if(L)L.set('cluster',v,true); } },
    { id:'ramp', label:'Ink ramp', min:0, max:1, step:0.01, value:0.18, unit:'', group:'Print', why:'How much ink the waves’ own strength lays down. Near a source every ink prints solid; far out, where only beats arrive, the same inks thin into the dot screen.', fmt:v=>(+v).toFixed(2), onChange(v){ const L=window.STUDY.live; if(L)L.set('ramp',v,true); } },
    { id:'zoneSoft', label:'Zone stipple', min:0, max:40, step:0.5, value:9, unit:'px', group:'Print', why:'Width of the stippled hand-over where one ink set gives way to another, at the red reach and the green capsule. 0 is a hard mask.', fmt:v=>(+v).toFixed(2), onChange(v){ const L=window.STUDY.live; if(L)L.set('zoneSoft',v,true); } },
    { id:'tooth', label:'Mesh tooth', min:0, max:2, step:0.01, value:0.7, unit:'px', group:'Print', why:'Edge jitter at the screen mesh: a sawtooth finer than a pixel at print size, held that fine at any size.', fmt:v=>(+v).toFixed(2), onChange(v){ const L=window.STUDY.live; if(L)L.set('tooth',v,true); } },
    { id:'rim', label:'Ink rim', min:0, max:0.6, step:0.01, value:0.16, unit:'', group:'Print', why:'Ink piles at the edge of every solid, so each shape darkens in its last pixel.', fmt:v=>(+v).toFixed(2), onChange(v){ const L=window.STUDY.live; if(L)L.set('rim',v,true); } },
    { id:'mottle', label:'Ink mottle', min:0, max:1, step:0.01, value:0.3, unit:'', group:'Print', why:'Slow, faint unevenness of laydown inside the solids.', fmt:v=>(+v).toFixed(2), onChange(v){ const L=window.STUDY.live; if(L)L.set('mottle',v,true); } },
    { id:'spread', label:'Edge softness', min:0, max:3, step:0.01, value:0.6, unit:'px', group:'Press', why:'Anti-aliasing of every edge. Edges are read off the wave’s own slope, so they hold this sharpness at any size.', fmt:v=>(+v).toFixed(2)+' px', onChange(v){ const L=window.STUDY.live; if(L)L.set('spread',v,true); } },
    { id:'grain', label:'Grain', min:0, max:60, step:0.1, value:10, unit:'', group:'Press', why:'Fine position-hashed noise on top of the inks.', fmt:v=>(+v).toFixed(1), onChange(v){ const L=window.STUDY.live; if(L)L.set('grain',v,true); } },
    { id:'seed', label:'Seed', min:1, max:999, step:1, value:8, unit:'', group:'Press', why:'Re-rolls the zone wobble and grain.', fmt:v=>(+v).toFixed(0), onChange(v){ const L=window.STUDY.live; if(L)L.set('seed',v,true); } }
  ],
  hud:true,
  render(canvas,w,h,dpr,finish){ return window.__MP.mount(this,canvas,w,h,dpr,finish); }
};
