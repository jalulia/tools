<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Studies</a><span class="sep">/</span><b>Grain nocturne</b><span class="code">ST-13</span></span><span class="pager"><a href="../../studies/st-11-gradient-by-number/index.html">← ST-11</a><a class="pos" href="../../index.html#techniques"><span class="n">11</span>&nbsp;of 35</a><a href="../../studies/st-14-stipple-gouache/index.html">ST-14 →</a></span> <p class="kicker"><span>ST-13</span><span>light gradient</span></p><h1 class="title">Grain nocturne</h1><p class="lede">One tone field for sky, crests, lit caps and shore, screened by a stochastic grain whose transfer from tone to speck was read off the reference in 12 px blocks.</p><div class="body"><p>The reference is a night seascape printed as a stipple: no grays, only specks of a median 2 px on black and black holes in the lit tint. Light is speck density. The open field covers 8 to 12 % of its area with specks, the dense foreground 27 %, and the lit caps run solid in slivers 6 px thick at the median, 13 px at the 90th percentile. Specks avoid each other: the lag-1 autocorrelation is 0.37 across and 0.30 down in the open field, with a negative lag 2.</p><p>The rebuild writes the picture as one luminance field first: a sky ramp, ridged crests whose spacing opens toward the viewer, a valley shadow under each next crest, lit caps on the high ground with a glow that falls down the slope, then stars, glints, hairlines, fringe and scratches as marks. A random cell lattice is resampled to the sheet and its own blur subtracted, so the specks space out. Each pixel's rank in that grain looks up the reference's tone distribution for its luminance, which is the whole transfer from tone to print. Density, grain size and evenness set the screen. Lit caps, cap thickness and glow set the light. Horizon, ridges and relief set the land.</p></div>
  <div class="accs"><details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>tone field: sky ramp, ridged crests, valley shadow under each next crest</b></li><li><b>lit caps: solid slivers on high ground, stipple glow falling down the slope</b></li><li><b>drawn marks: stars, glint dashes, contour hairlines, fringe hairs, scratches, edge hatch</b></li><li><b>grain screen: random cell lattice at 1.05 × 1.16 by 1.05 × 1.09 px per cell, resampled, minus 0.27 of its own 4.25 px blur (specks avoid each other)</b></li><li><b>transfer: each pixel's rank in the grain looks up the measured tone distribution, 12 tone bins × 129 quantiles</b></li><li><b>tone ramp: 11 stops, black to tint</b></li></ol></div></details><details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>4</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="grain"><span class="vn">Grain</span><span class="vid">grain</span></button></li><li class="vr"><button type="button" data-t="field"><span class="vn">Field</span><span class="vid">field</span></button></li><li class="vr"><button type="button" data-t="light"><span class="vn">Light</span><span class="vid">light</span></button></li><li class="vr"><button type="button" data-t="marks"><span class="vn">Marks</span><span class="vid">marks</span></button></li></ul></div></details><details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">References 13 · night seascape print, 1200 × 1617 px JPEG</p><div class="fid" id="fid"></div></div></details><details class="acc" name="notes" id="aStudy"><summary><span>Study</span></summary><div class="ab"><dl class="kv"><dt>Code</dt><dd>ST-13</dd><dt>Section</dt><dd>Studies</dd><dt>Family</dt><dd>light gradient</dd><dt>Spec</dt><dd><a href="spec.json">spec.json</a></dd></dl></div></details><details class="acc"
