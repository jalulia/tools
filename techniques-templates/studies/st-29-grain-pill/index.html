<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Studies</a><span class="sep">/</span><b>Grain pill</b><span class="code">ST-29</span></span><span class="pager"><a href="../../studies/st-28-two-ink-woods/index.html">← ST-28</a><a class="pos" href="../../index.html#techniques"><span class="n">25</span>&nbsp;of 35</a><a href="../../studies/st-30-thermal-field/index.html">ST-30 →</a></span> <p class="kicker"><span>ST-29</span><span>grain stock</span></p><h1 class="title">Grain pill</h1><p class="lede">Two frosted pills that read one chrome ramp at a jittered position, beside three lines of small black type with an oval round the middle one.</p><div class="body"><p>The source's pills are stadiums about 158 px tall with edges cut in 1 to 2 px. Inside, a blurred chrome runs gray, white, dark gray, yellow, white and pink in a swoosh, with thin bands that follow the rim at the right end. The grain sits on the glass only, and it is not even: its high-pass σ is 1.2 to 1.5 times the local slope, so it gathers on the band edges and nearly vanishes in the flat pink. That is the signature of a gradient read at a randomly offset position. The type under the glass shows blurred at about 30 % contrast; the small tag on the glass stays sharp.</p><p>The rebuild sets the type on its own layer, then lays each pill over it. Every pixel inside a pill reads the ramp along a warped coordinate: a tilted run, a swirl, a cupping bend and rim bands, all read at a position jittered by one grain field, so the grain lands on the band edges. The type under the pill is blurred and shows through at the Frost setting. The lower pill uses the same ramp with its yellow spent. Run angle, Run, Swirl and Bend shape the bands; Jitter and Grain floor set the grain; the Type group sets the three lines and the oval.</p></div>
  <div class="accs"><details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>type on its own layer: three lines of Archivo 500 at a 27.5 px cap and a 50.5 px pitch, the middle line indented 45 px and ringed by a 2.6 px oval, the last line's second word at a 135 px tab</b></li><li><b>ground and type flat: no grain on the ground, as measured</b></li><li><b>one grain field: position-hashed noise softened 0.6 px, normalized</b></li><li><b>each pill: a stadium 158 px tall; every pixel reads the chrome ramp along a tilted run, a swirl, a cupping bend and bands that follow the rim, at a position jittered by the grain field; the type under it is blurred 3.5 px and shows at 25 %</b></li><li><b>a light line on the first 1.6 px inside each pill's edge</b></li><li><b>the tag in Archivo 400 on the glass, sharp, one word per line</b></li></ol></div></details><details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>6</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="grain"><span class="vn">Grain</span><span class="vid">grain</span></button></li><li class="vr"><button type="button" data-t="frost"><span class="vn">Frost</span><span class="vid">frost</span></button></li><li class="vr"><button type="button" data-t="chrome"><span class="vn">Chrome</span><span class="vid">chrome</span></button></li><li class="vr"><button type="button" data-t="edge"><span class="vn">Edge</span><span class="vid">edge</span></button></li><li class="vr"><button type="button" data-t="type"><span class="vn">Type</span><span class="vid">type</span></button></li><li class="vr"><button type="button" data-t="ground"><span class="vn">Ground</span><span class="vid">ground</span></button></li></ul></div></details><details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">References 29 · frosted pill poster, 736 × 920 px</p><div class="fid" id="fid"></div></div></details><details class="acc" name="notes" id="aStudy"><summary><span>Study</span></summary><div class="ab"><dl class="kv"><dt>Code</dt><dd>ST-29</dd><dt>Section</dt><dd>Studies</dd><dt>Family</dt><dd>grain stock</dd><dt>Spec</dt><dd><a href="spec.json">spec.json</a></dd></dl></div></details><details class="acc" name="notes" id="aPts"><summary><span>Callouts <i>10</i></span></summary><div class="ab"><ol class="steps"><li><b>KEY · Dark band to yellow: the steepest run of the ramp, where…</b><span>u 0.66 · v 0.10 · grain</span></li><li><b>READ · Frosted run: light gray with the type under it blurred…</b><span>u 0.50 · v 0.09 · frost</span></li><li><b>READ · Rim bands: stripes that follow the pill's edge inside…</b><span>u 0.90 · v 0.12 · chrome</span></li><li><b>READ · Pink tip: the ramp's last stop, 246 186 224, where the…</b><span>u 0.95 · v 0.06 · chrome</span></li><li><b>KEY · Pill edge: cut in 1.4 px, with a light line on the first…</b><span>u 0.31 · v 0.04 · edge</span></li><li><b>KEY · Type: Archivo 500, 27.5 px caps, 50.5 px from baseline to…</b><span>u 0.10 · v 0.06 · type</span></li><li><b>READ · Oval: a 2.6 px ring 15 px clear of the middle line's ends.</b><span>u 0.15 · v 0.12 · type</span></li><li><b>READ · Tag on the glass: Archivo 400 at 17 px, sharp, one word…</b><span>u 0.40 · v 0.06 · type</span></li><li><b>KEY · Lower pill: the same ramp with the yellow spent, so the…</b><span>u 0.12 · v 0.85 · chrome</span></li><li><b>READ · Ground: flat 230 230 230; no grain reaches it.</b><span>u 0.50 · v 0.50 · ground</span></li></ol></div></details><details class="acc" name="notes" id="aRel"><summary><span>Related</span></summary><div class="ab"><div class="rel" id="rel"></div></div></details></div> {
