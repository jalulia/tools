<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Studies</a><span class="sep">/</span><b>Thermal field</b><span class="code">ST-30</span></span><span class="pager"><a href="../../studies/st-29-grain-pill/index.html">← ST-29</a><a class="pos" href="../../index.html#techniques"><span class="n">26</span>&nbsp;of 35</a><a href="../../studies/st-31-radial-dither-bloom/index.html">ST-31 →</a></span> <p class="kicker"><span>ST-30</span><span>grain stock</span></p><h1 class="title">Thermal field</h1><p class="lede">A wrapped field read through a cyclic thermal colormap, cut by a grid of cells that shift, fan and flare it.</p><div class="body"><p>The source reads a scalar field through a colormap that closes on itself: navy, violet, magenta, red, orange, yellow, then olive, green, teal and blue back to navy. Because the map is a loop, a field that climbs one full turn returns to its starting color, and a point the field winds around shows every color at once. Thin dark lines, 2 px, split the sheet into cells 63 to 76 px wide and 101 to 119 px tall, shorter toward the foot. Many cells carry a step in value at their edges; a few turn the field around one corner, so the colors fan out of the crossing. The grain is a dither on the value: σ 3.8 where the map runs fast through magenta, 0.2 in the flat navy.</p><p>The rebuild sums the field in turns: an offset, a tilt, three free domes, a flat-topped warm plateau pulled to orange one turn up and a cold pool pulled to navy. Every cell then takes a small step, some a larger shift, some a fan around a corner, some a flare along an edge. Hot spots are clusters of small domes that climb whole turns, so they read as rings, and each throws a jet along its grid line. One grain field dithers the value before the lookup. The lines multiply the field down on every cell edge. The colorbar is drawn from the same lookup over one turn with ticks 0 to 1, so it is the field's own scale; its marker sits at the phase. Offset turns every color along the loop; Dome height and Warm level set the sweep; the Cells group sets the patchwork; Phase walks the whole field once around the map.</p></div>
  <div class="accs"><details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>grid: columns 0.9 to 1.1 of W / 11.5 wide, rows 112 px that shrink toward the foot; vertical segments dropped to merge cells, horizontal segments jogged 3 to 6 px and some doubled</b></li><li><b>field in turns: offset plus a tilt, three free domes, then two flat-topped mixes that pull the warm plateau to orange one turn up and the cold pool to navy at the turn</b></li><li><b>cells: a small step in every cell, larger shifts in a few, fans that turn the field around one corner inside the cell, flares along one edge</b></li><li><b>hot spots: clusters of 2 to 4 small domes that climb whole turns, each throwing a jet along its grid line that pulls the field toward yellow</b></li><li><b>one grain field dithers the value before the cyclic colormap and screens the tones</b></li><li><b>lines: the field multiplied down along every cell edge, 2 px, anti-aliased</b></li><li><b>foot: caption, a colorbar drawn from the same lookup over one turn, its axis, end ticks, a marker at the phase, tick labels 0 to 1 and the x positions of three grid lines</b></li></ol></div></details><details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>6</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="field"><span class="vn">Field</span><span class="vid">field</span></button></li><li class="vr"><button type="button" data-t="grain"><span class="vn">Grain</span><span class="vid">grain</span></button></li><li class="vr"><button type="button" data-t="grid"><span class="vn">Grid</span><span class="vid">grid</span></button></li><li class="vr"><button type="button" data-t="cells"><span class="vn">Cells</span><span class="vid">cells</span></button></li><li class="vr"><button type="button" data-t="spot"><span class="vn">Spot</span><span class="vid">spot</span></button></li><li     { id:'spots', label:'Hot spots', min:0, max:6, step:1, value:2, unit:'', group:'Hot spots', why:'Clusters of small domes near grid crossings whose value climbs through whole turns, so each reads as rings of every color.', fmt:v=>(+v).toFixed(0), onChange(v){ const L=window.STUDY.live; if(L)L.set('spots',v,true); } },
    { id:'jet', label:'Jet', min:0, max:2, step:0.01, value:0.8, unit:'', group:'Hot spots', why:'A narrow ridge thrown from each cluster along its grid line that pulls the field toward yellow (0.5 to 0.56 turn) by the shortest way round the loop: the yellow column under the source\'s lower left cluster.', fmt:v=>(+v).toFixed(2), onChange(v){ const L=window.STUDY.live; if(L)L.set('jet',v,true); } },
    { id:'dither', label:'Dither', min:0, max:6, step:0.05, value:0.1, unit:'% turn', group:'Surface', why:'σ of the grain added to the value before the colormap. The speckle lands where the map runs fast: high-pass σ 3.8 in the magenta band, 0.8 in the orange, 0.2 in the navy.', fmt:v=>(+v).toFixed(2)+' % turn', onChange(v){ const L=window.STUDY.live; if(L)L.set('dither',v,true); } },
    { id:'grain', label:'Grain', min:0, max:6, step:0.05, value:0.4, unit:'σ', group:'Surface', why:'Luminance grain screened over everything by the same field.', fmt:v=>(+v).toFixed(2)+' σ', onChange(v){ const L=window.STUDY.live; if(L)L.set('grain',v,true); } },
    { id:'grainSize', label:'Grain size', min:0, max:3, step:0.05, value:1, unit:'px', group:'Surface', why:'Softening of the grain field. Measured lag-1 correlation 0.3 to 0.5.', fmt:v=>(+v).toFixed(2)+' px', onChange(v){ const L=window.STUDY.live; if(L)L.set('grainSize',v,true); } },
    { id:'phase', label:'Phase', min:0, max:1, step:0.001, value:0, unit:'', group:'Motion', why:'Position along the loop. Adds one turn to the field over the loop, so every color walks once around the map, the marker walks the colorbar and the grain boils.', fmt:v=>(+v).toFixed(3), onChange(v){ const L=window.STUDY.live; if(L)L.set('phase',v,true); } }
  ],
  hud:true,
  render(canvas,w,h,dpr,finish){ return window.__MP.mount(this,canvas,w,h,dpr,finish); }
