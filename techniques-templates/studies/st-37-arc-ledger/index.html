<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Studies</a><span class="sep">/</span><b>Arc ledger</b><span class="code">ST-37</span></span><span class="pager"><a href="../../studies/st-36-riso-road/index.html">← ST-36</a><a class="pos" href="../../index.html#techniques"><span class="n">33</span>&nbsp;of 35</a><a href="../../studies/st-38-robot-on-the-line/index.html">ST-38 →</a></span> <p class="kicker"><span>ST-37</span><span>grain stock</span></p><h1 class="title">Arc ledger</h1><p class="lede">Ten mirrored arcs on ten tracks, on paper ruled with the same 6.25 px circles that carry the data.</p><div class="body"><p>Fine concentric circles at a 6.25 px pitch radiate from each group’s center, and the two ring systems meet on a diagonal through the plate center. Every fifth ring is a track boundary, so a track is 31.25 px wide. Each arc is a 29.5 px round-capped stroke set in its track, separated from its neighbors by a paper hairline of about 1.4 px. The ten greens step from (221,232,152) on the outer track to (0,87,66) on the inner. Where an arc ends, the track’s inner edge continues as a 1 px leader to a straight label set tangent to the track, cap tops 2 px off the leader.</p><p>The ruling is drawn per pixel from the two centers; each arc is then stroked by its value: a 32° minimum sweep that keeps the cap and numeral visible, plus up to 126° in proportion to the value, clamped so no arc reaches its own label. Pitch, inner radius and hairline set the tracks. Ring depth, width and count set the paper. The axis angle turns the caps, label starts and ring seam together; group spread moves the two decks apart. The data lists are free text, one item per arc, name and value separated by a slash.</p></div>
  <div class="accs"><details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>pass 1, paper: a flat near-white, then two concentric ring systems (one per group center) meeting on the axis diagonal; each fine ring is a gaussian dip of measured depth with a fainter ring between each pair, five rings per track pitch; a low-amplitude grain, part high-passed, under it</b></li><li><b>pass 2, leaders: each empty track's inner edge is drawn as a 1 px gray arc from the arc's end cap to the label's near end</b></li><li><b>pass 3, arcs: a paper-white outline stroke, then the ink stroke, round caps; the outline is the hairline you see between neighbors</b></li><li><b>pass 4, numerals: white bold figures centered in the start caps</b></li><li><b>pass 5, labels: name (Archivo 400) and value (700) set on one straight baseline tangent to the track at the label's midpoint, cap tops toward the leader, flipped to stay readable on the mirrored group</b></li><li><b>pass 6, titles: two upright lines in the quiet sector before the caps</b></li><li><b>pass 7, softening: the drawn layer (arcs, leaders, numerals, labels, titles) is blurred by 0.45 px σ and composited over the paper, the resample softening the reference carries; the paper keeps its own grain</b></li></ol></div></details><details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>4</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="edge"><span class="vn">Edge</span><span class="vid">edge</span></button></li><li class="vr"><button type="button" data-t="pull"><span class="vn">Pull</span><span class="vid">pull</span></button></li><li class="vr"><button type="button" data-t="grain"><span class="vn">Grain</span><span class="vid">grain</span></button></li><li class="vr"><button type="button" data-t="type"><span class="vn">Type</span><span class="vid">type</span></button></li></ul></div></details><details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">References 37 · a two-deck concentric arc chart on a ring-ruled paper, 1486×842</p><div class="fid" id="fid"></div></div></details><details class="acc" name="notes" id="aStudy"><summary><span>Study</span></summary><div class="ab"><dl class="kv"><dt>Code</dt><dd>ST-37</dd><dt>Section</dt><dd>Studies</dd><dt>Family</dt><dd>grain stock</dd><dt>Spec</dt><dd><a href="spec.json">spec.json</a></dd></dl></div></details><details class="acc" name="notes" id="aPts"><summary><span>Callouts <i>10</i></span></summary><div class="ab"><ol class="steps"><li><b>KEY · Start cap of the upper deck</b><span>u 0.43 · v 0.29 · edge</span></li><li><b>KEY · Ten stacked tracks</b><span>u 0.60 · v 0.14 · pull</span></li><li><b>READ · Bare ruling</b><span>u 0.93 · v 0.12 · grain</span></li><li><b>KEY · Arc's end</b><span>u 0.77 · v 0.35 · edge</span></li><li><b>KEY · Labels on their tracks</b><span>u 0.74 · v 0.72 · type</span></li><li><b>READ · Ring seam</b><span>u 0.50 · v 0.50 · grain</span></li><li><b>READ · Title in the empty sector 22° before the caps, two upright lines at 12 px cap height.</b><span>u 0.40 · v 0.44 · type</span></li><li><b>KEY · Lower deck's labels</b><span>u 0.20 · v 0.17 · type</span></li><li><b>READ · Outermost pale arc of the lower deck at the 158° maximum sweep.</b><span>u 0.10 · v 0.55 · pull</span></li><li><b>READ · Innermost dark arc at the 32° minimum sweep, long enough to hold its cap and numeral.</b><span>u 0.56 · v 0.60 · edge</span></li></ol></div></details><details class="acc" name="notes" id="aRel"><summary><span>Related</span></summary><div class="ab"><div class="rel" id="rel"></div></div></details></div> {
