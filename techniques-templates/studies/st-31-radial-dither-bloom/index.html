<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Studies</a><span class="sep">/</span><b>Radial dither bloom</b><span class="code">ST-31</span></span><span class="pager"><a href="../../studies/st-30-thermal-field/index.html">← ST-30</a><a class="pos" href="../../index.html#techniques"><span class="n">27</span>&nbsp;of 35</a><a href="../../studies/st-32-noise-atom/index.html">ST-32 →</a></span> <p class="kicker"><span>ST-31</span><span>grain stock</span></p><h1 class="title">Radial dither bloom</h1><p class="lede">A lit panel, 17 bead-chain capsules and a ring of yellow teeth, sampled once per 2.21 px cell and printed as a diagonal checker of six inks.</p><div class="body"><p>The reference is a soft picture reduced to six inks: black, indigo, lilac, white, a pale yellow and an olive. Its cells measure 2.21 px, and the print is a diagonal checker: FFT peaks at 3.12 px on both diagonals, and on the pale ground every dark cell sits on one phase (no dark axis neighbors, 77 to 84 % dark diagonal neighbors). A square panel sits inset 55 to 68 px inside a black frame, and a halo ramps from the panel edge to black over 50 px with mitered corners. A light from the upper left falls across the panel: mean luminance runs 163, 130, 103 and 69 by quadrant. The same capsules read as smooth dark indigo beads on the pale ground and as white-cored lilac lobes on the dark ground. Their yellow caps spill past the panel edge.</p><p>The rebuild computes one light field per cell: the panel, the halo, the corner light, then the capsules and the center ring on top. A capsule is a chain of four soft beads: over the pale panel each bead is a gaussian dark spot, over the dark panel a bright capsule. The field carries no noise; all texture is the checker. Each cell then picks an ink ladder by warmth and saturation. The light phase of the checker prints the tone raised by h, the dark phase the tone lowered by h, and an ordered threshold on the checker's diagonal lattice places the cells that break to the next ink, so mid-tones print a clean checker with no row pattern. The cell grid is enlarged to the page with 0.8 linear interpolation, as the reference's was. Dither cell, checker depth, enlarge and phase breaks set the print. Light angle and falloff set the field. Rays, beads, bead depth and cap size set the capsules.</p></div>
  <div class="accs"><details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>light field per dither cell: a radial light from the upper left corner (tone falls with distance, warm only where it is bright), a square panel inset 55 to 68 px, a halo that ramps from the panel edge to black over 50 px with mitered corners</b></li><li><b>capsules: 17 rays, each a chain of four overlapping beads growing outward. A bead over the pale panel is a smooth gaussian dark spot (sigma 0.72 of its radius, indigo at the core, cool and saturated); over the dark panel it is a soft bright capsule, white in the core. Neither carries noise</b></li><li><b>caps: the outer bead ends in a pale yellow disc with a hard inner arc that spills past the panel at 0.9 opacity</b></li><li><b>center: a dark collar, a lilac disc, a zigzag of 12 yellow teeth, a black hole at 0.36 of the ring radius</b></li><li><b>dither, checker first: each cell belongs to one phase of the diagonal checker; the light phase quantizes T + h and the dark phase T − h, floored at the rung under T, along a warm, saturated or gray ladder; rung breaks and ladder picks use a 4 × 4 ordered threshold on the checker's diagonal lattice; phase breaks 0.005</b></li><li><b>print: the 2.21 px cell grid is enlarged to the page with 0.8 linear interpolation between cell centers; one-pixel lilac dust lands on the bare black</b></li></ol></div></details><details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>3</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="edge"><span class="vn">Edge</span><span class="vid">edge</span></button></li><li class="vr"><button type="button" data-t="tone"><span class="vn">Tone</span><span class="vid">tone</span></button></li><li class="vr"><button type="button" data-t="grain"><span class="vn">Grain</span><span class="vid">grain</span></button></li></ul></div></details><details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">References 31 · dithered radial bloom in indigo, lilac and pale yellow, 735 × 920 px JPEG</p><div class="fid" id="fid"></div></div></details><details class="acc" name="notes" id="aStudy"><summary><span>Study</span></summary><div class="ab"><dl class="kv"><dt>Code</dt><dd>ST-31</dd><dt>Section</dt><dd>Studies</dd><dt>Family</dt><dd>grain stock</dd><dt>Spec</dt><dd><a href="spec.json">spec.json</a></dd></dl></div></details><details class="acc" name="notes" id="aPts"><summary><span>Callouts <i>10</i></span></summary><div class="ab"><ol class="steps"><li><b>KEY · Center: 12 yellow teeth in a zigzag around a black hole…</b><span>u 0.50 · v 0.50 · edge</span></li><li><b>KEY · Bead chain on the pale ground: the dark phase prints…</b><span>u 0.30 · v 0.20 · tone</span></li><li><b>KEY · The same chain on the dark ground: indigo and lilac at…</b><span>u 0.70 · v 0.66 · tone</span></li><li><b>READ · Yellow cap spilling past the panel edge onto the bevel at…</b><span>u 0.44 · v 0.06 · edge</span></li><li><b>READ · Bevel corner: the halo ramps to black over 50 px through…</b><span>u 0.04 · v 0.04 · edge</span></li><li><b>READ · Right bevel: indigo, darker than the top bevel by the…</b><span>u 0.96 · v 0.50 · edge</span></li><li><b>READ · At 4x: the pale ground is a diagonal checker of yellow…</b><span>u 0.20 · v 0.13 · grain</span></li><li><b>READ · Dark ground between lobes: 98 % black, indigo cells only…</b><span>u 0.62 · v 0.80 · grain</span></li><li><b>READ · Dust on the bare black: one-pixel lilac specks, about 1.3…</b><span>u 0.66 · v 0.90 · grain</span></li><li><b>READ · Capsule on the mid ground: indigo on the dark phase…</b><span>u 0.25 · v 0.58 · tone</span></li></ol></div></details><details class="acc" name="notes" id="aRel"><summary><span>Related</span></summary><div class="ab"><div class="rel" id="rel"></div></div></details></di
