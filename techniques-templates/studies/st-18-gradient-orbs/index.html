<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Studies</a><span class="sep">/</span><b>Gradient orbs</b><span class="code">ST-18</span></span><span class="pager"><a href="../../studies/st-15-phosphor-cell/index.html">← ST-15</a><a class="pos" href="../../index.html#techniques"><span class="n">14</span>&nbsp;of 35</a><a href="../../studies/st-19-fold-glow/index.html">ST-19 →</a></span> <p class="kicker"><span>ST-18</span><span>light gradient</span></p><h1 class="title">Gradient orbs</h1><p class="lede">Six cut discs, each a ramp from its own rim color to a shared red, broken by arcs, the last one a glossy sphere.</p><div class="body"><p>The source is a stack of equal circles, 286 px in radius, on a light gray. Each circle is cut hard and filled with a gradient that starts at the disc's own color at the edge and moves toward one shared red, 253 4 55, inside. The red gathers in soft pools. Arcs about the size of the discs cross them: along an arc the ramp starts over, so a thin line of rim color cuts the red, sharp on one side and soft on the other. Where a lower disc crosses an upper one it covers it; a rim reads the same over another disc as over the ground. The last disc is a glossy sphere: a cool spot at the top, a pale band across the middle, a dark floor below, a red rim all round. The grain is strongest where the ramp is steepest, σ 1.1 in the mint-to-red mix against 0.3 on the ground.</p><p>The rebuild steps equal discs down the sheet and computes each pixel's ramp amount: the union of soft pools and one wide base pool, times the same ramp restarted from every arc and from the disc's own edge. One grain field jitters the distance the pools are read at, so the grain lands on the ramps, and screens the whole sheet. The last disc reflects a simple room along each pixel's reflected ray. Pools, Pool size, Pool falloff and Base pool set where the red gathers; Arcs, Arc reach and Crease ramp set the cuts; Rim ramp holds each disc's color at its edge; Highlight, Shade and Cool spot set the sphere; Phase turns the arcs and the light once round.</p></div>
  <div class="accs"><details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>chain: equal discs stepped down the sheet with a seeded sideways swing; each later disc lies on top</b></li><li><b>one grain field: position-hashed noise softened 2.2 px and normalized to σ 1; it jitters the distance the pools are read at and screens every tone</b></li><li><b>per disc and per pixel: the union of four soft pools and one wide base pool, 1 − Π(1 − m), each pool m = 1 − (1 − t)^1.5; times the same ramp restarted from every arc (short on one side, three times longer on the other) and from the disc's own edge; color = rim color moved toward the core red by that amount</b></li><li><b>the last disc only: a glossy sphere reflecting one simple room along each pixel's reflected ray: a pale band from 0.24 below the horizon to 0.9 up, a cool zenith, a dark floor, the base color at grazing angles</b></li><li><b>composite in order with a 1.5 px anti-aliased cut edge; Glass, at 0 by default, multiplies a disc with what lies beneath</b></li><li><b>the grain field screens the whole sheet at σ 0.5</b></li></ol></div></details><details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>4</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="edge"><span class="vn">Edge</span><span class="vid">edge</span></button></li><li class="vr"><button type="button" data-t="pull"><span class="vn">Pull</span><span class="vid">pull</span></button></li><li class="vr"><button type="button" data-t="grain"><span class="vn">Grain</span><span class="vid">grain</span></button></li><li class="vr"><button type="button" data-t="light"><span class="vn">Light</span><span class="vid">light</span></button></li></ul></div></details><details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">References 18 · gra
