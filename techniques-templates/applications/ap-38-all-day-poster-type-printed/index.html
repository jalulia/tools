  <span class="pager"><a href="../../applications/ap-37-all-day-poster-roller-run-out/index.html" title="Previous: AP-37 All-day poster · roller run-out">← AP-37</a><a class="pos" href="../../../library/#/plates?kind3=example"><span class="n">11</span>&nbsp;of 38</a><a href="../../applications/ap-08-timetable/index.html" title="Next: AP-08 Timetable · typed into a printed form">AP-08 →</a></span> <p class="kicker"><span>AP-38</span><span>print</span></p><h1 class="title">All-day poster · type, printed</h1><p class="lede">The all-day poster's type on its own: every dial changes how the letters print and nothing else.</p><div class="body"><p>The headline, the bill and the rules are inked by the same chain as the block; Face sets how the letters take ink, Edge works their edges and outline. The ember block and the press bar are printed at AP-37's defaults and do not move.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>Face</b><span>how the letters take ink from the forme.</span></li><li><b>Edge</b><span>spread, rag, wander, feather and bite at the edge; the squeezed rim, outline and contour.</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>2</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="fx-02-ink-edge"><span class="vn">Face</span><span class="vid">fx-02-ink-edge</span></button><span class="at"><a href="../../index.html#techniques?a=deposit">deposit</a></span><p class="ah">The letters are inked by the same chain as the roll: the board under each letter is ranked to percentiles and the impression inks its top share, so a light impression opens the face onto the valleys, starve pins the lowest share and the formation mottles the film. The letter's own edge is the coverage, worked in Edge.</p></li><li class="vr"><button type="button" data-t="type-edge"><span class="vn">Edge</span><span class="vid">type-edge</span></button><span class="at"><a href="../../index.html#techniques?a=deposit">deposit</a></span><p class="ah">Each letter's alpha becomes a signed distance in device px. The edge is moved by spread, pushed by the board's height (rag), waved by noise (wander), eaten near the edge (bite) and feathered along fibers; the rim keeps full film while the face thins (face 0 = outline type), and a contour hairline sits off the edge. Coverage stays one device px wide, so the edge is crisp at any setting.</p></li></ul></div></details>
  <details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">Split from AP-07 (All-day poster · the ink runs out with the day) into two instruments: this type page and AP-37, which holds the roller. Made with the effect set.</p><div class="fid" id="fid"></div></div></details>
