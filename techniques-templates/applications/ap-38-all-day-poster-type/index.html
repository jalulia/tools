  <span class="pager"><a href="../../applications/ap-37-all-day-poster-roller/index.html" title="Previous: AP-37 All-day poster · roller run-out">← AP-37</a><a class="pos" href="../../../library/#/plates?kind3=example"><span class="n">11</span>&nbsp;of 38</a><a href="../../applications/ap-08-timetable/index.html" title="Next: AP-08 Timetable · typed into a printed form">AP-08 →</a></span> <p class="kicker"><span>AP-38</span><span>print</span></p><h1 class="title">All-day poster · type, printed</h1><p class="lede">The all-day poster's type on its own: every control changes how the letters print and nothing else.</p><div class="body"><p>Choose the press and the letterform, then the ink, the impression and the wear. The key ink is in the Color tab. The ember block and the press bar are printed as AP-37 opens and do not move.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>Press</b><span>how the type meets the sheet: letterpress, offset or rubber stamp; then ink, impression and wear.</span></li><li><b>Letterform</b><span>solid, outline, inline or contour, in proportion to each letter.</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>2</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="fx-02-ink-edge"><span class="vn">Press</span><span class="vid">fx-02-ink-edge</span></button><span class="at"><a href="../../index.html#techniques?a=deposit">deposit</a></span><p class="ah">The letters are inked by the same chain as the roll, then their edges are worked on each letter's signed distance. The press sets the character: letterpress squeezes ink to a darker rim with a light impression in the face; offset is clean and flat; a rubber stamp is soft, spread and uneven. Ink, Impression and Wear move it from there; wear and the lines are in proportion to each letter, so the display type takes them and the small setting stays whole.</p></li><li class="vr"><button type="button" data-t="type-edge"><span class="vn">Letterform</span><span class="vid">type-edge</span></button><span class="at"><a href="../../index.html#techniques?a=deposit">deposit</a></span><p class="ah">Each letter's alpha becomes a signed distance in device px. Outline prints only a rim, Inline cuts a line along the inside of the stroke, Contour sets a line off the outside; each line is proportioned to the letter's own stroke (the running maximum of its inside distance), so display letters carry it and small type stays solid. Coverage stays one device px wide, so edges are crisp at any setting.</p></li></ul></div></details>
  <details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">Split from AP-07 (All-day poster · the ink runs out with the day) into two instruments: this type page and AP-37, which holds the roller. Made with the effect set.</p><div class="fid" id="fid"></div></div></details>
