  <span class="pager"><a href="../../applications/ap-13-spine-proof/index.html" title="Previous: AP-13 Spine proof · four volumes in gold foil">← AP-13</a><a class="pos" href="../../index.html#applications"><span class="n">14</span>&nbsp;of 34</a><a href="../../applications/ap-15-dieline/index.html" title="Next: AP-15 Dieline · a matchbox sleeve and tray, flat">AP-15 →</a></span> <p class="kicker"><span>AP-14</span><span>print</span></p><h1 class="title">Colophon · the contents in varnish only</h1><p class="lede">The colophon page of an invented edition, on deep green board in one white ink.</p><div class="body"><p>The table of contents is printed on this page only, and only in clear spot UV, so head-on the page shows the colophon and nothing else. The chapters appear where the soft box of the sheet light reflects in the gloss, and drift down the list as the light moves.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>Spot UV varnish</b><span>A clear gloss film printed only on the motif, over matte board.</span></li><li><b>Roller run-out</b><span>A solid that runs out.</span></li><li><b>Paper tooth</b><span>White stock that is not a screen.</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>3</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="fx-09-spot-uv"><span class="vn">Spot UV varnish</span><span class="vid">fx-09-spot-uv</span></button><span class="at"><a href="../../index.html#techniques?a=deposit">deposit</a><a href="../../index.html#techniques?a=reflect">reflect</a></span><p class="ah">Motif = an invented mark, a word or a ring seal (AA clip, main thread) → exact signed distance. Coverage pattern: solid, or an analytic line / dot screen intersected with the motif (or with the sheet around it), so every line and dot keeps a 1-device-px edge. Film profile from the signed distance: a rounded shoulder (1 − (1 − d / rounding)²) rising to the film build. The film levels the FX-03 tooth: its top = lerp(tooth, smoothed tooth, leveling × profile) + build × profile. Stock: FX-03's relief and fibers under a board color (OKLCH; dark by default). Matte = Lambert from FX-03 × albedo + a weak, broad rough-dielectric sheen on the tooth facets. Film: Fresnel (n = 1.5, F₀ = .04) from a perspective viewer above the plate; the mirror vector samples the studio (a rectangular soft box at the sheet light, a dim ceiling, a dark room); gloss sets the box edge softness and the glint exponent. Under the film the matte sheen is gone and the stock is darker and deeper in OKLab (wet tone). One light: the box center, glint and FX-03 shading all follow FX.LIGHT.</p></li><li class="vr"><button type="button" data-t="fx-02-ink-edge"><span class="vn">Roller run-out</span><span class="vid">fx-02-ink-edge</span></button><span class="at"><a href="../../index.html#techniques?a=deposit">deposit</a></span><p class="ah">Pressure = dropoff curve of the signed distance to a warped edge line (stroke direction, transition width), × the mask. Ink chain: the stock height under the inked area (blended with film-splitting noise, clumped and streaked along the stroke) is ranked to percentiles; pressure P inks exactly the top P of the surface, peaks first. Starve: valleys below the threshold never take ink. Wick: fibers carry ink past the edge. Mottle: paper formation thins the film. Film thickness thins with pressure unless the film breaks up; color = Beer–Lambert film in linear light. Light last: × the stock's shading. The ink sits in the tooth, not on top of it.</p></li><li class="vr"><button type="button" data-t="fx-03-paper-tooth"><span class="vn">Paper tooth</span><span class="vid">fx-03-paper-tooth</span></button><span class="at"><a href="../../index.html#techniques?a=form">form</a></span><p class="ah">Height = fbm at the tooth scale (octaves, persistence = how fast detail drops off), reshaped by the distribution curve; blended with low-frequency formation. Fibers: curved capsules at a count per 100 × 100 CSS px near the grain angle, raised into the height; pits: small depressions. Both also darken the albedo slightly. Normal from the height gradient → Lambert under the sheet light (azimuth + elevation from the light puck). Diffuse share vs ambient fill; the fill can be tinted. The same field is the stock for FX-01 and FX-02: its peaks take ink first, its valleys starve, its fibers wick. Mask = the sheet's cut or deckle edge; the sheet casts a contact + ambient shadow onto the page by the same light.</p></li></ul></div></details>
  <details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">Made with the effect set: Spot UV varnish, Roller run-out, Paper tooth.</p><div class="fid" id="fid"></div></div></details>
