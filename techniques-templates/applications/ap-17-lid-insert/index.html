<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#applications">Applications</a><span class="sep">/</span><b>Lid insert · a hill in laser power</b><span class="code">AP-17</span></span>
  <span class="pager"><a href="../../applications/ap-16-lid-proof/index.html" title="Previous: AP-16 Lid proof · the box key in spot UV">← AP-16</a><a class="pos" href="../../index.html#applications"><span class="n">17</span>&nbsp;of 34</a><a href="../../applications/ap-18-bottle-drawing/index.html" title="Next: AP-18 Bottle drawing · a 500 ml round in pencil">AP-18 →</a></span> <p class="kicker"><span>AP-17</span><span>packaging</span></p><h1 class="title">Lid insert · a hill in laser power</h1><p class="lede">The card insert for a tea tin, burned by a laser.</p><div class="body"><p>The garden's hill is a contour map in which the beam's power is the elevation: one power step (7.5 %) for every 100 m above 600 m, so the bands darken as the hill rises, and the 1,000 m and 1,500 m index lines burn at full power. The legend is burned at the same steps. The summit figure is burned too; the rest is printed. A fictional hill.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>Laser char</b><span>A CO₂ beam rasters a motif into card, one scan line at a time.</span></li><li><b>Roller run-out</b><span>A solid that runs out.</span></li><li><b>Paper tooth</b><span>White stock that is not a screen.</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>3</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="fx-12-laser"><span class="vn">Laser char</span><span class="vid">fx-12-laser</span></button><span class="at"><a href="../../index.html#techniques?a=burn">burn</a></span><p class="ah">Scan lines at the pitch (≥ 2 device px), at the scan angle. Dose at a pixel = Σ over nearby lines of power ÷ speed × the beam's gaussian, integrated over the pixel (erf): anti-aliased lines at any angle. When the pitch clamps to 2 device px, the dose is scaled by the clamp so the tone matches a finer screen. Firing gate = the motif clip sampled at each line's centerline, softened by the spot along the scan; the head's turnaround adds dose just inside the edges it reverses at. Defocus widens σ and lowers the peak (same energy, larger spot): paler, softer, lines merging. A power ramp can run across the raster. Char = 1 − e^(−k·(dose − threshold)) → an OKLab ramp tan → brown → black, multiplied into the stock albedo (fibers char darker). Heat halo = the dose spread a few px, browning fibers first. Relief: ablation sinks the surface with dose; the tooth is burned smooth; a fine char crust. Lit by the sheet light (grooves catch it on one wall). Vector cut: a kerf along the motif outline (offset) or a tag; tabs leave bridges. The kerf opens onto the ground below, shaded by the card edge toward the light; its walls are charred.</p></li><li class="vr"><button type="button" data-t="fx-02-ink-edge"><span class="vn">Roller run-out</span><span class="vid">fx-02-ink-edge</span></button><span class="at"><a href="../../index.html#techniques?a=deposit">deposit</a></span><p class="ah">Pressure = dropoff curve of the signed distance to a warped edge line (stroke direction, transition width), × the mask. Ink chain: the stock height under the inked area (blended with film-splitting noise, clumped and streaked along the stroke) is ranked to percentiles; pressure P inks exactly the top P of the surface, peaks first. Starve: valleys below the threshold never take ink. Wick: fibers carry ink past the edge. Mottle: paper formation thins the film. Film thickness thins with pressure unless the film breaks up; color = Beer–Lambert film in linear light. Light last: × the stock's shading. The ink sits in the tooth, not on top of it.</p></li><li class="vr"><button type="button" data-t="fx-03-paper-tooth"><span class="vn">Paper tooth</span><span class="vid">fx-03-paper-tooth</span></button><span class="at"><a href="../../index.html#techniques?a=form">form</a></span><p class="ah">Height = fbm at the tooth scale (octaves, persistence = how fast detail drops off), reshaped by the distribution curve; blended with low-frequency formation. Fibers: curved capsules at a count per 100 × 100 CSS px near the grain angle, raised into the height; pits: small depressions. Both also darken the albedo slightly. Normal from the height gradient → Lambert under the sheet light (azimuth + elevation from the light puck). Diffuse share vs ambient fill; the fill can be tinted. The same field is the stock for FX-01 and FX-02: its peaks take ink first, its valleys starve, its fibers wick. Mask = the sheet's cut or deckle edge; the sheet casts a contact + ambient shadow onto the page by the same light.</p></li></ul></div></details>
  <details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">Made with the effect set: Laser char, Roller run-out, Paper tooth.</p><div class="fid" id="fid"></div></div></details>
