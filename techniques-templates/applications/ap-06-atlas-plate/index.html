  <span class="pager"><a href="../../applications/ap-05-medal-table/index.html" title="Previous: AP-05 Medal table · each medal a foil dot">← AP-05</a><a class="pos" href="../../index.html#applications"><span class="n">6</span>&nbsp;of 34</a><a href="../../applications/ap-07-all-day-poster/index.html" title="Next: AP-07 All-day poster · the ink runs out with the day">AP-07 →</a></span> <p class="kicker"><span>AP-06</span><span>print</span></p><h1 class="title">Atlas plate · Brasca, where people sleep</h1><p class="lede">A plate from an atlas of invented cities.</p><div class="body"><p>Density is drawn in stipple: each dot is a fixed number of residents, so tone is a head count and the river, the parks and the edges of the satellite towns appear as the dots thin out. The key is five swatches of the same pen, not a gradient. The population, the peak and the residents per dot are integrated from the same modeled field that places the dots, at the scale this plate is drawn.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>Stipple ramp</b><span>Tone made of whole pen dots.</span></li><li><b>Roller run-out</b><span>A solid that runs out.</span></li><li><b>Paper tooth</b><span>White stock that is not a screen.</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>3</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="fx-01-stipple"><span class="vn">Stipple ramp</span><span class="vid">fx-01-stipple</span></button><span class="at"><a href="../../index.html#techniques?a=deposit">deposit</a></span><p class="ah">Site lattice at the pitch (CSS px), jittered. Value field (linear · radial · noise) eased from → to. Screen: FM keeps a site when its blue-noise rank &lt; value; AM keeps every site with radius ∝ √value; the dial interpolates. The mask is sampled at the site, so dots are whole or absent. Each dot is geometry: a signed distance to an irregular nib outline (7 vertex radii), so its edge is always 1 device px of anti-aliasing, never a blur. The stock edits the edge: the distance is displaced by the stock height (edge rag), valleys inside the dot can starve, fibers wick a short way out. Film τ = thickness × pressure. Color: Beer–Lambert film in linear light (or a coverage mix). Ink B overprints by the same film product. Light last: × the stock's shading under the sheet light.</p></li><li class="vr"><button type="button" data-t="fx-02-ink-edge"><span class="vn">Roller run-out</span><span class="vid">fx-02-ink-edge</span></button><span class="at"><a href="../../index.html#techniques?a=deposit">deposit</a></span><p class="ah">Pressure = dropoff curve of the signed distance to a warped edge line (stroke direction, transition width), × the mask. Ink chain: the stock height under the inked area (blended with film-splitting noise, clumped and streaked along the stroke) is ranked to percentiles; pressure P inks exactly the top P of the surface, peaks first. Starve: valleys below the threshold never take ink. Wick: fibers carry ink past the edge. Mottle: paper formation thins the film. Film thickness thins with pressure unless the film breaks up; color = Beer–Lambert film in linear light. Light last: × the stock's shading. The ink sits in the tooth, not on top of it.</p></li><li class="vr"><button type="button" data-t="fx-03-paper-tooth"><span class="vn">Paper tooth</span><span class="vid">fx-03-paper-tooth</span></button><span class="at"><a href="../../index.html#techniques?a=form">form</a></span><p class="ah">Height = fbm at the tooth scale (octaves, persistence = how fast detail drops off), reshaped by the distribution curve; blended with low-frequency formation. Fibers: curved capsules at a count per 100 × 100 CSS px near the grain angle, raised into the height; pits: small depressions. Both also darken the albedo slightly. Normal from the height gradient → Lambert under the sheet light (azimuth + elevation from the light puck). Diffuse share vs ambient fill; the fill can be tinted. The same field is the stock for FX-01 and FX-02: its peaks take ink first, its valleys starve, its fibers wick. Mask = the sheet's cut or deckle edge; the sheet casts a contact + ambient shadow onto the page by the same light.</p></li></ul></div></details>
  <details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">Made with the effect set: Stipple ramp, Roller run-out, Paper tooth.</p><div class="fid" id="fid"></div></div></details>
