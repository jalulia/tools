<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#applications">Applications</a><span class="sep">/</span><b>Cloth chart · six weaves at four setts</b><span class="code">AP-20</span></span>
  <span class="pager"><a href="../../applications/ap-19-weaving-draft/index.html" title="Previous: AP-19 Weaving draft · a goose-eye on eight shafts">← AP-19</a><a class="pos" href="../../index.html#applications"><span class="n">20</span>&nbsp;of 34</a><a href="../../applications/ap-21-band-sampler/index.html" title="Next: AP-21 Band sampler · seven stitches, one thread">AP-21 →</a></span> <p class="kicker"><span>AP-20</span><span>textile</span></p><h1 class="title">Cloth chart · six weaves at four setts</h1><p class="lede">One cotton yarn, black in the warp and white in the weft, woven twenty-four ways.</p><div class="body"><p>Down the chart the interlacement changes, and the share of warp on the face (counted from each weave's own rule) sets the cloth's gray. Across, the same yarn is set closer, so the gaps close: the cover under each column is computed from the yarn width and the sett.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>Weave</b><span>Cloth built as cloth: warp and weft at their own counts, a real interlacing, slubbed and hairy threads, every float a raised body lit by the sheet light and casting into the gaps.</span></li><li><b>Roller run-out</b><span>A solid that runs out.</span></li><li><b>Paper tooth</b><span>White stock that is not a screen.</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>3</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="fx-04-weave"><span class="vn">Weave</span><span class="vid">fx-04-weave</span></button><span class="at"><a href="../../index.html#techniques?a=form">form</a></span><p class="ah">Warp columns and weft rows at their own counts (threads / 100 CSS px); each thread: jittered center, thickness, dye-lot L, fray length, accent. Interlacing decides the top thread per crossing; a float is the run where it stays on top. Height = cylinder across the thread × arch along the float; under-threads sit low; hair = fine noise along the thread. Albedo in OKLab: under-thread, then top thread by AA coverage; accent as flecks (single floats, as in the source) or whole threads. Light: Lambert from the height gradient + a height-field shadow march toward the sheet light, so floats shade into the gaps; ambient occlusion darkens the gaps. Cut: the mask's signed distance plus each thread's own fray length, so threads end raggedly, not on a line. The swatch casts onto the page.</p></li><li class="vr"><button type="button" data-t="fx-02-ink-edge"><span class="vn">Roller run-out</span><span class="vid">fx-02-ink-edge</span></button><span class="at"><a href="../../index.html#techniques?a=deposit">deposit</a></span><p class="ah">Pressure = dropoff curve of the signed distance to a warped edge line (stroke direction, transition width), × the mask. Ink chain: the stock height under the inked area (blended with film-splitting noise, clumped and streaked along the stroke) is ranked to percentiles; pressure P inks exactly the top P of the surface, peaks first. Starve: valleys below the threshold never take ink. Wick: fibers carry ink past the edge. Mottle: paper formation thins the film. Film thickness thins with pressure unless the film breaks up; color = Beer–Lambert film in linear light. Light last: × the stock's shading. The ink sits in the tooth, not on top of it.</p></li><li class="vr"><button type="button" data-t="fx-03-paper-tooth"><span class="vn">Paper tooth</span><span class="vid">fx-03-paper-tooth</span></button><span class="at"><a href="../../index.html#techniques?a=form">form</a></span><p class="ah">Height = fbm at the tooth scale (octaves, persistence = how fast detail drops off), reshaped by the distribution curve; blended with low-frequency formation. Fibers: curved capsules at a count per 100 × 100 CSS px near the grain angle, raised into the height; pits: small depressions. Both also darken the albedo slightly. Normal from the height gradient → Lambert under the sheet light (azimuth + elevation from the light puck). Diffuse share vs ambient fill; the fill can be tinted. The same field is the stock for FX-01 and FX-02: its peaks take ink first, its valleys starve, its fibers wick. Mask = the sheet's cut or deckle edge; the sheet casts a contact + ambient shadow onto the page by the same light.</p></li></ul></div></details>
