<!-- <span class="crumb"><a href="../../../library/">Library</a><span class="sep">/</span><a href="../../../library/#/plates?kind3=example">Examples</a><span class="sep">/</span><b>All-day poster · roller run-out</b><span class="code">AP-37</span></span>
  <span class="pager"><a href="../../applications/ap-07-all-day-poster/index.html" title="Previous: AP-07 All-day poster · the ink runs out with the day">← AP-07</a><a class="pos" href="../../../library/#/plates?kind3=example"><span class="n">10</span>&nbsp;of 38</a><a href="../../applications/ap-38-all-day-poster-type/index.html" title="Next: AP-38 All-day poster · type, printed">AP-38 →</a></span> <p class="kicker"><span>AP-37</span><span>print</span></p><h1 class="title">All-day poster · roller run-out</h1><p class="lede">The all-day poster's roller on its own: every control changes the roll and nothing else.</p><div class="body"><p>A poster for a twelve-hour bill at an invented venue. One ember block is rolled once down the sheet and the roller is not re-inked, so each set's time is also how much ink was left. Set the paper, how much ink the roller carries and how fast it gives out, how hard the hand leans and drifts, what the roller is made of, and how the ink splits. The press bar is the same roller at six fixed pressures. The ink is in the Color tab. The type is printed as AP-38 opens and does not move.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>Paper</b><span>the sheet the roller meets: coated, bond or cold press.</span></li><li><b>Roller</b><span>how much ink it carries, how fast it gives out, how hard the hand leans and drifts, and what the roller is made of.</span></li><li><b>Ink</b><span>how the film splits onto the paper's peaks; its color is the Color tab.</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>3</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="fx-03-paper-tooth"><span class="vn">Paper</span><span class="vid">fx-03-paper-tooth</span></button><span class="at"><a href="../../index.html#techniques?a=form">form</a></span><p class="ah">The sheet is FX-03 live: tooth, formation, fibers and pits under the one sheet light. As the ink gives out it only reaches the paper's peaks, so the run-out speckle is the paper itself: fine and even on coated board, fibrous on bond, coarse and deep on cold press.</p></li><li class="vr"><button type="button" data-t="fx-02-ink-edge"><span class="vn">Roller</span><span class="vid">fx-02-ink-edge</span></button><span class="at"><a href="../../index.html#techniques?a=deposit">deposit</a></span><p class="ah">One pass of a hand roller. Ink on the roller sets where along the stroke it is down to half its ink, Run-out how much of the stroke that takes, Pressure how hard the hand leans (below 1 the solid opens onto the paper before the ink runs out), Hand drift how far the run-out line turns off square. The roller sets its ends and wander: hard rubber prints crisp ends with a ridge of squeezed ink that holds into the run-out, soft rubber a softer edge, foam a wandering edge and an open, cellular film.</p></li><li class="vr"><button type="button" data-t="ink-film"><span class="vn">Ink</span><span class="vid">ink-film</span></button><span class="at"><a href="../../index.html#techniques?a=deposit">deposit</a></span><p class="ah">The ink as it splits between roller and paper (the ink chain): the paper's height, blended with the film's own split, is ranked so that pressure P inks exactly the top P of the surface. A stiff ink breaks into sharp specks at full strength; a loose one stays a thinner, whole film that fades. Clump size is how big the film's own breaks are; Streak draws them out along the stroke. The color is the Color tab.</p></li></ul></div></details>
  <details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">Split from AP-07 (All-day poster · the ink runs out with the day) into two instruments: this roller page and AP-38, which holds the type. Made with the effect set.</p><div class="fid" id="fid"></div></div></details>
