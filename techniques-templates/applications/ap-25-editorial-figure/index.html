<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#applications">Applications</a><span class="sep">/</span><b>Editorial figure · two years in stipple</b><span class="code">AP-25</span></span>
  <span class="pager"><a href="../../applications/ap-24-instrument-dial/index.html" title="Previous: AP-24 Instrument dial · 24 h in stipple">← AP-24</a><a class="pos" href="../../index.html#applications"><span class="n">25</span>&nbsp;of 34</a><a href="../../applications/ap-26-sun-print/index.html" title="Next: AP-26 Sun print · a year of daylight at 60° N">AP-26 →</a></span> <p class="kicker"><span>AP-25</span><span>data</span></p><h1 class="title">Editorial figure · two years in stipple</h1><p class="lede">A figure as it would run in print.</p><div class="body"><p>Visitors per day at a corner café, last year in black and this year in ember. Each area is stipple, densest at its line and thinning to the baseline. This year's ember fills only the band above last year's line, so the gain the terrace opened reads without a legend. Hairline grid and direct labels; the axis and the note are struck in type.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>Stipple ramp</b><span>Tone made of whole pen dots.</span></li><li><b>Roller run-out</b><span>A solid that runs out.</span></li><li><b>Typewriter strike</b><span>Each glyph is a separate strike: its own pressure, a slight offset and rotation, sometimes only half the face lands.</span></li><li><b>Paper tooth</b><span>White stock that is not a screen.</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>4</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="fx-01-stipple"><span class="vn">Stipple ramp</span><span class="vid">fx-01-stipple</span></button><span class="at"><a href="../../index.html#techniques?a=deposit">deposit</a></span><p class="ah">Site lattice at the pitch (CSS px), jittered. Value field (linear · radial · noise) eased from → to. Screen: FM keeps a site when its blue-noise rank &lt; value; AM keeps every site with radius ∝ √value; the dial interpolates. The mask is sampled at the site, so dots are whole or absent. Each dot is geometry: a signed distance to an irregular nib outline (7 vertex radii), so its edge is always 1 device px of anti-aliasing, never a blur. The stock edits the edge: the distance is displaced by the stock height (edge rag), valleys inside the dot can starve, fibers wick a short way out. Film τ = thickness × pressure. Color: Beer–Lambert film in linear light (or a coverage mix). Ink B overprints by the same film product. Light last: × the stock's shading under the sheet light.</p></li><li class="vr"><button type="button" data-t="fx-02-ink-edge"><span class="vn">Roller run-out</span><span class="vid">fx-02-ink-edge</span></button><span class="at"><a href="../../index.html#techniques?a=deposit">deposit</a></span><p class="ah">Pressure = dropoff curve of the signed distance to a warped edge line (stroke direction, transition width), × the mask. Ink chain: the stock height under the inked area (blended with film-splitting noise, clumped and streaked along the stroke) is ranked to percentiles; pressure P inks exactly the top P of the surface, peaks first. Starve: valleys below the threshold never take ink. Wick: fibers carry ink past the edge. Mottle: paper formation thins the film. Film thickness thins with pressure unless the film breaks up; color = Beer–Lambert film in linear light. Light last: × the stock's shading. The ink sits in the tooth, not on top of it.</p></li><li class="vr"><button type="button" data-t="fx-07-typewriter"><span class="vn">Typewriter strike</span><span class="vid">fx-07-typewriter</span></button><span class="at"><a href="../../index.html#techniques?a=transfer">transfer</a><a href="../../index.html#techniques?a=deform">deform</a></span><p class="ah">Text in Courier Prime (a typewriter slab; bold below 15 px, as a light strike loses thin strokes), one strike per glyph on the main thread: pressure = ribbon life (exhausting along the page) × key variance; offset, rotation, an occasional dropped baseline; a half strike is a linear pressure ramp across the glyph, fading top or bottom. Ribbon: a plain weave at the ribbon count. Ink transfers through thread crossings, less through the gaps. Ink chain: pressure × ribbon vs stock-height percentile; ink squash pools film at the glyph edge. Impression: the strike dents the stock (blurred glyph × pressure); light from the combined height. Color: Beer–Lambert film.</p></li><li class="vr"><button type="button" data-t="fx-03-paper-tooth"><span class="vn">Paper tooth</span><span class="vid">fx-03-paper-tooth</span></button><span class="at"><a href="../../index.html#techniques?a=form">form</a></span><p class="ah">Height = fbm at the tooth scale (octaves, persistence = how fast detail drops off), reshaped by the distribution curve; blended with low-frequency formation. Fibers: curved capsules at a count per 100 × 100 CSS px near the grain angle, raised into the height; pits: small depressions. Both also darken the albedo slightly. Normal from the height gradient → Lambert under the sheet light (azimuth + elevation from the light puck). Diffuse share vs ambient fill; the fill can be tinted. The same field is the stock for FX-01 and FX-02: its peaks take ink first, its valleys starve, its fibers wick. Mask = the sheet's cut or deckle edge; the sheet casts a contact + ambient shadow onto the page by the same light.</p></li></ul></div></details>
  <details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">Made with the effect set: Stipple ramp, Roller run-out, Typewriter strike, Paper tooth.</p><div class="fid" id="fid"></div></div></details>
