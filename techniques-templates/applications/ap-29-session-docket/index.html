  <span class="pager"><a href="../../applications/ap-28-respiration-rail/index.html" title="Previous: AP-28 Respiration rail · 13 of 21 breaths, stitched">← AP-28</a><a class="pos" href="../../index.html#applications"><span class="n">29</span>&nbsp;of 34</a><a href="../../applications/ap-30-what-i-d-be/index.html" title="Next: AP-30 What I'd Be · nine plates on one index card">AP-30 →</a></span> <p class="kicker"><span>AP-29</span><span>product concept</span></p><h1 class="title">Session docket · a conversation, typed</h1><p class="lede">A Mindgut session as a typed docket.</p><div class="body"><p>Each turn carries the product's left rule: --c147 blue for the person (.msg.user) and --c258 purple for Mir (.msg.assistant). The rule is struck through the colored half of the ribbon, one bar per line. Times, the turn count and the duration are typed from the session itself, and one slip is struck out with x's. The session is fictional and the text is invented.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>Typewriter strike</b><span>Each glyph is a separate strike: its own pressure, a slight offset and rotation, sometimes only half the face lands.</span></li><li><b>Paper tooth</b><span>White stock that is not a screen.</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>2</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="fx-07-typewriter"><span class="vn">Typewriter strike</span><span class="vid">fx-07-typewriter</span></button><span class="at"><a href="../../index.html#techniques?a=transfer">transfer</a><a href="../../index.html#techniques?a=deform">deform</a></span><p class="ah">Text in Courier Prime (a typewriter slab; bold below 15 px, as a light strike loses thin strokes), one strike per glyph on the main thread: pressure = ribbon life (exhausting along the page) × key variance; offset, rotation, an occasional dropped baseline; a half strike is a linear pressure ramp across the glyph, fading top or bottom. Ribbon: a plain weave at the ribbon count. Ink transfers through thread crossings, less through the gaps. Ink chain: pressure × ribbon vs stock-height percentile; ink squash pools film at the glyph edge. Impression: the strike dents the stock (blurred glyph × pressure); light from the combined height. Color: Beer–Lambert film.</p></li><li class="vr"><button type="button" data-t="fx-03-paper-tooth"><span class="vn">Paper tooth</span><span class="vid">fx-03-paper-tooth</span></button><span class="at"><a href="../../index.html#techniques?a=form">form</a></span><p class="ah">Height = fbm at the tooth scale (octaves, persistence = how fast detail drops off), reshaped by the distribution curve; blended with low-frequency formation. Fibers: curved capsules at a count per 100 × 100 CSS px near the grain angle, raised into the height; pits: small depressions. Both also darken the albedo slightly. Normal from the height gradient → Lambert under the sheet light (azimuth + elevation from the light puck). Diffuse share vs ambient fill; the fill can be tinted. The same field is the stock for FX-01 and FX-02: its peaks take ink first, its valleys starve, its fibers wick. Mask = the sheet's cut or deckle edge; the sheet casts a contact + ambient shadow onto the page by the same light.</p></li></ul></div></details>
  <details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">Made with the effect set: Typewriter strike, Paper tooth.</p><div class="fid" id="fid"></div></div></details>
