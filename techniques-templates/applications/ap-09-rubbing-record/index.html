<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#applications">Applications</a><span class="sep">/</span><b>Rubbing record · a cornerstone in graphite</b><span class="code">AP-09</span></span>
  <span class="pager"><a href="../../applications/ap-08-timetable/index.html" title="Previous: AP-08 Timetable · typed into a printed form">← AP-08</a><a class="pos" href="../../index.html#applications"><span class="n">9</span>&nbsp;of 34</a><a href="../../applications/ap-10-sun-herbarium/index.html" title="Next: AP-10 Sun herbarium · three specimens, one exposure">AP-10 →</a></span> <p class="kicker"><span>AP-09</span><span>print</span></p><h1 class="title">Rubbing record · a cornerstone in graphite</h1><p class="lede">A register sheet for a carved inscription, and the rubbing is on the sheet itself.</p><div class="body"><p>Bond paper was laid over the stone and a graphite block was dragged across it. The graphite caught only where the stone pushed the paper up, so the face prints gray with its grain, and the cut letters, the border groove and the shuttle emblem stay white. The record below is printed. The town, the hall and the stone are invented.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>Graphite</b><span>Pencil hatching laid in strokes with tapered pressure.</span></li><li><b>Roller run-out</b><span>A solid that runs out.</span></li><li><b>Paper tooth</b><span>White stock that is not a screen.</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>3</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="fx-05-graphite"><span class="vn">Graphite</span><span class="vid">fx-05-graphite</span></button><span class="at"><a href="../../index.html#techniques?a=deposit">deposit</a><a href="../../index.html#techniques?a=reflect">reflect</a></span><p class="ah">Hatch strokes along an angle at a spacing; extra layers cross at an offset angle and only print where the value field asks for more tone. Each stroke is a wobbling polyline with pressure tapering at both ends, rasterized as AA capsules (lead width). Ink chain: pressure vs stock-height percentile. The lead touches peaks first; valleys stay white. Graphite is an opaque OKLab mix, not a film. Sheen: normals from the stock relief plus the graphite deposit's own burnish texture; Blinn specular toward the sheet light, gated by how much graphite is there. Light last: diffuse × stock shading, + specular.</p></li><li class="vr"><button type="button" data-t="fx-02-ink-edge"><span class="vn">Roller run-out</span><span class="vid">fx-02-ink-edge</span></button><span class="at"><a href="../../index.html#techniques?a=deposit">deposit</a></span><p class="ah">Pressure = dropoff curve of the signed distance to a warped edge line (stroke direction, transition width), × the mask. Ink chain: the stock height under the inked area (blended with film-splitting noise, clumped and streaked along the stroke) is ranked to percentiles; pressure P inks exactly the top P of the surface, peaks first. Starve: valleys below the threshold never take ink. Wick: fibers carry ink past the edge. Mottle: paper formation thins the film. Film thickness thins with pressure unless the film breaks up; color = Beer–Lambert film in linear light. Light last: × the stock's shading. The ink sits in the tooth, not on top of it.</p></li><li class="vr"><button type="button" data-t="fx-03-paper-tooth"><span class="vn">Paper tooth</span><span class="vid">fx-03-paper-tooth</span></button><span class="at"><a href="../../index.html#techniques?a=form">form</a></span><p class="ah">Height = fbm at the tooth scale (octaves, persistence = how fast detail drops off), reshaped by the distribution curve; blended with low-frequency formation. Fibers: curved capsules at a count per 100 × 100 CSS px near the grain angle, raised into the height; pits: small depressions. Both also darken the albedo slightly. Normal from the height gradient → Lambert under the sheet light (azimuth + elevation from the light puck). Diffuse share vs ambient fill; the fill can be tinted. The same field is the stock for FX-01 and FX-02: its peaks take ink first, its valleys starve, its fibers wick. Mask = the sheet's cut or deckle edge; the sheet casts a contact + ambient shadow onto the page by the same light.</p></li></ul></div></details>
  <details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">Made with the effect set: Graphite, Roller run-out, Paper tooth.</p><div class="fid" id="fid"></div></div></details>
