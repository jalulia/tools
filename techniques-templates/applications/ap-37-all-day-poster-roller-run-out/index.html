<!-- <span class="crumb"><a href="../../../library/">Library</a><span class="sep">/</span><a href="../../../library/#/plates?kind3=example">Examples</a><span class="sep">/</span><b>All-day poster · roller run-out</b><span class="code">AP-37</span></span>
  <span class="pager"><a href="../../applications/ap-07-all-day-poster/index.html" title="Previous: AP-07 All-day poster · the ink runs out with the day">← AP-07</a><a class="pos" href="../../../library/#/plates?kind3=example"><span class="n">10</span>&nbsp;of 38</a><a href="../../applications/ap-38-all-day-poster-type-printed/index.html" title="Next: AP-38 All-day poster · type, printed">AP-38 →</a></span> <p class="kicker"><span>AP-37</span><span>print</span></p><h1 class="title">All-day poster · roller run-out</h1><p class="lede">The all-day poster's roller on its own: every dial changes the roll and nothing else.</p><div class="body"><p>A poster for a twelve-hour bill at an invented venue. One ember block is rolled once down the sheet and the roller is not re-inked, so each set's time is also how much ink was left. Paper sets where the speckle can land, Roller where and how fast the ink gives out, Transfer how the film breaks up, Ink the color. The press bar is the same roller at six fixed pressures. The type is printed at AP-38's defaults and does not move.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>Paper</b><span>the sheet the roller meets: tooth, fibers, formation.</span></li><li><b>Roller</b><span>where and how fast the ink gives out down the sheet, and how its ends meet the paper.</span></li><li><b>Transfer</b><span>how the film splits onto the paper's peaks.</span></li><li><b>Ink</b><span>one transparent film, set in OKLCH.</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>4</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="fx-03-paper-tooth"><span class="vn">Paper</span><span class="vid">fx-03-paper-tooth</span></button><span class="at"><a href="../../index.html#techniques?a=form">form</a></span><p class="ah">The board is FX-03 live: tooth height (gradient noise at the tooth scale, stretched along the grain), formation flocs, laid fibers and pits, under the one sheet light. The roller reads this height: as its ink gives out it inks only the top share of the surface, so the run-out speckle is the board itself.</p></li><li class="vr"><button type="button" data-t="fx-02-ink-edge"><span class="vn">Roller</span><span class="vid">fx-02-ink-edge</span></button><span class="at"><a href="../../index.html#techniques?a=deposit">deposit</a></span><p class="ah">Pressure along the stroke = the dropoff curve of the distance to a warped run-out line (half the ink gone at Runs out at, over Run-out length). Across the stroke it falls off over Roller ends at the roller's ends, its set-down and its lift, with the board's own wander; the ends carry a ridge of squeezed ink, thicker film that holds longer.</p></li><li class="vr"><button type="button" data-t="ink-transfer"><span class="vn">Transfer</span><span class="vid">ink-transfer</span></button><span class="at"><a href="../../index.html#techniques?a=deposit">deposit</a></span><p class="ah">The ink chain: the board's height (blended with film-splitting noise, clumped and streaked along the stroke) is ranked to percentiles, and pressure P inks exactly the top P of the surface, peaks first. Starve keeps the lowest share bare, fibers wick ink into the run-out, mottle thins the film over the formation.</p></li><li class="vr"><button type="button" data-t="ink-film"><span class="vn">Ink</span><span class="vid">ink-film</span></button><span class="at"><a href="../../index.html#techniques?a=deposit">deposit</a></span><p class="ah">One transparent ink, set in OKLCH and printed as a Beer–Lambert film in linear light: absorbance = acceptance × film thickness. Over white it reads as its color; over the black band it all but disappears.</p></li></ul></div></details>
  <details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">Split from AP-07 (All-day poster · the ink runs out with the day) into two instruments: this roller page and AP-38, which holds the type. Made with the effect set.</p><div class="fid" id="fid"></div></div></details>

        <button type="button" role="tab" id="tabParams" data-tab="params" aria-selected="true" aria-controls="mParams">Parameters</button>
        <button type="button" role="tab" id="tabColor" data-tab="color" aria-selected="false" aria-controls="mColor">Color</button>
        <button type="button" role="tab" id="tabPresets" data-tab="presets" aria-selected="false" aria-controls="mPresets">Presets</button>
        <button type="button" role="tab" id="tabMore" data-tab="more" aria-selected="false" aria-controls="mExport">Export</button>
      </div>
    </div>
    <section class="tabp" id="mParams" role="tabpanel" aria-labelledby="tabParams" data-tab="params">
      <div class="th"><p class="hint">Drag a slider or type a value. Arrow keys step; Shift ×10, Alt ×0.1.</p><button type="button" class="ghost warn" id="bParamReset" hidden>Reset all</button></div>
      <div class="pgroups" id="prail"></div>
    </section>
    <section class="tabp" id="mColor" role="tabpanel" aria-labelledby="tabColor" data-tab="color" hidden>
      <div class="th"><p class="hint" id="colorHint">Pick a palette. Click any ink to change it.</p><button type="button" class="ghost warn" id="bInkReset" hidden>Reset inks</button></div>
      <div class="pal" id="pal" role="radiogroup" aria-label="Palettes"></div>
      <div class="inks" id="inks"></div>
    </section>
    <section class="tabp" id="mPresets" role="tabpanel" aria-labelledby="tabPresets" data-tab="presets" hidden>
      <div id="ppres"></div>
      <div class="mypre" id="mypre"></div>
    </section>
    <section class="tabp" id="mExport" role="tabpanel" aria-labelledby="tabMore" data-tab="more" hidden>
      <div class="row3"><button type="button" class="btn" id="bPng" title="Save the plate as it is drawn now">Save PNG</button><button type="button" class="btn" id="bCopy" title="Copy the spec as JSON">Copy spec</button><button type="button" class="btn" id="bSpec" title="Open the spec (S)">Open spec</button></div>
      <p class="hint">The spec holds every measured number, its range and the module that draws it.</p>
      <div id="mNote">
        <button type="button" class="disc" id="bPoints" aria-expanded="false" aria-controls="pts"><span>Point list</span><b id="ctr">0 / 10</b><svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 3.8L5 6.3l2.5-2.5"/></svg></button>
        <div class="pts" id="pts" hidden>
          <div class="rows" id="rows"></div>
          <div class="read" id="read"><span id="readtxt">Hover or select a point.</span><code id="readcode"></code></div>
        </div>
      </div>
      <div id="mView"><p class="hint" id="viewHint">The rebuild, drawn in code.</p></div>
      <div id="mMotion" hidden><span id="motionState">Still</span><div id="motionRow"></div><p id="motionHint"></p></div>
    </section>
  </aside>
</main>
