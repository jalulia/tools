  <span class="pager"><a href="../../applications/ap-27-coherence-reading/index.html" title="Previous: AP-27 Coherence reading · the field resolving in stipple">← AP-27</a><a class="pos" href="../../index.html#applications"><span class="n">28</span>&nbsp;of 34</a><a href="../../applications/ap-29-session-docket/index.html" title="Next: AP-29 Session docket · a conversation, typed">AP-29 →</a></span> <p class="kicker"><span>AP-28</span><span>product concept</span></p><h1 class="title">Respiration rail · 13 of 21 breaths, stitched</h1><p class="lede">The RESPIRATION reading stood on end and sewn into white shirting: 21 breath cells, breath 1 at the bottom.</p><div class="body"><p>The 13 taken are satin-filled in --c258, the color the product gives a lit respiration cell. The 8 still to come are not stitched at all. They are the transfer pattern, a dashed gray outline printed on the cloth before work begins: the part not yet worked. The rail renews at 21. The count is a placeholder, and the labels keep the product's 7 px caps grammar, scaled up to read.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>Satin embroidery</b><span>A satin fill: long thread floats laid side by side across the motif at one angle, each a slightly rounded body whose filaments gleam along their length, so the fill lights up or goes dark as the sheet light turns.</span></li><li><b>Roller run-out</b><span>A solid that runs out.</span></li><li><b>Weave</b><span>Cloth built as cloth: warp and weft at their own counts, a real interlacing, slubbed and hairy threads, every float a raised body lit by the sheet light and casting into the gaps.</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>3</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="fx-10-embroidery"><span class="vn">Satin embroidery</span><span class="vid">fx-10-embroidery</span></button><span class="at"><a href="../../index.html#techniques?a=stitch">stitch</a><a href="../../index.html#techniques?a=deform">deform</a><a href="../../index.html#techniques?a=reflect">reflect</a></span><p class="ah">Motif → exact signed distance. Satin: centerlines across the motif at the stitch angle, one per 100 / stitch count px; each centerline is marched against the motif to find where the needle goes in and out (concave motifs give several floats per row). Ends stagger (alternating needle points + jitter); floats longer than the max split into rows at brick-staggered points. Each float: a capsule whose cross-section is rounded (flatter when long), sinking into its needle hole at both ends, with an S-twist ridge along it. Floats are z-buffered by height (neighbors overlap like real satin); an optional split, running or chain stitch is traced along the motif edge (marching-squares contour, real arc length) and laid on top. Cloth (FX-04 live): pucker ridges run along the pull direction at the stitch ends, decaying away from the edge; a crease dimples just outside the satin; needle holes darken it. Its own lighting is kept and multiplied by the pucker's Lambert. Thread light: Lambert on the thread normals + an anisotropic gleam (Kajiya–Kay along the twisted filament direction × a lobe across the cylinder), from the sheet light; a height-field shadow and cavity occlusion from the stitched relief fall onto the cloth and between floats. Color: OKLCH.</p></li><li class="vr"><button type="button" data-t="fx-02-ink-edge"><span class="vn">Roller run-out</span><span class="vid">fx-02-ink-edge</span></button><span class="at"><a href="../../index.html#techniques?a=deposit">deposit</a></span><p class="ah">Pressure = dropoff curve of the signed distance to a warped edge line (stroke direction, transition width), × the mask. Ink chain: the stock height under the inked area (blended with film-splitting noise, clumped and streaked along the stroke) is ranked to percentiles; pressure P inks exactly the top P of the surface, peaks first. Starve: valleys below the threshold never take ink. Wick: fibers carry ink past the edge. Mottle: paper formation thins the film. Film thickness thins with pressure unless the film breaks up; color = Beer–Lambert film in linear light. Light last: × the stock's shading. The ink sits in the tooth, not on top of it.</p></li><li class="vr"><button type="button" data-t="fx-04-weave"><span class="vn">Weave</span><span class="vid">fx-04-weave</span></button><span class="at"><a href="../../index.html#techniques?a=form">form</a></span><p class="ah">Warp columns and weft rows at their own counts (threads / 100 CSS px); each thread: jittered center, thickness, dye-lot L, fray length, accent. Interlacing decides the top thread per crossing; a float is the run where it stays on top. Height = cylinder across the thread × arch along the float; under-threads sit low; hair = fine noise along the thread. Albedo in OKLab: under-thread, then top thread by AA coverage; accent as flecks (single floats, as in the source) or whole threads. Light: Lambert from the height gradient + a height-field shadow march toward the sheet light, so floats shade into the gaps; ambient occlusion darkens the gaps. Cut: the mask's signed distance plus each thread's own fray length, so threads end raggedly, not on a line. The swatch casts onto the page.</p></li></ul></div></details>
  <details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">Made with the effect set: Satin embroidery, Roller run-out, Weave.</p><div class="fid" id="fid"></div></div></details>
