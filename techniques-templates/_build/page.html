<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="description" content="{{DESCRIPTION}}">
<link rel="icon" href="data:,">
<title>{{CODE}} — {{TITLE}} · Techniques &amp; Templates · ø co.</title>
<link rel="stylesheet" href="../../_shared/fonts.css">
<link rel="stylesheet" href="../../_shared/shell.css">
<link rel="alternate" type="application/json" href="spec.json" title="technique spec, machine-readable">
</head>
<body class="plate-page" data-root="../../">
<!-- {{NAV}} {{NOTES}} {{SPEC}} are BAKED here by `node _build/build.mjs` from study.js — a static read for readers that
     cannot run scripts. shell.js redraws all of it on load. Edit study.js or _build/, never the generated index.html. -->
<nav class="nav" id="nav" aria-label="Site navigation">{{NAV}}</nav>
<main class="plate">
  <section class="notes" id="copy">{{NOTES}}</section>
  <section class="figure" id="stage">
    <div class="cvwrap"><canvas id="cv" aria-label="technique study, read"><img src="thumb.png" alt="{{CODE}} rebuild, still frame" loading="lazy"></canvas></div>
    <div class="live" id="live"></div>
    <div class="log" id="log">
      <div class="ctl">
        <button id="bRead" type="button" class="on" title="toggle the read overlay">Read</button>
        <button id="bReplay" type="button" title="re-run the read (space)">↻ Replay</button>
        <button id="bMode" type="button" title="cycle rebuild / reference / split (R)">Rebuild</button>
        <button id="bMotion" type="button" hidden title="run the motion version (M)">Motion</button>
        <button id="bLive" type="button" hidden title="open the live DOM version (L)">Live</button>
        <button id="bSpec" type="button" title="open the machine-readable spec (S)">Spec ⇥</button>
      </div>
      <div class="vtabs" id="vtabs"></div>
      <div class="prail" id="prail" hidden></div>
      <div class="lbody">
        <div class="lh"><span>Track log</span><span id="ctr">0 / 10</span></div>
        <div class="rows" id="rows"></div>
        <div class="read" id="read"><b>Read</b><span id="readtxt">Hover or select a point.</span><code id="readcode"></code></div>
        <div class="fid" id="fid"></div>
      </div>
    </div>
    <div class="rel" id="rel"></div>
  </section>
</main>
<aside class="spec" id="spec" aria-hidden="true">
  <div class="sh"><span>Technique spec · <b id="specid"></b> · JSON</span><span><button id="speccopy" type="button">Copy</button><button id="specclose" type="button">Close ×</button></span></div>
  <pre id="specpre">{{SPEC}}</pre>
</aside>
<script src="../../_shared/entries.js"></script>
<script src="../../_shared/vocab.js"></script>
<script src="../../_shared/art.js"></script>
<script src="ref.js"></script>
<script src="study.js"></script>
<script src="../../_shared/shell.js"></script>
</body>
</html>
