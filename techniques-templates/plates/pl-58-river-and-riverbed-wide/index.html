  <span class="pager"><a href="../../plates/pl-57-layer-stack-isometric/index.html" title="Previous: PL-57 Layer stack, isometric">← PL-57</a><a class="pos" href="../../index.html#plates"><span class="n">58</span>&nbsp;of 159</a><a href="../../plates/pl-59-the-silicon-4/index.html" title="Next: PL-59 The Silicon · 4">PL-59 →</a></span> <p class="kicker"><span>PL-58</span><span>pixel sprite</span></p><h1 class="title">River and riverbed, wide</h1><p class="lede">A river crossing a park, painted in grain, with the record lying on its bed.</p><div class="body"><p>Ground and water laid in as grain: every pixel takes one color from a short ramp, chosen by a light field, a brush streak and chance; hand strokes for grass and current go over it, and the record lies on the bed as two kinds of glow.</p><p>The river runs here from the page’s own code, with its dials. The grain is laid at the screen’s pixel, so it stays fine however large the plate is drawn; width, meander, light, speckle, bank fray, flowers, the riverbed glow, grass, current and the bank line redraw the scene, and Play runs its clock.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>ground</b><span>plate</span></li><li><b>fields</b><span>light, water, record, trees, flowers, drawn small and read back soft</span></li><li><b>grain</b><span>one color per screen pixel</span></li><li><b>hand</b><span>grass, current, bank line, reeds, stones</span></li><li><b>life</b><span>the clock: water, koi, canoe, people, birds</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>6</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="pixel-river"><span class="vn">Painted grain</span><span class="vid">pixel-river</span></button><span class="at"><a href="../../index.html#techniques?a=grain">grain</a><a href="../../index.html#techniques?a=ramp">ramp</a></span><p class="ah">Ground and water are laid in as grain: every pixel takes one color from a short ramp, chosen by a field of light, a streak of brushwork and chance, so light blooms and falls off in speckle and nothing has a hard edge. The record lies on the bed as two kinds of glow.</p></li><li class="vr"><button type="button" data-t="river-form"><span class="vn">River</span><span class="vid">river-form</span></button><span class="at"><a href="../../index.html#techniques?a=field">field</a></span><p class="ah">One centerline with a slowly varying width; banks wander about it by noise; three islands part the current; a light field of broad sweeps, a worn path and a sun on the water.</p></li><li class="vr"><button type="button" data-t="river-hand"><span class="vn">Hand marks</span><span class="vid">river-hand</span></button><span class="at"><a href="../../index.html#techniques?a=stroke">stroke</a></span><p class="ah">Tapered strokes of a loaded brush over the grain: grass on land, current in the water, a dark line at the bank that thickens, thins and breaks.</p></li><li class="vr"><button type="button" data-t="river-time"><span class="vn">Time</span><span class="vid">river-time</span></button><span class="at"><a href="../../index.html#techniques?a=motion">motion</a></span><p class="ah">Everything that moves reads one clock: glints and koi ride the current, the canoe passes from one model’s reach to the next, people and robots walk the banks.</p></li><li class="vr"><button type="button" data-t="ink-palette"><span class="vn">Measured inks</span><span class="vid">ink-palette</span></button><span class="at"><a href="../../index.html#techniques?a=palette">palette</a></span><p class="ah">solid ink pixels of each figure, read at full resolution, are clustered to five colors; a color is kept when it holds at least 4% of the ink.</p></li><li class="vr"><button type="button" data-t="figure-ground"><span class="vn">Figure and ground</span><span class="vid">figure-ground</span></button><span class="at"><a href="../../index.html#techniques?a=ground">ground</a><a href="../../index.html#techniques?a=coverage">coverage</a></span><p class="ah">The ground is the most common border color of a figure; ink is every pixel more than 40 levels from it.</p></li></ul></div></details>
