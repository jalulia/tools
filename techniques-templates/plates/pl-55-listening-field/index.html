  <span class="pager"><a href="../../plates/pl-54-text-spiral/index.html" title="Previous: PL-54 Text spiral">← PL-54</a><a class="pos" href="../../../library/#/plates?kind3=example"><span class="n">55</span>&nbsp;of 158</a><a href="../../plates/pl-56-one-point-illusion/index.html" title="Next: PL-56 One-point illusion">PL-56 →</a></span> <p class="kicker"><span>PL-55</span><span>type</span></p><h1 class="title">Listening field</h1><p class="lede">Characters are placed as a field: a spiral of letters, an ellipse of marks.</p><div class="body"><p>Characters are placed as a field: a spiral of letters, an ellipse of marks.</p><p>The field is drawn here from the page’s own code, ported: a square-dot lattice kept or dropped by a fixed hash against a wave. The switch is Mir’s state; the dials are the page’s own numbers: lattice pitch, dot size, wave number and coverage. Play moves the wave.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>ground</b></li><li><b>lattice</b><span>one point every pitch</span></li><li><b>wave</b><span>the state’s field at each point</span></li><li><b>threshold</b><span>keep where hash &lt; (wave + 1) · coverage</span></li><li><b>type</b><span>the page’s kicker and the state’s name</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>3</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="character-field"><span class="vn">Presence field</span><span class="vid">character-field</span></button><span class="at"><a href="../../index.html#techniques?a=dot%20lattice">dot lattice</a><a href="../../index.html#techniques?a=threshold">threshold</a><a href="../../index.html#techniques?a=wave">wave</a></span><p class="ah">A square-dot lattice thresholded by a fixed hash against a wave: dot printed where hash(x, y) &lt; (wave(x, y, t) + 1) · coverage. The wave is the state: sin(35·r) from the center; sin(20·(x + y)) · cos(20·r); or sin(12·x)·sin(6·y)·0.35.</p></li><li class="vr"><button type="button" data-t="ink-palette"><span class="vn">Measured inks</span><span class="vid">ink-palette</span></button><span class="at"><a href="../../index.html#techniques?a=palette">palette</a></span><p class="ah">solid ink pixels of each figure, read at full resolution, are clustered to five colors; a color is kept when it holds at least 4% of the ink.</p></li><li class="vr"><button type="button" data-t="figure-ground"><span class="vn">Figure and ground</span><span class="vid">figure-ground</span></button><span class="at"><a href="../../index.html#techniques?a=ground">ground</a><a href="../../index.html#techniques?a=coverage">coverage</a></span><p class="ah">The ground is the most common border color of a figure; ink is every pixel more than 40 levels from it.</p></li></ul></div></details>
