  <span class="pager"><a href="../../plates/pl-93-cathode-rayreceivers-3/index.html" title="Previous: PL-93 Cathode-ray receivers · 3">← PL-93</a><a class="pos" href="../../../library/#/plates?kind3=example"><span class="n">93</span>&nbsp;of 158</a><a href="../../plates/pl-95-cathode-rayreceivers-6/index.html" title="Next: PL-95 Cathode-ray receivers · 6">PL-95 →</a></span> <p class="kicker"><span>PL-94</span><span>line</span></p><h1 class="title">Cathode-ray receivers · 5</h1><p class="lede">05 CUBE, 1986: a kitchen set with a big tuner and a whip, in one line.</p><div class="body"><p>05 CUBE, 1986, from the sheet Cathode-Ray Receivers (TD·2608, rev B): a kitchen set with a big tuner dial, two knobs and a telescopic antenna, drawn front-on in one ink at two weights, with no fill.</p><p>The set is drawn here by code from the sheet’s own numbers, so the designer’s decisions are its controls: the cabinet’s corner and proportion, its antenna, the tube’s bulge and glass lines, which controls and grille it carries, and the line. At the defaults it is the sheet’s drawing, scaled to fill the plate.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>ground</b><span>the plate’s paper</span></li><li><b>cabinet</b><span>outline, rails, handle, feet, antenna</span></li><li><b>tube</b><span>mask, bowed face, glass lines, raster</span></li><li><b>controls</b><span>dials, knobs, buttons, grille</span></li><li><b>line</b><span>one ink at two weights, ruled or by hand</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>7</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="product-line"><span class="vn">Product line drawing</span><span class="vid">product-line</span></button><span class="at"><a href="../../index.html#techniques?a=line">line</a><a href="../../index.html#techniques?a=elevation">elevation</a><a href="../../index.html#techniques?a=parametric">parametric</a></span><p class="ah">A television drawn front-on in one ink at two weights, main 1.5 px and fine 1 px, with no fill; secondary lines are the same ink at lower opacity. Drawn here by code from the sheet’s own numbers.</p></li><li class="vr"><button type="button" data-t="crt-cabinet"><span class="vn">Cabinet</span><span class="vid">crt-cabinet</span></button><span class="at"><a href="../../index.html#techniques?a=rounded-rectangle">rounded-rectangle</a><a href="../../index.html#techniques?a=proportion">proportion</a></span><p class="ah">A rounded rectangle with quadratic corners in the main line; rails, handle, feet and antenna are laid from its edges, so they keep their places as the corner and the width change. The mask and tube corners follow the cabinet’s, concentric, once it outgrows them; the sheet’s is 14 px on a 330 px cabinet (4.2%). Proportion: the tube and its mask take the change in width; the column of controls keeps its width at the right. Antenna: Whip is the sheet’s, a telescopic mast solid where it leaves the set with a phantom extension above; Rabbit ears are two masts from a dome; None leaves the top bare.</p></li><li class="vr"><button type="button" data-t="crt-screen"><span class="vn">Tube</span><span class="vid">crt-screen</span></button><span class="at"><a href="../../index.html#techniques?a=pillow">pillow</a><a href="../../index.html#techniques?a=bow">bow</a><a href="../../index.html#techniques?a=hairline">hairline</a></span><p class="ah">The mask is a rounded rectangle in fine line; the face is four quadratic edges bowed out by the bulge, with rounded corners. Glass lines sit at the sheet’s fractions of the half-height (0.965, 0.885, 0.77), extended by the same power law (1 − 0.035·k^1.715), each inset to clear the corner.</p></li><li class="vr"><button type="button" data-t="crt-controls"><span class="vn">Controls</span><span class="vid">crt-controls</span></button><span class="at"><a href="../../index.html#techniques?a=dial">dial</a><a href="../../index.html#techniques?a=knob">knob</a><a href="../../index.html#techniques?a=button">button</a><a href="../../index.html#techniques?a=grille">grille</a></span><p class="ah">Control sets, in the column beside the tube. Dials: a big tuner dial over two knobs, the sheet’s. Knobs: three pointer knobs. Buttons: five push buttons, as on the POCKET. Dials are a main-line circle with a cap at 0.32 of the radius and twelve ticks; knobs a fine circle with a pointer from 0.35 of the radius; buttons small rounded rectangles; grilles fine slots at 0.6 or a checkerboard of dots.</p></li><li class="vr"><button type="button" data-t="crt-line"><span class="vn">Line</span><span class="vid">crt-line</span></button><span class="at"><a href="../../index.html#techniques?a=line-weight">line-weight</a><a href="../../index.html#techniques?a=hand">hand</a></span><p class="ah">Every part is flattened to a polyline, then stroked in one ink with round caps and joins. Hand moves every point of the drawing through one smooth seeded field (two octaves, 70 and 22 px), so lines bow as if drawn freehand while joints stay joined and small circles stay round.</p></li><li class="vr"><button type="button" data-t="ink-palette"><span class="vn">Measured inks</span><span class="vid">ink-palette</span></button><span class="at"><a href="../../index.html#techniques?a=palette">palette</a></span><p class="ah">solid ink pixels of each figure, read at full resolution, are clustered to five colors; a color is kept when it holds at least 4% of the ink.</p></li><li class="vr"><button type="button" data-t="figure-ground"><span class="vn">Figure and ground</span><span class="vid">figure-ground</span></button><span class="at"><a href="../../index.html#techniques?a=ground">ground</a><a href="../../index.html#techniques?a=coverage">coverage</a></span><p class="ah">The ground is the most common border color of a figure; ink is every pixel more than 40 levels from it.</p></li></ul></div></details>

    <div class="ptop">
      <div class="tbar" role="toolbar" aria-label="Plate">
        <button type="button" class="tb" id="bMotion" aria-pressed="false" title="Play or pause the motion (M)"><svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z"/></svg><svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3h2.6v10H4zM9.4 3H12v10H9.4z"/></svg><span>Play</span></button>
        <button type="button" class="tb" id="bLive" aria-pressed="false" title="Drag on the plate (L)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 2.2l9.4 5-4.1 1.3 2.4 4.5-1.6.9-2.4-4.5-3.1 2.9z"/></svg><span id="liveLabel">Drag</span></button>
        <label class="tb" id="noteTog" title="Numbered points where each technique was measured"><input type="checkbox" id="tNote"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="5" height="5"/><path d="M7.5 5h3.5M11 5v6.5"/><rect x="9" y="11" width="4" height="3" fill="currentColor" stroke="none"/></svg><span>Callouts</span></label>
        <label class="tb" id="cmpTog" title="Reference beside the rebuild (R)"><input type="checkbox" id="tCompare"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10"/><path d="M8 1.5v13"/></svg><span>Compare</span></label>
        <button type="button" class="tb" id="bWide" aria-pressed="false" title="Show the notes (F)"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10"/><path d="M6 3v10M3.5 6h1M3.5 8h1M3.5 10h1"/></svg><span>Notes</span></button>
      </div>
      <div class="readout" id="readout" aria-live="off"></div>
      <div class="ptabs" role="tablist" aria-label="Controls">
        <button type="button" role="tab" id="tabParams" data-tab="params" aria-selected="true" aria-controls="mParams">Parameters</button>
        <button type="button" role="tab" id="tabColor" data-tab="color" aria-selected="false" aria-controls="mColor">Color</button>
        <button type="button" role="tab" id="tabPresets" data-tab="presets" aria-selected="false" aria-controls="mPresets">Presets</button>
        <button type="button" role="tab" id="tabMore" data-tab="more" aria-selected="false" aria-controls="mExport">Export</button>
      </div>
    </div>
    <section class="tabp" id="mParams" role="tabpanel" aria-labelledby="tabParams" data-tab="params">
      <div class="th"><p class="hint">Drag a slider or type a value. Arrow keys step; Shift ×10, Alt ×0.1.</p><button type="button" class="ghost warn" id="bParamReset" hidden>Reset all</button></div>
      <div class="pgroups" id="prail"></div>
    </section>
    <section class="tabp" id="mColor" role="tabpanel" aria-labelledby="tabColor" data-tab="color" hidden>
      <div class="th"><p class="hint" id="colorHint">Pick a palette. Click any ink to change it.</p><button type="button" class="ghost warn" id="bInkReset" hidden>Reset inks</button></div>
      <div class="pal" id="pal" role="radiogroup" aria-label="Palettes"></div>
      <div class="inks" id="inks"></div>
    </section>
    <section class="tabp" id="mPresets" role="tabpanel" aria-labelledby="tabPresets" data-tab="presets" hidden>
      <div id="ppres"></div>
      <div class="mypre" id="mypre"></div>
    </section>
    <section class="tabp" id="mExport" role="tabpanel" aria-labelledby="tabMore" data-tab="more" hidden>
      <div class="row3"><button type="button" class="btn" id="bPng" title="Save the plate as it is drawn now">Save PNG</button><button type="button" class="btn" id="bCopy" title="Copy the spec as JSON">Copy spec</button><button type="button" class="btn" id="bSpec" title="Open the spec (S)">Open spec</button></div>
      <p class="hint">The spec holds every measured number, its range and the module that draws it.</p>
      <div id="mNote">
        <button type="button" class="disc" id="bPoints" aria-expanded="false" aria-controls="pts"><span>Point list</span><b id="ctr">0 / 10</b><svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 3.8L5 6.3l2.5-2.5"/></svg></button>
        <div class="pts" id="pts" hidden>
          <div class="rows" id="rows"></div>
          <div class="read" id="read"><span id="readtxt">Hover or select a point.</span><code id="readcode"></code></div>
        </div>
      </div>
      <div id="mView"><p class="hint" id="viewHint">The rebuild, drawn in code.</p></div>
      <div id="mMotion" hidden><span id="motionState">Still</span><div id="motionRow"></div><p id="motionHint"></p></div>
    </section>
  </aside>
</main>
<aside class="spec" id="spec" aria-hidden="true" aria-label="Technique spec">
  <div class="sh"><span>Spec · <b id="specid"></b> · JSON</span><span><button id="speccopy" type="button">Copy</button><button id="specclose" type="button">Close ×</button></span></div>
  <pre id="specpre">{{SPEC}}</pre>
</aside>
