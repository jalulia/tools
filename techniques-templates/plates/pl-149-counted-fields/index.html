  <span class="pager"><a href="../../plates/pl-148-weighedfrom-the-concept-end-a-new-drawing-in/index.html" title="Previous: PL-148 Weighedfrom the concept end · a new drawing in the measured grammar">← PL-148</a><a class="pos" href="../../index.html#plates"><span class="n">149</span>&nbsp;of 159</a><a href="../../plates/pl-150-a-strand-in-stipple-two-inks/index.html" title="Next: PL-150 A strand in stipple, two inks">PL-150 →</a></span> <p class="kicker"><span>PL-149</span><span>screen tone</span></p><h1 class="title">Counted fields</h1><p class="lede">Tone set as a count of single dots, in a dark green and a teal on white.</p><div class="body"><p>Tone is printed as a count of one-pixel dots per cell, so density carries the value and nothing is blended; two screens multiplied make the rings.</p><p>The four figures are drawn here by the counted screen of Mindgut Direction 01, with its dials. Cell and dot are held in screen pixels, so the plate prints finer as it grows, and every dial redraws the figures: curve, split, floor and top for the ramps; both pitches, gain, reach and the purple peak for the rings; tone and inset for the letters.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>ground</b><span>plate</span></li><li><b>counted screen</b><span>cells at screen size</span></li><li><b>ramps</b><span>rings · counted letters, one density field each</span></li><li><b>read</b><span>points measured from the filed figures</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>7</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="counted-stipple"><span class="vn">Counted screen</span><span class="vid">counted-stipple</span></button><span class="at"><a href="../../index.html#techniques?a=screen-tone">screen-tone</a><a href="../../index.html#techniques?a=stipple">stipple</a></span><p class="ah">Each cell of a jittered grid prints up to N dots at hashed positions and keeps the last one with probability equal to the remainder, so density is carried by the count of marks and nothing is blended.</p></li><li class="vr"><button type="button" data-t="stipple-ramp"><span class="vn">Stipple ramps</span><span class="vid">stipple-ramp</span></button><span class="at"><a href="../../index.html#techniques?a=ramp">ramp</a></span><p class="ah">density = floor + (top - floor) · (x / W)^curve, screened by the counted screen; the split ramp prints the top in dark green and the bottom in teal.</p></li><li class="vr"><button type="button" data-t="ring-interference"><span class="vn">Ring interference</span><span class="vid">ring-interference</span></button><span class="at"><a href="../../index.html#techniques?a=interference">interference</a></span><p class="ah">Two ring screens A = ½ + ½cos(2π dA / pA) and B likewise; their product, under a gaussian falloff, is the density; the cell takes dark green where A leads and teal where B does.</p></li><li class="vr"><button type="button" data-t="counted-cells"><span class="vn">Counted letters</span><span class="vid">counted-cells</span></button><span class="at"><a href="../../index.html#techniques?a=count">count</a></span><p class="ah">The words are spelled one letter per cell; each letter maps to a digit 1 to 9 and the cell prints that count as its tone, in the ink of its channel.</p></li><li class="vr"><button type="button" data-t="ink-palette"><span class="vn">Measured inks</span><span class="vid">ink-palette</span></button><span class="at"><a href="../../index.html#techniques?a=palette">palette</a></span><p class="ah">solid ink pixels of each figure, read at full resolution, are clustered to five colors; a color is kept when it holds at least 4% of the ink.</p></li><li class="vr"><button type="button" data-t="figure-ground"><span class="vn">Figure and ground</span><span class="vid">figure-ground</span></button><span class="at"><a href="../../index.html#techniques?a=ground">ground</a><a href="../../index.html#techniques?a=coverage">coverage</a></span><p class="ah">The ground is the most common border color of a figure; ink is every pixel more than 40 levels from it.</p></li><li class="vr"><button type="button" data-t="plate-layout"><span class="vn">Justified plate</span><span class="vid">plate-layout</span></button><span class="at"><a href="../../index.html#techniques?a=grid">grid</a></span><p class="ah">Figures keep their proportions and share a row height; each row fills the plate width. Every split of the figures into rows is tried, and the one whose row heights sit closest to the target wins.</p></li></ul></div></details>

        <button type="button" role="tab" id="tabParams" data-tab="params" aria-selected="true" aria-controls="mParams">Parameters</button>
        <button type="button" role="tab" id="tabColor" data-tab="color" aria-selected="false" aria-controls="mColor">Color</button>
        <button type="button" role="tab" id="tabPresets" data-tab="presets" aria-selected="false" aria-controls="mPresets">Presets</button>
        <button type="button" role="tab" id="tabMore" data-tab="more" aria-selected="false" aria-controls="mExport">Export</button>
      </div>
    </div>
    <section class="tabp" id="mParams" role="tabpanel" aria-labelledby="tabParams" data-tab="params">
      <div class="th"><p class="hint">Drag a slider or type a value. Arrow keys step; Shift ×10, Alt ×0.1.</p><button type="button" class="ghost warn" id="bParamReset" hidden>Reset all</button></div>
      <div class="pgroups" id="prail"></div>
    </section>
    <section class="tabp" id="mColor" role="tabpanel" aria-labelledby="tabColor" data-tab="color" hidden>
      <div class="th"><p class="hint" id="colorHint">Pick a palette. Click any ink to change it.</p><button type="button" class="ghost warn" id="bInkReset" hidden>Reset inks</button></div>
      <div class="pal" id="pal" role="radiogroup" aria-label="Palettes"></div>
      <div class="inks" id="inks"></div>
    </section>
    <section class="tabp" id="mPresets" role="tabpanel" aria-labelledby="tabPresets" data-tab="presets" hidden>
      <div id="ppres"></div>
      <div class="mypre" id="mypre"></div>
    </section>
    <section class="tabp" id="mExport" role="tabpanel" aria-labelledby="tabMore" data-tab="more" hidden>
      <div class="row3"><button type="button" class="btn" id="bPng" title="Save the plate as it is drawn now">Save PNG</button><button type="button" class="btn" id="bCopy" title="Copy the spec as JSON">Copy spec</button><button type="button" class="btn" id="bSpec" title="Open the spec (S)">Open spec</button></div>
      <p class="hint">The spec holds every measured number, its range and the module that draws it.</p>
      <div id="mNote">
        <button type="button" class="disc" id="bPoints" aria-expanded="false" aria-controls="pts"><span>Point list</span><b id="ctr">0 / 10</b><svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 3.8L5 6.3l2.5-2.5"/></svg></button>
        <div class="pts" id="pts" hidden>
          <div class="rows" id="rows"></div>
          <div class="read" id="read"><span id="readtxt">Hover or select a point.</span><code id="readcode"></code></div>
        </div>
      </div>
      <div id="mView"><p class="hint" id="viewHint">The rebuild, drawn in code.</p></div>
      <div id="mMotion" hidden><span id="motionState">Still</span><div id="motionRow"></div><p id="motionHint"></p></div>
    </section>
  </aside>
</main>

  <div class="sh"><span>Spec · <b id="specid"></b> · JSON</span><span><button id="speccopy" type="button">Copy</button><button id="specclose" type="button">Close ×</button></span></div>
  <pre id="specpre">{{SPEC}}</pre>
