<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Riso three-plate separation</b><span class="code">TS-06</span></span>
  <span class="pager"><a href="../../techniques/ts-03-iridescent-chrome/index.html" title="Previous: TS-03 Iridescent chrome on black">← TS-03</a><a class="pos" href="../../index.html#techniques"><span class="n">4</span>&nbsp;of 15</a><a href="../../techniques/ts-09-grain-gradient-layers/index.html" title="Next: TS-09 Grain gradient layers">TS-09 →</a></span> <p class="kicker"><span>TS-06</span><span>print physics</span></p><h1 class="title">Riso three-plate separation</h1><p class="lede">One isometric drawing printed as three riso plates, each off register by a few pixels.</p><div class="body"><p>Yellow takes the tops, blue the right faces, pink the left faces and a marbled fill; the keyline prints on all three. The inks multiply, so the keyline reads near black and pink over yellow reads orange. Each plate has its own register error, grain seed and edge thinning, on light gray stock with a printed isometric grid.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>stock</b><span>gray fill + iso grid</span></li><li><b>labels</b><span>top / right / left per object, back to front</span></li><li><b>coverage</b><span>three rasters from labels, marble cut into pink, wash and strokes into yellow</span></li><li><b>grain</b><span>edge thinning, mottle, mono noise per plate</span></li><li><b>plates</b><span>multiply in order yellow, blue, pink, each translated by its register error</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>6</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="iso-extrude"><span class="vn">Isometric extrusion by outline drop</span><span class="vid">iso-extrude</span></button><span class="at"><a href="../../index.html#techniques?a=isometric">isometric</a><a href="../../index.html#techniques?a=extrude">extrude</a><a href="../../index.html#techniques?a=painter-order">painter-order</a><a class="mod" href="lib/iso-extrude.js">lib/iso-extrude.js</a></span><p class="ah">Each object is a top-face mask drawn in the plane transform; a column scan drops every boundary pixel whose +x or +y probe is empty by the depth, labeling right or left face, top always winning; later objects overwrite earlier ones.</p></li><li class="vr"><button type="button" data-t="plate-separation"><span class="vn">Three-plate coverage split</span><span class="vid">plate-separation</span></button><span class="at"><a href="../../index.html#techniques?a=separation">separation</a><a href="../../index.html#techniques?a=multiply">multiply</a><a href="../../index.html#techniques?a=coverage">coverage</a><a class="mod" href="lib/plate-separation.js">lib/plate-separation.js</a></span><p class="ah">Face labels become three coverage rasters; each raster is colored mix(white, ink, coverage) on its own canvas and multiplied onto the stock in plate order.</p></li><li class="vr"><button type="button" data-t="misregister"><span class="vn">Per-plate register error</span><span class="vid">misregister</span></button><span class="at"><a href="../../index.html#techniques?a=translate">translate</a><a href="../../index.html#techniques?a=offset">offset</a><a class="mod" href="lib/misregister.js">lib/misregister.js</a></span><p class="ah">Each plate canvas is drawn translated by its own vector; the keyline sits on all three plates, so the offsets show as colored fringes on every edge and the overprint of all three is the near-black line.</p></li><li class="vr"><button type="button" data-t="ink-grain"><span class="vn">Per-plate ink grain</span><span class="vid">ink-grain</span></button><span class="at"><a href="../../index.html#techniques?a=grain">grain</a><a href="../../index.html#techniques?a=mottle">mottle</a><a href="../../index.html#techniques?a=edge-thinning">edge-thinning</a><a class="mod" href="lib/ink-grain.js">lib/ink-grain.js</a></span><p class="ah">Before coloring, coverage is multiplied by a blurred copy of itself so fills thin toward their edges, and by a slow perlin mottle; after coloring ART.grain runs mono on the plate and paper pixels are reset to white.</p></li><li class="vr"><button type="button" data-t="marbled-fill"><span class="vn">Marbled fill from fbm bands</span><span class="vid">marbled-fill</span></button><span class="at"><a href="../../index.html#techniques?a=fbm">fbm</a><a href="../../index.html#techniques?a=threshold">threshold</a><a href="../../index.html#techniques?a=band">band</a><a class="mod" href="lib/marbled-fill.js">lib/marbled-fill.js</a></span><p class="ah">Inside the top faces the pink plate is full except where an fbm field crosses zero: the core of the band is paper, the rim half-coverage, which reads as swirls.</p></li><li class="vr"><button type="button" data-t="grid-stock"><span class="vn">Isometric grid stock</span><span class="vid">grid-stock</span></button><span class="at"><a href="../../index.html#techniques?a=stock">stock</a><a href="../../index.html#techniques?a=grid">grid</a><a href="../../index.html#techniques?a=isometric">isometric</a><a class="mod" href="lib/grid-stock.js">lib/grid-stock.js</a></span><p class="ah">Flat gray fill, then verticals and both diagonal families stroked in the grid ink at 16 % before any plate lands.</p></li></ul></div></details>
