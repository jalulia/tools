  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Riso three-plate separation</b><span class="code">TS-06</span></span>
  <span class="pager"><a href="../../techniques/ts-05-line-screen-type/index.html" title="Vertical line-screen type">← TS-05</a><a href="../../index.html#techniques"><span class="n">6</span>&nbsp;/ 14</a><a href="../../techniques/ts-07-gradient-map-blur-type/index.html" title="Gradient-mapped blur type">TS-07 →</a></span> <p class="kicker">Technique · TS-06</p><h1 class="lede">One isometric drawing split into three ink plates, each off by a few px.</h1><div class="body"><p>An extruded isometric object — a top face and two sides — printed as three plates. Yellow takes the tops and a corner wash; blue the right faces; pink the left faces and a marbled fill in the tops; the keyline rides all three. The inks multiply: three on the keyline read near-black, pink over yellow reads orange.</p><p>Each plate lands on its own register error and grains on its own — mono noise at its own seed, coverage thinning toward every fill edge, a slow mottle. The stock is light gray with a printed isometric grid.</p></div>
  <div class="meta" style="display:block"><h2>Pass order</h2><ol class="steps"><li><div><b>stock</b> · gray fill + iso grid</div></li><li><div><b>labels</b> · top / right / left per object, back to front</div></li><li><div><b>coverage</b> · three rasters from labels, marble cut into pink, wash and strokes into yellow</div></li><li><div><b>grain</b> · edge thinning, mottle, mono noise per plate</div></li><li><div><b>plates</b> · multiply in order yellow, blue, pink, each translated by its register error</div></li></ol></div>
  <div class="meta"><div class="full"><h2>Vocabulary · a technique highlights its reads · an atom finds every use</h2><div class="vocab" id="chips"><div class="vr"><span data-t="iso-extrude" title="Isometric extrusion by outline drop"><b>EXTR</b>iso-extrude</span><span class="at"><a href="../../index.html#techniques?a=isometric">isometric</a><i>·</i><a href="../../index.html#techniques?a=extrude">extrude</a><i>·</i><a href="../../index.html#techniques?a=painter-order">painter-order</a></span></div><div class="vr"><span data-t="plate-separation" title="Three-plate coverage split"><b>PLTE</b>plate-separation</span><span class="at"><a href="../../index.html#techniques?a=separation">separation</a><i>·</i><a href="../../index.html#techniques?a=multiply">multiply</a><i>·</i><a href="../../index.html#techniques?a=coverage">coverage</a></span></div><div class="vr"><span data-t="misregister" title="Per-plate register error"><b>MREG</b>misregister</span><span class="at"><a href="../../index.html#techniques?a=translate">translate</a><i>·</i><a href="../../index.html#techniques?a=offset">offset</a></span></div><div class="vr"><span data-t="ink-grain" title="Per-plate ink grain"><b>GRN</b>ink-grain</span><span class="at"><a href="../../index.html#techniques?a=grain">grain</a><i>·</i><a href="../../index.html#techniques?a=mottle">mottle</a><i>·</i><a href="../../index.html#techniques?a=edge-thinning">edge-thinning</a></span></div><div class="vr"><span data-t="marbled-fill" title="Marbled fill from fbm bands"><b>MARB</b>marbled-fill</span><span class="at"><a href="../../index.html#techniques?a=fbm">fbm</a><i>·</i><a href="../../index.html#techniques?a=threshold">threshold</a><i>·</i><a href="../../index.html#techniques?a=band">band</a></span></div><div class="vr"><span data-t="grid-stock" title="Isometric grid stock"><b>STCK</b>grid-stock</span><span class="at"><a href="../../index.html#techniques?a=stock">stock</a><i>·</i><a href="../../index.html#techniques?a=grid">grid</a><i>·</i><a href="../../index.html#techniques?a=isometric">isometric</a></span></div></div></div>
  <div><h2>Reference</h2><div class="ro">Reference 06 · risograph print, three plates on grid stock, 1080 × 1080</div></div><div><h2>Study</h2><div class="nm">Riso three-plate separation</div><div class="ro">TS-06 · Techniques · 6 / 14</div></div></div>
  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>iso-extrude</b> · Isometric extrusion by outline drop — Each object is a top-face mask drawn in the plane transform; a column scan drops every boundary pixel whose +x or +y probe is empty by the depth, labelling right or left face, top always winning; later objects overwrite earlier ones.</div></li><li><div><b>plate-separation</b> · Three-plate coverage split — Face labels become three coverage rasters; each raster is coloured mix(white, ink, coverage) on its own canvas and multiplied onto the stock in plate order.</div></li><li><div><b>misregister</b> · Per-plate register error — Each plate canvas is drawn translated by its own vector; the keyline sits on all three plates, so the offsets show as coloured fringes on every edge and the overprint of all three is the near-black line.</div></li><li><div><b>ink-grain</b> · Per-plate ink grain — Before colouring, coverage is multiplied by a blurred copy of itself so fills thin toward their edges, and by a slow perlin mottle; after colouring ART.grain runs mono on the plate and paper pixels are reset to white.</div></li><li><div><b>marbled-fill</b> · Marbled fill from fbm bands — Inside the top faces the pink plate is full except where an fbm field crosses zero: the core of the band is paper, the rim half-coverage, which reads as swirls.</div></li><li><div><b>grid-stock</b> · Isometric grid stock — Flat gray fill, then verticals and both diagonal families stroked in the grid ink at 16 % before any plate lands.</div></li></ol></div>
