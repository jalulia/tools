  <span class="pager"><a href="../../techniques/ts-10-thermal-blob-field/index.html" title="Previous: TS-10 Thermal blob field">← TS-10</a><a class="pos" href="../../index.html#techniques"><span class="n">7</span>&nbsp;of 15</a><a href="../../techniques/ts-12-perforated-stamp/index.html" title="Next: TS-12 Perforated stamp">TS-12 →</a></span> <p class="kicker"><span>TS-11</span><span>layout ephemera</span></p><h1 class="title">Worn black box</h1><p class="lede">A black board box, front and back, worn at every edge, with stickers and a barcode.</p><div class="body"><p>Wear is a per-pixel threshold: the chance of a lighter pixel falls off exponentially with distance from the silhouette, the fold and the corners, gated by a patch field so some edges are heavy and others clean. On the board sit a light flap and label, a torn orange price sticker, a foil sticker, a barcode block and rows of mono metadata.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>ground</b><span>flat fill</span></li><li><b>board</b><span>region test, mottle, shade, speckle per pixel</span></li><li><b>scuff</b><span>distance transform, corner and fold distances, threshold per pixel</span></li><li><b>crease</b><span>blurred strokes</span></li><li><b>print</b><span>flap label, headline, spine type, body text, meta rows</span></li><li><b>stickers</b><span>price, foil, label, with shadows</span></li><li><b>barcode</b><span>box, bars, digits, icon row</span></li><li><b>grain</b><span>mono, amp 0.05</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>6</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="board-panel"><span class="vn">Board panel</span><span class="vid">board-panel</span></button><span class="at"><a href="../../index.html#techniques?a=flat">flat</a><a href="../../index.html#techniques?a=mottle">mottle</a><a href="../../index.html#techniques?a=speckle">speckle</a><a href="../../index.html#techniques?a=silhouette">silhouette</a></span><p class="ah">Each panel is a union of rectangles (spine, face, flap, tab, rounded tuck) tested per pixel; the fill is the board color mixed 3 % toward the scuff color by a perlin mottle and a vertical shade, plus sparse one-pixel dots.</p></li><li class="vr"><button type="button" data-t="edge-scuff"><span class="vn">Edge scuff</span><span class="vid">edge-scuff</span></button><span class="at"><a href="../../index.html#techniques?a=distance-field">distance-field</a><a href="../../index.html#techniques?a=threshold">threshold</a><a href="../../index.html#techniques?a=noise">noise</a></span><p class="ah">A chamfer distance transform gives d to the silhouette; dc is the distance to the nearest convex corner or fold junction and df to the spine crease or flap fold. A pixel turns lighter where a uniform random is below the summed density times the patch gate, so the wear reads as clustered abrasion rather than a line.</p></li><li class="vr"><button type="button" data-t="crease-line"><span class="vn">Crease line</span><span class="vid">crease-line</span></button><span class="at"><a href="../../index.html#techniques?a=stroke">stroke</a><a href="../../index.html#techniques?a=blur">blur</a></span><p class="ah">Faint diagonal strokes in the scuff color on a separate layer, blurred 1.5 px, then composited so the edges are soft.</p></li><li class="vr"><button type="button" data-t="sticker-layer"><span class="vn">Sticker layer</span><span class="vid">sticker-layer</span></button><span class="at"><a href="../../index.html#techniques?a=polygon">polygon</a><a href="../../index.html#techniques?a=shadow">shadow</a><a href="../../index.html#techniques?a=arc-gradient">arc-gradient</a></span><p class="ah">Each sticker is a filled path drawn over the worn board with its own drop shadow; the foil is 36 hue wedges on arcs under a radial highlight.</p></li><li class="vr"><button type="button" data-t="barcode-block"><span class="vn">Barcode block</span><span class="vid">barcode-block</span></button><span class="at"><a href="../../index.html#techniques?a=bars">bars</a><a href="../../index.html#techniques?a=box">box</a><a href="../../index.html#techniques?a=mono">mono</a></span><p class="ah">A white box, then random-width dark bars from a seeded sequence; the digit row is mono type below the bars.</p></li><li class="vr"><button type="button" data-t="edge-metadata"><span class="vn">Edge metadata</span><span class="vid">edge-metadata</span></button><span class="at"><a href="../../index.html#techniques?a=type">type</a><a href="../../index.html#techniques?a=rotate">rotate</a><a href="../../index.html#techniques?a=mono">mono</a></span><p class="ah">All lettering is live type in the three inlined fonts with invented plain words; spine text is drawn on a rotated context.</p></li></ul></div></details>

      <div class="th"><p class="hint">Drag a slider or type a value. Arrow keys step; Shift ×10, Alt ×0.1.</p><button type="button" class="ghost warn" id="bParamReset" hidden>Reset all</button></div>
      <div class="pgroups" id="prail"></div>
    </section>
    <section class="tabp" id="mColor" role="tabpanel" aria-labelledby="tabColor" data-tab="color" hidden>
      <div class="th"><p class="hint" id="colorHint">Pick a palette. Click any ink to change it.</p><button type="button" class="ghost warn" id="bInkReset" hidden>Reset inks</button></div>
      <div class="pal" id="pal" role="radiogroup" aria-label="Palettes"></div>
      <div class="inks" id="inks"></div>
    </section>
    <section class="tabp" id="mPresets" role="tabpanel" aria-labelledby="tabPresets" data-tab="presets" hidden>
      <div id="ppres"></div>
      <div class="mypre" id="mypre"></div>
    </section>
    <section class="tabp" id="mExport" role="tabpanel" aria-labelledby="tabMore" data-tab="more" hidden>
      <div class="row3"><button type="button" class="btn" id="bPng" title="Save the plate as it is drawn now">Save PNG</button><button type="button" class="btn" id="bCopy" title="Copy the spec as JSON">Copy spec</button><button type="button" class="btn" id="bSpec" title="Open the spec (S)">Open spec</button></div>
      <p class="hint">The spec holds every measured number, its range and the module that draws it.</p>
      <div id="mNote">
        <button type="button" class="disc" id="bPoints" aria-expanded="false" aria-controls="pts"><span>Point list</span><b id="ctr">0 / 10</b><svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 3.8L5 6.3l2.5-2.5"/></svg></button>
        <div class="pts" id="pts" hidden>
          <div class="rows" id="rows"></div>
          <div class="read" id="read"><span id="readtxt">Hover or select a point.</span><code id="readcode"></code></div>
        </div>
      </div>
      <div id="mView"><p class="hint" id="viewHint">The rebuild, drawn in code.</p></div>
      <div id="mMotion" hidden><span id="motionState">Still</span><div id="motionRow"></div><p id="motionHint"></p></div>
    </section>
  </aside>
</main>
