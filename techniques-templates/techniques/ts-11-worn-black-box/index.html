  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Worn black box</b><span class="code">TS-11</span></span>
  <span class="pager"><a href="../../techniques/ts-10-thermal-blob-field/index.html" title="Thermal blob field">← TS-10</a><a href="../../index.html#techniques"><span class="n">11</span>&nbsp;/ 14</a><a href="../../techniques/ts-12-perforated-stamp/index.html" title="Perforated stamp">TS-12 →</a></span> <p class="kicker">Technique · TS-11</p><h1 class="lede">Two board panels, abraded at every edge, with stickers and a barcode.</h1><div class="body"><p>A black-board box, front and back. Each panel is a flat fill with a low mottle and sparse one-pixel speckle. Wear is a per-pixel threshold: the chance of a lighter pixel falls off exponentially with distance from the silhouette, a fold and a corner, gated by a patch field so some runs of edge are heavy and others clean.</p><p>On the board sit the printed layers — a cream flap and label, a torn orange price sticker, a round foil sticker, a white barcode block, rows of small mono metadata. One grain pass ties them together.</p></div>
  <div class="meta" style="display:block"><h2>Pass order</h2><ol class="steps"><li><div><b>ground</b> · flat fill</div></li><li><div><b>board</b> · region test, mottle, shade, speckle per pixel</div></li><li><div><b>scuff</b> · distance transform, corner and fold distances, threshold per pixel</div></li><li><div><b>crease</b> · blurred strokes</div></li><li><div><b>print</b> · flap label, headline, spine type, body text, meta rows</div></li><li><div><b>stickers</b> · price, foil, label, with shadows</div></li><li><div><b>barcode</b> · box, bars, digits, icon row</div></li><li><div><b>grain</b> · mono, amp 0.05</div></li></ol></div>
  <div class="meta"><div class="full"><h2>Vocabulary · a technique highlights its reads · an atom finds every use</h2><div class="vocab" id="chips"><div class="vr"><span data-t="board-panel" title="Board panel"><b>BORD</b>board-panel</span><span class="at"><a href="../../index.html#techniques?a=flat">flat</a><i>·</i><a href="../../index.html#techniques?a=mottle">mottle</a><i>·</i><a href="../../index.html#techniques?a=speckle">speckle</a><i>·</i><a href="../../index.html#techniques?a=silhouette">silhouette</a></span></div><div class="vr"><span data-t="edge-scuff" title="Edge scuff"><b>SCUF</b>edge-scuff</span><span class="at"><a href="../../index.html#techniques?a=distance-field">distance-field</a><i>·</i><a href="../../index.html#techniques?a=threshold">threshold</a><i>·</i><a href="../../index.html#techniques?a=noise">noise</a></span></div><div class="vr"><span data-t="crease-line" title="Crease line"><b>CRSE</b>crease-line</span><span class="at"><a href="../../index.html#techniques?a=stroke">stroke</a><i>·</i><a href="../../index.html#techniques?a=blur">blur</a></span></div><div class="vr"><span data-t="sticker-layer" title="Sticker layer"><b>STCK</b>sticker-layer</span><span class="at"><a href="../../index.html#techniques?a=polygon">polygon</a><i>·</i><a href="../../index.html#techniques?a=shadow">shadow</a><i>·</i><a href="../../index.html#techniques?a=arc-gradient">arc-gradient</a></span></div><div class="vr"><span data-t="barcode-block" title="Barcode block"><b>BARC</b>barcode-block</span><span class="at"><a href="../../index.html#techniques?a=bars">bars</a><i>·</i><a href="../../index.html#techniques?a=box">box</a><i>·</i><a href="../../index.html#techniques?a=mono">mono</a></span></div><div class="vr"><span data-t="edge-metadata" title="Edge metadata"><b>META</b>edge-metadata</span><span class="at"><a href="../../index.html#techniques?a=type">type</a><i>·</i><a href="../../index.html#techniques?a=rotate">rotate</a><i>·</i><a href="../../index.html#techniques?a=mono">mono</a></span></div></div></div>
  <div><h2>Reference</h2><div class="ro">Reference 11 · worn black cardboard box mock-up, front and back, 1200 × 800</div></div><div><h2>Study</h2><div class="nm">Worn black box</div><div class="ro">TS-11 · Techniques · 11 / 14</div></div></div>
  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>board-panel</b> · Board panel — Each panel is a union of rectangles (spine, face, flap, tab, rounded tuck) tested per pixel; the fill is the board color mixed 3 % toward the scuff color by a perlin mottle and a vertical shade, plus sparse one-pixel dots.</div></li><li><div><b>edge-scuff</b> · Edge scuff — A chamfer distance transform gives d to the silhouette; dc is the distance to the nearest convex corner or fold junction and df to the spine crease or flap fold. A pixel turns lighter where a uniform random is below the summed density times the patch gate, so the wear reads as clustered abrasion rather than a line.</div></li><li><div><b>crease-line</b> · Crease line — Faint diagonal strokes in the scuff color on a separate layer, blurred 1.5 px, then composited so the edges are soft.</div></li><li><div><b>sticker-layer</b> · Sticker layer — Each sticker is a filled path drawn over the worn board with its own drop shadow; the foil is 36 hue wedges on arcs under a radial highlight.</div></li><li><div><b>barcode-block</b> · Barcode block — A white box, then random-width dark bars from a seeded sequence; the digit row is mono type below the bars.</div></li><li><div><b>edge-metadata</b> · Edge metadata — All lettering is live type in the three inlined fonts with invented plain words; spine text is drawn on a rotated context.</div></li></ol></div>
