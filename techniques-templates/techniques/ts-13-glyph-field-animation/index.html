  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>ASCII glyph-field animations</b><span class="code">TS-13</span></span>
  <span class="pager"><a href="../../techniques/ts-12-perforated-stamp/index.html" title="Perforated stamp">← TS-12</a><a href="../../index.html#techniques"><span class="n">13</span>&nbsp;/ 14</a><a href="../../techniques/ts-14-deep-space-chroma/index.html" title="Deep Space Chroma · birefringence">TS-14 →</a></span> <p class="kicker">Technique · TS-13</p><h1 class="lede">Type glyphs as particles: a helix, a wave, an orbit and a pulse, drawn with fillText.</h1><div class="body"><p>Four canvases, one method. Every mark is a monospace glyph placed with fillText — no sprites, no shapes. A glyph vocabulary of dots, rules, arrows and three-digit numbers is read by index, so the field looks typeset rather than drawn. Depth is alpha and size only: the helix projects 150 glyphs through a pinhole at 800 u and sorts them far-to-near, so near glyphs sit on top at 0.89 alpha and far ones fade to 0.04. Every 18th glyph is a palette label in its own color with a soft glow, so the animation names the system it decorates.</p><p>The field cedes the middle: a CSS radial mask (ellipse 44 % × 40 %) clears the helix behind the title. The wave is a 70 × 8 cell grid whose glyph is chosen by a sine phase and whose alpha falls off from a sine centerline. The orbit is 52 glyphs on a 0.4-ratio ellipse whose radius breathes ±10 %. The pulse is 18 glyphs lit by the positive half of one travelling sine. Each frame clears and redraws; reduced-motion draws the frame once and stops.</p></div>
  <div class="meta" style="display:block"><h2>Pass order</h2><ol class="steps"><li><div><b>vocabulary</b> · the glyph lists and label sequence</div></li><li><div><b>helix</b> · project 150 glyphs, sort far to near, draw with depth alpha and glow</div></li><li><div><b>mask</b> · elliptical radial mask over the helix canvas, title in the hole</div></li><li><div><b>grid</b> · wave, pulse and orbit each from one sine</div></li><li><div><b>runtime</b> · rAF loop, DPR cap, reduced-motion still frame</div></li></ol></div>

  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>glyph-helix</b> · Projected glyph helix — 150 particles climb a helix (0.018 of the height per second) while the helix turns (0.22 rad/s); each is projected through a pinhole at 800 u and drawn as text, far to near.</div></li><li><div><b>depth-alpha</b> · Depth as alpha and size — Nothing is shaded: depth is the alpha ramp and the projected font size, so far glyphs are ghosts and near glyphs are ink.</div></li><li><div><b>semantic-label</b> · Palette label with glow — Every glyph with i mod 18 = 7 is replaced by the next palette name, set in its lifted on-ink color at weight 500 with a depth-scaled glow; the animation names its own system.</div></li><li><div><b>glyph-vocab</b> · Indexed glyph vocabulary — Each animation reads its marks from a short ordered list by index, so the field is typeset from a vocabulary rather than drawn from shapes; the helix list mixes 10 marks with 13 three-digit numbers.</div></li><li><div><b>center-mask</b> · Radial center mask — The helix canvas is masked by an elliptical radial gradient so glyphs fade out toward the middle; the title sits in the hole with a wide dark text-shadow that deepens it.</div></li><li><div><b>pointer-parallax</b> · Eased pointer parallax — The pointer shifts the whole helix by at most 18 u × 14 u, eased at 4 % per frame, so the field drifts after the cursor rather than following it.</div></li><li><div><b>wave-grid</b> · Sine-phased glyph grid — A 70 × 8 grid where one sine phase picks both the glyph (from a five-step ramp) and the alpha (by distance to a sine centerline), so a two-wavelength band of laminar glyphs rolls across the frame.</div></li><li><div><b>pulse-row</b> · Half-wave pulse row — Eighteen glyphs along a line lit by the positive half of one travelling sine, so a soft blue pulse runs left to right behind a fixed ▸ head; it lives inline under a dialogue turn.</div></li><li><div><b>orbit-ring</b> · Breathing glyph orbit — 52 glyphs on a flattened ellipse, each with its own breathing radius and an alpha that peaks at the bottom of the orbit; the canvas is held at 30 % under a pull quote.</div></li><li><div><b>still-frame-runtime</b> · Frame runtime — One setupCanvas and one loop helper serve all four canvases; under prefers-reduced-motion the loop degenerates to a single still frame, so the page keeps its picture without motion.</div></li></ol></div>
  <div class="meta static" style="display:block"><h2>10 reads · u, v on the sheet</h2><ol class="steps"><li><div><b>HELX</b> · Helix · 150 glyphs, 7 turns over 484 u, two strands π apart, pinhole at 800 u <span class="ro">u 0.50 · v 0.06 · glyph-helix</span></div></li><li><div><b>DPTH</b> · Near glyph · alpha .04 + d^1.5 · .85, size 10.5 · 800/(800 − z) <span class="ro">u 0.66 · v 0.14 · depth-alpha</span></div></li><li><div><b>LABL</b> · Palette label · every 18th glyph, weight 500, glow shadowBlur 6·d in its own color <span class="ro">u 0.65 · v 0.09 · semantic-label</span></div></li><li><div><b>VOCB</b> · Vocabulary · 23 entries read by index: dots, rules, ø, ×, →, ▸, three-digit numbers <span class="ro">u 0.40 · v 0.12 · glyph-vocab</span></div></li><li><div><b>MASK</b> · Center mask · radial ellipse 44 % × 40 % at 50 % 52 %, clear to 0.4, opaque from 0.8 <span class="ro">u 0.30 · v 0.36 · center-mask</span></div></li><li><div><b>PRLX</b> · Pointer parallax · x ±18 u, y ±14 u, eased at 0.04 per frame <span class="ro">u 0.86 · v 0.34 · pointer-parallax</span></div></li><li><div><b>WAVE</b> · Wave grid · 70 × 8 cells, glyph = ramp[sin φ], alpha = 1 − |row − 4 + 1.4 sin φ| / 2.2 <span class="ro">u 0.50 · v 0.59 · wave-grid</span></div></li><li><div><b>PULS</b> · Pulse · 18 glyphs, sin(1.6 t − 0.12 i), only the positive half drawn, alpha ≤ .5 <span class="ro">u 0.26 · v 0.74 · pulse-row</span></div></li><li><div><b>ORBT</b> · Orbit · 52 glyphs on an ellipse, ratio 0.4, radius ±10 %, every 6th is ø, canvas at .3 <span class="ro">u 0.63 · v 0.90 · orbit-ring</span></div></li><li><div><b>LOOP</b> · Runtime · DPR capped at 2, clearRect every frame, reduced-motion draws one frame <span class="ro">u 0.10 · v 0.96 · still-frame-runtime</span></div></li></ol></div>
