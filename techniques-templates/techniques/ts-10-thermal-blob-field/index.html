  <span class="pager"><a href="../../techniques/ts-09-grain-gradient-layers/index.html" title="Previous: TS-09 Grain gradient layers">← TS-09</a><a class="pos" href="../../index.html#techniques"><span class="n">6</span>&nbsp;of 15</a><a href="../../techniques/ts-11-worn-black-box/index.html" title="Next: TS-11 Worn black box">TS-11 →</a></span> <p class="kicker"><span>TS-10</span><span>light gradient</span></p><h1 class="title">Thermal blob field</h1><p class="lede">Blurred blobs mapped through a ramp with one dark stop at the rim.</p><div class="body"><p>Four blob shapes are filled white on black and blurred wide, so each edge becomes a smooth S. The ramp runs paper, light blue, a navy stop just under mid, then plum, red, orange and yellow. The navy stop lands on the steepest part of that S, so it prints as a thin band that reads as a drawn rim.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>field</b><span>four blobs white on black at 1/3 res, blur σ 46 u</span></li><li><b>upscale</b><span>field to device res</span></li><li><b>map</b><span>LUT[field] per pixel (rim stop 0.44)</span></li><li><b>tooth</b><span>mono grain 0.03, perlin mottle 0.012</span></li><li><b>ledger</b><span>two rules, caption, two-line label</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>5</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="blob-field"><span class="vn">Blurred blob field</span><span class="vid">blob-field</span></button><span class="at"><a href="../../index.html#techniques?a=blob">blob</a><a href="../../index.html#techniques?a=fourier-radius">fourier-radius</a><a href="../../index.html#techniques?a=gaussian-blur">gaussian-blur</a><a class="mod" href="lib/blob-field.js">lib/blob-field.js</a></span><p class="ah">Four Fourier-radius blobs are filled with a radial white-to-gray gradient on a black canvas (union by lighten) at one-third resolution, blurred with σ = 46 u and read back as a 0..1 luminance field.</p></li><li class="vr"><button type="button" data-t="gradient-map"><span class="vn">Gradient map</span><span class="vid">gradient-map</span></button><span class="at"><a href="../../index.html#techniques?a=lut">lut</a><a href="../../index.html#techniques?a=gradient-map">gradient-map</a><a class="mod" href="lib/gradient-map.js">lib/gradient-map.js</a></span><p class="ah">Every pixel of the field is replaced by LUT[field]; the ramp is the only place color enters, so all four colorways share one field.</p></li><li class="vr"><button type="button" data-t="rim-stop"><span class="vn">Dark rim stop</span><span class="vid">rim-stop</span></button><span class="at"><a href="../../index.html#techniques?a=lut-stop">lut-stop</a><a href="../../index.html#techniques?a=edge-band">edge-band</a><a class="mod" href="lib/rim-stop.js">lib/rim-stop.js</a></span><p class="ah">The darkest stop sits just under the mid-point of the blurred edge, where the profile is steepest, so it occupies few pixels and reads as a drawn outline; the blue halo is the ramp segment just outside it.</p></li><li class="vr"><button type="button" data-t="paper-tooth"><span class="vn">Paper tooth</span><span class="vid">paper-tooth</span></button><span class="at"><a href="../../index.html#techniques?a=grain">grain</a><a href="../../index.html#techniques?a=mottle">mottle</a><a class="mod" href="lib/paper-tooth.js">lib/paper-tooth.js</a></span><p class="ah">Multiplicative mono grain per device pixel, then a low-frequency perlin mottle, both on the whole sheet including the blobs.</p></li><li class="vr"><button type="button" data-t="rule-ledger"><span class="vn">Rules, caption and label</span><span class="vid">rule-ledger</span></button><span class="at"><a href="../../index.html#techniques?a=hairline">hairline</a><a href="../../index.html#techniques?a=caption">caption</a><a href="../../index.html#techniques?a=label">label</a><a class="mod" href="lib/rule-ledger.js">lib/rule-ledger.js</a></span><p class="ah">Two 1 u ink rules across the sheet; the caption is set right-aligned 12 u under the first rule, the two-line studio label under the second.</p></li></ul></div></details>

        <label class="tb" id="noteTog" title="Numbered points where each technique was measured"><input type="checkbox" id="tNote"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="5" height="5"/><path d="M7.5 5h3.5M11 5v6.5"/><rect x="9" y="11" width="4" height="3" fill="currentColor" stroke="none"/></svg><span>Callouts</span></label>
        <label class="tb" id="cmpTog" title="Reference beside the rebuild (R)"><input type="checkbox" id="tCompare"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10"/><path d="M8 1.5v13"/></svg><span>Compare</span></label>
        <button type="button" class="tb" id="bWide" aria-pressed="false" title="Show the notes (F)"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10"/><path d="M6 3v10M3.5 6h1M3.5 8h1M3.5 10h1"/></svg><span>Notes</span></button>
      </div>
      <div class="readout" id="readout" aria-live="off"></div>
      <div class="ptabs" role="tablist" aria-label="Controls">
        <button type="button" role="tab" id="tabParams" data-tab="params" aria-selected="true" aria-controls="mParams">Parameters</button>
        <button type="button" role="tab" id="tabColor" data-tab="color" aria-selected="false" aria-controls="mColor">Color</button>
        <button type="button" role="tab" id="tabPresets" data-tab="presets" aria-selected="false" aria-controls="mPresets">Presets</button>
        <button type="button" role="tab" id="tabMore" data-tab="more" aria-selected="false" aria-controls="mExport">Export</button>
      </div>
    </div>
    <section class="tabp" id="mParams" role="tabpanel" aria-labelledby="tabParams" data-tab="params">
      <div class="th"><p class="hint">Drag a slider or type a value. Arrow keys step; Shift ×10, Alt ×0.1.</p><button type="button" class="ghost warn" id="bParamReset" hidden>Reset all</button></div>
      <div class="pgroups" id="prail"></div>
    </section>
    <section class="tabp" id="mColor" role="tabpanel" aria-labelledby="tabColor" data-tab="color" hidden>
      <div class="th"><p class="hint" id="colorHint">Pick a palette. Click any ink to change it.</p><button type="button" class="ghost warn" id="bInkReset" hidden>Reset inks</button></div>
      <div class="pal" id="pal" role="radiogroup" aria-label="Palettes"></div>
      <div class="inks" id="inks"></div>
    </section>
    <section class="tabp" id="mPresets" role="tabpanel" aria-labelledby="tabPresets" data-tab="presets" hidden>
      <div id="ppres"></div>
      <div class="mypre" id="mypre"></div>
    </section>
    <section class="tabp" id="mExport" role="tabpanel" aria-labelledby="tabMore" data-tab="more" hidden>
      <div class="row3"><button type="button" class="btn" id="bPng" title="Save the plate as it is drawn now">Save PNG</button><button type="button" class="btn" id="bCopy" title="Copy the spec as JSON">Copy spec</button><button type="button" class="btn" id="bSpec" title="Open the spec (S)">Open spec</button></div>
      <p class="hint">The spec holds every measured number, its range and the module that draws it.</p>
      <div id="mNote">
        <button type="button" class="disc" id="bPoints" aria-expanded="false" aria-controls="pts"><span>Point list</span><b id="ctr">0 / 10</b><svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 3.8L5 6.3l2.5-2.5"/></svg></button>
        <div class="pts" id="pts" hidden>
          <div class="rows" id="rows"></div>
          <div class="read" id="read"><span id="readtxt">Hover or select a point.</span><code id="readcode"></code></div>
        </div>
      </div>
      <div id="mView"><p class="hint" id="viewHint">The rebuild, drawn in code.</p></div>
      <div id="mMotion" hidden><span id="motionState">Still</span><div id="motionRow"></div><p id="motionHint"></p></div>
    </section>
  </aside>
</main>
<aside class="spec" id="spec" aria-hidden="true" aria-label="Technique spec">
  <div class="sh"><span>Spec · <b id="specid"></b> · JSON</span><span><button id="speccopy" type="button">Copy</button><button id="specclose" type="button">Close ×</button></span></div>
  <pre id="specpre">{{SPEC}}</pre>
</aside>
