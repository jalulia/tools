  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Thermal blob field</b><span class="code">TS-10</span></span>
  <span class="pager"><a href="../../techniques/ts-09-grain-gradient-layers/index.html" title="Grain gradient layers">← TS-09</a><a href="../../index.html#techniques"><span class="n">10</span>&nbsp;/ 19</a><a href="../../techniques/ts-11-worn-black-box/index.html" title="Worn black box">TS-11 →</a></span> <p class="kicker">Technique · TS-10</p><h1 class="lede">Blurred blobs mapped through a ramp with one dark stop at the rim.</h1><div class="body"><p>One luminance field through one color ramp. Four blob shapes fill white on black and blur wide, so every edge becomes a smooth S. The ramp reads that profile: paper low, a light blue as it rises, a dark navy stop just under mid, then plum, red, orange, and yellow only where the field saturates deep inside a blob.</p><p>Because the navy stop sits on the steepest part of the profile it renders as a thin band — the rim looks drawn but is only mapped. Over the sheet: mono grain and a faint mottle, two hairline rules, a mono caption and a two-line label.</p></div>
  <div class="meta" style="display:block"><h2>Pass order</h2><ol class="steps"><li><div><b>field</b> · four blobs white on black at 1/3 res, blur σ 46 u</div></li><li><div><b>upscale</b> · field to device res</div></li><li><div><b>map</b> · LUT[field] per pixel (rim stop 0.44)</div></li><li><div><b>tooth</b> · mono grain 0.03, perlin mottle 0.012</div></li><li><div><b>ledger</b> · two rules, caption, two-line label</div></li></ol></div>
  <div class="meta"><div class="full"><h2>Vocabulary · a technique highlights its reads · an atom finds every use</h2><div class="vocab" id="chips"><div class="vr"><span data-t="blob-field" title="Blurred blob field"><b>BLOB</b>blob-field</span><span class="at"><a href="../../index.html#techniques?a=blob">blob</a><i>·</i><a href="../../index.html#techniques?a=fourier-radius">fourier-radius</a><i>·</i><a href="../../index.html#techniques?a=gaussian-blur">gaussian-blur</a></span></div><div class="vr"><span data-t="gradient-map" title="Gradient map"><b>RAMP</b>gradient-map</span><span class="at"><a href="../../index.html#techniques?a=lut">lut</a><i>·</i><a href="../../index.html#techniques?a=gradient-map">gradient-map</a></span></div><div class="vr"><span data-t="rim-stop" title="Dark rim stop"><b>RIM</b>rim-stop</span><span class="at"><a href="../../index.html#techniques?a=lut-stop">lut-stop</a><i>·</i><a href="../../index.html#techniques?a=edge-band">edge-band</a></span></div><div class="vr"><span data-t="paper-tooth" title="Paper tooth"><b>TOOTH</b>paper-tooth</span><span class="at"><a href="../../index.html#techniques?a=grain">grain</a><i>·</i><a href="../../index.html#techniques?a=mottle">mottle</a></span></div><div class="vr"><span data-t="rule-ledger" title="Rules, caption and label"><b>RULE</b>rule-ledger</span><span class="at"><a href="../../index.html#techniques?a=hairline">hairline</a><i>·</i><a href="../../index.html#techniques?a=caption">caption</a><i>·</i><a href="../../index.html#techniques?a=label">label</a></span></div></div></div>
  <div><h2>Reference</h2><div class="ro">Reference 10 · blurred blob background with a dark rim, 1200 × 800</div></div><div><h2>Study</h2><div class="nm">Thermal blob field</div><div class="ro">TS-10 · Techniques · 10 / 19</div></div></div>
  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>blob-field</b> · Blurred blob field — Four Fourier-radius blobs are filled with a radial white-to-gray gradient on a black canvas (union by lighten) at one-third resolution, blurred with σ = 46 u and read back as a 0..1 luminance field. <span class="ro">Limits · Under σ ~15 u the edge profile is too steep for the ramp and the bands alias. Past σ ~110 u neighboring blobs fuse and the rim stop no longer closes. harmonic_scale above ~2 makes r(θ) cross zero and the outline self-intersects.</span> <a href="lib/blob-field.js">lib/blob-field.js</a></div></li><li><div><b>gradient-map</b> · Gradient map — Every pixel of the field is replaced by LUT[field]; the ramp is the only place color enters, so all four colourways share one field. <span class="ro">Limits · The ramp is read at 256 levels; contrast above ~2 leaves fewer than 6 levels across the rim and it stair-steps. A shift past ±0.15 moves the paper stop into the blobs or the core out of range.</span> <a href="lib/gradient-map.js">lib/gradient-map.js</a></div></li><li><div><b>rim-stop</b> · Dark rim stop — The darkest stop sits just under the mid-point of the blurred edge, where the profile is steepest, so it occupies few pixels and reads as a drawn outline; the blue halo is the ramp segment just outside it. <span class="ro">Limits · from must stay below to, and both inside 0.41–0.53 (the stops on either side). A band wider than ~0.07 reads as a dark fill, not an outline.</span> <a href="lib/rim-stop.js">lib/rim-stop.js</a></div></li><li><div><b>paper-tooth</b> · Paper tooth — Multiplicative mono grain per device pixel, then a low-frequency perlin mottle, both on the whole sheet including the blobs. <span class="ro">Limits · Grain above ~0.08 reads as noise on the paper and breaks the rim. A mottle cell under ~30 u reads as a second grain.</span> <a href="lib/paper-tooth.js">lib/paper-tooth.js</a></div></li><li><div><b>rule-ledger</b> · Rules, caption and label — Two 1 u ink rules across the sheet; the caption is set right-aligned 12 u under the first rule, the two-line studio label under the second. <span class="ro">Limits · Rules under 1 device px are drawn at 1 px. A caption past ~22 u collides with the second rule’s label on a narrow sheet.</span> <a href="lib/rule-ledger.js">lib/rule-ledger.js</a></div></li></ol></div>
  <div class="meta static" style="display:block"><h2>10 reads · u, v on the sheet</h2><ol class="steps"><li><div><b>BLOB</b> · Blob 2 · Fourier-radius shape, R 280 u, four harmonics <span class="ro">u 0.22 · v 0.75 · blob-field</span></div></li><li><div><b>BLOB</b> · Blob 1 · center off-sheet above, only its lower edge shows <span class="ro">u 0.33 · v 0.06 · blob-field</span></div></li><li><div><b>BLOB</b> · Blob 3 · merges with blob 2, union before the blur <span class="ro">u 0.72 · v 0.96 · blob-field</span></div></li><li><div><b>RIM</b> · Rim · navy stop at field 0.44, band about 16 u wide <span class="ro">u 0.39 · v 0.55 · rim-stop</span></div></li><li><div><b>RIM</b> · Blue halo · outside the rim, field 0.335–0.41 <span class="ro">u 0.40 · v 0.37 · rim-stop</span></div></li><li><div><b>RAMP</b> · Core · field ≥ 0.9 maps to yellow <span class="ro">u 0.30 · v 0.85 · gradient-map</span></div></li><li><div><b>RAMP</b> · Inside the rim · plum → red → orange over field 0.53–0.70 <span class="ro">u 0.36 · v 0.62 · gradient-map</span></div></li><li><div><b>TOOTH</b> · Paper · mono grain amp 0.03 plus mottle amp 0.012 <span class="ro">u 0.70 · v 0.28 · paper-tooth</span></div></li><li><div><b>RULE</b> · Rule 1 · 1 u ink, v 0.475, full width less 12 u <span class="ro">u 0.55 · v 0.47 · rule-ledger</span></div></li><li><div><b>RULE</b> · Rule 2 and label · caption right-set under rule 1, studio label under rule 2 <span class="ro">u 0.10 · v 0.93 · rule-ledger</span></div></li></ol></div>
