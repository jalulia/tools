<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Banknote engraving</b><span class="code">TS-15</span></span>
  <span class="pager"><a href="../../techniques/ts-14-deep-space-chroma/index.html" title="Previous: TS-14 Deep Space Chroma · birefringence">← TS-14</a><a class="pos" href="../../index.html#techniques"><span class="n">11</span>&nbsp;of 15</a><a href="../../techniques/ts-16-stipple-cloud-bank/index.html" title="Next: TS-16 Stipple bank and dot burst">TS-16 →</a></span> <p class="kicker"><span>TS-15</span><span>line</span></p><h1 class="title">Banknote engraving</h1><p class="lede">A picture reprinted as one-ink intaglio: swelling lines, crosshatch, guilloche and one kept hue.</p><div class="body"><p>Tone is line width, not gray: a 6 u screen whose lines swell from 6 % to 88 % of the pitch, break into dashes in the highlights and bend around forms. Past 58 % darkness a second set crosses at 62°, and smooth areas in the upper 40 % switch to a braided guilloche. Pixels within 30° of one chosen hue print in an ink of their own.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>picture</b><span>tone field drawn or supplied, upsampled to the sheet</span></li><li><b>curve</b><span>luminance → exposure → contrast</span></li><li><b>field</b><span>blurred luminance + edge energy at ¼ resolution</span></li><li><b>lines</b><span>phase = y/pitch + flow field; width from darkness; dashes in the highlights</span></li><li><b>hatch</b><span>second set at 62° above 58 % darkness</span></li><li><b>guilloche</b><span>two sine families where upper and smooth; straight lines fade there</span></li><li><b>ink</b><span>kept-hue ink or main ink, composited on paper by line coverage</span></li><li><b>grain</b><span>±3 % multiplicative</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>8</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="tone-field"><span class="vn">Tone field (the picture)</span><span class="vid">tone-field</span></button><span class="at"><a href="../../index.html#techniques?a=source">source</a><a href="../../index.html#techniques?a=procedural">procedural</a><a href="../../index.html#techniques?a=field">field</a><a class="mod" href="lib/tone-field.js">lib/tone-field.js</a></span><p class="ah">Sky, ridge, headland and sea are evaluated per pixel from seeded Perlin noise; tower, sheds and boat are drawn as flat lit/shadow faces on top. The function returns a canvas; every later technique only reads it.</p></li><li class="vr"><button type="button" data-t="tone-curve"><span class="vn">Exposure and contrast</span><span class="vid">tone-curve</span></button><span class="at"><a href="../../index.html#techniques?a=tone-curve">tone-curve</a><a href="../../index.html#techniques?a=luminance">luminance</a><a class="mod" href="lib/tone-curve.js">lib/tone-curve.js</a></span><p class="ah">Luminance is exposed and stretched about mid-gray before it sets any line width, so paper and solid shadow are reached inside the picture, not only at its extremes.</p></li><li class="vr"><button type="button" data-t="contour-flow"><span class="vn">Contour flow (tone-warped phase)</span><span class="vid">contour-flow</span></button><span class="at"><a href="../../index.html#techniques?a=phase-warp">phase-warp</a><a href="../../index.html#techniques?a=blur">blur</a><a href="../../index.html#techniques?a=field">field</a><a class="mod" href="lib/contour-flow.js">lib/contour-flow.js</a></span><p class="ah">A quarter-resolution copy of the picture is blurred; its luminance is added to the line phase, so lines rise over light forms and sink into dark ones. The same pass stores blurred edge energy for the guilloche mask.</p></li><li class="vr"><button type="button" data-t="engraved-line"><span class="vn">Swelling line screen</span><span class="vid">engraved-line</span></button><span class="at"><a href="../../index.html#techniques?a=line-screen">line-screen</a><a href="../../index.html#techniques?a=width-modulation">width-modulation</a><a href="../../index.html#techniques?a=dash">dash</a><a class="mod" href="lib/engraved-line.js">lib/engraved-line.js</a></span><p class="ah">Distance to the nearest line center is compared with half the tone-set width and antialiased over one device pixel. In the highlights each line is cut into dashes whose fill falls with darkness, with a hashed offset per line.</p></li><li class="vr"><button type="button" data-t="shadow-crosshatch"><span class="vn">Shadow crosshatch</span><span class="vid">shadow-crosshatch</span></button><span class="at"><a href="../../index.html#techniques?a=hatch">hatch</a><a href="../../index.html#techniques?a=line-screen">line-screen</a><a href="../../index.html#techniques?a=threshold">threshold</a><a class="mod" href="lib/shadow-crosshatch.js">lib/shadow-crosshatch.js</a></span><p class="ah">A second, unwarped line set whose width ramps from 0 at start to duty_max · strength at full darkness; the two sets are combined as 1 − (1−a)(1−b).</p></li><li class="vr"><button type="button" data-t="guilloche"><span class="vn">Guilloche in upper smooth regions</span><span class="vid">guilloche</span></button><span class="at"><a href="../../index.html#techniques?a=guilloche">guilloche</a><a href="../../index.html#techniques?a=sine-line">sine-line</a><a href="../../index.html#techniques?a=mask">mask</a><a class="mod" href="lib/guilloche.js">lib/guilloche.js</a></span><p class="ah">Two families of stacked sine lines, mirrored, give the braided cells. Vertical distance is divided by √(1 + slope²) so line width stays even on the steep parts. The mask is (above upper_v) × (edge energy low); the straight lines fade by the same mask.</p></li><li class="vr"><button type="button" data-t="hue-key"><span class="vn">Kept hue as a second ink</span><span class="vid">hue-key</span></button><span class="at"><a href="../../index.html#techniques?a=hue-key">hue-key</a><a href="../../index.html#techniques?a=spot-ink">spot-ink</a><a href="../../index.html#techniques?a=mask">mask</a><a class="mod" href="lib/hue-key.js">lib/hue-key.js</a></span><p class="ah">Mask = 1 inside tolerance of the chosen hue, feathered to 0, gated by saturation, scaled by strength and pulled back toward the main ink in the shadows by keep_shadows. It changes ink color only — line width is unchanged.</p></li><li class="vr"><button type="button" data-t="paper-grain"><span class="vn">Paper grain</span><span class="vid">paper-grain</span></button><span class="at"><a href="../../index.html#techniques?a=grain">grain</a><a href="../../index.html#techniques?a=stock">stock</a><a class="mod" href="lib/paper-grain.js">lib/paper-grain.js</a></span><p class="ah">One multiplicative monochrome noise pass over paper and ink together, on cells of 1.4 u with lag-1 correlation.</p></li></ul></div></details>
  <details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">Reference 15 · Figma community file “$Dollar Bill texture shader” — the Banknote Engraving effect (Line Relief Studio), read from its Shader and Instruction pages at 214 %</p><div class="fid" id="fid"></div></div></details>

  <details class="acc" name="notes" id="aPts"><summary><span>Callouts <i>10</i></span></summary><div class="ab"><ol class="steps"><li><b>GUIL · Guilloche · two mirrored sine-line families, period 103 u, max slope 1.55</b><span>u 0.20 · v 0.12 · guilloche</span></li><li><b>GUIL · Guilloche edge · fades out by v 0.40 and where the edge map rises</b><span>u 0.82 · v 0.33 · guilloche</span></li><li><b>LINE · Swelling line · pitch 6 u, width 6 → 88 % of pitch with darkness</b><span>u 0.36 · v 0.80 · engraved-line</span></li><li><b>LINE · Broken line · dashes below 22 % darkness, paper below 4 %</b><span>u 0.12 · v 0.47 · engraved-line</span></li><li><b>FLOW · Contour flow · line phase + 3.9 pitches × blurred tone</b><span>u 0.50 · v 0.47 · contour-flow</span></li><li><b>XHAT · Crosshatch · second set at 62°, starts at 58 % darkness</b><span>u 0.88 · v 0.60 · shadow-crosshatch</span></li><li><b>HKEY · Kept hue · rust band within 30° of 22° prints in its own hue</b><span>u 0.64 · v 0.20 · hue-key</span></li><li><b>TONE · Tone curve · exposure +0.1 stop, contrast 1.25 about mid-gray</b><span>u 0.44 · v 0.38 · tone-curve</span></li><li><b>SRC · Tone field · the picture as data: noise sea, lit from the left</b><span>u 0.70 · v 0.86 · tone-field</span></li><li><b>GRAIN · Paper grain · ±3 % on 0.6 u cells, after the ink</b><span>u 0.50 · v 0.96 · paper-grain</span></li></ol></div></details>
