  <span class="pager"><a href="../../techniques/ts-13-glyph-field-animation/index.html" title="Previous: TS-13 ASCII glyph-field animations">← TS-13</a><a class="pos" href="../../index.html#techniques"><span class="n">10</span>&nbsp;of 15</a><a href="../../techniques/ts-15-banknote-engraving/index.html" title="Next: TS-15 Banknote engraving">TS-15 →</a></span> <p class="kicker"><span>TS-14</span><span>fields optics</span></p><h1 class="title">Deep Space Chroma · birefringence</h1><p class="lede">A stressed birefringent sheet between crossed polarizers, integrated over the visible spectrum.</p><div class="body"><p>Each wavelength passes as sin²(πδ/λ), so a tungsten source read through the CIE color-matching functions gives the Michel-Lévy colors as a function of the retardation δ alone. Where the slow axis lines up with a polarizer the light is cut, which draws the black wedges. The palettes are presets: each changes the retardation and axis fields, not the inks.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>chart</b><span>integrate the spectrum once → color(δ)</span></li><li><b>warp</b><span>(x,y) += wa · noise2</span></li><li><b>field</b><span>δ(x,y) and ψ(x,y) for the family</span></li><li><b>isoclinic</b><span>sin²(m(ψ − β))^sharp</span></li><li><b>envelope</b><span>pinch × vignette × lobe gain, mix from the floor</span></li><li><b>defocus</b><span>gaussian σ .004 W</span></li><li><b>bloom</b><span>thresholded highlights, σ .05 W, add .4</span></li><li><b>grain</b><span>mono ×(1 + .02 n)</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>9</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="michel-levy-chart"><span class="vn">Spectral Michel-Lévy chart</span><span class="vid">michel-levy-chart</span></button><span class="at"><a href="../../index.html#techniques?a=spectrum">spectrum</a><a href="../../index.html#techniques?a=planck">planck</a><a href="../../index.html#techniques?a=cmf">cmf</a><a href="../../index.html#techniques?a=lut">lut</a></span><p class="ah">For every δ from 0 to 1599 nm the transmitted spectrum sin²(πδ/λ)·S(λ) is integrated against the color-matching functions; the 1600 colors are the LUT the field is shaded with. Order 1 (0–560 nm) is where the plates live: black → gray → warm white → amber → orange → red; the mauve and blue of 560–700 are the cool lanes.</p></li><li class="vr"><button type="button" data-t="retardation-field"><span class="vn">Retardation field</span><span class="vid">retardation-field</span></button><span class="at"><a href="../../index.html#techniques?a=field">field</a><a href="../../index.html#techniques?a=retardation">retardation</a><a href="../../index.html#techniques?a=oscillation">oscillation</a></span><p class="ah">Each family is one expression for δ. The sheet keeps δ in the orange-red most of the time (shape 2.4 dwells near d0) and dips to white or peaks to blue briefly; the load family is real plane-stress mechanics; the conoscopes are the textbook interference figures.</p></li><li class="vr"><button type="button" data-t="axis-field"><span class="vn">Slow-axis field ψ</span><span class="vid">axis-field</span></button><span class="at"><a href="../../index.html#techniques?a=direction">direction</a><a href="../../index.html#techniques?a=principal-axis">principal-axis</a><a href="../../index.html#techniques?a=warp">warp</a></span><p class="ah">ψ decides where the isoclinics fall. The domain warp bends the sheet — the plates are not flat starbursts — and warping θ makes lanes of unequal width; neither breaks the physics because δ and ψ are still evaluated from one coordinate.</p></li><li class="vr"><button type="button" data-t="isoclinic"><span class="vn">Isoclinics</span><span class="vid">isoclinic</span></button><span class="at"><a href="../../index.html#techniques?a=polarizer">polarizer</a><a href="../../index.html#techniques?a=extinction">extinction</a><a href="../../index.html#techniques?a=wedge">wedge</a></span><p class="ah">Multiplies the whole image; the black wedges are not masks but extinction where the material axis is parallel to the polarizer. Spinning β sweeps them around the focus.</p></li><li class="vr"><button type="button" data-t="envelope"><span class="vn">Envelope</span><span class="vid">envelope</span></button><span class="at"><a href="../../index.html#techniques?a=envelope">envelope</a><a href="../../index.html#techniques?a=vignette">vignette</a><a href="../../index.html#techniques?a=floor">floor</a></span><p class="ah">mix(floor, chart(δ) · iso, env): the load point is opaque, the far field sinks, nothing reaches 0.</p></li><li class="vr"><button type="button" data-t="plate-look"><span class="vn">Plate look (camera + grade)</span><span class="vid">plate-look</span></button><span class="at"><a href="../../index.html#techniques?a=white-balance">white-balance</a><a href="../../index.html#techniques?a=hue-compression">hue-compression</a><a href="../../index.html#techniques?a=shoulder">shoulder</a></span><p class="ah">Applied to the chart once (1600 entries), so per-pixel cost is a lookup; this is the step that turns a textbook chart into the plate palette.</p></li><li class="vr"><button type="button" data-t="soft-focus"><span class="vn">Post defocus</span><span class="vid">soft-focus</span></button><span class="at"><a href="../../index.html#techniques?a=blur">blur</a><a href="../../index.html#techniques?a=gaussian">gaussian</a></span><p class="ah">One gaussian over the finished color image; blurring after the chart is what mixes neighboring lanes into the gray-mauve transitions.</p></li><li class="vr"><button type="button" data-t="film-grain"><span class="vn">Mono grain</span><span class="vid">film-grain</span></button><span class="at"><a href="../../index.html#techniques?a=grain">grain</a><a href="../../index.html#techniques?a=noise">noise</a></span><p class="ah">Multiplicative hashed noise, identical across channels.</p></li><li class="vr"><button type="button" data-t="polariscope-motion"><span class="vn">Polariscope motion</span><span class="vid">polariscope-motion</span></button><span class="at"><a href="../../index.html#techniques?a=rotation">rotation</a><a href="../../index.html#techniques?a=breath">breath</a><a href="../../index.html#techniques?a=flow">flow</a></span><p class="ah">Every motion is a physical control of the instrument: rotate the polarizer, load the sheet, turn the sheet.</p></li></ul></div></details>

  <details class="acc" name="notes" id="aPts"><summary><span>Callouts <i>10</i></span></summary><div class="ab"><ol class="steps"><li><b>CHRT · Michel-Lévy chart · color(δ) = ∫ S(λ) sin²(πδ/λ) x̄ȳz̄(λ) dλ, tungsten 3000 K</b><span>u 0.62 · v 0.20 · michel-levy-chart</span></li><li><b>RETD · Retardation · δ = 520 + 200·osc(7θ) − 80r nm; red is δ ≈ 430–560, pink-white ≈ 320, steel blue ≈ 640</b><span>u 0.80 · v 0.40 · retardation-field</span></li><li><b>ISOC · Isoclinic · slow axis ∥ polarizer at β = −90°: sin²(ψ − β)^4 → 0, the wide black wedge</b><span>u 0.46 · v 0.08 · isoclinic</span></li><li><b>ISOC · Second arm · β + 180°, its own width (^1.2) and a .1·sin(ψ − β) skew: the arms are not mirror images</b><span>u 0.50 · v 0.92 · isoclinic</span></li><li><b>WARP · Warp · the sheet is domain-warped by value noise (.1 W at 1.2 cycles) and θ by 1.0·(sin 3θ/3 + sin 5θ/5): lanes bend and thicken</b><span>u 0.22 · v 0.42 · axis-field</span></li><li><b>PNCH · Pinch · envelope → 0 inside r &lt; .02 W; the load point is opaque</b><span>u 0.47 · v 0.34 · envelope</span></li><li><b>GRDE · Grade · hues compressed .75 toward 6° and 196° in display space; blue end desaturated .85; highlight bloom .4 at σ 5 % W</b><span>u 0.30 · v 0.62 · plate-look</span></li><li><b>BLUR · Defocus · gaussian σ = .4 % of width after the chart, so lanes bleed</b><span>u 0.10 · v 0.85 · soft-focus</span></li><li><b>GRN · Grain · mono, 2 %, 1 px cells; channels correlate .95 in the source</b><span>u 0.70 · v 0.90 · film-grain</span></li><li><b>MOTN · Motion · polarizer spins 2°/s (wedges sweep), δ0 breathes ±40 nm, lanes flow .15 rad/s (M)</b><span>u 0.90 · v 0.62 · polariscope-motion</span></li></ol></div></details>
