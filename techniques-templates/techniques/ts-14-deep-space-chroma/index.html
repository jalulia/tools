  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Deep Space Chroma · birefringence</b><span class="code">TS-14</span></span>
  <span class="pager"><a href="../../techniques/ts-13-glyph-field-animation/index.html" title="ASCII glyph-field animations">← TS-13</a><a href="../../index.html#techniques"><span class="n">14</span>&nbsp;/ 14</a><a class="off">→</a></span> <p class="kicker">Technique · TS-14</p><h1 class="lede">A stressed birefringent sheet between polarizers, integrated over the spectrum.</h1><div class="body"><p>Twenty-one key visuals, one instrument: a polariscope. A birefringent material splits light into two rays with a retardation δ between them; between crossed polarizers each wavelength is transmitted as sin²(πδ/λ), so integrating a tungsten source through the CIE color-matching functions gives the Michel-Lévy sequence — black, grey, warm white, amber, orange, red, mauve, blue, cyan — as a function of δ alone. Where the material’s slow axis lines up with a polarizer the light is cut regardless of δ: those are the isoclinics, the black wedges through every focus.</p><p>What varies between plates is only the retardation field and the axis field: an oriented sheet whose δ oscillates around a focus, point loads (Flamant), a uniaxial conoscopic figure (δ ∝ r², a Maltese cross), a biaxial one (δ ∝ |p−A|·|p−B|, hyperbolic isogyres), a ribbon, a ring. The plate look is the camera on top of the physics: partial white balance, a green dip, a teal-and-orange hue compression, a film shoulder that blows the cores to pink-white, a 1.2 % defocus and mono grain. Rotating the polarizer sweeps the isoclinics; breathing δ moves the fringes.</p></div>
  <div class="meta" style="display:block"><h2>Pass order</h2><ol class="steps"><li><div><b>chart</b> · integrate the spectrum once → color(δ)</div></li><li><div><b>warp</b> · (x,y) += wa · noise2</div></li><li><div><b>field</b> · δ(x,y) and ψ(x,y) for the family</div></li><li><div><b>isoclinic</b> · sin²(m(ψ − β))^sharp</div></li><li><div><b>envelope</b> · pinch × vignette × lobe gain, mix from the floor</div></li><li><div><b>defocus</b> · gaussian σ .004 W</div></li><li><div><b>bloom</b> · thresholded highlights, σ .05 W, add .4</div></li><li><div><b>grain</b> · mono ×(1 + .02 n)</div></li></ol></div>

  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>michel-levy-chart</b> · Spectral Michel-Lévy chart — For every δ from 0 to 1599 nm the transmitted spectrum sin²(πδ/λ)·S(λ) is integrated against the color-matching functions; the 1600 colors are the LUT the field is shaded with. Order 1 (0–560 nm) is where the plates live: black → grey → warm white → amber → orange → red; the mauve and blue of 560–700 are the cool lanes.</div></li><li><div><b>retardation-field</b> · Retardation field — Each family is one expression for δ. The sheet keeps δ in the orange-red most of the time (shape 2.4 dwells near d0) and dips to white or peaks to blue briefly; the load family is real plane-stress mechanics; the conoscopes are the textbook interference figures.</div></li><li><div><b>axis-field</b> · Slow-axis field ψ — ψ decides where the isoclinics fall. The domain warp bends the sheet — the plates are not flat starbursts — and warping θ makes lanes of unequal width; neither breaks the physics because δ and ψ are still evaluated from one coordinate.</div></li><li><div><b>isoclinic</b> · Isoclinics — Multiplies the whole image; the black wedges are not masks but extinction where the material axis is parallel to the polarizer. Spinning β sweeps them around the focus.</div></li><li><div><b>envelope</b> · Envelope — mix(floor, chart(δ) · iso, env): the load point is opaque, the far field sinks, nothing reaches 0.</div></li><li><div><b>plate-look</b> · Plate look (camera + grade) — Applied to the chart once (1600 entries), so per-pixel cost is a lookup; this is the step that turns a textbook chart into the plate palette.</div></li><li><div><b>soft-focus</b> · Post defocus — One gaussian over the finished color image; blurring after the chart is what mixes neighboring lanes into the grey-mauve transitions.</div></li><li><div><b>film-grain</b> · Mono grain — Multiplicative hashed noise, identical across channels.</div></li><li><div><b>polariscope-motion</b> · Polariscope motion — Every motion is a physical control of the instrument: rotate the polarizer, load the sheet, turn the sheet.</div></li></ol></div>
  <div class="meta static" style="display:block"><h2>10 reads · u, v on the sheet</h2><ol class="steps"><li><div><b>CHRT</b> · Michel-Lévy chart · color(δ) = ∫ S(λ) sin²(πδ/λ) x̄ȳz̄(λ) dλ, tungsten 3000 K <span class="ro">u 0.62 · v 0.20 · michel-levy-chart</span></div></li><li><div><b>RETD</b> · Retardation · δ = 520 + 200·osc(7θ) − 80r nm; red is δ ≈ 430–560, pink-white ≈ 320, steel blue ≈ 640 <span class="ro">u 0.80 · v 0.40 · retardation-field</span></div></li><li><div><b>ISOC</b> · Isoclinic · slow axis ∥ polarizer at β = −90°: sin²(ψ − β)^4 → 0, the wide black wedge <span class="ro">u 0.46 · v 0.08 · isoclinic</span></div></li><li><div><b>ISOC</b> · Second arm · β + 180°, its own width (^1.2) and a .1·sin(ψ − β) skew: the arms are not mirror images <span class="ro">u 0.50 · v 0.92 · isoclinic</span></div></li><li><div><b>WARP</b> · Warp · the sheet is domain-warped by value noise (.1 W at 1.2 cycles) and θ by 1.0·(sin 3θ/3 + sin 5θ/5): lanes bend and thicken <span class="ro">u 0.22 · v 0.42 · axis-field</span></div></li><li><div><b>PNCH</b> · Pinch · envelope → 0 inside r &lt; .02 W; the load point is opaque <span class="ro">u 0.47 · v 0.34 · envelope</span></div></li><li><div><b>GRDE</b> · Grade · hues compressed .75 toward 6° and 196° in display space; blue end desaturated .85; highlight bloom .4 at σ 5 % W <span class="ro">u 0.30 · v 0.62 · plate-look</span></div></li><li><div><b>BLUR</b> · Defocus · gaussian σ = .4 % of width after the chart, so lanes bleed <span class="ro">u 0.10 · v 0.85 · soft-focus</span></div></li><li><div><b>GRN</b> · Grain · mono, 2 %, 1 px cells; channels correlate .95 in the source <span class="ro">u 0.70 · v 0.90 · film-grain</span></div></li><li><div><b>MOTN</b> · Motion · polarizer spins 2°/s (wedges sweep), δ0 breathes ±40 nm, lanes flow .15 rad/s (M) <span class="ro">u 0.90 · v 0.62 · polariscope-motion</span></div></li></ol></div>
