<body class="plate-page" data-root="../../">
<nav class="nav" id="nav" aria-label="Site navigation"></nav>
<main class="plate">
  <section class="notes" id="copy"></section>
  <section class="figure" id="stage">
    <div class="cvwrap"><canvas id="cv" aria-label="technique study, read"></canvas></div>
    <div class="live" id="live"></div>
    <div class="log" id="log">
      <div class="ctl">
        <button id="bRead" type="button" class="on" title="toggle the read overlay">Read</button>
        <button id="bReplay" type="button" title="re-run the read (space)">↻ Replay</button>
        <button id="bMode" type="button" title="cycle rebuild / reference / split (R)">Rebuild</button>
        <button id="bMotion" type="button" hidden title="run the motion version (M)">Motion</button>
        <button id="bLive" type="button" hidden title="open the live DOM version (L)">Live</button>
        <button id="bSpec" type="button" title="open the machine-readable spec (S)">Spec ⇥</button>
      </div>
      <div class="vtabs" id="vtabs"></div>
      <div class="lbody">
        <div class="lh"><span>Track log</span><span id="ctr">0 / 10</span></div>
        <div class="rows" id="rows"></div>
        <div class="read" id="read"><b>Read</b><span id="readtxt">Hover or select a point.</span><code id="readcode"></code></div>
        <div class="fid" id="fid"></div>
      </div>
    </div>
    <div class="rel" id="rel"></div>
  </section>
</main>
<aside class="spec" id="spec" aria-hidden="true">
  <div class="sh"><span>Technique spec · <b id="specid"></b> · JSON</span><span><button id="speccopy" type="button">Copy</button><button id="specclose" type="button">Close ×</button></span></div>

</aside>
