<html lang="en">
<head>
<meta charset="UTF-8">

<title>Deep Space Chroma · polariscope engine · TS-14</title>
<style>
  :root{--ink:#F6F5F2;--grey:#9B9A95;--hair:rgba(255,255,255,.14);--acc:#F4551E;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0e0d0c;color:var(--ink);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;overflow:hidden}
  #stage{position:absolute;inset:0;display:grid;place-items:center;background:#0e0d0c}
  #out{display:block;max-width:100%;max-height:100%;cursor:crosshair}
  #ui{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 12px;background:rgba(14,13,12,.86);border:1px solid var(--hair);backdrop-filter:blur(6px)}

  #ui input[type=range]{width:70px;accent-color:var(--acc)}
  #ui select,#ui button{font:inherit;letter-spacing:inherit;text-transform:inherit;background:#1e1c1a;color:var(--ink);border:1px solid var(--hair);padding:4px 7px;cursor:pointer}
  #ui button:hover,#ui select:hover{border-color:var(--ink)}
  #ui .v{color:var(--ink);min-width:3.2em;text-align:right}
  #ui .sep{width:1px;height:18px;background:var(--hair)}
  #hd{position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;color:var(--grey);pointer-events:none;mix-blend-mode:difference}
  #hd b{color:var(--ink);font-weight:500}
  #chart{position:absolute;left:12px;top:34px;width:320px;height:10px;border:1px solid var(--hair);pointer-events:none}
  #hint{position:absolute;right:14px;top:34px;color:var(--grey);pointer-events:none;mix-blend-mode:difference}
  body.embed #ui,body.embed #hd,body.embed #hint,body.embed #chart{display:none}
</style>
</head>

window.CHROMA=(function(){
  const C={}; const TAU=Math.PI*2;
  /* CIE 1931 2° CMF, Wyman–Sloan–Shirley multi-lobe fit */

  /* Michel-Lévy chart for a crossed polariscope: color(δ) for δ = 0 … N−1 nm.

      L=0.2126*r+0.7152*gg+0.0722*b; let t=Math.min(1,Math.max(0,(L-0.6)/0.45)); t=t*t*(3-2*t)*0.85;
      r=r*(1-t)+L*1.02*t; gg=gg*(1-t)+L*0.97*t; b=b*(1-t)+L*0.96*t;

      env=Math.exp(-(d/P.width)*(d/P.width)*2); const s=Math.min(1,Math.max(0,(r-P.R0)/0.03)); env*=s*s*(3-2*s); env*=1-(P.vig||0)*r*r; }
    else if(P.type==='load'){ let sx=P.sx||0, sy=P.sy||0, txy=P.txy||0; for(const L of P.loads){ const dx=x-L[0], dy=y-L[1]; const r=Math.hypot(dx,dy)+0.004; const th=Math.atan2(dy,dx); const a=L[2]*Math.PI/180; const sr=-2*L[3]*Math.cos(th-a)/(Math.PI*Math.pow(r,P.decay||1));
        const c=Math.cos(th), s=Math.sin(th); sx+=sr*c*c; sy+=sr*s*s; txy+=sr*s*c; }
      const ds=Math.sqrt((sx-sy)*(sx-sy)+4*txy*txy); delta=(P.dmin||0)+(P.K||1)*ds; psi=0.5*Math.atan2(2*txy,sx-sy); const dx=x-cx, dy=y-cy, r=Math.hypot(dx,dy); const s=Math.min(1,Math.max(0,r/(P.core||0.02))); env=s*s*(3-2*s)*(1-(P.vig||0)*r*r); }
    else if(P.type==='uniaxial'){ const dx=x-cx, dy=y-cy, r=Math.hypot(dx,dy); delta=P.d0+P.c*r*r; psi=Math.atan2(dy,dx); env=1-(P.vig||0)*r*r; }
    else if(P.type==='biaxial'){ const ax=cx-P.sep/2, bx=cx+P.sep/2; const dax=x-ax, day=y-cy, dbx=x-bx, dby=y-cy; const ra=Math.hypot(dax,day), rb=Math.hypot(dbx,dby); delta=P.d0+P.c*ra*rb; psi=0.5*(Math.atan2(day,dax)+Math.atan2(dby,dbx)); const r=Math.hypot(x-cx,y-cy); env=1-(P.vig||0)*r*r; }
    else { /* sheet: oriented lobes around a focus */ const dx=x-cx, dy=y-cy, r=Math.hypot(dx,dy); const th=Math.atan2(dy,dx)+(P.rot||0)*t; const w=th+P.warp*(Math.sin(3*th+P.s1+0.05*t)/3+Math.sin(5*th+P.s2)/5);
      let osc=Math.cos(P.k*w+(P.ph||0)+(P.flow||0)*t); osc=Math.sign(osc)*Math.pow(Math.abs(osc),osc<0?(P.shapeN!==undefined?P.shapeN:(P.shape||1)):(P.shape||1)); /* shapeN sharpens the dips: the pale lanes are narrower than the red ones */ const d0=P.d0+(P.breath||0)*Math.sin(0.4*t);

  C.iso=function(P,psi,t){ const beta=(P.beta+(P.spin||0)*t)*Math.PI/180; const pp=psi-beta+(P.skew||0)*Math.sin(psi-beta); let s=Math.sin((P.m||2)*pp); const near=Math.cos(pp)>0; /* nearer the β arm or the β+180 arm — each arm has its own width */ s=Math.pow(s*s,near?(P.sharp||1):(P.sharp2!==undefined?P.sharp2:(P.sharp||1))); return (P.circ||0)+(1-(P.circ||0))*s; };
  return C;
})();

const RANGE={k:[1,12,1],warp:[0,1,0.01],d0:[0,1200,10],A:[0,600,10],shape:[0.3,4,0.05],shapeN:[0.3,6,0.05],pin:[0,0.2,0.005],twist:[-4,4,0.05],spiral:[0,2.5,0.05],beta:[-180,180,1],m:[1,2,1],skew:[0,0.5,0.01],sharp:[0.2,6,0.05],sharp2:[0.2,6,0.05],circ:[0,1,0.01],core:[0,0.15,0.005],vig:[0,2,0.01],spin:[0,20,0.5],breath:[0,200,5],flow:[0,1,0.01],K:[1,30,0.5],decay:[0.2,2,0.05],sx:[-400,400,5],sy:[-400,400,5],txy:[-400,400,5],c:[0,6000,50],sep:[0,0.8,0.01],amp:[0,0.3,0.005],freq:[0.2,1.5,0.01],period:[0.04,0.3,0.005],width:[0.04,0.4,0.005],tilt:[-2,2,0.05],R:[0.04,0.3,0.005],R0:[0,0.2,0.005],blur:[0,0.03,0.001],bloom:[0,1,0.01],grain:[0,0.06,0.002],wa:[0,0.3,0.005],wf:[0.5,6,0.1],wdrift:[0,0.5,0.01],dmin:[0,800,10],rad:[-600,600,10],ph:[0,6.28,0.01]};
let P=JSON.parse(JSON.stringify(PRESETS[0][2])); let blur=0.004, grain=0.02, bloom=0.5, playing=true, t0=performance.now(), tAcc=0;

/* ---------- WebGL ---------- */
const gl=document.createElement('canvas').getContext('webgl',{preserveDrawingBuffer:true,antialias:false});
const VS='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const FS=`precision highp float;
uniform vec2 u_res;uniform float u_t;uniform int u_type;uniform vec2 u_c;
uniform float u_wa,u_wf,u_wdrift,u_dmin,u_rad,u_sharp2,u_shapeN;
uniform float u_k,u_warp,u_s1,u_s2,u_d0,u_A,u_shape,u_pin,u_twist,u_spiral,u_beta,u_m,u_skew,u_sharp,u_circ,u_core,u_vig,u_spin,u_breath,u_flow,u_rot,u_gain;
uniform vec4 u_lobe;uniform vec3 u_occ[4];uniform int u_nocc;
uniform vec4 u_loads[6];uniform int u_nl;uniform float u_K,u_decay,u_sx,u_sy,u_txy;
uniform float u_cc,u_sep;uniform float u_amp,u_freq,u_ph,u_period,u_width,u_tilt,u_R,u_R0;
uniform vec3 u_floor;uniform sampler2D u_chart;
const float PI=3.14159265359;const float TAU=6.28318530718;
float tanh_(float x){ float e=exp(2.*clamp(x,-20.,20.)); return (e-1.)/(e+1.); }
float sstep(float e,float x){float s=clamp(x/max(e,1e-4),0.,1.);return s*s*(3.-2.*s);}
float hsh(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); float a=hsh(i),b=hsh(i+vec2(1.,0.)),c=hsh(i+vec2(0.,1.)),d=hsh(i+vec2(1.,1.)); return mix(mix(a,b,f.x),mix(c,d,f.x),f.y)*2.-1.; }
float noise2(vec2 p){ return vn(p)+0.5*vn(p*2.1+vec2(5.2,1.7)); }
void main(){
  vec2 uv=vec2(gl_FragCoord.x,u_res.y-gl_FragCoord.y)/u_res.x; float x=uv.x,y=uv.y; float delta=0.,psi=0.,env=1.; float t=u_t;
  if(u_wa>0.){ float dr=u_wdrift*t; float nx=noise2(vec2(x*u_wf+7.3+dr,y*u_wf+1.1)); float ny=noise2(vec2(x*u_wf+3.7,y*u_wf+9.2+dr)); x+=u_wa*nx; y+=u_wa*ny; }
  if(u_type==1){ float ph=TAU*(u_freq*x+u_ph+0.01*t); float yc=u_c.y+u_amp*sin(ph)+u_tilt*(x-.5); float dy=u_amp*TAU*u_freq*cos(ph)+u_tilt; float d=(y-yc)/sqrt(1.+dy*dy);
    delta=u_d0+u_A*tanh_(d/u_period)+40.*sin(u_flow*t); psi=atan(dy); env=exp(-(d/u_width)*(d/u_width)*2.)*(1.-u_vig*((x-.5)*(x-.5)+(y-.35)*(y-.35))); }
  else if(u_type==2){ vec2 dv=vec2(x,y)-u_c; float r=length(dv); float th=atan(dv.y,dv.x); float d=r-u_R; delta=u_d0+u_A*tanh_(d/u_period)+40.*sin(u_flow*t); psi=th+PI/2.;
    env=exp(-(d/u_width)*(d/u_width)*2.)*sstep(.03,r-u_R0)*(1.-u_vig*r*r); }
  else if(u_type==3){ float sx=u_sx,sy=u_sy,txy=u_txy; for(int i=0;i<6;i++){ if(i>=u_nl)break; vec2 dv=vec2(x,y)-u_loads[i].xy; float r=length(dv)+.004; float th=atan(dv.y,dv.x); float a=u_loads[i].z; float sr=-2.*u_loads[i].w*cos(th-a)/(PI*pow(r,u_decay)); float c=cos(th),s=sin(th); sx+=sr*c*c; sy+=sr*s*s; txy+=sr*s*c; }
    delta=u_dmin+u_K*sqrt((sx-sy)*(sx-sy)+4.*txy*txy); psi=.5*atan(2.*txy,sx-sy); float r=length(vec2(x,y)-u_c); env=sstep(u_core,r)*(1.-u_vig*r*r); }
  else if(u_type==4){ vec2 dv=vec2(x,y)-u_c; float r=length(dv); delta=u_d0+u_cc*r*r; psi=atan(dv.y,dv.x); env=1.-u_vig*r*r; }
  else if(u_type==5){ vec2 A=vec2(u_c.x-u_sep/2.,u_c.y), B=vec2(u_c.x+u_sep/2.,u_c.y); vec2 da=vec2(x,y)-A, db=vec2(x,y)-B; delta=u_d0+u_cc*length(da)*length(db); psi=.5*(atan(da.y,da.x)+atan(db.y,db.x)); float r=length(vec2(x,y)-u_c); env=1.-u_vig*r*r; }
  else { vec2 dv=vec2(x,y)-u_c; float r=length(dv); float th=atan(dv.y,dv.x)+u_rot*t; float w=th+u_warp*(sin(3.*th+u_s1+0.05*t)/3.+sin(5.*th+u_s2)/5.);
    float osc=cos(u_k*w+u_ph+u_flow*t); osc=sign(osc)*pow(abs(osc),osc<0.?u_shapeN:u_shape); float d0=u_d0+u_breath*sin(.4*t); delta=(d0+u_A*osc+u_rad*r)*(1.+u_pin/(r+.01)); psi=th+u_twist*r+u_spiral*log(r+.002);
    env=sstep(u_core,r)*(1.-u_vig*r*r); env*=u_lobe.x+u_lobe.y*(.5+.5*sin(th*u_lobe.z+u_lobe.w));
    for(int i=0;i<4;i++){ if(i>=u_nocc)break; float d=th-u_occ[i].x; d=abs(atan(sin(d),cos(d))); float qq=clamp((d-(u_occ[i].y-u_occ[i].z))/(2.*u_occ[i].z),0.,1.); env*=qq*qq*(3.-2.*qq); } }
  float beta=(u_beta+u_spin*t)*PI/180.; float pp=psi-beta+u_skew*sin(psi-beta); float s=sin(u_m*pp); float iso=u_circ+(1.-u_circ)*pow(s*s,cos(pp)>0.?u_sharp:u_sharp2);
  env=clamp(env*u_gain,0.,1.)*iso; delta=clamp(delta,0.,1599.); vec3 col=texture2D(u_chart,vec2((delta+.5)/1600.,.5)).rgb; gl_FragColor=vec4(mix(u_floor,col,env),1.);

function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}
const prog=gl.createProgram(); gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS)); gl.linkProgram(prog); gl.useProgram(prog);
const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW); const loc=gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(prog,n);
/* chart texture (1600 × 1) from the shared spectral model */
const CH=window.CHROMA.chart(); const tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex); const td=new Uint8Array(1600*4); for(let i=0;i<1600;i++){ td[i*4]=CH[i*3]*255; td[i*4+1]=CH[i*3+1]*255; td[i*4+2]=CH[i*3+2]*255; td[i*4+3]=255; }
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1600,1,0,gl.RGBA,gl.UNSIGNED_BYTE,td); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
(function(){ const c=$('chart'); if(!c)return; const x=c.getContext('2d'); const id=x.createImageData(320,10); for(let i=0;i<320;i++){ const k=Math.floor(i/320*800)*3; for(let j=0;j<10;j++){ const o=(j*320+i)*4; id.data[o]=CH[k]*255; id.data[o+1]=CH[k+1]*255; id.data[o+2]=CH[k+2]*255; id.data[o+3]=255; } } x.putImageData(id,0,0); })();
const TYPES={sheet:0,ribbon:1,ring:2,load:3,uniaxial:4,biaxial:5};
function drawField(w,h,t){ gl.canvas.width=w; gl.canvas.height=h; gl.viewport(0,0,w,h);
  gl.uniform2f(U('u_res'),w,h); gl.uniform1f(U('u_t'),t); gl.uniform1i(U('u_type'),TYPES[P.type]||0); gl.uniform2f(U('u_c'),P.cx||0.5,P.cy||0.35);
  const f=(n,v)=>gl.uniform1f(U(n),v||0);
  f('u_wa',P.wa||0); f('u_wf',P.wf||2.2); f('u_wdrift',P.wdrift||0); f('u_dmin',P.dmin||0); f('u_rad',P.rad||0); f('u_sharp2',P.sharp2!==undefined?P.sharp2:(P.sharp||1)); f('u_shapeN',P.shapeN!==undefined?P.shapeN:(P.shape||1)); f('u_k',P.k); f('u_warp',P.warp); f('u_s1',P.s1); f('u_s2',P.s2); f('u_d0',P.d0); f('u_A',P.A); f('u_shape',P.shape||1); f('u_pin',P.pin); f('u_twist',P.twist); f('u_spiral',P.spiral); f('u_beta',P.beta); f('u_m',P.m||2); f('u_skew',P.skew); f('u_sharp',P.sharp||1); f('u_circ',P.circ); f('u_core',P.core||0.02); f('u_vig',P.vig); f('u_spin',P.spin); f('u_breath',P.breath); f('u_flow',P.flow); f('u_rot',P.rot); f('u_gain',P.gain||1);
  const lb=P.lobe||[1,0,1,0]; gl.uniform4f(U('u_lobe'),lb[0],lb[1],lb[2],lb[3]);
  const occ=new Float32Array(12); const oc=(P.occ||[]).slice(0,4); oc.forEach((o,i)=>{occ[i*3]=o[0]*Math.PI/180;occ[i*3+1]=o[1]*Math.PI/180;occ[i*3+2]=(o[2]!==undefined?o[2]:o[1]*0.4)*Math.PI/180;}); gl.uniform3fv(U('u_occ'),occ); gl.uniform1i(U('u_nocc'),oc.length);
  const ld=new Float32Array(24); const ls=(P.loads||[]).slice(0,6); ls.forEach((l,i)=>{ld[i*4]=l[0];ld[i*4+1]=l[1];ld[i*4+2]=l[2]*Math.PI/180;ld[i*4+3]=l[3];}); gl.uniform4fv(U('u_loads'),ld); gl.uniform1i(U('u_nl'),ls.length);
  f('u_K',P.K); f('u_decay',P.decay||1); f('u_sx',P.sx); f('u_sy',P.sy); f('u_txy',P.txy); f('u_cc',P.c); f('u_sep',P.sep);
  f('u_amp',P.amp); f('u_freq',P.freq||1); f('u_ph',P.ph); f('u_period',P.period||0.15); f('u_width',P.width||0.15); f('u_tilt',P.tilt); f('u_R',P.R||0.12); f('u_R0',P.R0||0.05);
  gl.uniform3f(U('u_floor'),FLOOR[0]/255,FLOOR[1]/255,FLOOR[2]/255); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex); gl.uniform1i(U('u_chart'),0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4); }

/* ---------- compose: defocus + grain ---------- */
const out=$('out'), ctx=out.getContext('2d'); let W=0,H=0;
const grainTile=(()=>{ const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d'); const id=x.createImageData(256,256); let s=1234567; for(let i=0;i<id.data.length;i+=4){ s=s+0x6D2B79F5|0; let v=Math.imul(s^s>>>15,1|s); v=v+Math.imul(v^v>>>7,61|v)^v; const n=((v^v>>>14)>>>0)/4294967296; const g=128+(n-0.5)*2*60; id.data[i]=id.data[i+1]=id.data[i+2]=g; id.data[i+3]=255; } x.putImageData(id,0,0); return c; })();
function fit(){ const r=$('stage').getBoundingClientRect(); const asp=0.7; let w=r.width, h=w*asp; if(h>r.height){ h=r.height; w=h/asp; } const dpr=Math.min(2,devicePixelRatio||1); W=Math.round(w*dpr); H=Math.round(h*dpr); out.width=W; out.height=H; out.style.width=w+'px'; out.style.height=h+'px'; }
function compose(t,targetCtx,TW,TH,scale,gAmp){ const fw=Math.max(64,Math.round(TW*scale)), fh=Math.max(45,Math.round(TH*scale)); drawField(fw,fh,t);
  targetCtx.setTransform(1,0,0,1,0,0); targetCtx.globalCompositeOperation='source-over'; targetCtx.globalAlpha=1; targetCtx.imageSmoothingEnabled=true; targetCtx.imageSmoothingQuality='high';
  const pd=Math.ceil(blur*TW*2.5); targetCtx.filter=`blur(${(blur*TW).toFixed(1)}px)`; targetCtx.drawImage(gl.canvas,-pd,-pd,TW+2*pd,TH+2*pd); targetCtx.filter='none';
  if(bloom>0){ targetCtx.save(); targetCtx.globalCompositeOperation='lighter'; targetCtx.globalAlpha=bloom; targetCtx.filter=`blur(${(0.05*TW).toFixed(1)}px) brightness(0.8) contrast(2.5)`; targetCtx.drawImage(gl.canvas,-pd,-pd,TW+2*pd,TH+2*pd); targetCtx.restore(); targetCtx.filter='none'; }
  if(gAmp>0){ const pat=targetCtx.createPattern(grainTile,'repeat'); targetCtx.save(); targetCtx.translate(((t*37)|0)%256,((t*53)|0)%256); targetCtx.globalCompositeOperation='overlay'; targetCtx.globalAlpha=Math.min(1,gAmp*10); targetCtx.fillStyle=pat; targetCtx.fillRect(-256,-256,TW+512,TH+512); targetCtx.restore(); targetCtx.globalCompositeOperation='source-over'; targetCtx.globalAlpha=1; } }
let frames=0,fpsT=performance.now();
function loop(now){ if(playing)tAcc+=(now-t0)/1000; t0=now; compose(tAcc,ctx,W,H,0.3,grain); frames++; if(now-fpsT>1000){ $('stat').textContent=`${frames} fps · ${W}×${H} · field ${Math.round(W*0.3)} px`; frames=0; fpsT=now; } requestAnimationFrame(loop); }

/* ---------- UI ---------- */
const sel=$('preset'); PRESETS.forEach(p=>{ const o=document.createElement('option'); o.value=p[0]; o.textContent=p[1]; sel.appendChild(o); });
function buildSliders(){ const s=$('sliders'); s.innerHTML=''; const show=(SL[P.type]||SL.sheet).concat(['blur','bloom','grain']);
  for(const k of show){ const d=RANGE[k]; if(!d)continue; const lab=document.createElement('label'); const val=k==='blur'?blur:k==='grain'?grain:k==='bloom'?bloom:(P[k]??0); lab.innerHTML=`${k} <input type="range" min="${d[0]}" max="${d[1]}" step="${d[2]}" value="${val}"><span class="v">${(+val).toFixed(d[2]>=1?0:3)}</span>`; const inp=lab.querySelector('input'); inp.oninput=()=>{ const v=+inp.value; if(k==='blur')blur=v; else if(k==='grain')grain=v; else if(k==='bloom')bloom=v; else P[k]=v; lab.querySelector('.v').textContent=v.toFixed(d[2]>=1?0:3); }; s.appendChild(lab); } }
function load(id){ const p=PRESETS.find(z=>z[0]===id)||PRESETS[0]; P=JSON.parse(JSON.stringify(p[2])); $('type').value=P.type; sel.value=p[0]; blur=(P.blur!==undefined?P.blur:0.004); grain=0.02; bloom=(P.bloom!==undefined?P.bloom:0.35); buildSliders(); }
sel.onchange=()=>load(sel.value);
$('type').onchange=()=>{ const t=$('type').value; const base={sheet:SHEET,load:LOAD,uniaxial:UNI,biaxial:BI,ribbon:RB,ring:RG}[t]({}); P=Object.assign(base,{cx:P.cx??0.5,cy:P.cy??0.35}); if(t==='load')P.loads=[[P.cx,P.cy,-90,1]]; buildSliders(); };
$('play').onclick=()=>{ playing=!playing; $('play').textContent=playing?'Pause':'Play'; };
function rnd(){ const r=(a,b)=>a+Math.random()*(b-a); P=SHEET({cx:r(.1,.9),cy:r(.08,.62),k:Math.round(r(3,8)),warp:r(.2,.7),twist:Math.random()<.4?r(-3,3):0,spiral:Math.random()<.2?r(.8,2):0,beta:Math.round(r(-180,180)),m:Math.random()<.5?1:2,skew:r(0,.3),d0:r(380,560),A:r(120,260),shape:r(1,3),core:r(.015,.06),vig:r(.15,.5),s1:r(0,6.3),s2:r(0,6.3),lobe:[0.7,0.3,r(1,3),r(0,6.3)]}); $('type').value='sheet'; buildSliders(); }
$('rnd').onclick=rnd;
$('exp').onclick=()=>{ const c=document.createElement('canvas'); const EW=2000, EH=1400; c.width=EW; c.height=EH; compose(tAcc,c.getContext('2d'),EW,EH,0.5,grain); const a=document.createElement('a'); a.download=`deep-space-chroma-${sel.value}-${Math.round(tAcc*10)}.png`; a.href=c.toDataURL('image/png'); a.click(); };
$('copy').onclick=()=>{ const j=JSON.stringify(Object.assign({},P,{blur,grain,bloom}),null,1); (navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).catch(()=>prompt('preset',j)); };
let drag=false; out.addEventListener('pointerdown',e=>{drag=true;setFocus(e);}); addEventListener('pointermove',e=>{ if(drag)setFocus(e); }); addEventListener('pointerup',()=>drag=false);
function setFocus(e){ const r=out.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.width; if(P.type==='ribbon'){ P.cy=y; } else { P.cx=x; P.cy=y; if(P.loads)P.loads.forEach(l=>{l[0]=x;l[1]=y;}); } }
addEventListener('keydown',e=>{ if(e.key===' '){ e.preventDefault(); $('play').click(); } else if(e.key.toLowerCase()==='e')$('exp').click(); else if(e.key.toLowerCase()==='r')rnd(); });
addEventListener('resize',fit);
load(q.get('preset')||'ref'); if(q.get('t'))tAcc=+q.get('t'); fit(); requestAnimationFrame(now=>{t0=now;loop(now);});
window.__chroma={get P(){return P},set:(o)=>{Object.assign(P,o);},compose,PRESETS,chart:CH};
})();
