  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Vertical line-screen type</b><span class="code">TS-05</span></span>
  <span class="pager"><a href="../../techniques/ts-04-stacked-card-scroll/index.html" title="Stacked card scroll">← TS-04</a><a href="../../index.html#techniques"><span class="n">5</span>&nbsp;/ 14</a><a href="../../techniques/ts-06-riso-plate-separation/index.html" title="Riso three-plate separation">TS-06 →</a></span> <p class="kicker">Technique · TS-05</p><h1 class="lede">Heavy type cut into vertical bars; bar width follows a phase field.</h1><div class="body"><p>One ink on warm paper. Four lines of display type are set with leading shorter than the ascender, so each line overlaps the one above. The type is not printed as type — it prints through a vertical line screen at fixed pitch, and a bar exists only where the letter mask is on. Where two lines overlap the mask doubles and the bars swell to solid.</p><p>A low phase field shifts each bar a few units sideways and steps some regions by half a pitch, so bars break against each other at letter edges. A 0.7 px bleed rounds the bar ends, interiors print a shade darker, and the sheet carries tooth and a faint mottle.</p></div>
  <div class="meta" style="display:block"><h2>Pass order</h2><ol class="steps"><li><div><b>paper</b> · flat fill + mottle</div></li><li><div><b>mask</b> · four text lines summed into a luminance layer, blurred 1.2 px</div></li><li><div><b>phase</b> · perlin offset per (column, y)</div></li><li><div><b>bars</b> · one polygon per continuous run per column</div></li><li><div><b>bleed</b> · 0.7 px blur, soft threshold, interior darkening</div></li><li><div><b>captions</b> · corner blocks, credit, word row</div></li><li><div><b>tooth</b> · mono grain 0.04</div></li></ol></div>
  <div class="meta"><div class="full"><h2>Vocabulary · a technique highlights its reads · an atom finds every use</h2><div class="vocab" id="chips"><div class="vr"><span data-t="line-screen" title="Vertical line screen"><b>LINE</b>line-screen</span><span class="at"><a href="../../index.html#techniques?a=grating">grating</a><i>·</i><a href="../../index.html#techniques?a=mask">mask</a><i>·</i><a href="../../index.html#techniques?a=clip">clip</a></span></div><div class="vr"><span data-t="phase-field" title="Phase field"><b>PHSE</b>phase-field</span><span class="at"><a href="../../index.html#techniques?a=perlin">perlin</a><i>·</i><a href="../../index.html#techniques?a=offset">offset</a><i>·</i><a href="../../index.html#techniques?a=quantise">quantise</a></span></div><div class="vr"><span data-t="ink-bleed" title="Ink bleed"><b>BLED</b>ink-bleed</span><span class="at"><a href="../../index.html#techniques?a=blur">blur</a><i>·</i><a href="../../index.html#techniques?a=gain">gain</a><i>·</i><a href="../../index.html#techniques?a=darken">darken</a></span></div><div class="vr"><span data-t="paper-tooth" title="Paper tooth"><b>TOOTH</b>paper-tooth</span><span class="at"><a href="../../index.html#techniques?a=grain">grain</a><i>·</i><a href="../../index.html#techniques?a=mottle">mottle</a></span></div><div class="vr"><span data-t="caption-label" title="Caption blocks"><b>CAPT</b>caption-label</span><span class="at"><a href="../../index.html#techniques?a=type">type</a><i>·</i><a href="../../index.html#techniques?a=justify">justify</a></span></div></div></div>
  <div><h2>Reference</h2><div class="ro">Reference 05 · line-screened slab-serif type on gray stock, 1448 × 936</div></div><div><h2>Study</h2><div class="nm">Vertical line-screen type</div><div class="ro">TS-05 · Techniques · 5 / 14</div></div></div>
  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>line-screen</b> · Vertical line screen — For every screen column x_k = k·pitch, walk down the page one device pixel at a time, read the summed letter mask at (x_k + phase, y), map it to a bar width and fill each continuous run as one polygon with a left and a right edge per y.</div></li><li><div><b>phase-field</b> · Phase field — phase(x,y) = 2.4·fbm(x/260, y/260) plus half a pitch in regions where the field is high; the bar center is x_k + phase, so bars in neighbouring regions step against each other.</div></li><li><div><b>ink-bleed</b> · Ink bleed — The bar layer is blurred 0.8 px, its alpha is pushed through a soft threshold so the edge swells outward, and the ink color shifts toward ink_deep inside the letters.</div></li><li><div><b>paper-tooth</b> · Paper tooth — Luminance is multiplied by 1 + mottle before the bars land and by ART.grain after, so ink and paper share one tooth.</div></li><li><div><b>caption-label</b> · Caption blocks — Plain fills in the caption color; the word row divides the leftover width equally between the words.</div></li></ol></div>
  <div class="meta static" style="display:block"><h2>11 reads · u, v on the sheet</h2><ol class="steps"><li><div><b>LINE</b> · Line screen · pitch 6.9 u, bar 0.66 pitch inside a letter <span class="ro">u 0.50 · v 0.24 · line-screen</span></div></li><li><div><b>LINE</b> · Bar ends · the mask clips each bar; no bar on bare paper <span class="ro">u 0.20 · v 0.44 · line-screen</span></div></li><li><div><b>MERG</b> · Overlap · two lines of type, density 2, bars merge to solid <span class="ro">u 0.69 · v 0.47 · line-screen</span></div></li><li><div><b>PHSE</b> · Phase field · perlin, period 260 u, shift ± 2.4 u <span class="ro">u 0.36 · v 0.36 · phase-field</span></div></li><li><div><b>PHSE</b> · Half-pitch step · field quantised where |n| &gt; 0.35 <span class="ro">u 0.76 · v 0.66 · phase-field</span></div></li><li><div><b>BLED</b> · Ink bleed · 0.7 px blur, gain 1.15, corners soften <span class="ro">u 0.30 · v 0.72 · ink-bleed</span></div></li><li><div><b>BLED</b> · Interior darkening · ink → ink_deep where mask density &gt; 0.9 <span class="ro">u 0.62 · v 0.80 · ink-bleed</span></div></li><li><div><b>TOOTH</b> · Paper tooth · mono grain amp 0.04 on 1 px cells <span class="ro">u 0.90 · v 0.12 · paper-tooth</span></div></li><li><div><b>TOOTH</b> · Mottle · perlin at 60 u, ± 3.5 % luminance <span class="ro">u 0.08 · v 0.60 · paper-tooth</span></div></li><li><div><b>CAPT</b> · Caption block · Archivo 800 caps, 18 u, four lines <span class="ro">u 0.16 · v 0.15 · caption-label</span></div></li><li><div><b>CAPT</b> · Word row · JetBrains Mono 14 u, justified across 840 u <span class="ro">u 0.50 · v 0.93 · caption-label</span></div></li></ol></div>
