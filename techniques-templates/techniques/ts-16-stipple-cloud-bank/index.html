  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Stipple bank and dot burst</b><span class="code">TS-16</span></span>
  <span class="pager"><a href="../../techniques/ts-15-banknote-engraving/index.html" title="Banknote engraving">← TS-15</a><a href="../../index.html#techniques"><span class="n">16</span>&nbsp;/ 18</a><a href="../../techniques/ts-17-warped-ring-cells/index.html" title="Warped ring cells">TS-17 →</a></span> <p class="kicker">Technique · TS-16</p><h1 class="lede">Flat scalloped banks, each carried by one layer of dots.</h1><div class="body"><p>Four flat fills with scalloped edges: a row of circles along a spine, joined to the area under it. Every bank carries one layer of small dots on a jittered 6.4 u grid, in a tone close to the fill. A slow noise field thins the dots, which is the only shading.</p><p>The burst behind the banks is dots only. Each ray is a stream that narrows toward its tip; a dense core joins the rays at the center. A 3.5 % mono grain covers the sheet.</p></div>
  <div class="meta" style="display:block"><h2>Pass order</h2><ol class="steps"><li><div><b>sky</b> · flat fill</div></li><li><div><b>banks</b> · scalloped fills, back to front</div></li><li><div><b>burst</b> · dot streams and core on the sky</div></li><li><div><b>dots</b> · one layer per fill, thinned by the shade field</div></li><li><div><b>grain</b> · 3.5 % mono</div></li></ol></div>
  <div class="meta"><div class="full"><h2>Vocabulary · a technique highlights its reads · an atom finds every use</h2><div class="vocab" id="chips"><div class="vr"><span data-t="scallop-bank" title="Scalloped flat bank"><b>BANK</b>scallop-bank</span><span class="at"><a href="../../index.html#techniques?a=flat-fill">flat-fill</a><i>·</i><a href="../../index.html#techniques?a=circle-union">circle-union</a><i>·</i><a href="../../index.html#techniques?a=hard-edge">hard-edge</a></span></div><div class="vr"><span data-t="stipple-fill" title="Jittered dot layer"><b>STIP</b>stipple-fill</span><span class="at"><a href="../../index.html#techniques?a=stipple">stipple</a><i>·</i><a href="../../index.html#techniques?a=jittered-grid">jittered-grid</a><i>·</i><a href="../../index.html#techniques?a=near-tone">near-tone</a></span></div><div class="vr"><span data-t="shade-field" title="Density shading"><b>SHAD</b>shade-field</span><span class="at"><a href="../../index.html#techniques?a=noise-field">noise-field</a><i>·</i><a href="../../index.html#techniques?a=density">density</a></span></div><div class="vr"><span data-t="dot-burst" title="Dot sunburst"><b>RAYS</b>dot-burst</span><span class="at"><a href="../../index.html#techniques?a=radial">radial</a><i>·</i><a href="../../index.html#techniques?a=dot-stream">dot-stream</a><i>·</i><a href="../../index.html#techniques?a=falloff">falloff</a></span></div><div class="vr"><span data-t="paper-tooth" title="Sheet grain"><b>TOOTH</b>paper-tooth</span><span class="at"><a href="../../index.html#techniques?a=grain">grain</a><i>·</i><a href="../../index.html#techniques?a=stock">stock</a></span></div></div></div>
  <div><h2>Reference</h2><div class="ro">Reference 16 · stippled cloud print with a dotted sunburst, 736 × 1308</div></div><div><h2>Study</h2><div class="nm">Stipple bank and dot burst</div><div class="ro">TS-16 · Techniques · 16 / 18</div></div></div>
  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>scallop-bank</b> · Scalloped flat bank — Each bank is a row of circles along a spine from one point to another, filled together with the polygon under the spine; later banks cover earlier ones. <span class="ro">Limits · spacing above ~1.9 opens gaps between lobes and the edge reads as beads. R_var above ~0.6 makes single lobes swallow their neighbors.</span> <a href="lib/scallop-bank.js">lib/scallop-bank.js</a></div></li><li><div><b>stipple-fill</b> · Jittered dot layer — One dot per grid cell, moved by up to 0.42 of the pitch; the fill under the dot center picks the dot color. <span class="ro">Limits · radius above ~0.45 × pitch merges dots into a tint. jitter 0 shows the grid as rows. Below 3.5 u pitch the layer costs over 100 k dots per sheet.</span> <a href="lib/stipple-fill.js">lib/stipple-fill.js</a></div></li><li><div><b>shade-field</b> · Density shading — A two-octave noise field gives each dot a keep probability between the floor and 1. <span class="ro">Limits · floor at 1 removes the shading. scale under ~80 u reads as blotches, not form.</span> <a href="lib/shade-field.js">lib/shade-field.js</a></div></li><li><div><b>dot-burst</b> · Dot sunburst — Dots are placed along each ray with a spread that narrows to the tip and a count that thins with distance; a gaussian core sits on the center. A dot is dropped when another already sits within the gap. Dots land only on the sky. <span class="ro">Limits · Over ~60 rays the streams merge into a disc; root_width above ~140 u does the same. core_dots at 0 leaves the rays unjoined. gap at 0 lets dots pile up and the burst reads as spray, not stipple.</span> <a href="lib/dot-burst.js">lib/dot-burst.js</a></div></li><li><div><b>paper-tooth</b> · Sheet grain — A mono multiply grain over the finished sheet. <span class="ro">Limits · Above ~0.08 the grain competes with the dots.</span> <a href="lib/paper-tooth.js">lib/paper-tooth.js</a></div></li></ol></div>
  <div class="meta static" style="display:block"><h2>10 reads · u, v on the sheet</h2><ol class="steps"><li><div><b>RAYS</b> · Ray · a dot stream 560 u long, 64 u wide at the root <span class="ro">u 0.30 · v 0.33 · dot-burst</span></div></li><li><div><b>RAYS</b> · Core · 7000 dots, σ 185 u, joins the rays <span class="ro">u 0.50 · v 0.45 · dot-burst</span></div></li><li><div><b>BANK</b> · Scallop · circles of 62–118 u along a spine <span class="ro">u 0.62 · v 0.54 · scallop-bank</span></div></li><li><div><b>BANK</b> · Bank edge · hard, no blur <span class="ro">u 0.20 · v 0.62 · scallop-bank</span></div></li><li><div><b>STIP</b> · Dots on the pale fill · gray-green, r 1.5 u <span class="ro">u 0.72 · v 0.70 · stipple-fill</span></div></li><li><div><b>STIP</b> · Dots on the dark fill · light blue, same grid <span class="ro">u 0.16 · v 0.80 · stipple-fill</span></div></li><li><div><b>STIP</b> · Dots on the warm fill · orange, same grid <span class="ro">u 0.90 · v 0.47 · stipple-fill</span></div></li><li><div><b>SHAD</b> · Thinned dots · noise field drops density to 45 % <span class="ro">u 0.46 · v 0.78 · shade-field</span></div></li><li><div><b>SHAD</b> · Full density · the field is near 1 here <span class="ro">u 0.88 · v 0.90 · shade-field</span></div></li><li><div><b>TOOTH</b> · Sheet grain · 3.5 % mono, 1 px <span class="ro">u 0.08 · v 0.08 · paper-tooth</span></div></li></ol></div>
