  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Stipple bank and dot burst</b><span class="code">TS-16</span></span>
  <span class="pager"><a href="../../techniques/ts-15-banknote-engraving/index.html" title="Banknote engraving">← TS-15</a><a href="../../index.html#techniques"><span class="n">16</span>&nbsp;/ 19</a><a href="../../techniques/ts-17-warped-ring-cells/index.html" title="Warped ring cells">TS-17 →</a></span> <p class="kicker">Technique · TS-16</p><h1 class="lede">One dot lattice. Tone fields shade the banks and draw the burst.</h1><div class="body"><p>Every dot sits on one jittered lattice, pitch 5 u, and is drawn on whole pixels so its edge is hard. A tone field keeps or drops each dot. On the sky the field is a burst: a soft core and 26 tapered rays. On a dark bank it is dense at the scalloped rim and fades inward. On a light bank it is empty at the rim and builds inward in wisps, from a noise field stretched 3.2 to 1 along the bank.</p><p>The same tone field is printed under the dots as single pixels of a second color, clipped to its bank, so each flat shape carries a gradient with no blur. Motion sways the burst and shimmers the dots. Live puts the burst under the pointer. A weave and a 3 % grain cover the sheet.</p></div>
  <div class="meta" style="display:block"><h2>Pass order</h2><ol class="steps"><li><div><b>sky</b> · flat fill</div></li><li><div><b>banks</b> · scalloped fills, back to front</div></li><li><div><b>wash</b> · tone field as soft color, clipped per bank</div></li><li><div><b>dots</b> · one lattice; kept where the threshold is under the tone</div></li><li><div><b>tooth</b> · weave and grain</div></li></ol></div>
  <div class="meta"><div class="full"><h2>Vocabulary · a technique highlights its reads · an atom finds every use</h2><div class="vocab" id="chips"><div class="vr"><span data-t="scallop-bank" title="Scalloped flat bank"><b>BANK</b>scallop-bank</span><span class="at"><a href="../../index.html#techniques?a=flat-fill">flat-fill</a><i>·</i><a href="../../index.html#techniques?a=circle-union">circle-union</a><i>·</i><a href="../../index.html#techniques?a=hard-edge">hard-edge</a></span></div><div class="vr"><span data-t="stipple-fill" title="Jittered dot lattice"><b>STIP</b>stipple-fill</span><span class="at"><a href="../../index.html#techniques?a=stipple">stipple</a><i>·</i><a href="../../index.html#techniques?a=jittered-grid">jittered-grid</a><i>·</i><a href="../../index.html#techniques?a=near-tone">near-tone</a></span></div><div class="vr"><span data-t="shade-field" title="Tone by depth and wisp"><b>SHAD</b>shade-field</span><span class="at"><a href="../../index.html#techniques?a=noise-field">noise-field</a><i>·</i><a href="../../index.html#techniques?a=density">density</a><i>·</i><a href="../../index.html#techniques?a=edge-distance">edge-distance</a></span></div><div class="vr"><span data-t="grain-wash" title="Wash from the tone field"><b>WASH</b>grain-wash</span><span class="at"><a href="../../index.html#techniques?a=stochastic-gradient">stochastic-gradient</a><i>·</i><a href="../../index.html#techniques?a=clip">clip</a><i>·</i><a href="../../index.html#techniques?a=grain">grain</a></span></div><div class="vr"><span data-t="dot-burst" title="Burst tone field"><b>RAYS</b>dot-burst</span><span class="at"><a href="../../index.html#techniques?a=radial">radial</a><i>·</i><a href="../../index.html#techniques?a=taper">taper</a><i>·</i><a href="../../index.html#techniques?a=falloff">falloff</a></span></div><div class="vr"><span data-t="paper-tooth" title="Weave and grain"><b>TOOTH</b>paper-tooth</span><span class="at"><a href="../../index.html#techniques?a=grain">grain</a><i   <div><h2>Reference</h2><div class="ro">Reference 16 · stippled cloud print with a dotted sunburst, 736 × 1308</div></div><div><h2>Study</h2><div class="nm">Stipple bank and dot burst</div><div class="ro">TS-16 · Techniques · 16 / 19</div></div></div>
  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>scallop-bank</b> · Scalloped flat bank — A bank is a row of circles along a spine plus the area under the spine. The depth of a point is its distance inside the nearest lobe; the shading reads that depth. <span class="ro">Limits · spacing above ~1.9 opens gaps between lobes and the edge reads as beads. R_var above ~0.6 makes single lobes swallow their neighbors.</span> <a href="lib/scallop-bank.js">lib/scallop-bank.js</a></div></li><li><div><b>stipple-fill</b> · Jittered dot lattice — One dot per lattice cell, moved by up to 0.42 of the pitch, with one random threshold. A dot is drawn when its threshold is under the tone at its position. <span class="ro">Limits · radius above ~0.45 × pitch merges dots into a tint. jitter 0 shows the lattice as rows. Below 3 u pitch the sheet carries over 150 k dots.</span> <a href="lib/stipple-fill.js">lib/stipple-fill.js</a></div></li><li><div><b>shade-field</b> · Tone by depth and wisp — Rim banks: tone = floor + (1 − floor)·exp(−depth / rim depth). Body banks: tone = smoothstep(depth) × wisp, where wisp is three-octave noise sampled in coordinates turned to the bank and stretched along it. <span class="ro">Limits · wisp_mix at 0 leaves only the depth ramp and the banks read as flat steps. stretch above ~6 turns wisps into stripes.</span> <a href="lib/shade-field.js">lib/shade-field.js</a></div></li><li><div><b>grain-wash</b> · Wash from the tone field — The tone field is sampled at quarter size. Each pixel of the bank takes the wash color with a chance equal to tone × amount, so the gradient is made of single pixels. <span class="ro">Limits · At amount 1 the wash hides the dots on light banks. grain at 0 gives a smooth gradient, which reads as blur beside the dots.</span> <a href="lib/grain-wash.js">lib/grain-wash.js</a></div></li><li><div><b>dot-burst</b> · Burst tone field — Tone is the larger of a soft core disc and the nearest ray. A ray is a gaussian across its axis whose width tapers to the tip. <span class="ro">Limits · Over ~60 rays, or a root width above ~140 u, the rays merge into a disc. core_radius at 0 leaves the rays unjoined.</span> <a href="lib/dot-burst.js">lib/dot-burst.js</a></div></li><li><div><b>paper-tooth</b> · Weave and grain — Each pixel is multiplied by 1 + grain + weave, where weave is the product of two sine waves at the weave pitch. <span class="ro">Limits · Above ~0.08 either one competes with the dots.</span> <a href="lib/paper-tooth.js">lib/paper-tooth.js</a></div></li></ol></div>
  <div class="meta static" style="display:block"><h2>10 reads · u, v on the sheet</h2><ol class="steps"><li><div><b>RAYS</b> · Ray · tone falls from the root to the tip, 560 u long <span class="ro">u 0.30 · v 0.30 · dot-burst</span></div></li><li><div><b>RAYS</b> · Core · full density inside 137 u <span class="ro">u 0.48 · v 0.53 · dot-burst</span></div></li><li><div><b>BANK</b> · Scallop · lobes of 68 to 140 u along a spine <span class="ro">u 0.80 · v 0.50 · scallop-bank</span></div></li><li><div><b>BANK</b> · Small lobe · carried on the rim of a large one <span class="ro">u 0.58 · v 0.58 · scallop-bank</span></div></li><li><div><b>STIP</b> · Lattice · one dot per cell, pitch 5 u, radius 1.2 u, on whole pixels <span class="ro">u 0.40 · v 0.79 · stipple-fill</span></div></li><li><div><b>SHAD</b> · Rim placement · dense at the edge, fades over 0.9 R <span class="ro">u 0.88 · v 0.62 · shade-field</span></div></li><li><div><b>SHAD</b> · Wisp · stretched noise thins the dots <span class="ro">u 0.64 · v 0.76 · shade-field</span></div></li><li><div><b>WASH</b> · Wash · the same tone field as single pixels of a second color, 50 % <span class="ro">u 0.10 · v 0.62 · grain-wash</span></div></li><li><div><b>WASH</b> · Wash on a dark bank · a lighter rim <span class="ro">u 0.22 · v 0.95 · grain-wash</span></div></li><li><div><b>TOOTH</b> · Weave 3 u and 3 % grain, one pixel <span class="ro">u 0.08 · v 0.06 · paper-tooth</span></div></li></ol></div>
