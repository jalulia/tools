<!-- <span class="crumb"><a href="../../../library/">Library</a><span class="sep">/</span><a href="../../../library/#/plates?kind3=technique">Techniques</a><span class="sep">/</span><b>Seen in section</b><span class="code">TS-26</span></span>
  <span class="pager"><a href="../../techniques/ts-25-growth-over-the-record/index.html" title="Previous: TS-25 Growth over the record">← TS-25</a><a class="pos" href="../../../library/#/plates?kind3=technique"><span class="n">19</span>&nbsp;of 20</a><a href="../../techniques/ts-27-seen-from-far/index.html" title="Next: TS-27 Seen from far">TS-27 →</a></span> <p class="kicker"><span>TS-26</span><span>subject construction</span></p><h1 class="title">Seen in section</h1><p class="lede">A riverbank in section: water, gravel, soil, roots and a garden.</p><div class="body"><p>One ground line runs through the section: a riverbed at 402 u, a bank face at 48°, a crest at 286 u and an upland that rises 72 u to the right edge. Water fills every column below its level. Two gravel beds lie over a clay floor at 515 u: the riverbed, which wedges up under the bank and pinches out at x 634, and a deep bed 455 u down under the garden, dipping parallel to the wedge base.</p><p>Roots grow from five crowns in 2.2 u steps, bend toward the gravel and branch through four generations; at 60 % they stop where the deck’s roots stop, and at 100 % every main tip lands on the gravel top. Grass, irises and trees stand only on soil above the water.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>sky</b><span>flat Paper by day, Ink at night</span></li><li><b>far hills</b><span>four ridges back to front on the waterline: crest light, flecks, haze toward the water</span></li><li><b>water</b><span>level fill, depth gradient, horizontal brush streaks</span></li><li><b>section</b><span>clay floor, gravel beds and soil per pixel; specks, pebbles, laminae</span></li><li><b>roots</b><span>grown, edge then fill</span></li><li><b>garden</b><span>turf mat, trees, back blades, flowers, front blades</span></li><li><b>strokes</b><span>wave dashes over the water (moving in Play)</span></li><li><b>finish</b><span>3 % mono grain</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>7</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="section-ground"><span class="vn">Rendering and sky</span><span class="vid">section-ground</span></button><span class="at"><a href="../../index.html#techniques?a=ground">ground</a><a href="../../index.html#techniques?a=rendering">rendering</a><a href="../../index.html#techniques?a=grain">grain</a><a class="mod" href="lib/section-ground.js">lib/section-ground.js</a></span><p class="ah">The ground is one flat color behind everything. Gouache paints each region per pixel and adds a 3 % one-pixel grain; at night it mixes the hills (66 %), the water (42 %), the trees (45 %) and the grass (52 %) toward night blue. The line section draws contacts, hatching and symbols as hairlines on the same geometry, light on the night sky.</p></li><li class="vr"><button type="button" data-t="bank-profile"><span class="vn">Ground line</span><span class="vid">bank-profile</span></button><span class="at"><a href="../../index.html#techniques?a=profile">profile</a><a href="../../index.html#techniques?a=section">section</a><a href="../../index.html#techniques?a=smooth-min">smooth-min</a><a class="mod" href="lib/bank-profile.js">lib/bank-profile.js</a></span><p class="ah">The riverbed, the bank face and the upland are three curves joined by a smooth minimum at the toe and a smooth maximum at the crest, so the section has one continuous ground line with rounded corners.</p></li><li class="vr"><button type="button" data-t="river-view"><span class="vn">Water and far hills</span><span class="vid">river-view</span></button><span class="at"><a href="../../index.html#techniques?a=water">water</a><a href="../../index.html#techniques?a=stroke">stroke</a><a href="../../index.html#techniques?a=haze">haze</a><a class="mod" href="lib/river-view.js">lib/river-view.js</a></span><p class="ah">Water fills every column whose ground lies below the level, from the left edge to the shoreline. Strokes are arched, tapered dashes placed uniformly in the water; deeper strokes are longer and thicker. The far hills are four ridges drawn back to front, teal far to green near, each with a fractal crest, light on the flanks that face the upper left, fine dabbed flecks and haze toward the waterline; they stand on the waterline at any level.</p></li><li class="vr"><button type="button" data-t="gravel-body"><span class="vn">Gravel beds and clay floor</span><span class="vid">gravel-body</span></button><span class="at"><a href="../../index.html#techniques?a=bed">bed</a><a href="../../index.html#techniques?a=contact">contact</a><a href="../../index.html#techniques?a=pinch-out">pinch-out</a><a href="../../index.html#techniques?a=worley">worley</a><a class="mod" href="lib/gravel-body.js">lib/gravel-body.js</a></span><p class="ah">Two gravel beds over a clay floor. The riverbed gravel wedges up under the bank and pinches out where its base meets the contact; the deep bed runs under the garden and dips left parallel to the wedge base, so the soil between them never tapers into a tongue. Depth thickens both, moves the wedge tip right and raises the deep bed toward the roots. Pebbles are elliptical Worley cells lit from the upper left; the clay is laminated.</p></li><li class="vr"><button type="button" data-t="soil-grain"><span class="vn">Soil grain</span><span class="vid">soil-grain</span></button><span class="at"><a href="../../index.html#techniques?a=speck">speck</a><a href="../../index.html#techniques?a=stipple">stipple</a><a href="../../index.html#techniques?a=mottle">mottle</a><a class="mod" href="lib/soil-grain.js">lib/soil-grain.js</a></span><p class="ah">One speck per jittered cell, its size and its pale or dark ink drawn from a hash of the cell, over a two-scale mottle; nothing repeats.</p></li><li class="vr"><button type="button" data-t="root-growth"><span class="vn">Root growth</span><span class="vid">root-growth</span></button><span class="at"><a href="../../index.html#techniques?a=branching">branching</a><a href="../../index.html#techniques?a=tropism">tropism</a><a href="../../index.html#techniques?a=taper">taper</a><a class="mod" href="lib/root-growth.js">lib/root-growth.js</a></span><p class="ah">Each root walks in 2.2 u steps, turning toward straight down and wandering; it forks at a per-generation rate into children 0.62 × its width. It stops on the envelope ground + depth × (gravel top − ground), never above the soil line, never in the gravel and never under water.</p></li><li class="vr"><button type="button" data-t="bank-garden"><span class="vn">Garden on the bank</span><span class="vid">bank-garden</span></button><span class="at"><a href="../../index.html#techniques?a=blade">blade</a><a href="../../index.html#techniques?a=flower">flower</a><a href="../../index.html#techniques?a=canopy">canopy</a><a class="mod" href="lib/bank-garden.js">lib/bank-garden.js</a></span><p class="ah">A turf mat follows the soil line; blades grow from it along the surface normal and lean up. Flowers take fixed slots along the dry bank so the count adds or removes without reshuffling. Each tree stands on the soil line: a trunk forks into three branches under a crown of 10 to 15 seeded lobes, each lobe dabbed and lit from its upper left; a tree that would cross the plate edge moves inside it.</p></li></ul></div></details>
