  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Arc bundles on a dashed globe</b><span class="code">TS-19</span></span>
  <span class="pager"><a href="../../techniques/ts-17-warped-ring-cells/index.html" title="Warped ring cells">← TS-17</a><a href="../../index.html#techniques"><span class="n">18</span>&nbsp;/ 18</a><a class="off">→</a></span> <p class="kicker">Technique · TS-19</p><h1 class="lede">Fans of thin gradient arcs from one hub, over dashed meridians.</h1><div class="body"><p>Fourteen bundles leave one hub. A bundle is 10 to 34 thin strokes that end side by side along a short line, each a little shorter than the last, so the strokes nest. Each stroke is a quadratic curve whose bend grows across the bundle. Color runs along every stroke from a faint root to full ink at the tip, and strokes add where they cross.</p><p>Behind them, eleven dashed meridians of one sphere and one solid axis. Small square nodes carry a number in a 13.5 u sans. A blurred copy of the strokes is added back at 35 % as glow.</p></div>
  <div class="meta" style="display:block"><h2>Pass order</h2><ol class="steps"><li><div><b>ground</b> · flat</div></li><li><div><b>grid</b> · dashed meridians, one solid axis</div></li><li><div><b>arcs</b> · bundles from the hub, gradient strokes, lighter blend</div></li><li><div><b>glow</b> · blurred copy added</div></li><li><div><b>nodes</b> · squares and numbers</div></li></ol></div>

  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>meridian-grid</b> · Dashed meridians — Each meridian is an ellipse with the sphere radius as its tall axis and radius·|sin λ| as its wide one, stroked with a 6 on 5 dash. <span class="ro">Limits · Over ~31 meridians the dashes of neighbors align into bands. A radius under the half-height of the sheet shows the sphere outline and the picture reads as a ball, not a field.</span> <a href="lib/meridian-grid.js">lib/meridian-grid.js</a></div></li><li><div><b>arc-bundle</b> · Nested arc bundle — For each bundle a target point is picked around the hub; stroke ends are spaced along a line through it, and each stroke is a quadratic curve whose sideways bend steps up across the bundle. <span class="ro">Limits · fan under ~10 u collapses a bundle to one thick line. Past ~24 bundles the sheet fills and single arcs stop reading.</span> <a href="lib/arc-bundle.js">lib/arc-bundle.js</a></div></li><li><div><b>stroke-gradient</b> · Along-stroke gradient — A linear gradient from the hub to the stroke end colors each stroke: faint at the root, full ink at the tip. Strokes are composited with the lighter blend. <span class="ro">Limits · With both alphas at 1 on a dark ground, crossings near the hub clip to white.</span> <a href="lib/stroke-gradient.js">lib/stroke-gradient.js</a></div></li><li><div><b>glow-pass</b> · Additive glow — The stroke layer is blurred and added back over itself. <span class="ro">Limits · gain above ~1 washes the thin strokes into a haze.</span> <a href="lib/glow-pass.js">lib/glow-pass.js</a></div></li><li><div><b>node-label</b> · Numbered nodes — Square markers sit on bundle ends and on seeded free points; each carries a seeded number set up and to the right. <span class="ro">Limits · Over ~60 nodes the labels overlap. Type under 9 u is unreadable at 900 px.</span> <a href="lib/node-label.js">lib/node-label.js</a></div></li></ol></div>
