  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Arc bundles on a dashed globe</b><span class="code">TS-19</span></span>
  <span class="pager"><a href="../../techniques/ts-17-warped-ring-cells/index.html" title="Warped ring cells">← TS-17</a><a href="../../index.html#techniques"><span class="n">18</span>&nbsp;/ 19</a><a href="../../techniques/ts-22-capsule-rain/index.html" title="Capsule system">TS-22 →</a></span> <p class="kicker">Technique · TS-19</p><h1 class="lede">Bundles of thin arcs leave one hub as a trunk and fan apart at the far end.</h1><div class="body"><p>Twelve bundles leave one hub. Every strand of a bundle shares its first direction: the control point of its curve sits on one ray from the hub. The far ends are spread over 0.2 to 0.6 rad and turned by up to 1.1 rad, so a bundle starts as one trunk and opens into separate arcs. Most run off the sheet.</p><p>Color runs along each strand through three inks and strands add where they cross, so the trunk is the brightest part. Behind them sit eleven dashed meridians of one sphere and one solid axis; square nodes carry a number. Motion sways the bundles and sends a pulse down each strand. Live moves the hub.</p></div>
  <div class="meta" style="display:block"><h2>Pass order</h2><ol class="steps"><li><div><b>ground</b> · flat</div></li><li><div><b>grid</b> · dashed meridians, one solid axis</div></li><li><div><b>arcs</b> · trunk-and-fan bundles, gradient strokes, lighter blend</div></li><li><div><b>glow</b> · blurred copy added</div></li><li><div><b>nodes</b> · squares and numbers</div></li></ol></div>

  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>meridian-grid</b> · Dashed meridians — Each meridian is an ellipse with the sphere radius as its tall axis and radius·|sin λ| as its wide one, stroked with a 6 on 5 dash. <span class="ro">Limits · Over ~31 meridians the dashes of neighbors align into bands. A radius under half the sheet height shows the sphere outline.</span> <a href="lib/meridian-grid.js">lib/meridian-grid.js</a></div></li><li><div><b>arc-bundle</b> · Trunk-and-fan arc bundle — Each strand is a quadratic curve from the hub. Its control point lies on the bundle’s ray at trunk × reach; its end is turned from that ray by the curl plus its share of the spread. <span class="ro">Limits · trunk under ~0.25 lets strands separate at the hub and the bundle reads as a plain fan. Past ~24 bundles the sheet fills and single arcs stop reading.</span> <a href="lib/arc-bundle.js">lib/arc-bundle.js</a></div></li><li><div><b>stroke-gradient</b> · Along-stroke gradient — A linear gradient from the hub to the strand end colors each strand through three inks; strands are composited with the lighter blend. <span class="ro">Limits · With both alphas at 1 on a dark ground the whole trunk clips to white.</span> <a href="lib/stroke-gradient.js">lib/stroke-gradient.js</a></div></li><li><div><b>glow-pass</b> · Additive glow — The strand layer is blurred and added back over itself. <span class="ro">Limits · gain above ~1 washes the thin strands into a haze. On a light ground the pass is skipped: it would only gray the paper.</span> <a href="lib/glow-pass.js">lib/glow-pass.js</a></div></li><li><div><b>node-label</b> · Numbered nodes — Square markers sit on bundle ends and on seeded free points; each carries a seeded number set up and to the right. <span class="ro">Limits · Over ~60 nodes the labels overlap. Type under 9 u is unreadable at 900 px.</span> <a href="lib/node-label.js">lib/node-label.js</a></div></li></ol></div>
