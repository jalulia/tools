  <span class="pager"><a href="../../techniques/ts-17-warped-ring-cells/index.html" title="Previous: TS-17 Warped ring cells">← TS-17</a><a class="pos" href="../../index.html#techniques"><span class="n">14</span>&nbsp;of 15</a><a href="../../techniques/ts-22-capsule-rain/index.html" title="Next: TS-22 Capsule system">TS-22 →</a></span> <p class="kicker"><span>TS-19</span><span>data display</span></p><h1 class="title">Arc bundles on a dashed globe</h1><p class="lede">Bundles of thin arcs leave one hub as a trunk and fan apart at the far end.</p><div class="body"><p>Twelve bundles leave one hub, and every strand in a bundle shares its first direction. The far ends spread over 0.2 to 0.6 rad and turn by up to 1.1 rad, so each bundle opens from one trunk into separate arcs. Color runs along each strand through three inks and adds where strands cross, over eleven dashed meridians and numbered square nodes.</p></div>
