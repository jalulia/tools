  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Iridescent chrome on black</b><span class="code">TS-03</span></span>
  <span class="pager"><a href="../../techniques/ts-02-four-ink-spot-illustration/index.html" title="Four-ink spot illustration">← TS-02</a><a href="../../index.html#techniques"><span class="n">3</span>&nbsp;/ 14</a><a href="../../techniques/ts-04-stacked-card-scroll/index.html" title="Stacked card scroll">TS-04 →</a></span> <p class="kicker">Technique · TS-03</p><h1 class="lede">A bent slab, normals mapped through a spectral LUT, film grain, split type.</h1><div class="body"><p>Normal shading. A 300 × 160 u slab with 30 u fillets is swept along an L, twisted 31° and tilted 29° to camera, then rasterized to a per-pixel normal buffer. Each pixel reflects a 1-D environment: the vertical component of the reflected ray indexes a spectral LUT, so the fillets sweep the whole table in a few pixels and each flat face holds one band. Grazing normals take the edge color; a specular lobe adds white.</p><p>Film grain sits over it — multiplicative on the chrome, additive on the black so the ground is never clean. The headline is Archivo 900 at width 62, each word drawn three times in red, green and blue with a lighter blend, offset 2.5 u: overlaps sum to white, edges fringe.</p></div>
  <div class="meta" style="display:block"><h2>Pass order</h2><ol class="steps"><li><div><b>ground</b> · flat fill</div></li><li><div><b>headline + small words</b> · channel split on a transparent layer, source-over</div></li><li><div><b>slab</b> · rasterize section sweep into normal + depth buffers</div></li><li><div><b>shade</b> · LUT[t(reflect)] + edge band + specular, soften 0.7 px, source-over</div></li><li><div><b>grain</b> · multiplicative per channel, then additive on the ground</div></li></ol></div>
  <div class="meta"><div class="full"><h2>Techniques read · click to highlight</h2><div class="tags" id="chips"><span data-t="spectral-lut" title="Spectral look-up table">spectral-lut</span><span data-t="normal-shading" title="Normal-buffer shading of a swept slab">normal-shading</span><span data-t="edge-highlight" title="Edge band and specular lobe">edge-highlight</span><span data-t="film-grain" title="Per-channel film grain">film-grain</span><span data-t="channel-split-type" title="RGB channel-split lettering">channel-split-type</span><span data-t="display-headline" title="Condensed display headline">display-headline</span></div></div>

  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>spectral-lut</b> · Spectral look-up table — ART.lut(stops) gives 256 colors; the shading pass indexes it with the environment coordinate t, so color is a function of normal direction only.</div></li><li><div><b>normal-shading</b> · Normal-buffer shading of a swept slab — Vertices P = C(s) + a·e1 + b·e2 with the section basis rotated by the twist; normals from the cross product of finite differences; triangles rasterized with edge functions into normal + depth buffers; per pixel the reflected ray of the orthographic view picks LUT[t].</div></li><li><div><b>edge-highlight</b> · Edge band and specular lobe — band = exp(−((|n.z|−0.34)/0.06)²) mixes the edge color in; spec = (n·h)^60 mixes white in; both read from the same normal buffer as the LUT.</div></li><li><div><b>film-grain</b> · Per-channel film grain — ART.grain multiplies RGB by 1 + 0.10·n per channel (visible on the chrome and the type); a second pass adds signed noise of 14/255 so the black ground carries grain too, as film does.</div></li><li><div><b>channel-split-type</b> · RGB channel-split lettering — Each word is filled three times in #FF0000, #00FF00, #0000FF with globalCompositeOperation lighter on a transparent layer, offset per channel; where all three overlap the sum is white, at the edges one or two channels show; the layer is drawn under the chrome.</div></li><li><div><b>display-headline</b> · Condensed display headline — line 1 is sized to 924 u (font-stretch is set after ctx.font, which resets it); the figure sits on line 2 flush right; the slab is drawn after the type so it covers the bottom of the headline as the reference slab does.</div></li></ol></div>
  <div class="meta static" style="display:block"><h2>10 reads · u, v on the sheet</h2><ol class="steps"><li><div><b>LUT</b> · Spectral LUT · 10 stops, navy → blue → cyan → white → yellow → pink → magenta → navy <span class="ro">u 0.30 · v 0.62 · spectral-lut</span></div></li><li><div><b>NRML</b> · Inner wall · section 300 × 160 u, fillet 30 u; this face is the slab’s thickness <span class="ro">u 0.62 · v 0.80 · normal-shading</span></div></li><li><div><b>NRML</b> · Top face · t = 0.5 + 0.40·r.y + 0.16·r.x picks the band; tilt 29° puts it in the cyan half <span class="ro">u 0.46 · v 0.55 · normal-shading</span></div></li><li><div><b>EDGE</b> · Edge band · |n.z| = 0.34 ± 0.06 painted yellow along every fillet <span class="ro">u 0.20 · v 0.86 · edge-highlight</span></div></li><li><div><b>EDGE</b> · Specular lobe · (n·h)^60, light from upper left, peaks at the outer bend <span class="ro">u 0.34 · v 0.57 · edge-highlight</span></div></li><li><div><b>GRN</b> · Ground grain · additive, σ 14/255, per channel <span class="ro">u 0.60 · v 0.30 · film-grain</span></div></li><li><div><b>GRN</b> · Chrome grain · multiplicative, amp 0.10, mono:false <span class="ro">u 0.74 · v 0.52 · film-grain</span></div></li><li><div><b>TYPE</b> · Headline · Archivo 900, wdth 62, cap 142 u, line pitch 175 u <span class="ro">u 0.08 · v 0.12 · display-headline</span></div></li><li><div><b>SPLT</b> · Channel split · R −2.5 u, G 0, B +2.5 u, blend lighter → white where all three overlap <span class="ro">u 0.32 · v 0.30 · channel-split-type</span></div></li><li><div><b>SPLT</b> · Small words · same split at 4 u, so the fringe is wider than the stem <span class="ro">u 0.80 · v 0.41 · channel-split-type</span></div></li></ol></div>
