  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Flat-color card set</b><span class="code">TS-08</span></span>
  <span class="pager"><a href="../../techniques/ts-07-gradient-map-blur-type/index.html" title="Gradient-mapped blur type">← TS-07</a><a href="../../index.html#techniques"><span class="n">8</span>&nbsp;/ 14</a><a href="../../techniques/ts-09-grain-gradient-layers/index.html" title="Grain gradient layers">TS-09 →</a></span> <p class="kicker">Technique · TS-08</p><h1 class="lede">Six flat cards, condensed type at two scales, mono at the edges.</h1><div class="body"><p>A 3 × 2 grid of rounded portrait cards on black; the middle column sits 57 u high. Each card is one flat fill. Display type is a heavy condensed grotesk — Archivo, width 62, weight 800–900 — at two scales: all-caps lines at 29 u, and single words fitted to the card at 95–165 u with leading under 0.8 so they touch.</p><p>Metadata sits in 8–9 u mono pinned to the edges, in two or three columns. One card runs a gradient plate with a line drawing where the reference had a photo; one is a ledger of four events on dotted rules; one carries a barcode strip and a ticket row.</p></div>

  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>card-ground</b> · Flat ground and grid — Fill the sheet, then place six cards on a 3 × 2 grid; the middle column is translated up by 57 u so its cards straddle the row gap.</div></li><li><div><b>rounded-frame</b> · Rounded card — Each card is one rounded-rect path: fill flat, then clip so type can run to the edge and be cut by the corner.</div></li><li><div><b>condensed-display</b> · Condensed display at two scales — Two set sizes: a wrapped all-caps paragraph, and single words each fitted to the inner width and stacked with leading below 0.8 so caps of adjacent lines touch.</div></li><li><div><b>edge-metadata</b> · Edge metadata — Tiny mono rows pinned to the top and bottom edges in two or three columns; a barcode strip is a seeded run of bars with a mono number under it.</div></li><li><div><b>gradient-plate</b> · Gradient plate with line illustration — Where the reference carries a photograph the card fills with a two-stop linear gradient, then five concentric arcs and a disc are stroked in one tint over it; display type sits on top as on the other cards.</div></li><li><div><b>rule-ledger</b> · Rule ledger — A vertical list of event rows: bold title, two or three mono lines, a dotted rule between rows; the ticket row is a boxed strip of five cells with hairline rules and a lozenge stamp under it.</div></li></ol></div>
