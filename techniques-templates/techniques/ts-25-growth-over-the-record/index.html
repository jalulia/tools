<!-- <span class="crumb"><a href="../../../library/">Library</a><span class="sep">/</span><a href="../../../library/#/plates?kind3=technique">Techniques</a><span class="sep">/</span><b>Growth over the record</b><span class="code">TS-25</span></span>
  <span class="pager"><a href="../../techniques/ts-24-icon-on-its-grid/index.html" title="Previous: TS-24 Mir on its icon grid">← TS-24</a><a class="pos" href="../../../library/#/plates?kind3=technique"><span class="n">18</span>&nbsp;of 20</a><a href="../../techniques/ts-26-seen-in-section/index.html" title="Next: TS-26 Seen in section">TS-26 →</a></span> <p class="kicker"><span>TS-25</span><span>grain stock</span></p><h1 class="title">Growth over the record</h1><p class="lede">One hill, half grass and half riverbed blue, laid in one fine grain.</p><div class="body"><p>The hill silhouette (crest 610 u across, 166 u down) and the front swell are traced from the reference. A boundary at 25.5° with a level cap at 225 u splits the hill: 40 % of the land is riverbed blue, the rest is grass, and the two meet over a 50 u grain dissolve with the grass darkening into it. A grass patch is always held under each trunk.</p><p>Every surface is one stochastic screen: a 1.3 u grain picks one of five or six inks per pixel from a tone set by the sun angle, the depth below the silhouette and a 16 u rim light. The grass tufts (12 u blades in front, smaller up the hill), the leafy flower clumps and the tree (16 lobes of leaf clusters on a forked trunk) are drawn as tones and screened by the same grain.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>sky</b><span>Paper with per-pixel grain</span></li><li><b>hills behind</b><span>measured silhouettes, hazed by depth</span></li><li><b>form</b><span>main hill and front swell, traced</span></li><li><b>boundary</b><span>blue share solved, dissolve by grain</span></li><li><b>light</b><span>sun normal, rim, depth</span></li><li><b>tone layer</b><span>tufts, flower clumps, forked trunk and leaf lobes</span></li><li><b>grain</b><span>one ink per pixel from tone + grain; current strokes in the blue</span></li><li><b>flowers</b><span>petal heads on top</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>9</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="paper-sky"><span class="vn">Paper sky</span><span class="vid">paper-sky</span></button><span class="at"><a href="../../index.html#techniques?a=ground">ground</a><a href="../../index.html#techniques?a=grain">grain</a><a href="../../index.html#techniques?a=stock">stock</a><a class="mod" href="lib/paper-sky.js">lib/paper-sky.js</a></span><p class="ah">Paper multiplied by 1 + 0.012 × a signed hash per device pixel, so the sky is never a flat fill.</p></li><li class="vr"><button type="button" data-t="hills-behind"><span class="vn">Hills behind</span><span class="vid">hills-behind</span></button><span class="at"><a href="../../index.html#techniques?a=silhouette">silhouette</a><a href="../../index.html#techniques?a=aerial-perspective">aerial-perspective</a><a href="../../index.html#techniques?a=haze">haze</a><a class="mod" href="lib/hills-behind.js">lib/hills-behind.js</a></span><p class="ah">Each hill is a measured monotone-cubic silhouette, screened from the four darker grass inks, darkened over its first 70 u and mixed toward the haze ink by haze × its depth, plus up to 30 % mist from 50 u to 140 u below its top.</p></li><li class="vr"><button type="button" data-t="hill-form"><span class="vn">Measured hill and front swell</span><span class="vid">hill-form</span></button><span class="at"><a href="../../index.html#techniques?a=silhouette">silhouette</a><a href="../../index.html#techniques?a=landform">landform</a><a href="../../index.html#techniques?a=monotone-cubic">monotone-cubic</a><a class="mod" href="lib/hill-form.js">lib/hill-form.js</a></span><p class="ah">Sky-boundary and blue-edge scans of the reference every 8 px, simplified to 27 and 19 points and joined by a monotone cubic (no overshoot, flat at the crest).</p></li><li class="vr"><button type="button" data-t="riverbed-boundary"><span class="vn">Riverbed boundary</span><span class="vid">riverbed-boundary</span></button><span class="at"><a href="../../index.html#techniques?a=boundary">boundary</a><a href="../../index.html#techniques?a=dissolve">dissolve</a><a href="../../index.html#techniques?a=stochastic-threshold">stochastic-threshold</a><a href="../../index.html#techniques?a=area-solve">area-solve</a><a class="mod" href="lib/riverbed-boundary.js">lib/riverbed-boundary.js</a></span><p class="ah">A line at the boundary angle through the measured anchor, smooth-maxed with a level cap at 225 u and meandered across its course by noise whose wavelength grows with the wobble (60 u + 3.2 × wobble, so it never folds), is shifted vertically until the blue area is the share of the land (a quantile of the signed distances on a 4 u grid); a pixel is blue when its coverage smoothstep beats its own grain value.</p></li><li class="vr"><button type="button" data-t="hill-light"><span class="vn">Side light and rim</span><span class="vid">hill-light</span></button><span class="at"><a href="../../index.html#techniques?a=lambert">lambert</a><a href="../../index.html#techniques?a=rim-light">rim-light</a><a href="../../index.html#techniques?a=depth-falloff">depth-falloff</a><a class="mod" href="lib/hill-light.js">lib/hill-light.js</a></span><p class="ah">At each column the silhouette normal (slope, −1) is dotted with the sun vector; below the edge the normal turns toward the viewer over 70 u, a rim term decays over rim width, and depth darkens the lower hill.</p></li><li class="vr"><button type="button" data-t="stipple-grain"><span class="vn">Stipple grain and riverbed mark</span><span class="vid">stipple-grain</span></button><span class="at"><a href="../../index.html#techniques?a=stochastic-screen">stochastic-screen</a><a href="../../index.html#techniques?a=value-noise">value-noise</a><a href="../../index.html#techniques?a=anisotropic-noise">anisotropic-noise</a><a href="../../index.html#techniques?a=dither">dither</a><a class="mod" href="lib/stipple-grain.js">lib/stipple-grain.js</a></span><p class="ah">Value noise on a lattice rotated 27°, mixed with per-pixel white noise, offsets each pixel’s tone before it picks one discrete ink; grass adds 3.5 u streaks traced from its bright specks. Current is a second value noise stretched 34 u along the boundary and 2.1 u across it, meandering 7 u, added to the blue only.</p></li><li class="vr"><button type="button" data-t="grass-tufts"><span class="vn">Grass tufts</span><span class="vid">grass-tufts</span></button><span class="at"><a href="../../index.html#techniques?a=blade">blade</a><a href="../../index.html#techniques?a=tuft">tuft</a><a href="../../index.html#techniques?a=perspective">perspective</a><a href="../../index.html#techniques?a=tone-layer">tone-layer</a><a class="mod" href="lib/grass-tufts.js">lib/grass-tufts.js</a></span><p class="ah">420 tufts of three to seven curved, tapering blades, placed on grass only and denser toward the front; each blade is a dark or light tone in the shared tone layer and the grain screens it like the rest of the grass.</p></li><li class="vr"><button type="button" data-t="tree-crown"><span class="vn">Tree of leaf clusters</span><span class="vid">tree-crown</span></button><span class="at"><a href="../../index.html#techniques?a=leaf-cluster">leaf-cluster</a><a href="../../index.html#techniques?a=lobe">lobe</a><a href="../../index.html#techniques?a=soft-edge">soft-edge</a><a href="../../index.html#techniques?a=tone-layer">tone-layer</a><a class="mod" href="lib/tree-crown.js">lib/tree-crown.js</a></span><p class="ah">A trunk 0.12 R wide forks at 0.46 R into three limbs. Sixteen lobes, drawn top and outside first, are each filled with about 70 five-leaflet clusters shaded as a small sphere lit from the sun side, scaled by the whole crown’s shading; clusters on the crown’s rim go down at partial coverage so the grain gives a soft edge.</p></li><li class="vr"><button type="button" data-t="wildflowers"><span class="vn">Wildflowers</span><span class="vid">wildflowers</span></button><span class="at"><a href="../../index.html#techniques?a=clump">clump</a><a href="../../index.html#techniques?a=flower-head">flower-head</a><a href="../../index.html#techniques?a=perspective">perspective</a><a class="mod" href="lib/wildflowers.js">lib/wildflowers.js</a></span><p class="ah">Clumps of six to nine blades with three to seven heads about 5 u across, at least 3.6 u apart, on stems 6–19 u tall; leaves and stems go into the tone layer, the heads are pixel-quantized lilac or yellow petals drawn last. A head on blue or on a tree is skipped.</p></li></ul></div></details>
