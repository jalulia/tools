  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Gradient-mapped blur type</b><span class="code">TS-07</span></span>
  <span class="pager"><a href="../../techniques/ts-06-riso-plate-separation/index.html" title="Riso three-plate separation">← TS-06</a><a href="../../index.html#techniques"><span class="n">7</span>&nbsp;/ 14</a><a href="../../techniques/ts-08-flat-color-card-set/index.html" title="Flat-color card set">TS-08 →</a></span> <p class="kicker">Technique · TS-07</p><h1 class="lede">Type and blobs in one mask, blurred, mapped through a four-stop ramp.</h1><div class="body"><p>One luminance mask. Hard-edged blobs sit on black; six heavy words draw over them with a difference composite, so a letter is white on a black field and black on a white field. The whole mask blurs, then every pixel is replaced by a ramp read at its luminance — black, deep red, red, pink, light gray.</p><p>The edge halo is that ramp read down the blur falloff; stops at 0, 0.09, 0.30, 0.70 and 0.92 make the pink band wide and the drop to black short. In motion the blur breathes between 4 and 28 u over 8 s and the blobs drift — the words hold still.</p></div>
  <div class="meta" style="display:block"><h2>Pass order</h2><ol class="steps"><li><div><b>mask</b> · black ground, metaballs thresholded at 1.0</div></li><li><div><b>type</b> · six words in difference over the mask</div></li><li><div><b>blur</b> · gaussian σ 16 u (4–28 u in motion), padded canvas</div></li><li><div><b>map</b> · LUT[luminance] per pixel</div></li><li><div><b>frame</b> · crop the padding</div></li></ol></div>
  <div class="meta"><div class="full"><h2>Techniques read · click to highlight</h2><div class="tags" id="chips"><span data-t="blob-field" title="Metaball blob field">blob-field</span><span data-t="display-stack" title="Stacked display words">display-stack</span><span data-t="blur-field" title="Whole-mask gaussian blur">blur-field</span><span data-t="gradient-map" title="Five-stop gradient map">gradient-map</span><span data-t="breath-motion" title="Breathing blur">breath-motion</span></div></div>
  <div><h2>Reference</h2><div class="ro">Reference 07 · frame from an 8 s motion piece, gradient-mapped blurred type, 1000 × 1296</div></div><div><h2>Study</h2><div class="nm">Gradient-mapped blur type</div><div class="ro">TS-07 · Techniques · 7 / 14</div></div></div>
  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>blob-field</b> · Metaball blob field — Sum of inverse-fourth elliptic fields from 10 seeded centres; pixels above 1.0 are white, the rest black, so nearby blobs merge into one shape with a hard edge.</div></li><li><div><b>display-stack</b> · Stacked display words — Six words centred at 225 u (the six-letter word spans 0.92 W), drawn white with globalCompositeOperation difference so each letter inverts the blob field under it.</div></li><li><div><b>blur-field</b> · Whole-mask gaussian blur — One CSS blur over the full mask after the type is composited, so type edges and blob edges get the same falloff.</div></li><li><div><b>gradient-map</b> · Five-stop gradient map — 256-entry LUT from the stops; every pixel of the blurred mask is replaced by LUT[luminance], which turns the blur falloff into the red-and-pink halo.</div></li><li><div><b>breath-motion</b> · Breathing blur — Each frame recomputes the blobs at quarter scale, composites the cached text mask, blurs at the current σ and gradient-maps on a 512 px work canvas that is drawn up to plate size.</div></li></ol></div>
  <div class="meta static" style="display:block"><h2>10 reads · u, v on the sheet</h2><ol class="steps"><li><div><b>BLOB</b> · Blob 1 · metaball, radius 210 u, ratio 1.35, cut by the frame edge <span class="ro">u 0.08 · v 0.20 · blob-field</span></div></li><li><div><b>BLOB</b> · Blob 6 · field threshold 1.0 gives a hard edge before the blur <span class="ro">u 0.92 · v 0.66 · blob-field</span></div></li><li><div><b>BLOB</b> · Blobs 5 + 10 · two fields sum and merge into one shape <span class="ro">u 0.34 · v 0.48 · blob-field</span></div></li><li><div><b>TYPE</b> · Line 1 · Archivo 900 semi-condensed, 225 u, cap 155 u <span class="ro">u 0.50 · v 0.12 · display-stack</span></div></li><li><div><b>TYPE</b> · Line 4 · pitch 205 u, six lines, difference composite over the blobs <span class="ro">u 0.50 · v 0.60 · display-stack</span></div></li><li><div><b>TYPE</b> · Line 6 · black letter over a white blob, white letter over black ground <span class="ro">u 0.20 · v 0.92 · display-stack</span></div></li><li><div><b>BLUR</b> · Blur · gaussian, σ 16 u on the whole mask; the halo width is 2σ <span class="ro">u 0.66 · v 0.36 · blur-field</span></div></li><li><div><b>MAP</b> · Ramp on the falloff · light → pink → red → deep red → black <span class="ro">u 0.14 · v 0.74 · gradient-map</span></div></li><li><div><b>MAP</b> · Flat white region → light gray stop at 0.92 <span class="ro">u 0.84 · v 0.06 · gradient-map</span></div></li><li><div><b>BRTH</b> · Breath · σ = 4 + 24·(0.5+0.5·sin 2πt/8) u; blobs drift ±40 u on perlin(t) <span class="ro">u 0.50 · v 0.80 · breath-motion</span></div></li></ol></div>
