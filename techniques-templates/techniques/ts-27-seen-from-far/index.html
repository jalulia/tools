<!-- <span class="crumb"><a href="../../../library/">Library</a><span class="sep">/</span><a href="../../../library/#/plates?kind3=technique">Techniques</a><span class="sep">/</span><b>Seen from far</b><span class="code">TS-27</span></span>
  <span class="pager"><a href="../../techniques/ts-26-seen-in-section/index.html" title="Previous: TS-26 Seen in section">← TS-26</a><a class="pos" href="../../../library/#/plates?kind3=technique"><span class="n">20</span>&nbsp;of 20</a><a class="off" aria-disabled="true">→</a></span> <p class="kicker"><span>TS-27</span><span>screen tone</span></p><h1 class="title">Seen from far</h1><p class="lede">A clearing that becomes a field of dots as you step back from it.</p><div class="body"><p>Up close the clearing is painted from above. Stepping back, the painting is cut into cells that grow from 2.4 u to 11.1 u, the cells part to show paper, and one by one each takes the record’s dot instead of the paint, empty ground first.</p><p>At 100 % the plate is the deck’s emblem: dots sized and colored by density, a 62 u hole at zero, 22 turns joined by a 1.9 u line. Play grows the record from day 6 to day 60, then steps in to the clearing and back out.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>clearing</b><span>ground lookup, grain, dabs, grass, path, sprouts, meadow, plantings, trees (drawn once, reused)</span></li><li><b>record</b><span>density per 4 u cell at the current day</span></li><li><b>screen</b><span>per cell size and color from the painting or the record; per pixel coverage from the four nearest cells</span></li><li><b>turns</b><span>halo then core, one path each</span></li><li><b>origin</b><span>lime ring, orange dot</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>6</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="step-back"><span class="vn">Distance</span><span class="vid">step-back</span></button><span class="at"><a href="../../index.html#techniques?a=cell-mosaic">cell-mosaic</a><a href="../../index.html#techniques?a=handoff">handoff</a><a href="../../index.html#techniques?a=screen-growth">screen-growth</a><a class="mod" href="lib/step-back.js">lib/step-back.js</a></span><p class="ah">Distance sets the cell pitch, how far the cells part, and when each cell trades the painting for the record. A dot that still shows the painting shows the painting’s own pixels, so the plate is never a blurred copy; a cell with more growth trades later, so the empty ground clears first and the ring stays to the end. Trees go first: each leaves whole, canopy and shadow, one after another from the plate edge inward over 0.6–12.5 % of the slider, and the front starts after the last one, leaving all four sides of the plate together.</p></li><li class="vr"><button type="button" data-t="clearing"><span class="vn">Clearing</span><span class="vid">clearing</span></button><span class="at"><a href="../../index.html#techniques?a=top-down">top-down</a><a href="../../index.html#techniques?a=illustration">illustration</a><a href="../../index.html#techniques?a=grain">grain</a><a href="../../index.html#techniques?a=growth">growth</a><a class="mod" href="lib/clearing.js">lib/clearing.js</a></span><p class="ah">The trees are drawn last, and the painting is kept once without them. The ground is a lookup from the record density (mown at zero, lawn, meadow, shrub) with 3 % per-pixel grain; dabs, grass ticks, the trodden path, sprouts, grass tufts and flowers where the record is dense, plantings at each turn and tree canopies are drawn over it.</p></li><li class="vr"><button type="button" data-t="record-field"><span class="vn">Record field</span><span class="vid">record-field</span></button><span class="at"><a href="../../index.html#techniques?a=ring">ring</a><a href="../../index.html#techniques?a=density">density</a><a href="../../index.html#techniques?a=noise">noise</a><a href="../../index.html#techniques?a=lobe">lobe</a><a class="mod" href="lib/record-field.js">lib/record-field.js</a></span><p class="ah">density = 1 − (1 − band)(1 − lobe): band rises over 24 u past the round hole, holds to 0.6 R and falls over 0.16 R on a radius stretched 1.16 across and 0.95 down, with the edge moved by noise; each turn adds a 36 u lobe with a flat top and a 0.1 skirt; the field tapers to nothing 445–478 u from the center on each axis, and nodes stay within 440 u, so nothing touches the plate edge; gaps are cut where a second noise passes 0.14–0.26. Growth by day is kept apart, so a new day costs one pass over the 4 u grid.</p></li><li class="vr"><button type="button" data-t="am-screen"><span class="vn">AM screen</span><span class="vid">am-screen</span></button><span class="at"><a href="../../index.html#techniques?a=halftone">halftone</a><a href="../../index.html#techniques?a=am-screen">am-screen</a><a href="../../index.html#techniques?a=dot-gain">dot-gain</a><a href="../../index.html#techniques?a=ramp">ramp</a><a class="mod" href="lib/am-screen.js">lib/am-screen.js</a></span><p class="ah">Each cell takes one size and one color. Per pixel the four nearest cells add their coverage with a half-pixel edge (lines a quarter-pixel edge) and share the color by weight; a dot with two or more filled neighbors fills its cell as a tile in its own ink, so abutting squares and lines close without seams and dots stay round at any angle; a square or line that would leave a gap under 12 % of the cell fills it.</p></li><li class="vr"><button type="button" data-t="the-turns"><span class="vn">The turns</span><span class="vid">the-turns</span></button><span class="at"><a href="../../index.html#techniques?a=polyline">polyline</a><a href="../../index.html#techniques?a=node">node</a><a href="../../index.html#techniques?a=halo">halo</a><a class="mod" href="lib/the-turns.js">lib/the-turns.js</a></span><p class="ah">Nodes sit at 0.54–0.95 of the reach (within 440 u of the center on each axis), one per turn with ±31 % angle jitter; the path joins them in order and 30 % of turns also cut across two or three nodes. The core and the halo are one path each, so crossings do not double the ink.</p></li><li class="vr"><button type="button" data-t="origin-dot"><span class="vn">Origin</span><span class="vid">origin-dot</span></button><span class="at"><a href="../../index.html#techniques?a=marker">marker</a><a href="../../index.html#techniques?a=dot">dot</a><a class="mod" href="lib/origin-dot.js">lib/origin-dot.js</a></span><p class="ah">One orange disc in a lime ring at zero; up close it casts a short shadow on the grass.</p></li></ul></div></details>
