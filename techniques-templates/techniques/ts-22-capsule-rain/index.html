<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Capsule system</b><span class="code">TS-22</span></span>
  <span class="pager"><a href="../../techniques/ts-19-arc-bundle-field/index.html" title="Previous: TS-19 Arc bundles on a dashed globe">← TS-19</a><a class="pos" href="../../index.html#techniques"><span class="n">15</span>&nbsp;of 15</a><a class="off" aria-disabled="true">→</a></span> <p class="kicker"><span>TS-22</span><span>layout ephemera</span></p><h1 class="title">Capsule system</h1><p class="lede">One capsule, drawn by one function, used as a field, a helix, a dial, controls and icons.</p><div class="body"><p>Capsule columns grow along an axis from 2 u dots to 78 u pills, lean 12° and take five inks in bands. The same capsule makes the 46 rungs of the helix, the 54 spokes of the dial, the parts of five controls and the strokes of eight icons. The palettes switch the treatment as well as the inks: flat capsules that multiply, or one-pixel stipple by coverage.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>sheet</b><span>flat</span></li><li><b>fields</b><span>capsules per ink layer, clipped; stippled fields eroded at the clip edge</span></li><li><b>stipple</b><span>coverage to on/off pixels</span></li><li><b>blend</b><span>ink layers onto the sheet</span></li><li><b>chrome</b><span>frames, block, controls, icons, labels</span></li><li><b>grain</b><span>2 % mono</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>12</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="capsule-rain"><span class="vn">Capsule columns</span><span class="vid">capsule-rain</span></button><span class="at"><a href="../../index.html#techniques?a=capsule">capsule</a><a href="../../index.html#techniques?a=column">column</a><a href="../../index.html#techniques?a=growth-axis">growth-axis</a><a class="mod" href="lib/capsule-rain.js">lib/capsule-rain.js</a></span><p class="ah">Each column is filled top to bottom with capsules whose length and width follow the column’s position t on the growth axis; lengths vary ±50 %. A column repeats every panel height, so the fall loops.</p></li><li class="vr"><button type="button" data-t="wedge-envelope"><span class="vn">Wedge envelope</span><span class="vid">wedge-envelope</span></button><span class="at"><a href="../../index.html#techniques?a=envelope">envelope</a><a href="../../index.html#techniques?a=ramp">ramp</a><a class="mod" href="lib/wedge-envelope.js">lib/wedge-envelope.js</a></span><p class="ah">The filled height is floor + (1 − floor)·t^power from the bottom; a few capsules are allowed past the edge.</p></li><li class="vr"><button type="button" data-t="ink-bands"><span class="vn">Ink bands on the axis</span><span class="vid">ink-bands</span></button><span class="at"><a href="../../index.html#techniques?a=palette-field">palette-field</a><a href="../../index.html#techniques?a=overprint">overprint</a><a href="../../index.html#techniques?a=multiply">multiply</a><a class="mod" href="lib/ink-bands.js">lib/ink-bands.js</a></span><p class="ah">A capsule draws its ink from five gaussian bands along t. Each ink has its own layer; the layers are composited with the variant’s blend.</p></li><li class="vr"><button type="button" data-t="shape-mask"><span class="vn">Shape clip with a masked edge</span><span class="vid">shape-mask</span></button><span class="at"><a href="../../index.html#techniques?a=clip">clip</a><a href="../../index.html#techniques?a=mask">mask</a><a href="../../index.html#techniques?a=feather">feather</a><a class="mod" href="lib/shape-mask.js">lib/shape-mask.js</a></span><p class="ah">A field is drawn through a clip path. Three erasing strokes along the path then lower coverage toward the edge; the stipple turns that ramp into single pixels.</p></li><li class="vr"><button type="button" data-t="fine-stipple"><span class="vn">One-pixel stipple</span><span class="vid">fine-stipple</span></button><span class="at"><a href="../../index.html#techniques?a=stochastic-screen">stochastic-screen</a><a href="../../index.html#techniques?a=grain">grain</a><a href="../../index.html#techniques?a=coverage">coverage</a><a class="mod" href="lib/fine-stipple.js">lib/fine-stipple.js</a></span><p class="ah">Capsules are drawn into a coverage layer per ink. Each pixel of the layer is then set fully on or off: on when a random number is under coverage × density.</p></li><li class="vr"><button type="button" data-t="capsule-helix"><span class="vn">Capsule helix</span><span class="vid">capsule-helix</span></button><span class="at"><a href="../../index.html#techniques?a=helix">helix</a><a href="../../index.html#techniques?a=sine">sine</a><a href="../../index.html#techniques?a=depth-cue">depth-cue</a><a class="mod" href="lib/capsule-helix.js">lib/capsule-helix.js</a></span><p class="ah">Each rung is a vertical capsule whose length is 2 × amplitude × |sin φ|. Two dots sit at its ends; the near strand’s dot is 45 % larger and the far one 45 % smaller.</p></li><li class="vr"><button type="button" data-t="capsule-dial"><span class="vn">Capsule dial</span><span class="vid">capsule-dial</span></button><span class="at"><a href="../../index.html#techniques?a=radial">radial</a><a href="../../index.html#techniques?a=rosette">rosette</a><a class="mod" href="lib/capsule-dial.js">lib/capsule-dial.js</a></span><p class="ah">Capsules point outward from a circle. Length and width follow a sine with three lobes around the dial; ink follows the angle through the five bands.</p></li><li class="vr"><button type="button" data-t="capsule-ui"><span class="vn">Controls from one pill</span><span class="vid">capsule-ui</span></button><span class="at"><a href="../../index.html#techniques?a=pill">pill</a><a href="../../index.html#techniques?a=control">control</a><a href="../../index.html#techniques?a=state">state</a><a class="mod" href="lib/capsule-ui.js">lib/capsule-ui.js</a></span><p class="ah">Button, toggle, three chips, slider, pager and a nine-bar meter are all one rounded bar at different sizes, filled or outlined. The meter reads the slider value.</p></li><li class="vr"><button type="button" data-t="capsule-icons"><span class="vn">Capsule icons</span><span class="vid">capsule-icons</span></button><span class="at"><a href="../../index.html#techniques?a=icon">icon</a><a href="../../index.html#techniques?a=round-cap">round-cap</a><a href="../../index.html#techniques?a=stroke">stroke</a><a class="mod" href="lib/capsule-icons.js">lib/capsule-icons.js</a></span><p class="ah">Each icon is two to eight straight round-cap strokes on a 2 × 2 unit square; the last stroke takes an ink.</p></li><li class="vr"><button type="button" data-t="hairline-frame"><span class="vn">Hairline frame</span><span class="vid">hairline-frame</span></button><span class="at"><a href="../../index.html#techniques?a=rule">rule</a><a href="../../index.html#techniques?a=frame">frame</a><a class="mod" href="lib/hairline-frame.js">lib/hairline-frame.js</a></span><p class="ah">The clip path of a panel is stroked once over the field.</p></li><li class="vr"><button type="button" data-t="tracked-label"><span class="vn">Tracked mono label</span><span class="vid">tracked-label</span></button><span class="at"><a href="../../index.html#techniques?a=mono-caps">mono-caps</a><a href="../../index.html#techniques?a=tracking">tracking</a><a href="../../index.html#techniques?a=rule">rule</a><a class="mod" href="lib/tracked-label.js">lib/tracked-label.js</a></span><p class="ah">Capitals in JetBrains Mono, set letter by letter with 0.22 em added; a short rule sits one gap below the last line.</p></li><li class="vr"><button type="button" data-t="sheet-grain"><span class="vn">Sheet grain</span><span class="vid">sheet-grain</span></button><span class="at"><a href="../../index.html#techniques?a=grain">grain</a><a href="../../index.html#techniques?a=stock">stock</a><a class="mod" href="lib/sheet-grain.js">lib/sheet-grain.js</a></span><p class="ah">A mono multiply grain over the finished sheet.</p></li></ul></div></details>
