  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Capsule system</b><span class="code">TS-22</span></span>
  <span class="pager"><a href="../../techniques/ts-19-arc-bundle-field/index.html" title="Arc bundles on a dashed globe">← TS-19</a><a href="../../index.html#techniques"><span class="n">19</span>&nbsp;/ 19</a><a class="off">→</a></span> <p class="kicker">Technique · TS-22</p><h1 class="lede">One capsule, used as field, helix, dial, control and icon.</h1><div class="body"><p>One primitive, a capsule, drawn by one function. Columns of capsules grow along an axis from 2 u dots to 78 u pills, lean 12° and take five inks in bands. The same capsule stands as the 46 rungs of a helix, the 54 spokes of a dial, the strokes of eight icons and the parts of five controls.</p><p>Each variant is an alternate treatment. Flat: vector capsules that multiply where they overlap. Stipple: every pixel is on or off by coverage, a capsule fades along its length, and a field loses coverage over the last 5 u before its clip edge. The color variants are a complement pair, a primary triad and a split complement. Motion lets the columns fall and turns the helix and the dial. Live slides the inks and the slider.</p></div>
  <div class="meta" style="display:block"><h2>Pass order</h2><ol class="steps"><li><div><b>sheet</b> · flat</div></li><li><div><b>fields</b> · capsules per ink layer, clipped; stippled fields eroded at the clip edge</div></li><li><div><b>stipple</b> · coverage to on/off pixels</div></li><li><div><b>blend</b> · ink layers onto the sheet</div></li><li><div><b>chrome</b> · frames, block, controls, icons, labels</div></li><li><div><b>grain</b> · 2 % mono</div></li></ol></div>

s?a=depth-cue">depth-cue</a></span></div><div class="vr"><span data-t="capsule-dial" title="Capsule dial"><b>DIAL</b>capsule-dial</span><span class="at"><a href="../../index.html#techniques?a=radial">radial</a><i>·</i><a href="../../index.html#techniques?a=rosette">rosette</a></span></div><div class="vr"><span data-t="capsule-ui" title="Controls from one pill"><b>CTRL</b>capsule-ui</span><span class="at"><a href="../../index.html#techniques?a=pill">pill</a><i>·</i><a href="../../index.html#techniques?a=control">control</a><i>·</i><a href="../../index.html#techniques?a=state">state</a></span></div><div class="vr"><span data-t="capsule-icons" title="Capsule icons"><b>ICON</b>capsule-icons</span><span class="at"><a href="../../index.html#techniques?a=icon">icon</a><i>·</i><a href="../../index.html#techniques?a=round-cap">round-cap</a><i>·</i><a href="../../index.html#techniques?a=stroke">stroke</a></span></div><div class="vr"><span data-t="hairline-frame" title="Hairline frame"><b>FRAME</b>hairline-frame</span><span class="at"><a href="../../index.html#techniques?a=rule">rule</a><i>·</i><a href="../../index.html#techniques?a=frame">frame</a></span></div><div class="vr"><span data-t="tracked-label" title="Tracked mono label"><b>LABL</b>tracked-label</span><span class="at"><a href="../../index.html#techniques?a=mono-caps">mono-caps</a><i>·</i><a href="../../index.html#techniques?a=tracking">tracking</a><i>·</i><a href="../../index.html#techniques?a=rule">rule</a></span></div><div class="vr"><span data-t="sheet-grain" title="Sheet grain"><b>TOOTH</b>sheet-grain</span><span class="at"><a href="../../index.html#techniques?a=grain">grain</a><i>·</i><a href="../../index.html#techniques?a=stock">stock</a></span></div></div></div>
  <div><h2>Reference</h2><div class="ro">Reference 22 · identity board built from colored capsule columns, 1080 × 1350</div></div><div><h2>Study</h2><div class="nm">Capsule system</div><div class="ro">TS-22 · Techniques · 19 / 19</div></div></div>
  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>capsule-rain</b> · Capsule columns — Each column is filled top to bottom with capsules whose length and width follow the column’s position t on the growth axis; lengths vary ±50 %. A column repeats every panel height, so the fall loops. <span class="ro">Limits · Pitch under ~4 u turns the late columns into a solid tint. gap under ~0.1 fuses a column into a bar. A lean past ±30° crosses three columns and the axis stops reading.</span> <a href="lib/capsule-rain.js">lib/capsule-rain.js</a></div></li><li><div><b>wedge-envelope</b> · Wedge envelope — The filled height is floor + (1 − floor)·t^power from the bottom; a few capsules are allowed past the edge. <span class="ro">Limits · floor at 1 fills the panel and the wedge is gone. scatter above ~0.4 hides the wedge edge.</span> <a href="lib/wedge-envelope.js">lib/wedge-envelope.js</a></div></li><li><div><b>ink-bands</b> · Ink bands on the axis — A capsule draws its ink from five gaussian bands along t. Each ink has its own layer; the layers are composited with the variant’s blend. <span class="ro">Limits · width above ~0.35 mixes all five inks everywhere. Under ~0.05 the inks meet in hard stripes.</span> <a href="lib/ink-bands.js">lib/ink-bands.js</a></div></li><li><div><b>shape-mask</b> · Shape clip with a masked edge — A field is drawn through a clip path. Three erasing strokes along the path then lower coverage toward the edge; the stipple turns that ramp into single pixels. <span class="ro">Limits · A feather above ~20 u erodes a third of a narrow panel. On flat fields the ramp would show as a gray band, so it is off there.</span> <a href="lib/shape-mask.js">lib/shape-mask.js</a></div></li><li><div><b>fine-stipple</b> · One-pixel stipple — Capsules are drawn into a coverage layer per ink. Each pixel of the layer is then set fully on or off: on when a random number is under coverage × density. <span class="ro">Limits · edge above ~1.5 u dissolves the smallest capsules. density under ~0.5 reads as a tint, not as ink.</span> <a href="lib/fine-stipple.js">lib/fine-stipple.js</a></div></li><li><div><b>capsule-helix</b> · Capsule helix — Each rung is a vertical capsule whose length is 2 × amplitude × |sin φ|. Two dots sit at its ends; the near strand’s dot is 45 % larger and the far one 45 % smaller. <span class="ro">Limits · Over ~90 rungs the capsules touch and the helix reads as a ribbon. Under one turn there is no crossing and it reads as a lens.</span> <a href="lib/capsule-helix.js">lib/capsule-helix.js</a></div></li><li><div><b>capsule-dial</b> · Capsule dial — Capsules point outward from a circle. Length and width follow a sine with three lobes around the dial; ink follows the angle through the five bands. <span class="ro">Limits · Over ~120 spokes the inner ends overlap into a ring. lobes at 0 gives a plain sun.</span> <a href="lib/capsule-dial.js">lib/capsule-dial.js</a></div></li><li><div><b>capsule-ui</b> · Controls from one pill — Button, toggle, three chips, slider, pager and a nine-bar meter are all one rounded bar at different sizes, filled or outlined. The meter reads the slider value. <span class="ro">Limits · Under 24 u height the 11.5 u label touches the pill edge.</span> <a href="lib/capsule-ui.js">lib/capsule-ui.js</a></div></li><li><div><b>capsule-icons</b> · Capsule icons — Each icon is two to eight straight round-cap strokes on a 2 × 2 unit square; the last stroke takes an ink. <span class="ro">Limits · stroke above ~10 u closes the gaps in the sun and the helix.</span> <a href="lib/capsule-icons.js">lib/capsule-icons.js</a></div></li><li><div><b>hairline-frame</b> · Hairline frame — The clip path of a panel is stroked once over the field. <span class="ro">Limits · Above ~3 u the frame competes with the capsules.</span> <a href="lib/hairline-frame.js">lib/hairline-frame.js</a></div></li><li><div><b>tracked-label</b> · Tracked mono label — Capitals in JetBrains Mono, set letter by letter with 0.22 em added; a short rule sits one gap below the last line. <span class="ro">Limits · Tracking above ~0.4 em breaks words into letters at this size.</span> <a href="lib/tracked-label.js">lib/tracked-label.js</a></div></li><li><div><b>sheet-grain</b> · Sheet grain — A mono multiply grain over the finished sheet. <span class="ro">Limits · Above ~0.06 the grain shows inside the flat inks.</span> <a href="lib/sheet-grain.js">lib/sheet-grain.js</a></div></li></ol></div>
