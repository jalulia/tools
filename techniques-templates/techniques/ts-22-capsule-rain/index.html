  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Capsule rain system</b><span class="code">TS-22</span></span>
  <span class="pager"><a href="../../techniques/ts-19-arc-bundle-field/index.html" title="Arc bundles on a dashed globe">← TS-19</a><a href="../../index.html#techniques"><span class="n">19</span>&nbsp;/ 19</a><a class="off">→</a></span> <p class="kicker">Technique · TS-22</p><h1 class="lede">Columns of pills that grow along one axis, five inks in bands.</h1><div class="body"><p>One generator fills every panel. Pills stand in columns on a 6.5 u pitch. Along the growth axis a pill goes from a 2 u dot to a 78 u capsule and from 1.5 to 10.5 u wide, so late columns overlap. Ink follows the same axis in five overlapping bands, and inks multiply where pills overlap.</p><p>A wedge limits where pills land, a hairline frame or a shape clips them, and the same field at low density gives the sparse panels. Labels are tracked mono capitals over a 22 u rule. Motion lets the pills fall. Live slides the ink bands and bends the wedge.</p></div>
  <div class="meta" style="display:block"><h2>Pass order</h2><ol class="steps"><li><div><b>sheet</b> · flat gray</div></li><li><div><b>fields</b> · capsule columns per panel, clipped, multiplied</div></li><li><div><b>frames</b> · hairlines, block, circle pair</div></li><li><div><b>labels</b> · tracked mono capitals and rules</div></li><li><div><b>grain</b> · 2 % mono</div></li></ol></div>

  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>capsule-rain</b> · Capsule columns — Each column is filled top to bottom with rounded bars whose length and width are set by the column’s position t on the growth axis; lengths vary ±50 %. <span class="ro">Limits · Pitch under the largest width (10.5 u) makes columns overlap their neighbors; that is intended at 6.5 u and turns to a solid tint under ~4 u. gap under ~0.1 fuses a column into a bar.</span> <a href="lib/capsule-rain.js">lib/capsule-rain.js</a></div></li><li><div><b>wedge-envelope</b> · Wedge envelope — The filled height is floor + (1 − floor)·t^power from the anchor side; a few pills are allowed past the edge. <span class="ro">Limits · floor at 1 fills the frame and the wedge is gone. scatter above ~0.4 hides the wedge edge.</span> <a href="lib/wedge-envelope.js">lib/wedge-envelope.js</a></div></li><li><div><b>ink-bands</b> · Ink bands on the axis — Each pill draws its ink from five gaussian bands along t and is composited with multiply, so overlaps print darker. <span class="ro">Limits · width above ~0.35 mixes all five inks everywhere. Under ~0.05 the inks meet in hard stripes.</span> <a href="lib/ink-bands.js">lib/ink-bands.js</a></div></li><li><div><b>shape-mask</b> · Shape clip — The capsule field is drawn through a clip path: a rectangle for framed panels, a ring with an opening for the mark. <span class="ro">Limits · An inner radius within ~20 u of the outer leaves a band thinner than one long capsule and the field no longer reads.</span> <a href="lib/shape-mask.js">lib/shape-mask.js</a></div></li><li><div><b>hairline-frame</b> · Hairline frame — A square-cornered rectangle stroked once over the clipped field. <span class="ro">Limits · Above ~3 u the frame competes with the capsules.</span> <a href="lib/hairline-frame.js">lib/hairline-frame.js</a></div></li><li><div><b>tracked-label</b> · Tracked mono label — Capitals in JetBrains Mono, set letter by letter with 0.22 em added; a short rule sits one gap below the last line. <span class="ro">Limits · Tracking above ~0.4 em breaks words into letters at this size.</span> <a href="lib/tracked-label.js">lib/tracked-label.js</a></div></li><li><div><b>sheet-grain</b> · Sheet grain — A mono multiply grain over the finished sheet. <span class="ro">Limits · Above ~0.06 the grain shows inside the flat inks.</span> <a href="lib/sheet-grain.js">lib/sheet-grain.js</a></div></li></ol></div>
