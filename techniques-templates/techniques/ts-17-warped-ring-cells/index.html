<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Warped ring cells</b><span class="code">TS-17</span></span>
  <span class="pager"><a href="../../techniques/ts-16-stipple-cloud-bank/index.html" title="Previous: TS-16 Stipple bank and dot burst">← TS-16</a><a class="pos" href="../../index.html#techniques"><span class="n">13</span>&nbsp;of 15</a><a href="../../techniques/ts-19-arc-bundle-field/index.html" title="Next: TS-19 Arc bundles on a dashed globe">TS-19 →</a></span> <p class="kicker"><span>TS-17</span><span>screen tone</span></p><h1 class="title">Warped ring cells</h1><p class="lede">Rounded cells on a sheet pulled at four points, inked by thirteen pools, printed as single pixels.</p><div class="body"><p>A 52 u grid of rounded cells sits on a sheet pulled at four points; each pull falls off as a gaussian, so cells behind it stretch to nearly three times their length. Each ink pool fills cells, outlines them or fills the gutters. Every pixel takes one ink with a chance equal to the coverage there, or shows stock; nothing is blurred.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>margin</b><span>paper</span></li><li><b>pulls</b><span>pixel to sample point</span></li><li><b>cells</b><span>solid, outline and gutter coverage</span></li><li><b>pools</b><span>strength per pixel, ink by share</span></li><li><b>print</b><span>one ink or stock per pixel</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>5</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="paper-margin"><span class="vn">Plain margin</span><span class="vid">paper-margin</span></button><span class="at"><a href="../../index.html#techniques?a=margin">margin</a><a href="../../index.html#techniques?a=stock">stock</a><a class="mod" href="lib/paper-margin.js">lib/paper-margin.js</a></span><p class="ah">Flat paper fill; the print sits inset on every side.</p></li><li class="vr"><button type="button" data-t="sheet-pull"><span class="vn">Gaussian sheet pulls</span><span class="vid">sheet-pull</span></button><span class="at"><a href="../../index.html#techniques?a=domain-warp">domain-warp</a><a href="../../index.html#techniques?a=gaussian">gaussian</a><a href="../../index.html#techniques?a=displacement">displacement</a><a class="mod" href="lib/sheet-pull.js">lib/sheet-pull.js</a></span><p class="ah">Each pixel is sampled at its own position minus every pull vector times exp(−d² / r²). The grid is read at the sample point, so the sheet stretches behind a pull and bunches ahead of it.</p></li><li class="vr"><button type="button" data-t="ring-cell"><span class="vn">Rounded cell</span><span class="vid">ring-cell</span></button><span class="at"><a href="../../index.html#techniques?a=grid">grid</a><a href="../../index.html#techniques?a=superellipse">superellipse</a><a href="../../index.html#techniques?a=ring">ring</a><a class="mod" href="lib/ring-cell.js">lib/ring-cell.js</a></span><p class="ah">The distance from the cell center is a superellipse. Three shapes are read from it: the solid cell, an outline band, and the gutter past it.</p></li><li class="vr"><button type="button" data-t="ink-pool"><span class="vn">Ink pools</span><span class="vid">ink-pool</span></button><span class="at"><a href="../../index.html#techniques?a=palette-field">palette-field</a><a href="../../index.html#techniques?a=gaussian">gaussian</a><a href="../../index.html#techniques?a=per-cell">per-cell</a><a class="mod" href="lib/ink-pool.js">lib/ink-pool.js</a></span><p class="ah">Each pool has an ink, a center, a gaussian radius and a mode. Its strength is 2.4 × the gaussian, read per pixel and clipped at 1, so the middle of a pool is solid; the mode says which shape of the cell it colors.</p></li><li class="vr"><button type="button" data-t="stochastic-speckle"><span class="vn">Noise-threshold print</span><span class="vid">stochastic-speckle</span></button><span class="at"><a href="../../index.html#techniques?a=dither">dither</a><a href="../../index.html#techniques?a=grain">grain</a><a href="../../index.html#techniques?a=speckle">speckle</a><a class="mod" href="lib/stochastic-speckle.js">lib/stochastic-speckle.js</a></span><p class="ah">Per pixel: ink if a random number is under the coverage, with the ink drawn in proportion to each pool’s share; otherwise stock, or a stray ink pixel.</p></li></ul></div></details>
