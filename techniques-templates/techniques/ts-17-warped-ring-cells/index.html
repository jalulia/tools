  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Warped ring cells</b><span class="code">TS-17</span></span>
  <span class="pager"><a href="../../techniques/ts-16-stipple-cloud-bank/index.html" title="Stipple bank and dot burst">← TS-16</a><a href="../../index.html#techniques"><span class="n">17</span>&nbsp;/ 18</a><a href="../../techniques/ts-19-arc-bundle-field/index.html" title="Arc bundles on a dashed globe">TS-19 →</a></span> <p class="kicker">Technique · TS-17</p><h1 class="lede">A grid of ringed cells pulled through a lens, printed as speckle.</h1><div class="body"><p>A square grid of rounded cells, pitch 64 u, turned 14°. Each cell carries an outer ring and, in most cells, a thin inner ring. The grid is read through a pinch lens: sample positions are pulled toward the lens center, so cells far from it stretch along the radius.</p><p>Ink color comes from five anchors blended by distance and fixed per cell. Every pixel is thresholded against noise, so rings are speckle, not line, and stray color pixels land on the stock between them. A 34 u margin frames the sheet.</p></div>
  <div class="meta" style="display:block"><h2>Pass order</h2><ol class="steps"><li><div><b>margin</b> · paper</div></li><li><div><b>warp</b> · pixel to sample point</div></li><li><div><b>cells</b> · two ring bands per cell, ink by region</div></li><li><div><b>print</b> · noise threshold per pixel, stray ink on stock</div></li><li><div><b>soften</b> · 0.8 px blur</div></li></ol></div>
  <div class="meta"><div class="full"><h2>Vocabulary · a technique highlights its reads · an atom finds every use</h2><div class="vocab" id="chips"><div class="vr"><span data-t="paper-margin" title="Plain margin"><b>EDGE</b>paper-margin</span><span class="at"><a href="../../index.html#techniques?a=margin">margin</a><i>·</i><a href="../../index.html#techniques?a=stock">stock</a></span></div><div class="vr"><span data-t="lens-warp" title="Pinch lens"><b>WARP</b>lens-warp</span><span class="at"><a href="../../index.html#techniques?a=domain-warp">domain-warp</a><i>·</i><a href="../../index.html#techniques?a=radial">radial</a><i>·</i><a href="../../index.html#techniques?a=lens">lens</a></span></div><div class="vr"><span data-t="ring-cell" title="Ringed rounded cell"><b>CELL</b>ring-cell</span><span class="at"><a href="../../index.html#techniques?a=grid">grid</a><i>·</i><a href="../../index.html#techniques?a=superellipse">superellipse</a><i>·</i><a href="../../index.html#techniques?a=ring">ring</a></span></div><div class="vr"><span data-t="hue-field" title="Anchored ink regions"><b>HUE</b>hue-field</span><span class="at"><a href="../../index.html#techniques?a=palette-field">palette-field</a><i>·</i><a href="../../index.html#techniques?a=per-cell">per-cell</a></span></div><div class="vr"><span data-t="stochastic-speckle" title="Noise-threshold print"><b>GRAIN</b>stochastic-speckle</span><span class="at"><a href="../../index.html#techniques?a=dither">dither</a><i>·</i><a href="../../index.html#techniques?a=grain">grain</a><i>·</i><a href="../../index.html#techniques?a=speckle">speckle</a></span></div></div></div>

  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>paper-margin</b> · Plain margin — Flat paper fill; the print sits inset on every side. <span class="ro">Limits · Above ~120 u the margin crops the stretched cells at the sheet edge.</span> <a href="lib/paper-margin.js">lib/paper-margin.js</a></div></li><li><div><b>lens-warp</b> · Pinch lens — Each pixel is mapped to a sample point pulled toward the lens center by 1/(1 + k·r²); the grid is evaluated at the sample point. <span class="ro">Limits · k below about −0.6 folds the grid over itself inside the sheet. k above ~3 stretches the outer cells past the sheet and they read as bars.</span> <a href="lib/lens-warp.js">lib/lens-warp.js</a></div></li><li><div><b>ring-cell</b> · Ringed rounded cell — Inside each cell the distance to the center is measured as a superellipse; two bands of that distance carry ink and the space past 0.45 carries a lighter tint. Both strengthen with a gaussian field centered on the lens. <span class="ro">Limits · outer.at + width + grow above ~0.6 closes every gutter and the cells read as holes in a flat tint. Pitch under ~28 u falls below the speckle and the rings vanish.</span> <a href="lib/ring-cell.js">lib/ring-cell.js</a></div></li><li><div><b>hue-field</b> · Anchored ink regions — Five anchor points carry one ink each. A cell takes the ink of its nearest anchor, or with up to 30 % chance the second nearest. <span class="ro">Limits · sharpness under ~1.5 mixes every region and no ink dominates anywhere. mix above ~0.4 reads as random color.</span> <a href="lib/hue-field.js">lib/hue-field.js</a></div></li><li><div><b>stochastic-speckle</b> · Noise-threshold print — Per pixel: ink if a random number is under the coverage, else stock; a share of stock pixels take a random ink. A 0.8 px blur follows. <span class="ro">Limits · stray above ~0.2 lifts the stock to a tint and the rings lose contrast. soften above ~1.5 px turns the speckle into tone.</span> <a href="lib/stochastic-speckle.js">lib/stochastic-speckle.js</a></div></li></ol></div>
  <div class="meta static" style="display:block"><h2>10 reads · u, v on the sheet</h2><ol class="steps"><li><div><b>WARP</b> · Lens center · cells are smallest here <span class="ro">u 0.50 · v 0.52 · lens-warp</span></div></li><li><div><b>WARP</b> · Far from the center · cells stretch along the radius <span class="ro">u 0.46 · v 0.14 · lens-warp</span></div></li><li><div><b>CELL</b> · Outer ring · band at 0.37 of the cell, rounded square <span class="ro">u 0.30 · v 0.44 · ring-cell</span></div></li><li><div><b>CELL</b> · Inner ring · band at 0.2, in 7 cells of 10 <span class="ro">u 0.66 · v 0.40 · ring-cell</span></div></li><li><div><b>CELL</b> · Gutters · up to 60 % ink between cells near the center <span class="ro">u 0.56 · v 0.62 · ring-cell</span></div></li><li><div><b>HUE</b> · Ink anchor · red, lower right <span class="ro">u 0.74 · v 0.80 · hue-field</span></div></li><li><div><b>HUE</b> · Ink anchor · yellow, left edge <span class="ro">u 0.14 · v 0.66 · hue-field</span></div></li><li><div><b>GRAIN</b> · Stray pixels · 15 % of stock pixels take an ink <span class="ro">u 0.86 · v 0.30 · stochastic-speckle</span></div></li><li><div><b>GRAIN</b> · Ring edge · thresholded against noise, no hard line <span class="ro">u 0.22 · v 0.88 · stochastic-speckle</span></div></li><li><div><b>EDGE</b> · Margin · 34 u, no rule <span class="ro">u 0.50 · v 0.01 · paper-margin</span></div></li></ol></div>
