  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Warped ring cells</b><span class="code">TS-17</span></span>
  <span class="pager"><a href="../../techniques/ts-16-stipple-cloud-bank/index.html" title="Stipple bank and dot burst">← TS-16</a><a href="../../index.html#techniques"><span class="n">17</span>&nbsp;/ 19</a><a href="../../techniques/ts-19-arc-bundle-field/index.html" title="Arc bundles on a dashed globe">TS-19 →</a></span> <p class="kicker">Technique · TS-17</p><h1 class="lede">A grid of rounded cells on a pulled sheet, inked in pools, printed as single pixels.</h1><div class="body"><p>A square grid of rounded cells, pitch 52 u, lies on a sheet that is pulled at four points. A pull moves the sheet by a vector that falls off as a gaussian. Cells behind a pull stretch to nearly three times their length; cells ahead of it shrink. Thirteen pools of ink sit over the sheet. A pool fills the cells, outlines them, or fills the gutters between them.</p><p>Nothing is drawn as a line and nothing is blurred. Each pixel takes an ink with a chance equal to the coverage there, drawn in proportion to the pools that reach it, and otherwise shows stock. 12 % of pixels near a pool take a stray ink. Motion swings the pulls. Live adds a pull under the pointer.</p></div>
  <div class="meta" style="display:block"><h2>Pass order</h2><ol class="steps"><li><div><b>margin</b> · paper</div></li><li><div><b>pulls</b> · pixel to sample point</div></li><li><div><b>cells</b> · solid, outline and gutter coverage</div></li><li><div><b>pools</b> · strength per pixel, ink by share</div></li><li><div><b>print</b> · one ink or stock per pixel</div></li></ol></div>

  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>paper-margin</b> · Plain margin — Flat paper fill; the print sits inset on every side. <span class="ro">Limits · Above ~120 u the margin crops the stretched band.</span> <a href="lib/paper-margin.js">lib/paper-margin.js</a></div></li><li><div><b>sheet-pull</b> · Gaussian sheet pulls — Each pixel is sampled at its own position minus every pull vector times exp(−d² / r²). The grid is read at the sample point, so the sheet stretches behind a pull and bunches ahead of it. <span class="ro">Limits · A pull folds the sheet when 0.86 × vector length exceeds its radius; at strength 1 the largest ratio is 0.65. Pitch under ~24 u puts a cell below ten pixels and the outline closes.</span> <a href="lib/sheet-pull.js">lib/sheet-pull.js</a></div></li><li><div><b>ring-cell</b> · Rounded cell — The distance from the cell center is a superellipse. Three shapes are read from it: the solid cell, an outline band, and the gutter past it. <span class="ro">Limits · cell_at above gutter_at removes the stock band between a cell and its gutter. edge above ~0.2 thins every shape to a haze.</span> <a href="lib/ring-cell.js">lib/ring-cell.js</a></div></li><li><div><b>ink-pool</b> · Ink pools — Each pool has an ink, a center, a gaussian radius and a mode. Its strength is 2.4 × the gaussian, read per pixel and clipped at 1, so the middle of a pool is solid; the mode says which shape of the cell it colors. <span class="ro">Limits · size above ~2 merges the pools into one field and no region reads. gain under ~0.4 leaves only the stray pixels.</span> <a href="lib/ink-pool.js">lib/ink-pool.js</a></div></li><li><div><b>stochastic-speckle</b> · Noise-threshold print — Per pixel: ink if a random number is under the coverage, with the ink drawn in proportion to each pool’s share; otherwise stock, or a stray ink pixel. <span class="ro">Limits · stray above ~0.25 lifts the stock to a tint. Any soften above 0 turns the pixels into tone and the print reads as blurred.</span> <a href="lib/stochastic-speckle.js">lib/stochastic-speckle.js</a></div></li></ol></div>
