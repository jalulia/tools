  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Grain gradient layers</b><span class="code">TS-09</span></span>
  <span class="pager"><a href="../../techniques/ts-08-flat-color-card-set/index.html" title="Flat-color card set">← TS-08</a><a href="../../index.html#techniques"><span class="n">9</span>&nbsp;/ 14</a><a href="../../techniques/ts-10-thermal-blob-field/index.html" title="Thermal blob field">TS-10 →</a></span> <p class="kicker">Technique · TS-09</p><h1 class="lede">Three gradient panels, one soft mask, one ripple band, one grain.</h1><div class="body"><p>Three portrait panels. The first is a vertical two-stop gradient with a black shape blurred in from the left; the same shape blurred far wider tints the field crimson as it nears the black. The second is a blue field of stacked dark arcs at one pitch, darkest inside a window and cut off below it — each peak slides left down the stack, and the arcs taper to points where the window ends. The third runs black through red to pink on a 66° diagonal.</p><p>Everything draws flat, then one additive grain crosses all three panels at once — heavier in the darks, lighter in the lights. Captions sit in the corners.</p></div>
  <div class="meta" style="display:block"><h2>Pass order</h2><ol class="steps"><li><div><b>gradients</b> · three panels, canvas linear gradients</div></li><li><div><b>soft mask</b> · halo blur ×4, then the black blur, clipped to panel 1</div></li><li><div><b>ripple band</b> · per-pixel arcs on panel 2, blurred 3.3 u</div></li><li><div><b>captions</b> · Inter 22 u in the corners</div></li><li><div><b>grain</b> · additive mono + per-channel multiplicative, whole sheet</div></li></ol></div>
  <div class="meta"><div class="full"><h2>Techniques read · click to highlight</h2><div class="tags" id="chips"><span data-t="two-stop-gradient" title="Two-stop linear gradient">two-stop-gradient</span><span data-t="soft-mask" title="Blurred shape mask">soft-mask</span><span data-t="ripple-band" title="Concentric ripple band">ripple-band</span><span data-t="film-grain" title="Additive film grain">film-grain</span><span data-t="caption-label" title="Corner caption">caption-label</span></div></div>
  <div><h2>Reference</h2><div class="ro">Reference 09 · three grained gradient panels, 1200 × 800</div></div><div><h2>Study</h2><div class="nm">Grain gradient layers</div><div class="ro">TS-09 · Techniques · 9 / 14</div></div></div>
  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>two-stop-gradient</b> · Two-stop linear gradient — Each panel starts as a canvas linear gradient; C runs from the panel top-left along 66° from horizontal, with knee stops so black holds to 0.15 and pink holds from 0.67.</div></li><li><div><b>soft-mask</b> · Blurred shape mask — The shape is drawn twice on padded offscreens: once in crimson and blurred wide (σ 110 u), drawn four times to tint the field; once in black and blurred σ 33 u, drawn over. The wide blur is the halo that reddens the gradient near the black.</div></li><li><div><b>ripple-band</b> · Concentric ripple band — Per pixel: solve q, the peak height of the arc through the pixel (three fixed-point steps, since the peak x depends on q); darkness = envelope(q) × a thresholded cosine of q whose threshold rises as the envelope falls, so the stripes thin to points where the window cuts off on the right; light stripes sit at the opposite phase. The layer is blurred 3.3 u.</div></li><li><div><b>film-grain</b> · Additive film grain — One pass over the whole canvas after every panel is drawn: a mono additive noise scaled down with luminance (it reads in the black, thins in the pink), plus a small per-channel multiplicative term for the color speckle.</div></li><li><div><b>caption-label</b> · Corner caption — Three short captions in Inter at 22 u, set flat under the grain so the grain sits on the type too.</div></li></ol></div>
  <div class="meta static" style="display:block"><h2>10 reads · u, v on the sheet</h2><ol class="steps"><li><div><b>MASK</b> · Soft mask · black shape, edge blurred σ 33 u <span class="ro">u 0.11 · v 0.60 · soft-mask</span></div></li><li><div><b>MASK</b> · Mask edge · 10 → 90 % over 83 u <span class="ro">u 0.24 · v 0.55 · soft-mask</span></div></li><li><div><b>MASK</b> · Halo · the same mask blurred σ 110 u tints the field crimson <span class="ro">u 0.30 · v 0.40 · soft-mask</span></div></li><li><div><b>GRAD</b> · Gradient A · two stops, vertical, orange to red-orange <span class="ro">u 0.31 · v 0.05 · two-stop-gradient</span></div></li><li><div><b>RIPL</b> · Upper arcs · pitch 32 u, contrast rising toward the band <span class="ro">u 0.42 · v 0.12 · ripple-band</span></div></li><li><div><b>RIPL</b> · Band · same pitch, dark duty 63 %, light stripes between, blur 3.3 u <span class="ro">u 0.50 · v 0.40 · ripple-band</span></div></li><li><div><b>RIPL</b> · Tips · arcs taper where the window cuts off, 2 u left per u down <span class="ro">u 0.60 · v 0.55 · ripple-band</span></div></li><li><div><b>GRAD</b> · Gradient C · black → red → pink along 66° <span class="ro">u 0.86 · v 0.42 · two-stop-gradient</span></div></li><li><div><b>GRAN</b> · Film grain · additive, σ 12/255 in black, 6/255 in pink <span class="ro">u 0.90 · v 0.86 · film-grain</span></div></li><li><div><b>CAPT</b> · Caption · Inter 400, 22 u, right-aligned, 14 u from the edge <span class="ro">u 0.94 · v 0.19 · caption-label</span></div></li></ol></div>
