<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Grain gradient layers</b><span class="code">TS-09</span></span>
  <span class="pager"><a href="../../techniques/ts-06-riso-plate-separation/index.html" title="Previous: TS-06 Riso three-plate separation">← TS-06</a><a class="pos" href="../../index.html#techniques"><span class="n">5</span>&nbsp;of 15</a><a href="../../techniques/ts-10-thermal-blob-field/index.html" title="Next: TS-10 Thermal blob field">TS-10 →</a></span> <p class="kicker"><span>TS-09</span><span>light gradient</span></p><h1 class="title">Grain gradient layers</h1><p class="lede">Three gradient panels with one soft mask, one ripple band and one grain across all three.</p><div class="body"><p>Panel one is a two-stop gradient with a black shape blurred in from the left. Panel two stacks dark arcs at one pitch inside a window; panel three runs black through red to pink on a 66° diagonal. Everything is drawn flat, then one additive color grain crosses all three panels, heavier in the darks.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>gradients</b><span>three panels, canvas linear gradients</span></li><li><b>soft mask</b><span>halo blur ×4, then the black blur, clipped to panel 1</span></li><li><b>ripple band</b><span>per-pixel arcs on panel 2, blurred 3.3 u</span></li><li><b>captions</b><span>Inter 22 u in the corners</span></li><li><b>grain</b><span>additive mono + per-channel multiplicative, whole sheet</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>5</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="two-stop-gradient"><span class="vn">Two-stop linear gradient</span><span class="vid">two-stop-gradient</span></button><span class="at"><a href="../../index.html#techniques?a=gradient">gradient</a><a href="../../index.html#techniques?a=field">field</a></span><p class="ah">Each panel starts as a canvas linear gradient; C runs from the panel top-left along 66° from horizontal, with knee stops so black holds to 0.15 and pink holds from 0.67.</p></li><li class="vr"><button type="button" data-t="soft-mask"><span class="vn">Blurred shape mask</span><span class="vid">soft-mask</span></button><span class="at"><a href="../../index.html#techniques?a=mask">mask</a><a href="../../index.html#techniques?a=blur">blur</a><a href="../../index.html#techniques?a=shape">shape</a></span><p class="ah">The shape is drawn twice on padded offscreens: once in crimson and blurred wide (σ 110 u), drawn four times to tint the field; once in black and blurred σ 33 u, drawn over. The wide blur is the halo that reddens the gradient near the black.</p></li><li class="vr"><button type="button" data-t="ripple-band"><span class="vn">Concentric ripple band</span><span class="vid">ripple-band</span></button><span class="at"><a href="../../index.html#techniques?a=grating">grating</a><a href="../../index.html#techniques?a=radial">radial</a><a href="../../index.html#techniques?a=envelope">envelope</a><a href="../../index.html#techniques?a=blur">blur</a></span><p class="ah">Per pixel: solve q, the peak height of the arc through the pixel (three fixed-point steps, since the peak x depends on q); darkness = envelope(q) × a thresholded cosine of q whose threshold rises as the envelope falls, so the stripes thin to points where the window cuts off on the right; light stripes sit at the opposite phase. The layer is blurred 3.3 u.</p></li><li class="vr"><button type="button" data-t="film-grain"><span class="vn">Additive film grain</span><span class="vid">film-grain</span></button><span class="at"><a href="../../index.html#techniques?a=grain">grain</a><a href="../../index.html#techniques?a=noise">noise</a><a href="../../index.html#techniques?a=additive">additive</a></span><p class="ah">One pass over the whole canvas after every panel is drawn: a mono additive noise scaled down with luminance (it reads in the black, thins in the pink), plus a small per-channel multiplicative term for the color speckle.</p></li><li class="vr"><button type="button" data-t="caption-label"><span class="vn">Corner caption</span><span class="vid">caption-label</span></button><span class="at"><a href="../../index.html#techniques?a=lettering">lettering</a><a href="../../index.html#techniques?a=sans">sans</a><a href="../../index.html#techniques?a=caption">caption</a></span><p class="ah">Three short captions in Inter at 22 u, set flat under the grain so the grain sits on the type too.</p></li></ul></div></details>
