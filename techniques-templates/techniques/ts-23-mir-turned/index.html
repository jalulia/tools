<!-- <span class="crumb"><a href="../../../library/">Library</a><span class="sep">/</span><a href="../../../library/#/plates?kind3=technique">Techniques</a><span class="sep">/</span><b>Mir, turned</b><span class="code">TS-23</span></span>
  <span class="pager"><a href="../../techniques/ts-22-capsule-rain/index.html" title="Previous: TS-22 Capsule system">← TS-22</a><a class="pos" href="../../../library/#/plates?kind3=technique"><span class="n">16</span>&nbsp;of 20</a><a href="../../techniques/ts-24-icon-on-its-grid/index.html" title="Next: TS-24 Mir on its icon grid">TS-24 →</a></span> <p class="kicker"><span>TS-23</span><span>character construction</span></p><h1 class="title">Mir, turned</h1><p class="lede">Mir as a construction: a sphere, a dome and two cans, turned and lit.</p><div class="body"><p>The head is a sphere of radius R = 300 u. The dome is the cap above a band at 12° latitude; the eyes and mouth are decals wrapped onto the sphere; each can is a 0.46 R cylinder with a beveled face, splayed 26.5° toward the viewer; each antenna is a 0.12 R tube. One rotation projects every part, so the line keeps one weight at every turn.</p><p>Fills are computed per pixel from the surface normal under one light from the upper left. Flat reads only the part. Grain and Mono print the shade as single-pixel dots, Engraved cuts it into lines along parallel planes through each part, and Pencil lays graphite strokes over it and leaves the construction circles in.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>ground</b><span>the sheet in the ground ink</span></li><li><b>form</b><span>sphere, cans and antennae rotated by Turn and Tilt; back can, head, front can</span></li><li><b>fill</b><span>per pixel from the surface normal: part, shade, finish</span></li><li><b>line</b><span>outline, band, folds and rims in one weight; eyes and mouth filled</span></li><li><b>finish</b><span>Pencil adds the construction circles last</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>7</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="ground-inks"><span class="vn">Ground and inks</span><span class="vid">ground-inks</span></button><span class="at"><a href="../../index.html#techniques?a=ground">ground</a><a href="../../index.html#techniques?a=palette">palette</a><a href="../../index.html#techniques?a=brand-rule">brand-rule</a><a class="mod" href="lib/ground-inks.js">lib/ground-inks.js</a></span><p class="ah">One switch picks five roles from the palette: sheet, line, face, accent and the one-ink color for Mono, Engraved and Pencil.</p></li><li class="vr"><button type="button" data-t="head-sphere"><span class="vn">Head sphere, turned</span><span class="vid">head-sphere</span></button><span class="at"><a href="../../index.html#techniques?a=sphere">sphere</a><a href="../../index.html#techniques?a=rotation">rotation</a><a href="../../index.html#techniques?a=orthographic">orthographic</a><a href="../../index.html#techniques?a=latitude-band">latitude-band</a><a class="mod" href="lib/head-sphere.js">lib/head-sphere.js</a></span><p class="ah">Every part is built in head space and taken to the view by one rotation, tilt about x then turn about y, and an orthographic projection. The band is the latitude circle at 12°; only its front half is drawn.</p></li><li class="vr"><button type="button" data-t="headphone-cans"><span class="vn">Cans and antennae</span><span class="vid">headphone-cans</span></button><span class="at"><a href="../../index.html#techniques?a=cylinder">cylinder</a><a href="../../index.html#techniques?a=bevel">bevel</a><a href="../../index.html#techniques?a=convex-hull">convex-hull</a><a href="../../index.html#techniques?a=tube">tube</a><a class="mod" href="lib/headphone-cans.js">lib/headphone-cans.js</a></span><p class="ah">A can is a puck: a cylinder with rounded edges, its inner face tangent to the sphere. Its outline is the convex hull of 14 rims sampled at 144 points, so ellipse arcs join by true tangent lines. A front can always stands out past the head’s silhouette by at least 1.3 line widths (it slides along the ear axis when the turn would bring the two outlines together), so the head line meets it in clean T-junctions. A can whose axis has turned to within 0.1 of edge-on is drawn behind the head (any overlap at that moment is thinner than the line) and slides up to 0.12 R into it, so it tucks behind the head instead of standing beside it as a slab.</p></li><li class="vr"><button type="button" data-t="brain-folds"><span class="vn">Dome and brain folds</span><span class="vid">brain-folds</span></button><span class="at"><a href="../../index.html#techniques?a=scallop">scallop</a><a href="../../index.html#techniques?a=latitude-rows">latitude-rows</a><a href="../../index.html#techniques?a=sphere-curve">sphere-curve</a><a class="mod" href="lib/brain-folds.js">lib/brain-folds.js</a></span><p class="ah">Each fold is a curve on the sphere: latitude rises in √sin humps 0.075 R high every 0.28 R of arc and drifts by up to 0.4 of a row; one end curls down and back through 112° on a 0.055 R radius. Only the part facing the viewer and clear of the outline is drawn.</p></li><li class="vr"><button type="button" data-t="face-decals"><span class="vn">Eyes, look and mouth</span><span class="vid">face-decals</span></button><span class="at"><a href="../../index.html#techniques?a=decal">decal</a><a href="../../index.html#techniques?a=gaze">gaze</a><a href="../../index.html#techniques?a=glint">glint</a><a class="mod" href="lib/face-decals.js">lib/face-decals.js</a></span><p class="ah">Eyes and mouth are shapes in the tangent plane at a point of the sphere, pushed back onto it. The glint offset is 1.4 × (sin across · cos up, sin up) of the eye radius, eased to at most 0.85.</p></li><li class="vr"><button type="button" data-t="brush-line"><span class="vn">Brush line</span><span class="vid">brush-line</span></button><span class="at"><a href="../../index.html#techniques?a=stroke">stroke</a><a href="../../index.html#techniques?a=round-cap">round-cap</a><a href="../../index.html#techniques?a=single-weight">single-weight</a><a class="mod" href="lib/brush-line.js">lib/brush-line.js</a></span><p class="ah">Round-capped, round-joined strokes of one width over the fills; eyes and mouth are filled in the line color.</p></li><li class="vr"><button type="button" data-t="finish"><span class="vn">Finish</span><span class="vid">finish</span></button><span class="at"><a href="../../index.html#techniques?a=stochastic-screen">stochastic-screen</a><a href="../../index.html#techniques?a=engraving">engraving</a><a href="../../index.html#techniques?a=graphite">graphite</a><a href="../../index.html#techniques?a=per-pixel">per-pixel</a><a class="mod" href="lib/finish.js">lib/finish.js</a></span><p class="ah">Per pixel: tone = 1 − n·L, eased in past mid-shade. Grain keeps the part colors and screens only the shade, in the darkest ink; Mono screens one ink; Engraved inks a line where the plane phase falls within the tone; Pencil draws broken diagonal strokes thinned by paper tooth. On the deep ground the one ink is paper and prints the light, from 70% on the lit side down to none in the shade, so the paper line still reads.</p></li></ul></div></details>
