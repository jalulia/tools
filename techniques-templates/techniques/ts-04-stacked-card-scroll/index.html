  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Stacked card scroll</b><span class="code">TS-04</span></span>
  <span class="pager"><a href="../../techniques/ts-03-iridescent-chrome/index.html" title="Iridescent chrome on black">← TS-03</a><a href="../../index.html#techniques"><span class="n">4</span>&nbsp;/ 14</a><a href="../../techniques/ts-05-line-screen-type/index.html" title="Vertical line-screen type">TS-05 →</a></span> <p class="kicker">Technique · TS-04</p><h1 class="lede">Rounded cards pin to the top and stack; each one a different ground.</h1><div class="body"><p>A column of full-height cards on black. Every card is sticky at the same top offset, so the card on screen holds while the next slides over it; the covered card clips at the incoming edge and shrinks a few percent. Each card is one flat color, 36 u corners, 24 u margin, and carries one thing — a headline panel, a specimen grid, a blurred plate.</p><p>The still draws the stacked state as one frame: card 1 cut short by card 2, card 2 full, cards 3 and 4 arriving from the bottom. Press L for the live scroll.</p></div>
  <div class="meta" style="display:block"><h2>Pass order</h2><ol class="steps"><li><div><b>ground</b> · flat black</div></li><li><div><b>cards</b> · rrect fill + clip, bottom to top so the upper card is covered</div></li><li><div><b>card 1</b> · panel, captions, headline in Archivo 800</div></li><li><div><b>card 2</b> · six specimen tiles</div></li><li><div><b>card 3</b> · plate: gradients → blur → grain</div></li><li><div><b>card 4</b> · white peek with a mono metadata row</div></li></ol></div>

  <div><h2>Reference</h2><div class="ro">Reference 04 · phone-height screenshot of a stacked card page, 670 × 1666</div></div><div><h2>Study</h2><div class="nm">Stacked card scroll</div><div class="ro">TS-04 · Techniques · 4 / 14</div></div></div>
  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>sticky-stack</b> · Sticky card stack — Every card is sticky at the same top offset, each a direct child of the scrolling body; the incoming card covers the pinned one, which is clipped at the seam and scaled to 0.95 as it goes under; cards are siblings of one scroll container, not wrapped in sections, so each stays pinned until the end of the page.</div></li><li><div><b>card-ground</b> · Flat card ground — Each card is one flat fill; nothing separates cards but the ground showing through the gap and the corner radius.</div></li><li><div><b>rounded-frame</b> · Rounded frame — rrect(24, y, 952, h, 36) filled then used as a clip for everything on the card; the inset panel is a plain rectangle that the clip cuts.</div></li><li><div><b>specimen-grid</b> · Specimen grid — Six tiles, alternately light and dark, each showing one type size: a wide word, a two-line condensed heading, a staggered mono list, a display numeral with mono alphabet rows, cropped display letters, a color-bar table.</div></li><li><div><b>soft-blur-plate</b> · Soft blur plate — Radial gradients on a flat gray, blurred with a 2-D gaussian, then multiplied by mono grain so the gradient does not band.</div></li></ol></div>
  <div class="meta static" style="display:block"><h2>10 reads · u, v on the sheet</h2><ol class="steps"><li><div><b>STCK</b> · Stack seam · card 1 is clipped at 670 u where card 2 covers it; 34 u of ground between <span class="ro">u 0.50 · v 0.27 · sticky-stack</span></div></li><li><div><b>STCK</b> · Card 4 arriving · only 70 u of it is on screen yet <span class="ro">u 0.50 · v 0.96 · sticky-stack</span></div></li><li><div><b>GRND</b> · Card 1 ground · flat red, no gradient, no border <span class="ro">u 0.06 · v 0.15 · card-ground</span></div></li><li><div><b>GRND</b> · Card 2 ground · flat gray 217; the tiles sit on it without shadow <span class="ro">u 0.50 · v 0.32 · card-ground</span></div></li><li><div><b>FRME</b> · Corner · 36 u radius on all four corners, 24 u side margin <span class="ro">u 0.04 · v 0.28 · rounded-frame</span></div></li><li><div><b>FRME</b> · Inset panel · 66 u inside the card, runs past the clip on the right and bottom <span class="ro">u 0.13 · v 0.04 · rounded-frame</span></div></li><li><div><b>SPEC</b> · Specimen tile · 2 columns × 3 rows, tiles 425 × 242 u, gutter 28 / 39 u <span class="ro">u 0.28 · v 0.41 · specimen-grid</span></div></li><li><div><b>SPEC</b> · Type sizes · one display numeral, three mono rows on a light tile <span class="ro">u 0.72 · v 0.52 · specimen-grid</span></div></li><li><div><b>BLUR</b> · Plate · two bright radial blobs and one dark, blurred 14 u <span class="ro">u 0.70 · v 0.84 · soft-blur-plate</span></div></li><li><div><b>BLUR</b> · Plate grain · mono noise, amp 0.04, so the blur does not band <span class="ro">u 0.25 · v 0.91 · soft-blur-plate</span></div></li></ol></div>
