<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Four-ink spot illustration</b><span class="code">TS-02</span></span>
  <span class="pager"><a href="../../techniques/ts-01-moire-ring-screens/index.html" title="Previous: TS-01 Moiré from two ring screens">← TS-01</a><a class="pos" href="../../index.html#techniques"><span class="n">2</span>&nbsp;of 15</a><a href="../../techniques/ts-03-iridescent-chrome/index.html" title="Next: TS-03 Iridescent chrome on black">TS-03 →</a></span> <p class="kicker"><span>TS-02</span><span>print physics</span></p><h1 class="title">Four-ink spot illustration</h1><p class="lede">A black keyline and three flat spot inks, slipped 1 to 2.5 u off register, with hatch and dot tints.</p><div class="body"><p>Eight objects are filled flat on red, yellow and blue plates and outlined on black. Green is yellow under blue; pink and sky are 5 u dot tints. Shadow sides carry a 45° broken hatch at 6 u pitch, on off-white stock with a low mottle and one-pixel grain.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>stock</b><span>cream flat</span></li><li><b>color plates</b><span>flat fills, tints, knockouts per shape</span></li><li><b>composite</b><span>yellow, red, blue plates multiplied at their offsets</span></li><li><b>black plate</b><span>keylines, hatch, captions in register</span></li><li><b>age</b><span>mottle multiply, 0.35 px blur, mono grain</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>7</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="spot-fill"><span class="vn">Flat spot fill</span><span class="vid">spot-fill</span></button><span class="at"><a href="../../index.html#techniques?a=flat-fill">flat-fill</a><a href="../../index.html#techniques?a=plate">plate</a><a href="../../index.html#techniques?a=knockout">knockout</a></span><p class="ah">Every closed shape is filled flat on one plate canvas and cleared from the others (destination-out), so plates only overlap where an overprint is intended.</p></li><li class="vr"><button type="button" data-t="black-keyline"><span class="vn">Black keyline</span><span class="vid">black-keyline</span></button><span class="at"><a href="../../index.html#techniques?a=outline">outline</a><a href="../../index.html#techniques?a=stroke">stroke</a><a href="../../index.html#techniques?a=waver">waver</a></span><p class="ah">Each shape is stroked twice on the black plate: 2.2 u on the path, then 1.4 u on the path shifted by a seeded 0.6 u jitter, which thickens the line unevenly.</p></li><li class="vr"><button type="button" data-t="hatch-shade"><span class="vn">Broken hatch shading</span><span class="vid">hatch-shade</span></button><span class="at"><a href="../../index.html#techniques?a=hatch">hatch</a><a href="../../index.html#techniques?a=dash">dash</a><a href="../../index.html#techniques?a=clip">clip</a></span><p class="ah">The shadow side of a shape is clipped and crossed by 45° lines at a 6 u pitch with a 12/4 dash whose phase changes per line; drawn on the black plate so it never slips.</p></li><li class="vr"><button type="button" data-t="misregister"><span class="vn">Plate misregister</span><span class="vid">misregister</span></button><span class="at"><a href="../../index.html#techniques?a=offset">offset</a><a href="../../index.html#techniques?a=register">register</a><a href="../../index.html#techniques?a=trap">trap</a></span><p class="ah">Each color plate is composited with its own down-right offset before the black plate lands in register, so fills open a paper sliver on the top-left of the line and spill past it bottom-right.</p></li><li class="vr"><button type="button" data-t="dot-tint"><span class="vn">Dot-tint screen</span><span class="vid">dot-tint</span></button><span class="at"><a href="../../index.html#techniques?a=halftone">halftone</a><a href="../../index.html#techniques?a=screen">screen</a><a href="../../index.html#techniques?a=dot">dot</a></span><p class="ah">A mid-tone is the plate ink drawn as a regular dot grid clipped to the shape; the dot radius is set from the requested coverage.</p></li><li class="vr"><button type="button" data-t="aged-stock"><span class="vn">Aged cream stock</span><span class="vid">aged-stock</span></button><span class="at"><a href="../../index.html#techniques?a=paper">paper</a><a href="../../index.html#techniques?a=mottle">mottle</a><a href="../../index.html#techniques?a=grain">grain</a><a href="../../index.html#techniques?a=scan-blur">scan-blur</a></span><p class="ah">Cream flat, then a low-frequency perlin multiply, a 0.35 px blur for the scan, then mono grain over everything including the inks.</p></li><li class="vr"><button type="button" data-t="caption-label"><span class="vn">Caption label</span><span class="vid">caption-label</span></button><span class="at"><a href="../../index.html#techniques?a=lettering">lettering</a><a href="../../index.html#techniques?a=mono">mono</a><a href="../../index.html#techniques?a=caps">caps</a></span><p class="ah">One caption centered under each object on the black plate; a sheet title at the top and a folio at the foot.</p></li></ul></div></details>
  <details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">Reference 02 · textbook spot-illustration sheet, 1006 × 1390</p><div class="fid" id="fid"></div></div></details>
