  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Four-ink spot illustration</b><span class="code">TS-02</span></span>
  <span class="pager"><a href="../../techniques/ts-01-moire-ring-screens/index.html" title="Moiré from two ring screens">← TS-01</a><a href="../../index.html#techniques"><span class="n">2</span>&nbsp;/ 14</a><a href="../../techniques/ts-03-iridescent-chrome/index.html" title="Iridescent chrome on black">TS-03 →</a></span> <p class="kicker">Technique · TS-02</p><h1 class="lede">Black keyline, three flat spot inks slipped 2 u, hatch and dot tints on cream.</h1><div class="body"><p>A letterpress catalogue sheet. Eight objects, each a closed shape filled flat on one of three plates — red, yellow, blue — and outlined on a black plate. Green is yellow under blue; pink and sky are red and blue screened as a 5 u dot tint. Every color plate prints 1–2.5 u down-right of the black, so a paper sliver opens on one edge and color spills the line on the other.</p><p>Shadow sides carry a 45° broken hatch on the black plate at 6 u pitch. The stock is cream with a low mottle and a 1 px grain; a 0.35 px blur stands in for the scan. Captions run under each object in mono.</p></div>
  <div class="meta" style="display:block"><h2>Pass order</h2><ol class="steps"><li><div><b>stock</b> · cream flat</div></li><li><div><b>color plates</b> · flat fills, tints, knockouts per shape</div></li><li><div><b>composite</b> · yellow, red, blue plates multiplied at their offsets</div></li><li><div><b>black plate</b> · keylines, hatch, captions in register</div></li><li><div><b>age</b> · mottle multiply, 0.35 px blur, mono grain</div></li></ol></div>
  <div class="meta"><div class="full"><h2>Vocabulary · a technique highlights its reads · an atom finds every use</h2><div class="vocab" id="chips"><div class="vr"><span data-t="spot-fill" title="Flat spot fill"><b>SPOT</b>spot-fill</span><span class="at"><a href="../../index.html#techniques?a=flat-fill">flat-fill</a><i>·</i><a href="../../index.html#techniques?a=plate">plate</a><i>·</i><a href="../../index.html#techniques?a=knockout">knockout</a></span></div><div class="vr"><span data-t="black-keyline" title="Black keyline"><b>KEY</b>black-keyline</span><span class="at"><a href="../../index.html#techniques?a=outline">outline</a><i>·</i><a href="../../index.html#techniques?a=stroke">stroke</a><i>·</i><a href="../../index.html#techniques?a=waver">waver</a></span></div><div class="vr"><span data-t="hatch-shade" title="Broken hatch shading"><b>HTCH</b>hatch-shade</span><span class="at"><a href="../../index.html#techniques?a=hatch">hatch</a><i>·</i><a href="../../index.html#techniques?a=dash">dash</a><i>·</i><a href="../../index.html#techniques?a=clip">clip</a></span></div><div class="vr"><span data-t="misregister" title="Plate misregister"><b>SLIP</b>misregister</span><span class="at"><a href="../../index.html#techniques?a=offset">offset</a><i>·</i><a href="../../index.html#techniques?a=register">register</a><i>·</i><a href="../../index.html#techniques?a=trap">trap</a></span></div><div class="vr"><span data-t="dot-tint" title="Dot-tint screen"><b>TINT</b>dot-tint</span><span class="at"><a href="../../index.html#techniques?a=halftone">halftone</a><i>·</i><a href="../../index.html#techniques?a=screen">screen</a><i>·</i><a href="../../index.html#techniques?a=dot">dot</a></span></div><div class="vr"><span data-t="aged-stock" title="Aged cream stock"><b>PAPR</b>aged-stock</span><span class="at"><a href="../../index.html#techniques?a=paper">paper</a><i>·</i><a href="../../index.html#techniques?a=mottle">mottle</a><i>·</i><a href="../../index.html#techniques?a=grain">grain</a><i>·</i><a href="../../index.html#techniques?a=scan-blur">scan-blur</a></span></div><div class="vr"><span data-t="caption-label" title="Caption label"><b>CAPT</b>caption-label</span><span class="at"><a href="../../index.html#techniques?a=lettering">lettering</a><i>·</i><a href="../../index.html#techniques?a=mono">mono</a><i>·</i><a href="../../index.html#techniques?a=caps">caps</a></span></div></div></div>
  <div><h2>Reference</h2><div class="ro">Reference 02 · textbook spot-illustration sheet, 1006 × 1390</div></div><div><h2>Study</h2><div class="nm">Four-ink spot illustration</div><div class="ro">TS-02 · Techniques · 2 / 14</div></div></div>
  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>spot-fill</b> · Flat spot fill — Every closed shape is filled flat on one plate canvas and cleared from the others (destination-out), so plates only overlap where an overprint is intended.</div></li><li><div><b>black-keyline</b> · Black keyline — Each shape is stroked twice on the black plate: 2.2 u on the path, then 1.4 u on the path shifted by a seeded 0.6 u jitter, which thickens the line unevenly.</div></li><li><div><b>hatch-shade</b> · Broken hatch shading — The shadow side of a shape is clipped and crossed by 45° lines at a 6 u pitch with a 12/4 dash whose phase changes per line; drawn on the black plate so it never slips.</div></li><li><div><b>misregister</b> · Plate misregister — Each color plate is composited with its own down-right offset before the black plate lands in register, so fills open a paper sliver on the top-left of the line and spill past it bottom-right.</div></li><li><div><b>dot-tint</b> · Dot-tint screen — A mid-tone is the plate ink drawn as a regular dot grid clipped to the shape; the dot radius is set from the requested coverage.</div></li><li><div><b>aged-stock</b> · Aged cream stock — Cream flat, then a low-frequency perlin multiply, a 0.35 px blur for the scan, then mono grain over everything including the inks.</div></li><li><div><b>caption-label</b> · Caption label — One caption centred under each object on the black plate; a sheet title at the top and a folio at the foot.</div></li></ol></div>
  <div class="meta static" style="display:block"><h2>10 reads · u, v on the sheet</h2><ol class="steps"><li><div><b>KEY</b> · Keyline · black plate, 2.2 u, two passes for waver <span class="ro">u 0.28 · v 0.07 · black-keyline</span></div></li><li><div><b>SPOT</b> · Spot fill · red plate, flat, closed shape <span class="ro">u 0.34 · v 0.09 · spot-fill</span></div></li><li><div><b>SLIP</b> · Misregister · yellow plate +1, +2.6 u; paper sliver on the top-left edge <span class="ro">u 0.64 · v 0.14 · misregister</span></div></li><li><div><b>TINT</b> · Dot tint · blue plate screened 40 %, pitch 5 u, on the fan guard <span class="ro">u 0.17 · v 0.32 · dot-tint</span></div></li><li><div><b>HTCH</b> · Hatch · 45°, pitch 6 u, broken dashes, on the pot shadow side <span class="ro">u 0.80 · v 0.42 · hatch-shade</span></div></li><li><div><b>SLIP</b> · Overprint green · yellow plate under 85 % blue, both slipped <span class="ro">u 0.70 · v 0.30 · misregister</span></div></li><li><div><b>HTCH</b> · Hatch on the toaster side face · black plate, no slip <span class="ro">u 0.39 · v 0.60 · hatch-shade</span></div></li><li><div><b>CAPT</b> · Caption · JetBrains Mono 700, 21 u caps, black plate <span class="ro">u 0.25 · v 0.72 · caption-label</span></div></li><li><div><b>PAPR</b> · Aged stock · cream (247,237,227), mottle ±3 %, grain σ ≈ 5/255 <span class="ro">u 0.09 · v 0.90 · aged-stock</span></div></li><li><div><b>TINT</b> · Pink · red plate screened 42 % on the dryer intake <span class="ro">u 0.70 · v 0.81 · dot-tint</span></div></li></ol></div>
