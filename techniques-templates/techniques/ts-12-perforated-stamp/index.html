  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Perforated stamp with halftone title</b><span class="code">TS-12</span></span>
  <span class="pager"><a href="../../techniques/ts-11-worn-black-box/index.html" title="Worn black box">← TS-11</a><a href="../../index.html#techniques"><span class="n">12</span>&nbsp;/ 14</a><a href="../../techniques/ts-13-glyph-field-animation/index.html" title="ASCII glyph-field animations">TS-13 →</a></span> <p class="kicker">Technique · TS-12</p><h1 class="lede">A red stamp bitten round the edge, a rotated title filled with dots.</h1><div class="body"><p>One red stamp on black. A rectangle with semicircular bites at fixed pitch along every edge, corner to corner; the red carries tooth and a faint mottle. A display title runs up the left edge, quarter-turned, and overhangs the top so the perforation cuts it.</p><p>The title is not a flat fill: a dark texture is screened as a 45° dot grid, dot size following the texture, shown only inside the letters. A white script credit sits right of center. A soft shadow lifts the stamp off the ground.</p></div>
  <div class="meta" style="display:block"><h2>Pass order</h2><ol class="steps"><li><div><b>ground</b> · flat black</div></li><li><div><b>shadow</b> · blurred stamp rectangle, offset 6 u, alpha 0.55</div></li><li><div><b>stamp</b> · red rectangle + mottle + grain on a layer</div></li><li><div><b>title</b> · Archivo 900 mask, halftone through the mask, drawn on the stamp layer</div></li><li><div><b>perforation</b> · destination-out circles at pitch along every edge</div></li><li><div><b>credit</b> · white Inter 500 skewed −12°</div></li></ol></div>
  <div class="meta"><div class="full"><h2>Vocabulary · a technique highlights its reads · an atom finds every use</h2><div class="vocab" id="chips"><div class="vr"><span data-t="perforation" title="Scalloped perforation"><b>PERF</b>perforation</span><span class="at"><a href="../../index.html#techniques?a=clip">clip</a><i>·</i><a href="../../index.html#techniques?a=bite">bite</a><i>·</i><a href="../../index.html#techniques?a=pitch">pitch</a></span></div><div class="vr"><span data-t="halftone-fill" title="Halftone texture fill"><b>HALF</b>halftone-fill</span><span class="at"><a href="../../index.html#techniques?a=screen">screen</a><i>·</i><a href="../../index.html#techniques?a=dot">dot</a><i>·</i><a href="../../index.html#techniques?a=fbm">fbm</a></span></div><div class="vr"><span data-t="rotated-display" title="Rotated display title"><b>ROTD</b>rotated-display</span><span class="at"><a href="../../index.html#techniques?a=type">type</a><i>·</i><a href="../../index.html#techniques?a=rotate">rotate</a><i>·</i><a href="../../index.html#techniques?a=overhang">overhang</a></span></div><div class="vr"><span data-t="script-credit" title="Script credit"><b>SCRP</b>script-credit</span><span class="at"><a href="../../index.html#techniques?a=type">type</a><i>·</i><a href="../../index.html#techniques?a=skew">skew</a></span></div><div class="vr"><span data-t="paper-tooth" title="Paper tooth and mottle"><b>TOOTH</b>paper-tooth</span><span class="at"><a href="../../index.html#techniques?a=grain">grain</a><i>·</i><a href="../../index.html#techniques?a=mottle">mottle</a></span></div></div></div>
  <div><h2>Reference</h2><div class="ro">Reference 12 · red perforated stamp poster, 736 × 920</div></div><div><h2>Study</h2><div class="nm">Perforated stamp with halftone title</div><div class="ro">TS-12 · Techniques · 12 / 14</div></div></div>
  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>perforation</b> · Scalloped perforation — The stamp is painted as a rectangle on its own layer, then a circle at every pitch step along all four edges is punched out with destination-out; the punched layer is the clip for everything on the stamp.</div></li><li><div><b>halftone-fill</b> · Halftone texture fill — Inside the letter mask a dark base is laid first; then a 45° dot lattice is walked and each dot is drawn with radius and color taken from the texture value at its center, so light patches of the texture become large tan dots.</div></li><li><div><b>rotated-display</b> · Rotated display title — The title is drawn once into a mask canvas rotated −90° about its start point; the halftone is composited through it with destination-in, then the result is drawn on the stamp layer under the perforation clip.</div></li><li><div><b>script-credit</b> · Script credit — Two invented lines centred on a point right of the middle, skewed −12° to stand in for the italic script; drawn after the grain so the white stays clean.</div></li><li><div><b>paper-tooth</b> · Paper tooth and mottle — Before the perforation punch the stamp layer is multiplied by a low-frequency fbm and then by ART.grain, so both tooth and mottle follow the stamp and stop at the bites.</div></li></ol></div>
  <div class="meta static" style="display:block"><h2>10 reads · u, v on the sheet</h2><ol class="steps"><li><div><b>PERF</b> · Perforation · semicircular bites, pitch 62 u, radius 19 u <span class="ro">u 0.50 · v 0.10 · perforation</span></div></li><li><div><b>PERF</b> · Right edge · 16 bites down, one on each corner <span class="ro">u 0.84 · v 0.50 · perforation</span></div></li><li><div><b>PERF</b> · Corner bite · the title is cut by the same clip <span class="ro">u 0.16 · v 0.10 · perforation</span></div></li><li><div><b>HALF</b> · Halftone fill · 45° dot screen, pitch 7 u, dot size from a fbm texture <span class="ro">u 0.30 · v 0.30 · halftone-fill</span></div></li><li><div><b>HALF</b> · Dot floor · smallest dots keep the letter dark, never open <span class="ro">u 0.30 · v 0.62 · halftone-fill</span></div></li><li><div><b>ROTD</b> · Rotated display · Archivo 900, −90°, cap height ≈ 215 u <span class="ro">u 0.32 · v 0.85 · rotated-display</span></div></li><li><div><b>ROTD</b> · Overhang · the word starts above the stamp top and is clipped <span class="ro">u 0.22 · v 0.15 · rotated-display</span></div></li><li><div><b>SCRP</b> · Credit · two lines, white, skew −12°, 30 u <span class="ro">u 0.62 · v 0.46 · script-credit</span></div></li><li><div><b>TOOTH</b> · Paper tooth · mono grain amp 0.05 on 1 px cells <span class="ro">u 0.66 · v 0.72 · paper-tooth</span></div></li><li><div><b>TOOTH</b> · Mottle · low-frequency fbm, ±4 % on the red <span class="ro">u 0.50 · v 0.84 · paper-tooth</span></div></li></ol></div>
