<!-- <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Perforated stamp with halftone title</b><span class="code">TS-12</span></span>
  <span class="pager"><a href="../../techniques/ts-11-worn-black-box/index.html" title="Previous: TS-11 Worn black box">← TS-11</a><a class="pos" href="../../index.html#techniques"><span class="n">8</span>&nbsp;of 15</a><a href="../../techniques/ts-13-glyph-field-animation/index.html" title="Next: TS-13 ASCII glyph-field animations">TS-13 →</a></span> <p class="kicker"><span>TS-12</span><span>print physics</span></p><h1 class="title">Perforated stamp with halftone title</h1><p class="lede">A red stamp with a bitten perforation and a rotated title filled with a dot screen.</p><div class="body"><p>Semicircular bites run at one pitch along every edge, corner to corner. The title runs up the left edge, turned a quarter, and overhangs the top so the perforation cuts it. Inside the letters a dark texture is screened as a 45° dot grid whose dot size follows the texture.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>ground</b><span>flat black</span></li><li><b>shadow</b><span>blurred stamp rectangle, offset 6 u, alpha 0.55</span></li><li><b>stamp</b><span>red rectangle + mottle + grain on a layer</span></li><li><b>title</b><span>Archivo 900 mask, halftone through the mask, drawn on the stamp layer</span></li><li><b>perforation</b><span>destination-out circles at pitch along every edge</span></li><li><b>credit</b><span>white Inter 500 skewed −12°</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>5</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="perforation"><span class="vn">Scalloped perforation</span><span class="vid">perforation</span></button><span class="at"><a href="../../index.html#techniques?a=clip">clip</a><a href="../../index.html#techniques?a=bite">bite</a><a href="../../index.html#techniques?a=pitch">pitch</a></span><p class="ah">The stamp is painted as a rectangle on its own layer, then a circle at every pitch step along all four edges is punched out with destination-out; the punched layer is the clip for everything on the stamp.</p></li><li class="vr"><button type="button" data-t="halftone-fill"><span class="vn">Halftone texture fill</span><span class="vid">halftone-fill</span></button><span class="at"><a href="../../index.html#techniques?a=screen">screen</a><a href="../../index.html#techniques?a=dot">dot</a><a href="../../index.html#techniques?a=fbm">fbm</a></span><p class="ah">Inside the letter mask a dark base is laid first; then a 45° dot lattice is walked and each dot is drawn with radius and color taken from the texture value at its center, so light patches of the texture become large tan dots.</p></li><li class="vr"><button type="button" data-t="rotated-display"><span class="vn">Rotated display title</span><span class="vid">rotated-display</span></button><span class="at"><a href="../../index.html#techniques?a=type">type</a><a href="../../index.html#techniques?a=rotate">rotate</a><a href="../../index.html#techniques?a=overhang">overhang</a></span><p class="ah">The title is drawn once into a mask canvas rotated −90° about its start point; the halftone is composited through it with destination-in, then the result is drawn on the stamp layer under the perforation clip.</p></li><li class="vr"><button type="button" data-t="script-credit"><span class="vn">Script credit</span><span class="vid">script-credit</span></button><span class="at"><a href="../../index.html#techniques?a=type">type</a><a href="../../index.html#techniques?a=skew">skew</a></span><p class="ah">Two invented lines centered on a point right of the middle, skewed −12° to stand in for the italic script; drawn after the grain so the white stays clean.</p></li><li class="vr"><button type="button" data-t="paper-tooth"><span class="vn">Paper tooth and mottle</span><span class="vid">paper-tooth</span></button><span class="at"><a href="../../index.html#techniques?a=grain">grain</a><a href="../../index.html#techniques?a=mottle">mottle</a></span><p class="ah">Before the perforation punch the stamp layer is multiplied by a low-frequency fbm and then by ART.grain, so both tooth and mottle follow the stamp and stop at the bites.</p></li></ul></div></details>
  <details class="acc" name="notes" id="aRef"><summary><span>Reference and match</span></summary><div class="ab"><p class="src">Reference 12 · red perforated stamp poster, 736 × 920</p><div class="fid" id="fid"></div></div></details>
  <details class="acc" name="notes" id="aStudy"><summary><span>Study</span></summary><div class="ab"><dl class="kv"><dt>Code</dt><dd>TS-12</dd><dt>Section</dt><dd>Techniques · 8 of 15</dd><dt>Family</dt><dd>print physics</dd><dt>Spec</dt><dd><a href="spec.json">spec.json</a></dd></dl></div></details>
  <details class="acc" name="notes" id="aPts"><summary><span>Callouts <i>10</i></span></summary><div class="ab"><ol class="steps"><li><b>PERF · Perforation · semicircular bites, pitch 62 u, radius 19 u</b><span>u 0.50 · v 0.10 · perforation</span></li><li><b>PERF · Right edge · 16 bites down, one on each corner</b><span>u 0.84 · v 0.50 · perforation</span></li><li><b>PERF · Corner bite · the title is cut by the same clip</b><span>u 0.16 · v 0.10 · perforation</span></li><li><b>HALF · Halftone fill · 45° dot screen, pitch 7 u, dot size from a fbm texture</b><span>u 0.30 · v 0.30 · halftone-fill</span></li><li><b>HALF · Dot floor · smallest dots keep the letter dark, never open</b><span>u 0.30 · v 0.62 · halftone-fill</span></li><li><b>ROTD · Rotated display · Archivo 900, −90°, cap height ≈ 215 u</b><span>u 0.32 · v 0.85 · rotated-display</span></li><li><b>ROTD · Overhang · the word starts above the stamp top and is clipped</b><span>u 0.22 · v 0.15 · rotated-display</span></li><li><b>SCRP · Credit · two lines, white, skew −12°, 30 u</b><span>u 0.62 · v 0.46 · script-credit</span></li><li><b>TOOTH · Paper tooth · mono grain amp 0.05 on 1 px cells</b><span>u 0.66 · v 0.72 · paper-tooth</span></li><li><b>TOOTH · Mottle · low-frequency fbm, ±4 % on the red</b><span>u 0.50 · v 0.84 · paper-tooth</span></li></ol></div></details>
