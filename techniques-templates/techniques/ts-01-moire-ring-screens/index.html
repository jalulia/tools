  <span class="crumb"><a href="../../index.html">Techniques &amp; Templates</a><span class="sep">/</span><a href="../../index.html#techniques">Techniques</a><span class="sep">/</span><b>Moiré from two ring screens</b><span class="code">TS-01</span></span>
  <span class="pager"><a class="off">←</a><a href="../../index.html#techniques"><span class="n">1</span>&nbsp;/ 14</a><a href="../../techniques/ts-02-four-ink-spot-illustration/index.html" title="Four-ink spot illustration">TS-02 →</a></span> <p class="kicker">Technique · TS-01</p><h1 class="lede">Two ring gratings multiplied, screened as two inks, one hot core.</h1><div class="body"><p>Two ink plates. Blue is the product of two concentric-ring gratings — centers apart, pitches 68 and 60 u. Where the rings cross they make a dot lattice; the 8 u pitch difference beats into the long fringes. Red is a radial falloff from the core, shaped by grating A so the rings carry through it.</p><p>Each ink is thresholded per pixel against white noise: every mid-tone is a mix of paper, blue, red and overprint. That mix is the grain, not a layer on top. A 34 u cream margin frames the sheet.</p></div>
  <div class="meta" style="display:block"><h2>Pass order</h2><ol class="steps"><li><div><b>margin</b> · cream sheet</div></li><li><div><b>gratings</b> · A and B evaluated per pixel</div></li><li><div><b>coverage</b> · blue = product, red = radial × A</div></li><li><div><b>screen</b> · random threshold per ink, overprint where both</div></li><li><div><b>soften</b> · 0.6 px blur</div></li></ol></div>
  <div class="meta"><div class="full"><h2>Vocabulary · a technique highlights its reads · an atom finds every use</h2><div class="vocab" id="chips"><div class="vr"><span data-t="ring-screen" title="Concentric ring grating"><b>SCRN</b>ring-screen</span><span class="at"><a href="../../index.html#techniques?a=grating">grating</a><i>·</i><a href="../../index.html#techniques?a=radial">radial</a></span></div><div class="vr"><span data-t="moire-product" title="Grating product (moiré)"><b>MOIR</b>moire-product</span><span class="at"><a href="../../index.html#techniques?a=moire">moire</a><i>·</i><a href="../../index.html#techniques?a=interference">interference</a></span></div><div class="vr"><span data-t="radial-heat" title="Radial red core"><b>HEAT</b>radial-heat</span><span class="at"><a href="../../index.html#techniques?a=radial">radial</a><i>·</i><a href="../../index.html#techniques?a=falloff">falloff</a></span></div><div class="vr"><span data-t="stochastic-grain" title="Stochastic two-ink screen"><b>GRAIN</b>stochastic-grain</span><span class="at"><a href="../../index.html#techniques?a=dither">dither</a><i>·</i><a href="../../index.html#techniques?a=grain">grain</a><i>·</i><a href="../../index.html#techniques?a=overprint">overprint</a></span></div><div class="vr"><span data-t="paper-margin" title="Cream margin"><b>EDGE</b>paper-margin</span><span class="at"><a href="../../index.html#techniques?a=margin">margin</a><i>·</i><a href="../../index.html#techniques?a=stock">stock</a></span></div></div></div>
  <div><h2>Reference</h2><div class="ro">Reference 01 · red-and-blue moiré print, 735 × 956</div></div><div><h2>Study</h2><div class="nm">Moiré from two ring screens</div><div class="ro">TS-01 · Techniques · 1 / 14</div></div></div>
  <div class="meta static" style="display:block"><h2>Techniques · <a href="spec.json">spec.json</a></h2><ol class="steps"><li><div><b>ring-screen</b> · Concentric ring grating — g(p) = 0.5+0.5·cos(2π·|p−c|/pitch) for each grating; the floor keeps a base blue coverage so the field never drops to paper. <span class="ro">Limits · Pitches within ~4 u of each other push the beat fringe past the sheet; equal pitches collapse the moiré to one ring set. Below ~30 u the rings alias into the screen.</span> <a href="lib/ring-screen.js">lib/ring-screen.js</a></div></li><li><div><b>moire-product</b> · Grating product (moiré) — Multiplying the two gratings gives a dot lattice where both are high and long beat fringes where their phases drift; nothing is drawn as a dot — the lattice is the product. <span class="ro">Limits · knee_lo ≥ knee_hi inverts the smoothstep. gamma below ~0.8 fills the lattice to a flat tint; above ~2.5 the dots shrink to specks.</span> <a href="lib/moire-product.js">lib/moire-product.js</a></div></li><li><div><b>radial-heat</b> · Radial red core — Red coverage is a clipped gaussian of distance from the core; inside it the blue lattice overprints as a lighter pink, which is how the rings read through the red. <span class="ro">Limits · gain above ~2 saturates the core to a flat disc; sigma above ~700 u floods the sheet and the blue lattice no longer reads through.</span> <a href="lib/radial-heat.js">lib/radial-heat.js</a></div></li><li><div><b>stochastic-grain</b> · Stochastic two-ink screen — For each device pixel: blue if r1 &lt; blue_coverage, red if r2 &lt; red_coverage; both → overprint; neither → paper tint. A 0.6 px blur softens the pixel edges the way the reference’s scan does. <span class="ro">Limits · soften above ~1.5 px dissolves the lattice into tone; cell_px is fixed at 1 in this rebuild (a coarser cell needs a hash per cell, not per pixel).</span> <a href="lib/stochastic-grain.js">lib/stochastic-grain.js</a></div></li><li><div><b>paper-margin</b> · Cream margin — Flat cream fill; the print sits inset by 34 u on every side. <span class="ro">Limits · Above ~120 u the margin crops the beat fringe at the left edge.</span> <a href="lib/paper-margin.js">lib/paper-margin.js</a></div></li></ol></div>
  <div class="meta static" style="display:block"><h2>10 reads · u, v on the sheet</h2><ol class="steps"><li><div><b>HEAT</b> · Red core · clipped gaussian, σ 0.33 W, off-center left <span class="ro">u 0.44 · v 0.49 · radial-heat</span></div></li><li><div><b>SCRN</b> · Ring grating A · center at the core, pitch 68 u <span class="ro">u 0.30 · v 0.36 · ring-screen</span></div></li><li><div><b>SCRN</b> · Ring grating B · center off-sheet top-right, pitch 60 u <span class="ro">u 0.74 · v 0.22 · ring-screen</span></div></li><li><div><b>MOIR</b> · Dot lattice · product of the two gratings <span class="ro">u 0.62 · v 0.62 · moire-product</span></div></li><li><div><b>MOIR</b> · Beat fringe · pitch difference 8 u makes the long curves <span class="ro">u 0.20 · v 0.72 · moire-product</span></div></li><li><div><b>GRAIN</b> · Stochastic screen · random threshold per ink per pixel <span class="ro">u 0.14 · v 0.20 · stochastic-grain</span></div></li><li><div><b>GRAIN</b> · Overprint pixels · both inks on → plum far out, pink in the core <span class="ro">u 0.86 · v 0.86 · stochastic-grain</span></div></li><li><div><b>EDGE</b> · Cream margin · 34 u, no rule <span class="ro">u 0.50 · v 0.08 · paper-margin</span></div></li><li><div><b>HEAT</b> · Heat tail · red coverage falls below 0.1 here <span class="ro">u 0.40 · v 0.94 · radial-heat</span></div></li><li><div><b>SCRN</b> · Ring A at the rim · coverage floor 0.42 keeps the field blue <span class="ro">u 0.88 · v 0.45 · ring-screen</span></div></li></ol></div>
