<!-- <span class="crumb"><a href="../../../library/">Library</a><span class="sep">/</span><a href="../../../library/#/plates?kind3=technique">Techniques</a><span class="sep">/</span><b>Mir on its icon grid</b><span class="code">TS-24</span></span>
  <span class="pager"><a href="../../techniques/ts-23-mir-turned/index.html" title="Previous: TS-23 Mir, turned">← TS-23</a><a class="pos" href="../../../library/#/plates?kind3=technique"><span class="n">17</span>&nbsp;of 20</a><a href="../../techniques/ts-25-growth-over-the-record/index.html" title="Next: TS-25 Growth over the record">TS-25 →</a></span> <p class="kicker"><span>TS-24</span><span>character construction</span></p><h1 class="title">Mir on its icon grid</h1><p class="lede">The 1024 px icon tile, its keylines, and Mir down a five-size ladder.</p><div class="body"><p>The tile is 1024 px with a 22.4% corner. The keylines are a 16 × 64 px grid, the inscribed circle, the 80% safe circle and square, the diagonals and the center cross. Mir is the TS-23 construction at front view in one 28 px line, scaled so its inked width is 87% of the safe circle.</p><p>The ladder redraws the icon at 180, 120, 80, 58 and 40 px. Optical compensation thickens the line as the icon shrinks, by (1 + c) at 40 px and less above, and drops fold rows that would close up. With pixel snapping on, each size is drawn at its true pixel count with whole-pixel lines, and a loupe shows the 40 px icon enlarged without smoothing.</p></div>
  <div class="accs">
  <details class="acc" name="notes" id="aBuild" open><summary><span>How it is built</span></summary><div class="ab"><ol class="steps"><li><b>sheet</b><span>white</span></li><li><b>tile</b><span>rounded path in the tile ink</span></li><li><b>keylines</b><span>grid, circles, square and diagonals, inside and outside the tile</span></li><li><b>Mir</b><span>fills, folds, band, decals, cans and antennae in one line</span></li><li><b>over</b><span>center cross, tile outline, dimension lines and notes</span></li><li><b>ladder</b><span>five sizes, vector or snapped pixels</span></li></ol></div></details>
  <details class="acc" name="notes" id="aTech"><summary><span>Techniques <i>5</i></span></summary><div class="ab"><ul class="vocab" id="chips"><li class="vr"><button type="button" data-t="icon-tile"><span class="vn">Tile and corner</span><span class="vid">icon-tile</span></button><span class="at"><a href="../../index.html#techniques?a=rounded-rect">rounded-rect</a><a href="../../index.html#techniques?a=superellipse">superellipse</a><a href="../../index.html#techniques?a=continuous-curvature">continuous-curvature</a><a class="mod" href="lib/icon-tile.js">lib/icon-tile.js</a></span><p class="ah">Each corner is a circular arc of 90° × (1 − smoothing) between two cubic easings, the corner taking (1 + smoothing) × radius of each side (the Figma corner-smoothing construction).</p></li><li class="vr"><button type="button" data-t="safe-area"><span class="vn">Safe area and keylines</span><span class="vid">safe-area</span></button><span class="at"><a href="../../index.html#techniques?a=keyline">keyline</a><a href="../../index.html#techniques?a=grid">grid</a><a href="../../index.html#techniques?a=safe-area">safe-area</a><a href="../../index.html#techniques?a=center-cross">center-cross</a><a class="mod" href="lib/safe-area.js">lib/safe-area.js</a></span><p class="ah">All keylines are drawn twice, clipped inside and outside the tile, so they keep contrast on dark tiles. Grid and keylines sit under Mir; the center cross and notes sit over it.</p></li><li class="vr"><button type="button" data-t="mir-lines"><span class="vn">Mir in simple lines</span><span class="vid">mir-lines</span></button><span class="at"><a href="../../index.html#techniques?a=sphere">sphere</a><a href="../../index.html#techniques?a=cylinder">cylinder</a><a href="../../index.html#techniques?a=decal">decal</a><a href="../../index.html#techniques?a=single-weight">single-weight</a><a class="mod" href="lib/mir-lines.js">lib/mir-lines.js</a></span><p class="ah">The TS-23 construction at turn 0°, tilt 8°: sphere, band at 12°, decal eyes and mouth, two cans splayed 26.5°, antenna tubes, scalloped folds. Its radius is solved so line plus geometry fills the target width.</p></li><li class="vr"><button type="button" data-t="size-ladder"><span class="vn">Size ladder</span><span class="vid">size-ladder</span></button><span class="at"><a href="../../index.html#techniques?a=optical-size">optical-size</a><a href="../../index.html#techniques?a=pixel-grid">pixel-grid</a><a href="../../index.html#techniques?a=hinting">hinting</a><a class="mod" href="lib/size-ladder.js">lib/size-ladder.js</a></span><p class="ah">Each size keeps the same inked width share. line = weight × N / 1024 × (1 + c × (1024 / N − 1) / 24.6), held under 0.24 R; fold rows = ⌊dome height / max(2.8 × fold line, 7.5 px)⌋, held to 1–3.</p></li><li class="vr"><button type="button" data-t="dimension-notes"><span class="vn">Dimension notes</span><span class="vid">dimension-notes</span></button><span class="at"><a href="../../index.html#techniques?a=mono-caps">mono-caps</a><a href="../../index.html#techniques?a=dimension-line">dimension-line</a><a href="../../index.html#techniques?a=knockout">knockout</a><a class="mod" href="lib/dimension-notes.js">lib/dimension-notes.js</a></span><p class="ah">JetBrains Mono capitals at 14 u on the sheet; ladder captions in Inter at 14 u (no dotted zeros); dimension lines with 10 u end ticks; each note sits on a box in the color under it. Inside a colored tile, notes and keylines are set in ink or paper.</p></li></ul></div></details>

        <button type="button" role="tab" id="tabColor" data-tab="color" aria-selected="false" aria-controls="mColor">Color</button>
        <button type="button" role="tab" id="tabPresets" data-tab="presets" aria-selected="false" aria-controls="mPresets">Presets</button>
        <button type="button" role="tab" id="tabMore" data-tab="more" aria-selected="false" aria-controls="mExport">Export</button>
      </div>
    </div>
    <section class="tabp" id="mParams" role="tabpanel" aria-labelledby="tabParams" data-tab="params">
      <div class="th"><p class="hint">Drag a slider or type a value. Arrow keys step; Shift ×10, Alt ×0.1.</p><button type="button" class="ghost warn" id="bParamReset" hidden>Reset all</button></div>
      <div class="pgroups" id="prail"></div>
    </section>
    <section class="tabp" id="mColor" role="tabpanel" aria-labelledby="tabColor" data-tab="color" hidden>

      <div class="inks" id="inks"></div>
    </section>
    <section class="tabp" id="mPresets" role="tabpanel" aria-labelledby="tabPresets" data-tab="presets" hidden>
      <div id="ppres"></div>
      <div class="mypre" id="mypre"></div>
    </section>
    <section class="tabp" id="mExport" role="tabpanel" aria-labelledby="tabMore" data-tab="more" hidden>
      <div class="row3"><button type="button" class="btn" id="bPng" title="Save the plate as it is drawn now">Save PNG</button><button type="button" class="btn" id="bCopy" title="Copy the spec as JSON">Copy spec</button><button type="button" class="btn" id="bSpec" title="Open the spec (S)">Open spec</button></div>
      <p class="hint">The spec holds every measured number, its range and the module that draws it.</p>
      <div id="mNote">
        <button type="button" class="disc" id="bPoints" aria-expanded="false" aria-controls="pts"><span>Point list</span><b id="ctr">0 / 10</b><svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 3.8L5 6.3l2.5-2.5"/></svg></button>
        <div class="pts" id="pts" hidden>
          <div class="rows" id="rows"></div>
          <div class="read" id="read"><span id="readtxt">Hover or select a point.</span><code id="readcode"></code></div>
        </div>
      </div>
      <div id="mView"><p class="hint" id="viewHint">The rebuild, drawn in code.</p></div>
      <div id="mMotion" hidden><span id="motionState">Still</span><div id="motionRow"></div><p id="motionHint"></p></div>
    </section>

</main>
