name: Deploy tools site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for git dates)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild generated data (GitHub owns these files)
        run: node scripts/build-data.mjs

      - name: Guard (nothing lost, nothing new without dials)
        run: |
          set +e; node scripts/guard.mjs; code=$?; set -e
          if [ $code -eq 3 ]; then
            npm i --no-save --no-audit --no-fund playwright@1.63.0
            npx playwright install --with-deps chromium
            node scripts/guard.mjs
          elif [ $code -ne 0 ]; then exit $code; fi

      - name: Build all tools + index
        run: node scripts/build-site.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
