<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tools — jalulia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #fafafa;
        --fg: #111;
        --muted: #888;
        --hover: #f0f0f0;
        --rule: #eaeaea;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0c0c;
          --fg: #f2f2f2;
          --muted: #777;
          --hover: #181818;
          --rule: #1c1c1c;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-feature-settings: 'ss01', 'cv11';
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 96px 32px 128px;
      }
      header {
        margin-bottom: 64px;
      }
      header h1 {
        margin: 0;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: -0.01em;
      }
      header p {
        margin: 8px 0 0;
        font-size: 14px;
        color: var(--muted);
        font-weight: 400;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--rule);
      }
      li {
        border-bottom: 1px solid var(--rule);
      }
      li a {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: baseline;
        column-gap: 24px;
        padding: 20px 0 20px 0;
        text-decoration: none;
        color: var(--fg);
        transition: background 120ms ease, padding 120ms ease;
      }
      li a:hover {
        background: var(--hover);
        padding-left: 12px;
        padding-right: 12px;
      }
      .name {
        font-weight: 500;
        font-size: 16px;
        letter-spacing: -0.01em;
      }
      .desc {
        display: block;
        grid-column: 1;
        margin-top: 4px;
        font-size: 13px;
        color: var(--muted);
        font-weight: 400;
      }
      .date {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      footer {
        margin-top: 64px;
        font-size: 11px;
        color: var(--muted);
      }
      footer a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>tools</h1>
        <p>small browser things, in progress and shipped.</p>
      </header>
      <ul>
<!-- TOOL_ROWS -->
      </ul>
      <footer>
        <a href="https://github.com/jalulia/tools">github.com/jalulia/tools</a>
      </footer>
    </main>
  </body>
</html>
