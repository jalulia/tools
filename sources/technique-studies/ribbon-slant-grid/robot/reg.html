<!doctype html><html><body><script src="../src/mark22.js"></script><script>
const LW=1620, LH=1571, W=LW, H=LH, P=MG_MARK.map(d=>new Path2D(d));
const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d',{willReadFrequently:true});
g.setTransform(.1,0,0,-.1,0,LH); g.fillStyle='#fff'; g.fill(P[0]); const wa=g.getImageData(0,0,W,H).data;
g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,W,H); g.setTransform(.1,0,0,-.1,0,LH); for(let i=1;i<5;i++) g.fill(P[i],'evenodd'); const ba=g.getImageData(0,0,W,H).data;
g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,W,H); g.setTransform(.1,0,0,-.1,0,LH); g.fill(P[2]); g.fill(P[3]); const ea=g.getImageData(0,0,W,H).data;
const out=new Uint8ClampedArray(W*H*4); for(let i=0;i<W*H;i++){ out[i*4]=wa[i*4+3]; out[i*4+1]=ba[i*4+3]; out[i*4+2]=ea[i*4+3]; out[i*4+3]=255; }
const o=document.createElement('canvas'); o.width=W; o.height=H; o.getContext('2d').putImageData(new ImageData(out,W,H),0,0);
window.png=o.toDataURL('image/png'); window.done=true;
</script></body></html>
