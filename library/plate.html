<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plate · Library</title>
<style>body{margin:0;background:#fff;color:#101014;font-family:Inter,system-ui,sans-serif}main{max-width:1200px;margin:0 auto;padding:24px 16px 64px}img{display:block;max-width:100%;height:auto;border:1px solid #101014}h1{font-size:22px;line-height:1.2;margin:20px 0 6px;font-weight:600}p{margin:0 0 4px;font-size:13px;color:#55555c}a{color:inherit}nav{font:12px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;margin-bottom:18px}</style></head>
<body><main><nav><a href="./">&larr; Library</a></nav><div id="p"></div></main>
<script src="catalog.js"></script><script>
(function(){var L=window.LIBRARY||{},a=new URLSearchParams(location.search).get('r'),r=(L.records||[]).filter(function(x){return x.acc===a||x.id===a})[0],el=document.getElementById('p');
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
if(!r){el.innerHTML='<p>No plate with that number.</p>';return}
var w=r.work&&(L.records||[]).filter(function(x){return x.id===r.work})[0];if(r.role==='part'&&w&&w.href){location.replace(w.href);return}
document.title=r.title+' · Library';
el.innerHTML=(r.thumb?'<img src="'+e(r.thumb_2x||r.thumb)+'" alt="'+e(r.title)+'">':'')+'<h1>'+e(r.title)+'</h1><p>'+e(r.acc)+(r.family?' · '+e(r.family.replace(/-/g,' ')):'')+(r.form?' · '+e(r.form):'')+'</p><p>'+e(r.source||'')+'</p><p><a href="./#/plates?r='+encodeURIComponent(r.acc)+'">Open the record</a></p>'})();
</script></body></html>
