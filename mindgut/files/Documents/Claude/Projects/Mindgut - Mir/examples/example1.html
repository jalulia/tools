<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>A tiny title you can change</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#fff;--paper-2:#fafafa;--ink:#09090b;--ink-2:#1c1c20;--mute:#52525b;--mute-2:#a1a1aa;--mute-3:#d4d4d8;--line:rgba(9,9,11,.08);--rail:rgba(9,9,11,.05);--ice:#2b8ef5;--laminar:#10b981;--heat:#ff5a1f;--void:#e11d48;--signal:#f59e0b;--balanced:#16a34a;--sans:'Geist',-apple-system,sans-serif;--display:'Instrument Serif',serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:var(--sans);font-size:18px;line-height:1.60;font-weight:400;color:var(--ink-2);background:var(--paper);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:#09090b;color:#fff}
main{background:var(--paper);padding:80px 0 120px}
.thread{margin:64px auto 32px;max-width:40rem;padding:0 28px;text-align:center}
.thread .num{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute-2);display:inline-flex;align-items:center;gap:14px;margin-bottom:14px}
.thread .num::before,.thread .num::after{content:"";width:24px;height:1px;background:var(--line)}
.thread h2{font-family:var(--display);font-weight:400;font-size:clamp(32px,5vw,50px);line-height:1.08;letter-spacing:-.02em;color:var(--ink)}
.sys{max-width:36rem;margin:40px auto;padding:0 28px;display:flex;align-items:center;gap:16px;justify-content:center;opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s ease}
.sys.in{opacity:1;transform:none}
.sys .ln{flex:1;height:1px;background:var(--line)}
.sys .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--mute-2);font-weight:500}
.chat{position:relative}.chat .column{max-width:40rem;margin:0 auto;padding:0 28px;position:relative}
.chat .column.rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--rail);pointer-events:none}
.turn{position:relative;margin:34px 0;opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s ease}
.turn.in{opacity:1;transform:none}
.turn .meta{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--ink);margin-bottom:10px}
.turn .text{color:var(--ink)}
.turn.mir{max-width:32rem;margin-right:auto}
.turn.you{max-width:26rem;margin-left:auto;text-align:right}
.turn.you .meta{text-align:right}
.pull{max-width:44rem;margin:64px auto;padding:32px 28px;text-align:center;position:relative;opacity:0;transform:translateY(14px);transition:opacity 1s ease,transform 1s ease}
.pull.in{opacity:1;transform:none}
.pull::before{content:"";position:absolute;left:50%;top:0;width:40px;height:1px;background:var(--ink);transform:translateX(-50%)}
.pull blockquote{font-family:var(--display);font-weight:400;font-size:clamp(28px,3.4vw,40px);line-height:1.22;letter-spacing:-.015em;color:var(--ink)}
.pull .attr{margin-top:18px;font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.pull.bg-solid{padding:36px 32px;border-radius:8px}
.pull.bg-highlight blockquote{color:var(--highlight-color)}.pull.bg-highlight::before{background:var(--highlight-color)}
.pull.bg-dark{padding:36px 32px;border-radius:8px;background:#09090b}.pull.bg-dark blockquote{color:#f6f1e4}.pull.bg-dark .attr{color:rgba(255,255,255,.4)}.pull.bg-dark::before{background:rgba(255,255,255,.2)}
.atmosphere{position:relative;width:100%;min-height:280px;margin:64px 0;padding:72px 28px;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;justify-content:center;align-items:center;opacity:0;transform:translateY(14px);transition:opacity 1s ease,transform 1s ease}
.atmosphere.in{opacity:1;transform:none}
.atmosphere::after{content:"";position:absolute;inset:0;z-index:0;opacity:.7;animation:blobShift 12s ease-in-out infinite alternate;pointer-events:none}
.atmosphere>*{position:relative;z-index:1}
.atmosphere::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(to bottom,var(--paper),transparent 15%,transparent 85%,var(--paper))}
.atmosphere.blob-ice::after{background:radial-gradient(ellipse 90% 70% at 20% 30%,rgba(43,142,245,.2),transparent 60%),radial-gradient(ellipse 80% 90% at 80% 70%,rgba(16,185,129,.14),transparent 55%),radial-gradient(ellipse 70% 60% at 50% 50%,rgba(43,142,245,.08),transparent 50%)}
.atmosphere.blob-laminar::after{background:radial-gradient(ellipse 90% 70% at 25% 40%,rgba(16,185,129,.2),transparent 60%),radial-gradient(ellipse 80% 90% at 75% 60%,rgba(43,142,245,.14),transparent 55%),radial-gradient(ellipse 70% 60% at 50% 50%,rgba(22,163,106,.08),transparent 50%)}
.atmosphere.blob-heat::after{background:radial-gradient(ellipse 90% 70% at 20% 50%,rgba(255,90,31,.2),transparent 60%),radial-gradient(ellipse 80% 90% at 80% 30%,rgba(245,158,11,.14),transparent 55%),radial-gradient(ellipse 70% 60% at 50% 50%,rgba(225,29,72,.08),transparent 50%)}
.atmosphere.blob-void::after{background:radial-gradient(ellipse 90% 70% at 30% 30%,rgba(225,29,72,.2),transparent 60%),radial-gradient(ellipse 80% 90% at 70% 70%,rgba(255,90,31,.12),transparent 55%),radial-gradient(ellipse 70% 60% at 50% 50%,rgba(225,29,72,.08),transparent 50%)}
.atmosphere.blob-signal::after{background:radial-gradient(ellipse 90% 70% at 20% 40%,rgba(245,158,11,.2),transparent 60%),radial-gradient(ellipse 80% 90% at 80% 60%,rgba(255,90,31,.12),transparent 55%),radial-gradient(ellipse 70% 60% at 50% 50%,rgba(245,158,11,.08),transparent 50%)}
.atmosphere.blob-balanced::after{background:radial-gradient(ellipse 90% 70% at 25% 35%,rgba(22,163,106,.2),transparent 60%),radial-gradient(ellipse 80% 90% at 75% 65%,rgba(16,185,129,.14),transparent 55%),radial-gradient(ellipse 70% 60% at 50% 50%,rgba(22,163,106,.08),transparent 50%)}
@keyframes blobShift{0%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.05) rotate(2deg)}100%{transform:scale(.98) rotate(-1deg)}}
.atmosphere .atm-pull{max-width:44rem;text-align:center}
.atmosphere .atm-pull blockquote{font-family:var(--display);font-weight:400;font-size:clamp(28px,3.4vw,40px);line-height:1.22;letter-spacing:-.015em;color:var(--ink)}
.atmosphere .atm-pull .attr{margin-top:14px;font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.note{max-width:36rem;margin:40px auto;padding:0 28px;opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s ease}
.note.in{opacity:1;transform:none}
.note-inner{padding:14px 18px;border-left:2px solid var(--mute-3);background:var(--paper-2)}
.note .note-head{font-family:var(--mono);font-size:8px;letter-spacing:.28em;text-transform:uppercase;color:var(--mute-2);margin-bottom:6px}
.note .note-body{font-family:var(--sans);font-size:14px;line-height:1.6;color:var(--mute)}
</style></head><body>
<main>
<div class="thread"><div class="num">01</div><h2>A tiny title you can change</h2></div>
<section class="chat"><div class="column rail">
  <div class="turn mir"><div class="meta"><span style="color:#2b8ef5">Julia</span></div><div class="text" style="font-size:18px;line-height:1.60;">hey Mir, do my work for me please.</div></div>
</div></section>
<div class="note"><div class="note-inner"><div class="note-head">Note</div><div class="note-body">here is where I asked Mir to do my work for me. Can you guess how that went?</div></div></div>
<section class="chat"><div class="column rail">
  <div class="turn you" style="padding-left:18px;border-left:2px solid #10b981;background:linear-gradient(to right,#10b9810a,transparent 60%)"><div class="meta"><span style="color:#10b981">Mir</span></div><div class="text" style="font-size:18px;line-height:1.60;">🦭</div></div>
</div></section>
<div class="sys"><div class="ln"></div><div class="lbl">PERFECTION</div><div class="ln"></div></div>
<section class="chat"><div class="column rail">
  <div class="turn mir"><div class="meta"><span style="color:#2b8ef5">Julia</span></div><div class="text" style="font-size:18px;line-height:1.60;">Thx, great job 10/10 would reccomend.</div></div>
</div></section>
<div class="atmosphere blob-ice"><div class="atm-pull"><blockquote>“Thx, great job 10/10 would reccomend.”</blockquote><div class="attr">Julia</div></div></div>
<section class="chat"><div class="column rail">
</div></section>
</main>
<script>
var o=new IntersectionObserver(function(e){e.forEach(function(x){if(x.isIntersecting)x.target.classList.add("in")})},{threshold:.15});
document.querySelectorAll(".turn,.pull,.atmosphere,.note,.sys").forEach(function(e){o.observe(e)});

setTimeout(function(){var total=document.documentElement.scrollHeight-window.innerHeight;var dur=Math.min(total/1.2,50000);var t0=performance.now();function step(){var p=Math.min((performance.now()-t0)/dur,1);var e=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;window.scrollTo(0,e*total);if(p<1)requestAnimationFrame(step)}step()},2500);
</script></body></html>
