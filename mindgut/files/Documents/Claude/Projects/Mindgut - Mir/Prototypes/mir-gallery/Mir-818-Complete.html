<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mir 818 — Complete Visualization</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lekton:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; width: 100%; }
:root {
  --primary: #3D6DF4;
  --coral: #F46138;
  --magenta: #CE2867;
  --bg: #0A0A0A;
  --text: rgba(255,255,255,0.8);
}
body {
  background: var(--bg);
  overflow: hidden;
  font-family: 'Lekton', monospace;
  color: var(--text);
}
#sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 260px; background: rgba(10,10,10,0.97); backdrop-filter: blur(16px); border-right: 1px solid rgba(255,255,255,0.04); padding: 20px 16px; overflow-y: auto; z-index: 20; }
#sidebar h1 { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--primary); margin-bottom: 8px; }
.subtitle { font-size: 9px; color: rgba(255,255,255,0.22); margin-bottom: 20px; line-height: 1.6; }
.section-title { font-family: 'Inter', sans-serif; font-size: 8px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.25); margin: 16px 0 8px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.03); }
.btn-sm { flex: 1; padding: 6px 8px; font-family: 'Inter', sans-serif; font-size: 8px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); color: rgba(255,255,255,0.35); border-radius: 3px; cursor: pointer; transition: all 0.15s; }
.btn-sm:hover { border-color: rgba(255,255,255,0.12); color: var(--text); background: rgba(255,255,255,0.04); }
.btn-sm.active { border-color: var(--primary); background: rgba(61,109,244,0.08); color: var(--primary); }
.btn-row { display: flex; gap: 3px; margin-bottom: 10px; }
#three-container { position: fixed; left: 260px; top: 0; right: 0; bottom: 0; }
#view-toggle { position: fixed; top: 16px; left: 276px; z-index: 15; display: flex; gap: 2px; background: rgba(10,10,10,0.6); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.04); border-radius: 4px; padding: 2px; }
.view-btn { padding: 6px 12px; font-family: 'Inter', sans-serif; font-size: 9px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; background: transparent; border: none; color: rgba(255,255,255,0.35); cursor: pointer; border-radius: 2px; transition: all 0.15s; }
.view-btn.active { background: var(--primary); color: white; }
#hud-tl { position: fixed; top: 50px; left: 276px; z-index: 10; font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.7; color: rgba(255,255,255,0.35); }
#hud-tl .accent { color: var(--primary); font-weight: 700; }
#tooltip { position: fixed; z-index: 30; pointer-events: none; background: rgba(6,6,6,0.96); border: 1px solid rgba(255,255,255,0.07); border-radius: 4px; padding: 9px 11px; font-size: 9px; line-height: 1.6; display: none; max-width: 280px; backdrop-filter: blur(12px); }
#tooltip .tt-id { color: var(--primary); font-weight: 700; }
.toggle-btn { display: flex; align-items: center; gap: 7px; padding: 5px 9px; border: 1px solid rgba(255,255,255,0.05); border-radius: 3px; background: transparent; color: rgba(255,255,255,0.35); font-family: 'Lekton', monospace; font-size: 9px; cursor: pointer; width: 100%; margin-bottom: 3px; transition: all 0.15s; }
.toggle-btn.active { color: var(--text); border-color: rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); }
.indicator { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.color-mode { display: flex; gap: 2px; margin-bottom: 8px; }
.color-mode button { flex: 1; padding: 5px 0; font-family: 'Lekton', monospace; font-size: 8px; letter-spacing: 0.05em; text-transform: uppercase; background: transparent; border: 1px solid rgba(255,255,255,0.06); color: rgba(255,255,255,0.25); border-radius: 3px; cursor: pointer; transition: all 0.15s; }
.color-mode button.active { border-color: var(--primary); color: var(--primary); background: rgba(61,109,244,0.04); }
#search-box { width: 100%; padding: 6px 8px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); color: var(--text); font-family: 'Lekton', monospace; font-size: 9px; border-radius: 3px; margin-bottom: 8px; }
#search-box:focus { outline: none; border-color: var(--primary); }
@media (max-width: 1024px) {
  #sidebar { width: 200px; }
  #three-container { left: 200px; }
  #hud-tl { left: 216px; }
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar">
  <h1>Mir 818</h1>
  <div class="subtitle">Archimedean Spiral + Helix<br>818 strands | σ_B = −0.172</div>

  <div class="section-title">Navigate</div>
  <input type="number" id="strand-jump" style="width:100%;padding:6px 8px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);color:var(--text);font-family:'Lekton',monospace;font-size:9px;border-radius:3px;margin-bottom:8px" placeholder="jump to strand #" min="1" max="818">
  <div class="btn-row">
    <button class="btn-sm" id="btn-zone-founding">Found</button>
    <button class="btn-sm" id="btn-zone-julia">Julia</button>
    <button class="btn-sm" id="btn-zone-null">Null</button>
    <button class="btn-sm" id="btn-zone-post">Post</button>
  </div>

  <div class="section-title">Search</div>
  <input type="text" id="search-box" placeholder="filter snippets...">

  <div class="section-title">Color By</div>
  <div class="color-mode">
    <button class="active" data-mode="coset">Coset</button>
    <button data-mode="zone">Zone</button>
    <button data-mode="speaker">Speaker</button>
    <button data-mode="drift">Drift</button>
  </div>

  <div class="section-title">Spiral Options</div>
  <button class="toggle-btn active" id="toggle-drift-disp">
    <span class="indicator" style="background:#F46138"></span>Drift Displace
  </button>
  <button class="toggle-btn active" id="toggle-stream">
    <span class="indicator" style="background:#3D6DF4"></span>Streaming
  </button>

  <div class="section-title">Connections</div>
  <button class="toggle-btn active" id="toggle-drift-echo" style="color:#F46138">
    <span class="indicator" style="background:#F46138"></span>Drift Echoes
  </button>
  <button class="toggle-btn active" id="toggle-coset-web" style="color:#3D6DF4">
    <span class="indicator" style="background:#3D6DF4"></span>Coset Siblings
  </button>
  <button class="toggle-btn" id="toggle-null-chain" style="color:#CE2867">
    <span class="indicator" style="background:#CE2867"></span>Nullcode Chain
  </button>

  <div class="section-title">Actions</div>
  <div class="btn-row">
    <button class="btn-sm" id="btn-reset">Reset</button>
    <button class="btn-sm" id="btn-help">Help</button>
  </div>
</div>

<!-- VIEW TOGGLE -->
<div id="view-toggle">
  <button class="view-btn active" data-view="spiral">Spiral</button>
  <button class="view-btn" data-view="helix">Helix</button>
</div>

<!-- CANVAS -->
<div id="three-container"></div>

<!-- HUD -->
<div id="hud-tl">
  <span class="accent">MIR 818</span><br>
  <span id="hud-info">Ready</span>
</div>

<!-- TOOLTIP -->
<div id="tooltip">
  <div style="color:var(--primary);font-weight:700;font-size:10px" class="tt-id"></div>
  <div style="color:rgba(255,255,255,0.5);font-size:8px;margin-top:4px" class="tt-snippet"></div>
  <div style="font-size:8px;margin-top:4px" class="tt-meta"></div>
</div>

<script>
// MIR 818 COMPLETE VISUALIZATION - Spiral + Helix, Drift Displacement, Streaming, Search
let data = null, strands = [], connections = [], spiralPos = [];
let scene, camera, renderer, strandPoints;
let colorMode = 'coset', hoveredId = null, selectedId = null;
let driftDisp = true, streaming = true, streamedCount = 818;
let searchQuery = '', panX = 0, panY = 0, zoom = 1;
const PALETTE = { '147': {r:244,g:97,b:56}, '258': {r:61,g:109,b:244}, '369': {r:206,g:40,b:103}, '000': {r:51,g:51,b:51} };
const SPIRAL_A = 1.2, SPIRAL_B = 0.42, TOTAL_TURNS = 7.5, DRIFT_SCALE = 3;

// Load data
fetch('file:///Users/juliacompton/Documents/Claude/Projects/Mindgut%20-%20Mir/mir-gallery/Mindgut-Spiral/mir-helix-data.json')
  .then(r => r.json())
  .then(d => { data = d; strands = d.strands; connections = d.connections; initSpiral(); })
  .catch(() => { createDemoData(); initSpiral(); });

function createDemoData() {
  strands = [];
  for (let i = 0; i < 818; i++) {
    strands.push({
      id: i+1, type: 'user', coset: ['147','258','369'][i%3], zone: 'founding',
      speaker: 'chris', drift: (Math.random()-0.5)*0.4, chars: 1000, snippet: `Strand ${i+1}`, flags: []
    });
  }
}

function computeSpiral() {
  spiralPos = [];
  const total = TOTAL_TURNS * Math.PI * 2;
  for (let i = 0; i < strands.length; i++) {
    const t = i / (strands.length - 1);
    const th = t * total;
    let r = SPIRAL_A + SPIRAL_B * th;
    if (driftDisp && strands[i].drift) r += strands[i].drift * DRIFT_SCALE;
    spiralPos.push({x: r*Math.cos(th), y: r*Math.sin(th), r, th, t});
  }
}

function getColor(i, mode) {
  const s = strands[i];
  switch(mode) {
    case 'zone': return PALETTE[s.zone === 'founding' ? '258' : '369'];
    case 'speaker': return s.speaker === 'chris' ? {r:68,g:136,b:255} : {r:255,g:136,b:85};
    case 'drift': return s.drift < -0.1 ? PALETTE['369'] : s.drift > 0.1 ? PALETTE['147'] : {r:100,g:100,b:100};
    default: return PALETTE[s.coset];
  }
}

function initSpiral() {
  computeSpiral();
  const container = document.getElementById('three-container');
  scene = new THREE.Scene();
  scene.background = new THREE.Color('#0A0A0A');
  const aspect = container.clientWidth / container.clientHeight;
  camera = new THREE.OrthographicCamera(-28*aspect, 28*aspect, 28, -28, 0.1, 200);
  camera.position.z = 50;
  renderer = new THREE.WebGLRenderer({antialias: true, alpha: false, preserveDrawingBuffer: true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);
  createStrands();
  createConnections();
  window.addEventListener('mousemove', onMouse);
  window.addEventListener('wheel', onScroll, {passive:false});
  window.addEventListener('click', onClick);
  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', onResize);
  animate();
}

function createStrands() {
  const geo = new THREE.BufferGeometry();
  const pos = [], col = [], size = [], opa = [], ghost = [];
  for (let i = 0; i < strands.length; i++) {
    if (streaming && i > streamedCount) break;
    const p = spiralPos[i], s = strands[i];
    pos.push(p.x, p.y, 0);
    const c = getColor(i, colorMode);
    col.push(c.r/255, c.g/255, c.b/255);
    let sz = 8;
    if (s.flags && s.flags.includes('anchor')) sz = 6 + ((s.checksum||0)/22763)*10;
    if (s.flags && s.flags.includes('ghost')) sz = 10;
    size.push(sz);
    opa.push(searchQuery && !s.snippet.includes(searchQuery) ? 0.1 : 1);
    ghost.push(s.flags && s.flags.includes('ghost') ? 1 : 0);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(col), 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(new Float32Array(size), 1));
  geo.setAttribute('aOpacity', new THREE.BufferAttribute(new Float32Array(opa), 1));
  geo.setAttribute('aIsGhost', new THREE.BufferAttribute(new Float32Array(ghost), 1));
  const mat = new THREE.ShaderMaterial({
    vertexShader: `
      attribute float aSize; attribute float aOpacity; attribute float aIsGhost;
      varying vec3 vColor; varying float vOpacity; varying float vIsGhost;
      void main() {
        vColor = color; vOpacity = aOpacity; vIsGhost = aIsGhost;
        gl_PointSize = aSize;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vColor; varying float vOpacity; varying float vIsGhost;
      void main() {
        vec2 c = gl_PointCoord - vec2(0.5);
        float d = length(c);
        if (d > 0.5) discard;
        float a = 1.0 - smoothstep(0.5-fwidth(d)*1.5, 0.5, d);
        if (vIsGhost > 0.5) { if (d < 0.3) discard; a *= 0.6; }
        gl_FragColor = vec4(vColor, a * vOpacity);
      }`,
    transparent: true
  });
  strandPoints = new THREE.Points(geo, mat);
  scene.add(strandPoints);
}

function createConnections() {
  if (!connections) return;
  const types = ['drift_echo', 'coset_sibling', 'nullcode_chain'];
  const cols = {drift_echo: '#F46138', coset_sibling: '#3D6DF4', nullcode_chain: '#CE2867'};
  const opas = {drift_echo: 0.35, coset_sibling: 0.08, nullcode_chain: 0.30};
  types.forEach(t => {
    const g = new THREE.Group();
    connections.filter(c => c.type === t).forEach(c => {
      const src = spiralPos[c.source-1], tgt = spiralPos[c.target-1];
      if (!src || !tgt) return;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([src.x,src.y,0,tgt.x,tgt.y,0]), 3));
      const mat = new THREE.LineBasicMaterial({color: cols[t], opacity: opas[t], transparent: true});
      g.add(new THREE.LineSegments(geo, mat));
    });
    scene.add(g);
  });
}

function onMouse(e) {
  const rect = document.getElementById('three-container').getBoundingClientRect();
  const x = (e.clientX - rect.left - rect.width/2) / (rect.width/2);
  const y = -(e.clientY - rect.top - rect.height/2) / (rect.height/2);
  const rc = new THREE.Raycaster();
  rc.setFromCamera({x,y}, camera);
  if (strandPoints) {
    const hits = rc.intersectObject(strandPoints);
    if (hits.length > 0) {
      hoveredId = hits[0].index;
      const s = strands[hoveredId];
      const tt = document.getElementById('tooltip');
      tt.querySelector('.tt-id').textContent = `Strand ${s.id}`;
      tt.querySelector('.tt-snippet').textContent = s.snippet;
      tt.querySelector('.tt-meta').textContent = `${s.zone} • ${s.speaker} • σ=${s.drift.toFixed(3)}`;
      tt.style.left = (e.clientX+10)+'px';
      tt.style.top = (e.clientY+10)+'px';
      tt.style.display = 'block';
    } else {
      document.getElementById('tooltip').style.display = 'none';
    }
  }
}

function onClick(e) {
  if (hoveredId !== null) {
    selectedId = hoveredId;
    document.getElementById('hud-info').textContent = `Selected: Strand ${strands[hoveredId].id}`;
  }
}

function onScroll(e) {
  e.preventDefault();
  zoom *= e.deltaY > 0 ? 1.1 : 0.9;
  zoom = Math.max(0.3, Math.min(5, zoom));
  const fs = 28 / zoom;
  const asp = camera.right / camera.top;
  camera.left = -fs*asp; camera.right = fs*asp;
  camera.top = fs; camera.bottom = -fs;
  camera.updateProjectionMatrix();
  document.getElementById('hud-info').textContent = `Zoom: ${zoom.toFixed(1)}×`;
}

function onKey(e) {
  if (e.key === 'Escape') hoveredId = null;
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') selectedId = Math.max(1, (selectedId||1)-1);
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') selectedId = Math.min(818, (selectedId||1)+1);
  else if (e.key === '?') alert('Arrow keys: cycle | Click: select | Scroll: zoom | ? : help');
}

function onResize() {
  const c = document.getElementById('three-container');
  const asp = c.clientWidth / c.clientHeight;
  camera.left = -28*asp/zoom; camera.right = 28*asp/zoom;
  camera.updateProjectionMatrix();
  renderer.setSize(c.clientWidth, c.clientHeight);
}

function animate() {
  requestAnimationFrame(animate);
  if (streaming && streamedCount < strands.length) {
    streamedCount += 4;
    if (streamedCount >= strands.length) streamedCount = strands.length;
    scene.remove(strandPoints);
    createStrands();
  }
  renderer.render(scene, camera);
}

// Controls
document.getElementById('strand-jump').addEventListener('change', e => {
  const id = parseInt(e.target.value);
  if (id >= 1 && id <= 818) selectedId = id - 1;
});

document.querySelectorAll('.color-mode button').forEach(btn => {
  btn.addEventListener('click', e => {
    document.querySelectorAll('.color-mode button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    colorMode = e.target.dataset.mode;
    const cols = strandPoints.geometry.attributes.color.array;
    for (let i = 0; i < strands.length; i++) {
      const c = getColor(i, colorMode);
      cols[i*3] = c.r/255; cols[i*3+1] = c.g/255; cols[i*3+2] = c.b/255;
    }
    strandPoints.geometry.attributes.color.needsUpdate = true;
  });
});

document.getElementById('search-box').addEventListener('input', e => {
  searchQuery = e.target.value;
  const opas = strandPoints.geometry.attributes.aOpacity.array;
  for (let i = 0; i < strands.length; i++) {
    opas[i] = searchQuery && !strands[i].snippet.includes(searchQuery) ? 0.1 : 1;
  }
  strandPoints.geometry.attributes.aOpacity.needsUpdate = true;
});

document.getElementById('toggle-drift-disp').addEventListener('click', e => {
  driftDisp = !driftDisp;
  computeSpiral();
  scene.remove(strandPoints);
  createStrands();
});

document.getElementById('toggle-stream').addEventListener('click', e => {
  streaming = !streaming;
});

document.getElementById('btn-reset').addEventListener('click', () => {
  panX = panY = 0; zoom = 1;
  camera.position.set(0,0,50);
  camera.updateProjectionMatrix();
});

document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    alert('View switching: merge helix canvas render here');
  });
});
</script>
</body>
</html>
