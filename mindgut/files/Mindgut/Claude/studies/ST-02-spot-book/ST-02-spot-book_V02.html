:root{color-scheme:dark;--bg:#111010;--ink:#F3EFE8;--ink-2:#B9B3AA;--ink-3:#7A746C;--line:#2A2724;--pane:#1a1816;--f:"Archivo","Helvetica Neue",Arial,sans-serif;--m:"JetBrains Mono",ui-monospace,Menlo,monospace;--pad:clamp(24px,4vw,64px);--w:1360px}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--w);margin:0 auto;padding:0 var(--pad)}
header{padding:calc(var(--pad) + 16px) 0 0}
.kicker{font-family:var(--m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 18px}
header h1{font-size:clamp(34px,4.4vw,64px);font-weight:500;letter-spacing:-.03em;line-height:1;margin:0 0 20px}
header h1 em{font-style:normal;font-weight:300;color:var(--ink-2)}
.lede{margin:0;color:var(--ink-2);font-size:clamp(16px,1.25vw,19px);line-height:1.45;max-width:66ch;font-weight:300}
.lede b{color:var(--ink);font-weight:500}
.meta{font-family:var(--m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 0;line-height:1.9}
.meta b{color:var(--ink-2);font-weight:500}
nav.idx{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 28px;margin:34px 0 0;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-family:var(--m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
nav.idx a{display:block;padding:3px 0}nav.idx a:hover{color:var(--ink)}nav.idx a b{color:var(--ink-3);font-weight:400;margin-right:8px}
section{padding:72px 0 8px}
.head{display:grid;grid-template-columns:72px 1fr 1fr;gap:16px 40px;align-items:start;margin:0 0 22px}
.head .n{font-family:var(--m);font-size:12px;letter-spacing:.14em;color:var(--ink-3);padding-top:10px}
.head h2{font-size:clamp(28px,3.2vw,44px);font-weight:500;letter-spacing:-.028em;line-height:1;margin:0;grid-column:2}
.head h2 small{display:block;font-family:var(--m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:400;margin-top:10px}
.head .read{grid-column:2;margin:14px 0 0;color:var(--ink-2);font-size:clamp(15px,1.15vw,18px);line-height:1.45;font-weight:300}
.head .side{grid-column:3;grid-row:1 / span 2;margin:8px 0 0;border-left:1px solid var(--line);padding-left:22px;font-size:14px;line-height:1.5;color:var(--ink-2);font-weight:300}
.head .side .k{display:block;font-family:var(--m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.head .side p{margin:0 0 14px}
.head .side ol{margin:0;padding:0 0 0 18px}.head .side li{margin:0 0 4px}.head .side li b{color:var(--ink);font-weight:500;margin-right:6px;font-family:var(--m);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
/* panes */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.pair.one{grid-template-columns:minmax(0,822px)}.pair.one .pane:first-child{display:none}
.pane{position:relative;background:var(--pane);overflow:hidden}
.pane canvas{display:block;width:100%;height:auto}
.pane canvas.over{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;transition:opacity .12s ease}
.pane.show-ref canvas.over{opacity:1}
.pane .tagp{position:absolute;left:10px;bottom:10px;font-family:var(--m);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:rgba(17,16,16,.78);padding:4px 7px;pointer-events:none}
.pane .marks i{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:1px solid rgba(243,239,232,.9);background:rgba(17,16,16,.55);color:var(--ink);font:500 10px/18px var(--m);text-align:center;font-style:normal;pointer-events:none;transition:background .12s,transform .12s}
.pane .marks i.hot{background:var(--ink);color:var(--bg);transform:scale(1.25)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:10px 0 0;font-family:var(--m);font-size:11px;letter-spacing:.08em;color:var(--ink-2)}
.ctl button{font:inherit;color:var(--ink-2);background:transparent;border:1px solid var(--line);padding:6px 10px;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
.ctl button:hover{color:var(--ink);border-color:var(--ink-3)}.ctl button.on{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.ctl button kbd{font:inherit;opacity:.6;margin-right:6px}
.ctl .ms{margin-left:auto;color:var(--ink-3)}
.ctl label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-transform:uppercase;font-size:10px}
.ctl input[type=checkbox]{accent-color:var(--ink);margin:0}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);margin:14px 0 0;border:1px solid var(--line)}
.readout div{background:var(--bg);padding:12px 14px}
.readout .k{display:block;font-family:var(--m);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.readout .v{font-size:22px;font-weight:300;letter-spacing:-.02em;overflow-wrap:anywhere}.readout .v small{font-size:12px;color:var(--ink-3);margin-left:6px;font-family:var(--m)}
/* study body */
.t{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin:26px 0 0;padding-top:22px;border-top:1px solid var(--line)}
.k{display:block;font-family:var(--m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px}
ol.reads{list-style:none;margin:0;padding:0;font-size:14px;line-height:1.45;color:var(--ink-2)}
ol.reads li{display:grid;grid-template-columns:28px 64px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:default}
ol.reads li em{font-style:normal;font-family:var(--m);font-size:11px;color:var(--ink-3)}
ol.reads li b{font-family:var(--m);font-size:11px;letter-spacing:.08em;color:var(--ink);font-weight:500}
ol.reads li .d{color:var(--ink-3)}ol.reads li.hot{color:var(--ink)}
.vocab{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.chip{display:inline-grid;grid-template-columns:auto auto;gap:2px 10px;padding:7px 10px;border:1px solid var(--line);font-family:var(--m);font-size:10.5px;letter-spacing:.06em;line-height:1.3}
.chip b{color:var(--ink);font-weight:500;letter-spacing:.1em}.chip span{color:var(--ink-2)}.chip i{grid-column:1 / span 2;font-style:normal;color:var(--ink-3)}
.ledger .sub{display:grid;grid-template-columns:72px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.ledger .sub b.short{font-family:var(--m);font-size:11px;letter-spacing:.12em;color:var(--ink);font-weight:500;padding-top:3px}
.ledger .nm{font-size:15px;font-weight:500;margin:0 0 6px}.ledger .nm span{display:block;font-family:var(--m);font-size:10.5px;color:var(--ink-3);font-weight:400;letter-spacing:.06em;margin-top:3px}
table.params{border-collapse:collapse;font-family:var(--m);font-size:11px;color:var(--ink-2);margin:6px 0 8px;width:100%}
table.params th{text-align:left;font-weight:400;color:var(--ink-3);padding:3px 10px 3px 0;letter-spacing:.06em;white-space:nowrap}
table.params td{padding:3px 10px 3px 0;color:var(--ink)}table.params thead td{color:var(--ink-3)}
.ledger .im{font-size:13.5px;line-height:1.5;color:var(--ink-2);font-weight:300}.ledger .lim{font-size:12.5px;line-height:1.5;color:var(--ink-3);margin-top:6px}.ledger .lim::before{content:"Limits · ";color:var(--ink-3)}
/* quality */
table.q{border-collapse:collapse;width:100%;font-family:var(--m);font-size:11.5px;margin:0}
table.q th{text-align:left;font-weight:400;color:var(--ink-3);padding:8px 12px 8px 0;border-bottom:1px solid var(--line);letter-spacing:.08em;text-transform:uppercase;font-size:10px}
table.q td{padding:9px 12px 9px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top;overflow-wrap:anywhere}table.q td.n{color:var(--ink)}table.q td.f{font-family:var(--f);font-size:13.5px;line-height:1.45;font-weight:300;color:var(--ink-2)}
.wrong{columns:2;column-gap:40px;list-style:none;margin:0;padding:0;color:var(--ink-2);font-size:14px;line-height:1.5;font-weight:300}
.wrong li{break-inside:avoid;padding:0 0 8px 16px;text-indent:-16px}.wrong li::before{content:"— ";color:var(--ink-3)}
pre.spec{font-family:var(--m);font-size:11px;line-height:1.5;color:var(--ink-2);background:var(--pane);padding:18px;overflow:auto;max-height:420px;margin:0;border:1px solid var(--line)}
details summary{cursor:pointer;font-family:var(--m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding:10px 0}
footer{padding:64px 0 var(--pad);color:var(--ink-3);font-family:var(--m);font-size:11px;letter-spacing:.06em;line-height:1.9;border-top:1px solid var(--line);margin-top:72px}
footer b{color:var(--ink-2);font-weight:500}
/* loupe */
.loupe{position:fixed;z-index:9;pointer-events:none;display:none;grid-template-columns:1fr 1fr;gap:2px;background:var(--line);padding:2px;box-shadow:0 1px 0 rgba(255,255,255,.08) inset,2px 3px 5px rgba(0,0,0,.62),8px 14px 30px rgba(0,0,0,.36)}
.loupe canvas{display:block;width:160px;height:160px;background:var(--pane)}
.loupe.on{display:grid}
.loupe span{position:absolute;left:4px;top:4px;font-family:var(--m);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:rgba(17,16,16,.7);padding:2px 5px}
.loupe span.r{left:auto;right:4px}
@media (max-width:900px){nav.idx{grid-template-columns:1fr 1fr}.head{grid-template-columns:1fr}.head h2,.head .read,.head .side{grid-column:1;grid-row:auto}.head .side{border-left:0;padding-left:0;margin-top:14px}.pair{grid-template-columns:1fr}.t{grid-template-columns:1fr}.wrong{columns:1}.ctl .ms{margin-left:0;width:100%}.loupe{display:none!important}}
</style></head><body>

<script type="application/json" id="spec-st-02">{"id":"ST-02","code":"B-10","title":"Spot illustration · the book of ribbons","version":"V02","date":"2026-10-23","reference":{"pin":"048","image":"b171ef59ad6729c08f130fb0798ae6f3","board":"MG · Julia","url":"https://www.pinterest.com/pin/2392606049589188/","px":[822,810],"status":"directional","reading":"Ribbons · bookmarks as recall — colored reaches into a text"},"units":"reference px; the pin is 822 wide. u = W / 822 scales every constant.","primary_read":"A closed green book on a wood floor, seen from its tail edge, with ribbons and flags reaching out of the pages — one object carrying one idea.","grammar":"Flat inks, a warm black keyline with a red run under the cover's outline, hatching only as the pages themselves, solid cast shadows from one light, print grain gated by darkness. TS-02 four-ink spot grammar, as the reference actually does it.","lands":"The walkthrough's stories and the brief's figures: the genesis book, the window, the swap — an object drawn flat with a keyline, lit by one light, standing on a made surface.","what_v05_got_wrong":["A top-down flat polygon book: the reference is an oblique view of the tail edge with a rounded back.","Hatch on the cover and ground as shading: the reference has no shading hatch; its lines are the pages and the wood.","Ribbons as parallelograms falling right: they are swept splines falling down and forward, with selvages, a rolled edge and cut ends.","No cast shadows, no light; the reference's shadows are solid black from one upper-right light.","Keyline as a single black stroke: the reference's keyline is warm black over a red run, misregistered by a pixel."],"geometry":{"projection":"oblique: u (book width) at −24.5°, v (book height, toward the viewer) at 46.9°, thickness vertical; parallel, no convergence","u":[0.9099,-0.4149],"v":[0.683,0.7304],"slope_dy_dx":-0.456,"corner":[262,337],"overhang":21,"block_h":227,"band_bottom":33,"back":"Catmull-Rom through 19 measured points; shoulder flat at the top, rounder at the bottom; apex (194, 488)","back_pts":[[286,336],[274,345],[263,354],[250,361],[237,368],[226,382],[217,396],[209,412],[204,430],[199,448],[196,466],[194,488],[195,508],[199,528],[205,545],[211,560],[216,573],[224,581],[236,584]],"band_w":"cream edge → the back's outer keyline: 19 at the top (the 21 px tail-edge stack), 16 at the apex (line 2 · dark teal 12 · line 2), 32 at the bottom corner → 33 along the bottom","silhouette":"x = 15 + 0.936 (y − 380), along v; the spine-edge face 20 outside it, keylined on both sides; fillet r 36 into the bottom line","groove":"two lines along v, 19.5 apart vertically (13.5 ⟂): they are the cover's own outline lines — the spine-side line turns down-left at (266, 340) into the back's keyline, the board-side line turns right at (268, 323) into the thin top line; both turns rounded r ≈ 6","line_offsets":[12,25.5,33.5,55,72.5,90.3,106,128,149,173.5,193,212.5],"line_drift_per_300px":[-2.5,-1,-3,-4,-5,0,-3,-3,-3,0,-6,0],"rim":[4.5,9,14],"headband":{"pitch":36,"len":10,"w":5,"first":44,"inset":1.5}},"palette":{"ground":"#914829","wood":"#1f0f07","contact":"#1b0d06","cover":"#306e3f","cover_dark":"#2b633a","cover_light":"#327245","face":"#1f5a47","turn_in":"#3b9676","cream":"#f9f3e3","page_line":"#151010","key":"#140f0b","fringe":"#8a2a14","headband":"#e54526","yellow":"#f8dc4d","yellow_edge":"#e4b23a","yellow_under":"#e9b33e","blue":"#366bcb","blue_selvage":"#8db7f4","card":"#3461be","red":"#e6452f","dot":"#e14124","red_selvage":"#f07a63","plaid":"#e75a4b","plaid_line":"#efc750","pink":"#f1b0c6","pink_stripe":"#f4c2bf","purple":"#b57bdb","lavender":"#b37bde","shadow":"#050404"},"pass_order":[["ground","flat brown; wood strokes along u at −21°, rows every 3.1 px, 2–4 strokes a row, dry gaps; a density field (0.72 + 0.23 toward the left, a Gaussian clearing from (530,560) to (200,790), width 95)"],["contact","the book's contact shadow: a 10 px band under the bottom keyline from x = 540"],["cover","the dark edge face first (the whole book, #1c473f), then the green top and spine wedge with a tonal drift along u and a 70 px cloth mottle at ±5%, then the lit strips of the edge faces (top: cover green 4 px under the thin line; bottom: a 9 px green-teal strip above the bottom keyline)"],["block","cream with a 3% mottle; the block's own 2 px edge lines (5 px above the cream, around the back, along the bottom, and the back board's inner line) and the cyan turn-in under the top edge; 12 page lines as dry-brush strokes with per-line drift; the top three wrap the back as rim lines; interior lines end on the innermost rim; red headband capsules on the cream's edge"],["shadows","solid black: the red ribbon's patch on the board face and its stripe on the floor, the blue ribbon's stripe, the yellow ribbon's sliver, the card's patch, the root notches, the flag wedges"],["press 1","the first ink layer — shadows, the block's lines, the book's keylines — drawn on its own canvas and spread ±0.35 px by a smooth field (wavelength 14 px) before it lands on the stock, so every printed edge breathes"],["objects","flags and the card (flat fills, patterns clipped inside), then the ribbons (fills, selvages, the rolled edge)"],["press 2","the objects' keylines, spread the same way, over them"],["grain","per-reference-pixel noise, amplitude 3 + 13 (1 − L), biased +10%, plus a 2-px clump at 0.9× — last, in device space"]],"why_this_order":"The shadows and the block's lines are on the stock, under the objects; the objects cover them; the objects' own keylines go over. Each ink layer is spread before it lands, because a printed line's edge is the paper's, not the vector's. Grain is last because it is a reproduction artifact over everything and its amplitude reads the finished luminance.","studies":[{"id":"stock","n":"01","title":"Stock and grain","view":[380,40,640,240],"z":2.5,"read":"Flat ink is never flat: a cloth green with a tonal drift, a soft mottle, and a stochastic grain that gets louder as the ink gets darker.","subs":[{"short":"INK","id":"flat-ink","name":"Flat ink with drift","atoms":["fill","gradient"],"params":{"drift":{"value":"#2b633a → #327245","range":"±4% L","unit":""}},"implementation":"One linear gradient along u across the whole cover; the specimen reads as one green but the left is darker.","limits":"Past ±6% L it reads as lighting, and the grammar has no lighting on fills."},{"short":"MOTTLE","id":"cloth-mottle","name":"Cloth mottle","atoms":["fbm","multiply"],"params":{"wavelength":{"value":70,"range":[40,120],"unit":"px"},"amp":{"value":0.05,"range":[0.02,0.08],"unit":""}},"implementation":"3-octave value noise in 6 px cells, light cells screen, dark cells multiply, clipped to the cover; the cream gets the same at 0.03.","limits":"Above 0.08 the cover reads as stained."},{"short":"GRAIN","id":"dark-gated-grain","name":"Darkness-gated grain","atoms":["noise","luma-gate"],"params":{"amp":{"value":"3 + 14 (1 − L)","range":"","unit":"8-bit"},"bias":{"value":0.1,"range":[0,0.15],"unit":""},"cell":{"value":1,"range":"","unit":"reference px"}},"implementation":"One uniform noise per reference pixel, amplitude from the pixel's luminance, biased positive so dark inks get light speckle and the cream stays clean. Runs after the keylines.","limits":"Measured on the pin: cover sd 6.6 L, cream sd < 4. Flat amplitude everywhere is the tell of a filter."}],"reads":[["INK","cover drift","darker toward the spine",0.2,0.5],["MOTTLE","cloth","70 px light patches",0.55,0.35],["GRAIN","speckle","light grain on the dark green",0.8,0.75]]},{"id":"back","n":"02","title":"The rounded back","view":[140,290,330,630],"z":2,"read":"The book is not a box. Its back is a measured curve, the pages are lines that stop on a rim of three, and the cover wraps it as a dark edge face between two lines that thickens toward the floor.","subs":[{"short":"AXES","id":"oblique-axes","name":"Oblique axes","atoms":["u","v","w"],"params":{"u_angle":{"value":-24.5,"range":"","unit":"°"},"v_angle":{"value":46.9,"range":"","unit":"°"},"thickness":{"value":"vertical","range":"","unit":""}},"implementation":"Every edge is along u, along v, or vertical; no vanishing point. The page lines, the floor boards and the flags all share u.","limits":"Any convergence and the whole sheet has to be re-measured; the reference has none."},{"short":"BACK","id":"measured-back","name":"Measured back","atoms":["spline","normal","offset"],"params":{"points":{"value":19,"range":"","unit":""},"band_w":{"value":"12 → 14 → 30","range":"","unit":"px"},"rim":{"value":"4.5 · 9 · 14","range":"","unit":"px inset"}},"implementation":"Catmull-Rom through the cream envelope; outward normals give the dark band, inward offsets give the rim lines and the headband. The three top lines become the rim and return as the three bottom lines.","limits":"A half-ellipse was tried and rejected: the shoulder is flat at the top and round at the bottom, which no ellipse has."},{"short":"LINES","id":"page-lines","name":"Page lines, dry","atoms":["offset","drift","taper"],"params":{"count":{"value":12,"range":"","unit":""},"weight":{"value":"2.9 ± 1.4","range":"","unit":"px"},"pitch":{"value":"13 → 24","range":"","unit":"px, tighter at the top"}},"implementation":"Offsets measured at x = 500, drift per line toward the fore-edge, ±1.2 px hand wobble, weight and alpha from noise; lines taper and break past x = 560.","limits":"Even pitch reads as ruling, not pages."},{"short":"HEAD","id":"headband","name":"Headband","atoms":["capsule","arc-length"],"params":{"pitch":{"value":36,"range":[30,40],"unit":"px"},"size":{"value":"11 × 6","range":"","unit":"px"}},"implementation":"Red capsules every 36 px of arc length, sitting on the cream's edge; the cream between them is the white of the band.","limits":"Measured by connected components on the pin; the first pass had them at 14.5 px, which is a dotted line, not a headband."}],"reads":[["BACK","band","12 px at the top",0.62,0.17],["HEAD","capsule","on the cream's edge",0.3,0.55],["LINES","rim","three lines wrap, the rest stop",0.5,0.5],["AXES","groove hook","the board line turns into the spine line",0.6,0.12]]},{"id":"key","n":"03","title":"Keyline and fringe","view":[200,280,320,380],"z":5,"read":"The cover's outline is two inks: a red run under a warm black, so the line has a warm rim. Weight is by element — the groove is the heaviest line on the sheet, the board's top edge the thinnest — and joins are round.","subs":[{"short":"KEY","id":"warm-keyline","name":"Warm keyline","atoms":["stroke","round-join"],"params":{"edge":{"value":3.4,"range":[2.5,4.5],"unit":"px"},"groove":{"value":4.6,"range":[4,6],"unit":"px"},"flag":{"value":3.0,"range":[2.5,3.5],"unit":"px"},"ribbon":{"value":"1.6 lit · 3.0 shadow","range":"","unit":"px"}},"implementation":"#140f0b, never pure black; round joins and caps; the ribbon's lit edge is thinner than its shadow edge. The cover's edge is a stack, not a line: thin top line 2.6 · lit strip 4 · dark face 9 · lower line 2 · cyan turn-in 3.5 · cream (21 px). Along the bottom: line 2 · dark teal 15 · line 2 · lit strip 9 · keyline 5 (33 px).","limits":"Under 2.5 px the fills float; over 5 the sheet becomes a woodcut."},{"short":"RUN","id":"red-under-run","name":"Red under-run","atoms":["second-pass","offset"],"params":{"dx":{"value":0.8,"range":[0.5,1.5],"unit":"px"},"dy":{"value":1.0,"range":[0.5,1.5],"unit":"px"},"extra_w":{"value":1.6,"range":[1,2.5],"unit":"px"}},"implementation":"The cover's outline lines (top edge, back, silhouette, bottom) are stroked first in #8a2a14 at w + 1.4, almost unshifted, then in black at w: a 0.7 px warm rim on both sides. Measured on the pin as redness +10 to +40 within 1 px of these lines and none on the groove, flags, ribbons or card, which are stroked once.","limits":"A text-shadow copy is the fake; this is the second run of a print."},{"short":"TURN","id":"groove-turns","name":"Groove turns","atoms":["turn","round"],"params":{"gap":{"value":13.5,"range":"","unit":"px ⟂"}},"implementation":"The two groove lines are the cover's outline: the spine-side line turns down-left into the back's keyline, the board-side line turns right into the thin top line; the channel between them is cover green and ends where they diverge. Scanned at 12×: no third line, no hook — a bend each.","limits":""},{"short":"PRESS","id":"ink-spread","name":"Ink spread","atoms":["displacement","field","layer"],"params":{"amp":{"value":0.35,"range":[0.2,0.7],"unit":"px"},"wavelength":{"value":14,"range":[8,24],"unit":"px"},"layers":{"value":2,"range":"","unit":""}},"implementation":"The ink passes are drawn on their own canvas and resampled through a smooth two-channel displacement field before compositing: the line stays, its edge breathes like a printed one.","limits":"Above 0.7 px the lines shiver; this is spread, not wobble (fidelity §3.1: displacement-wobble ink is the fake — the displacement here is sub-pixel and only on the edge)."}],"reads":[["TURN","turns","B down-left, A right",0.52,0.5],["RUN","warm rim","on the outline lines only",0.3,0.3],["KEY","groove","4.8 px, the heaviest",0.2,0.2],["PRESS","edge","breathes, does not wobble",0.8,0.8]]},{"id":"ribbons","n":"04","title":"Ribbons","view":[250,330,640,720],"z":1.6,"read":"A ribbon is a swept centerline with a width that grows as it falls; a selvage on one edge, a rolled edge where it twists, a notch where it enters the pages, a cut end.","subs":[{"short":"SWEEP","id":"measured-ribbon","name":"Measured ribbon","atoms":["contour","chains","chaikin"],"params":{"contour":{"value":"colour mask → component → DP 1.2 px","range":"","unit":""},"smoothing":{"value":"Chaikin ×3, normals averaged ±4","range":"","unit":""}},"implementation":"The ribbon's outline is its measured contour; it is split at its top and bottom vertices into the viewer's-left and right chains, which carry the selvage, the crease, the rolled edge and the two keyline weights.","limits":"A centerline + width profile was the V01 model; it reads right but sat 3–6 px off. The contour is the pin's."},{"short":"SELV","id":"selvage","name":"Selvage and crease","atoms":["strip","clip","crease"],"params":{"blue":{"value":"left, 5 px","range":"","unit":""},"red":{"value":"right, 3.5 px from t = .72","range":"","unit":""},"crease":{"value":1.6,"range":"","unit":"px"}},"implementation":"A lighter strip inside the body along one edge, with a near-black crease line between strip and body.","limits":""},{"short":"ROLL","id":"rolled-edge","name":"Rolled edge","atoms":["strip","grow"],"params":{"from":{"value":0.78,"range":[0.6,0.9],"unit":"t"},"w":{"value":4.5,"range":[3,7],"unit":"px"}},"implementation":"The yellow ribbon turns to face the viewer near its end: a darker-yellow strip grows along the right edge, keylined, so the end reads as a cut edge with thickness.","limits":"Past 7 px it reads as a second ribbon."},{"short":"ROOT","id":"root-notch","name":"Root notch","atoms":["wedge"],"params":{},"implementation":"A solid black wedge where the ribbon enters the page block, drawn with the shadows.","limits":""}],"reads":[["ROOT","notch","where the yellow enters",0.12,0.3],["SELV","selvage","the blue's lit edge",0.42,0.28],["ROLL","rolled edge","the yellow turns",0.4,0.9],["SWEEP","flare","the red widens to 27",0.9,0.82]]},{"id":"flags","n":"05","title":"Flags and the card","view":[540,140,822,470],"z":1.8,"read":"Every flag is a quadrilateral along u; patterns are flat fills clipped inside the keyline; the polka dots are hand-placed, and that is the point.","subs":[{"short":"FLAG","id":"flag-quad","name":"Flag along u","atoms":["quad","round-corner"],"params":{"corner_r":{"value":"2 – 10","range":"","unit":"px"}},"implementation":"Top and bottom edges along u, sides at 50–60°; measured corners from the color masks.","limits":""},{"short":"PATT","id":"pattern-fill","name":"Pattern fill","atoms":["stripe","plaid","dot","clip"],"params":{"stripe_w":{"value":"30 – 40","range":"","u 4":"dark by design, declared","G5":"no motion","G7":"annotations outside the canvases","G9":"removal test per pass in why_this_order","G10":"no font approximation: Archivo + JetBrains Mono as the boards","G11":"DPR ≤ 2, canvases sized from pane width"},"quality_pass":{"00":"Reads as the same piece; the structural |Δ| is now ~10 (from 14 at pass 1). The ground's bundles are still a little more even than the pin's; the cover's mottle a touch finer.","01":"Grain amplitude and clump match the pin's statistics (cover sd 10.0 vs 10.8). The pin's speckle has slightly more light clumps on the dark green.","02":"The back, the two-line edge face, the headband, the traced page lines and the groove's two turns are the pin's construction. The pin's rim lines are ~1 px thinner; its lines reach the shoulder a little higher.","03":"The edge stack and the groove turns read right at 5×; the spread gives the lines a printed edge. The pin's groove lines sit ~0.5 px heavier.","04":"Outlines are the pin's contours (IoU yellow .78 · blue .77 · red .69 from .72 · .64 · .59). The blue's selvage strip is a little wide at the root; the yellow's rolled edge a little short.","05":"Flag hulls sit on the pin; the dots at their measured centers. The pin's plaid is more broken with more stray ticks.","06":"Shadow shapes are the pin's components (seeded). Under the card the pin grades from black into the dark-brown contact band; mine is solid black along the card's whole bottom edge.","07":"Coverage per region within ~10% of the pin. The pin's strokes are slightly straighter and more continuous."},"measured":{"how":"measure.py: colour class → connected component (seeded for the shadows) → outer contour, dilated 1 px to the keyline center → Douglas-Peucker 1.2 px; convex hull for the flags and the card (what the ribbons and notches cut out of a mask is drawn back over it); page lines traced every 6 px where a dark run sits between cream","objects":["ribbon_yellow","ribbon_blue","ribbon_red","flag_yel   const s = section('plate', '00', 'The plate', 'reference 048 · 822 × 810 · rebuilt live in canvas', `The whole sheet, drawn at the pane's size from the same code as every study below. <b>R</b> flips the rebuild to the reference in place, <b>D</b> shows |Δ|, the checkboxes remove a pass (the removal test), <b>S</b> re-rolls the stochastic passes, <b>1</b> shows one pane at the pin's own size.`, side);
  const st = makePair({ x0: 0, y0: 0, x1: PLATE.REF_W, y1: PLATE.REF_H }, 1, {}, { onDraw: st => st.fill && st.fill() });
  st.oneToOne = true; s.appendChild(st.pair); s.appendChild(controls(st, true)); s.appendChild(readout(st)); wireLoupe(st); pairs.push(st); st.label = '00 · the plate';
  const w = $('div'); w.innerHTML = `<span class="k" style="margin-top:28px">What V05 got wrong</span><ul class="wrong">${SPEC.what_v05_got_wrong.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`; s.appendChild(w);
}
// 01–07 · studies
const ISOLATE = { back: { objects: false, shadow: false }, key: { grain: false, mottle: false, wood: false }, flags: { shadow: false }, shadow: { objects: false, key: false, lines: false, headband: false } };
SPEC.studies.forEach(sp => {
  const s = section('st-' + sp.id, sp.n, sp.title, `${sp.view.join(' · ')} of the pin · ${sp.z}×`, esc(sp.read));
  const view = { x0: sp.view[0], y0: sp.view[1], x1: sp.view[2], y1: sp.view[3] };
  const st = makePair(view, sp.z, {}, { onDraw: st => st.fill && st.fill() }); st.isolate = ISOLATE[sp.id]; st.label = `${sp.n} · ${sp.title}`;
  // marks
  sp.reads.forEach((r, i) => { const m = $('i', '', String(i + 1)); m.dataset.i = i; m.style.left = (r[3] * 100) + '%'; m.style.top = (r[4] * 100) + '%'; m.title = r[1]; st.marks.appendChild(m); });
  s.appendChild(st.pair); s.appendChild(controls(st, false)); s.appendChild(readout(st)); wireLoupe(st); pairs.push(st);
  // the two columns: reads + vocabulary | ledger
  const t = $('div', 't');
  const left = $('div'); left.innerHTML = `<span class="k">Reads · hover</span><ol class="reads">${sp.reads.map((r, i) => `<li data-i="${i}"><em>${String(i + 1).padStart(2, '0')}</em><b>${r[0]}</b><span>${esc(r[1])} <span class="d">· ${esc(r[2])}</span></span></li>`).join('')}</ol><span class="k" style="margin-top:22px">Vocabulary · short · id · atoms</span><div class="vocab">${sp.subs.map(u => `<span class="chip"><b>${u.short}</b><span>${u.id}</span><i>${u.atoms.join(' · ')}</i></span>`).join('')}</div>`;
  const right = $('div'); right.innerHTML = `<span class="k">Sub-techniques · params · implementation · limits</span><div class="ledger">${sp.subs.map(u => `<div class="sub"><b class="short">${u.short}</b><div><div class="nm">${esc(u.name)}<span>${u.id} · ${u.atoms.join(' · ')}</span></div>${Object.keys(u.params).length ? `<table class="params"><thead><tr><th></th><td>value</td><td>range</td><td>unit</td></tr></thead>${Object.entries(u.params).map(([k, p]) => `<tr><th>${k}</th><td>${esc(fmt(p.value))}</td><td>${esc(fmt(p.range))}</td><td>${esc(p.unit || '')}</td></tr>`).join('')}</table>` : ''}<div class="im">${esc(u.implementation)}</div>${u.limits ? `<div class="lim">${esc(u.limits)}</div>` : ''}</div></div>`).join('')}</div>`;
  t.appendChild(left); t.appendChild(right); s.appendChild(t);
  left.querySelectorAll('.reads li').forEach(li => { const i = li.dataset.i; li.addEventListener('mouseenter', () => { st.marks.querySelectorAll('i').forEach(m => m.classList.toggle('hot', m.dataset.i === i)); li.classList.add('hot'); }); li.addEventListener('mouseleave', () => { st.marks.querySelectorAll('i').forEach(m => m.classList.remove('hot')); li.classList.remove('hot'); }); });
});
// 08 · quality pass
{
  const s = section('quality', '08', 'Quality pass', 'computed in this page from the canvases above · plus what remains', 'Each study measured against the same crop of the pin at the same device size: mean absolute difference per channel (raw, and in 6-reference-pixel box averages, where grain and line phase stop counting), the share of dark pixels, the mean luminance. Numbers recompute on every redraw. Below the numbers, the faults that remain in V01, by eye.');
  const tbl = $('table', 'q'); tbl.innerHTML = `<thead><tr><th>study</th><th>mean |Δ|</th><th>|Δ| in 6 px boxes</th><th>dark px ref · rebuild</th><th>mean L ref · rebuild</th><th>IoU green · cream · yellow · red · blue · ink</th><th>what remains</th></tr></thead><tbody></tbody>`;
  const wrapT = $('div'); wrapT.style.cssText = 'overflow-x:auto;max-width:100%'; wrapT.appendChild(tbl); s.appendChild(wrapT); const tb = tbl.querySelector('tbody');
  const faults = SPEC.quality_pass || {};
  window.__fillQuality = () => { tb.innerHTML = pairs.map(st => { const m = st.m || {}; const f = faults[st.label.slice(0, 2)] || ''; return `<tr><td class="n">${esc(st.label)}</td><td>${m.mae ? m.mae.toFixed(1) : '—'}</td><td>${m.maeS ? m.maeS.toFixed(1) : '—'}</td><td>${m.darkRef != null ? `${(m.darkRef * 100).toFixed(1)}% · ${(m.darkOut * 100).toFixed(1)}%` : '—'}</td><td>${m.lRef != null ? `${m.lRef.toFixed(1)} · ${m.lOut.toFixed(1)}` : '—'}</td><td>${m.iou ? ['green', 'cream', 'yellow', 'red', 'blue', 'ink'].map(k => m.iou[k] == null ? '—' : m.iou[k].toFixed(2)).join(' · ') : '—'}</td><td class="f">${esc(f)}</td></tr>`; }).join(''); };
}
// 09 · spec
{
  const s = section('spec', '09', 'Spec', 'machine-readable · the same JSON is embedded as #spec-st-02', 'Geometry, palette, pass order, every sub-technique with value · range · unit, the measured constants, the library cross-index and the gates. Read it with <b>JSON.parse(document.getElementById(\'spec-st-02\').textContent)</b>.');
  const d = $('details'); d.innerHTML = `<summary>show the JSON</summary><pre class="spec">${esc(JSON.stringify(SPEC, null, 2))}</pre>`; s.appendChild(d);
  const lib = $('p', 'meta'); lib.innerHTML = `Library <b>${SPEC.library.join(' · ')}</b><br>Lands in Mindgut <b>${esc(SPEC.lands)}</b>`; s.appendChild(lib);
}
document.getElementById('foot').innerHTML = `<b>ST-02 · spot book · ${SPEC.version}</b> · ${SPEC.date} · Mindgut/Claude/studies/ST-02-spot-book/ · single file, fonts and the reference embedded, no requests · reference: ${SPEC.reference.url} (${SPEC.reference.board}, pin ${SPEC.reference.pin}) · the plate is computed, not traced: every pass is a function of the measured constants in the spec.`;

/* ---------- draw everything, rebuild on resize ---------- */
function drawAll() { pairs.forEach(st => { st.draw(); if (st.fill) st.fill(); }); if (window.__fillQuality) window.__fillQuality(); window.READY = true; }
const start = () => { drawAll(); let last = window.innerWidth, t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => { if (Math.abs(window.innerWidth - last) > 70) { last = window.innerWidth; drawAll(); } }, 300); }); };
if (REF.complete && REF.naturalWidth) start(); else REF.addEventListener('load', start);
})();
</script>
</body></html>
