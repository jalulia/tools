<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#111}canvas{display:block}</style>
<style id="fonts"></style></head>
<body><canvas id="c"></canvas>
<script>
const q = new URLSearchParams(location.search);
document.write(`<script src="${q.get("plate") || "plate.js"}"><\/script>`);
</script>
<script>
const view = q.get('view') ? (() => { const [x0,y0,x1,y1] = q.get('view').split(',').map(Number); return {x0,y0,x1,y1}; })() : null;
const z = parseFloat(q.get('z') || '1');
const v = view || {x0:0,y0:0,x1:PLATE.REF_W,y1:PLATE.REF_H};
const W = Math.round((v.x1-v.x0)*z), H = Math.round((v.y1-v.y0)*z);
const layers = {}; (q.get('off')||'').split(',').filter(Boolean).forEach(k => layers[k] = false);
const thumb = q.get('thumb');
(async () => {
  if (window.FONT_CSS) { document.getElementById('fonts').textContent = window.FONT_CSS; await document.fonts.ready; }
  const t0 = performance.now();
  if (thumb) PLATE.renderThumb(document.getElementById('c'), W, H, thumb);
  else PLATE.render(document.getElementById('c'), W, H, v, layers, parseInt(q.get('seed')||'1'));
  window.RENDER_MS = performance.now() - t0; window.READY = true;
})();
</script></body></html>
