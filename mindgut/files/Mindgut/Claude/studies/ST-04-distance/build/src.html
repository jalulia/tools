<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">

<style>

ol.reads li b{color:var(--ink);font-weight:500}ol.reads li .d{color:var(--ink-3)}

.loop .r .cap{padding:10px 0 0;font-size:13px;line-height:1.45;color:var(--ink-2);font-weight:300}.loop .r .cap b{display:block;color:var(--ink);font-weight:500;font-family:var(--m);font-size:11px;letter-spacing:.1em;margin-bottom:4px}.loop .r .cap em{display:block;font-style:normal;color:var(--ink-3);margin-top:6px}.loop .r .cap em::before{content:"patched · ";color:var(--ink-3)}

.wrong li{break-inside:avoid;padding:0 0 8px 16px;text-indent:-16px}.wrong li::before{content:"— ";color:var(--ink-3)}
pre.spec{font-family:var(--m);font-size:11px;line-height:1.5;color:var(--ink-2);background:var(--pane);padding:18px;overflow:auto;max-height:420px;margin:0;border:1px solid var(--line)}
details summary{cursor:pointer;font-family:var(--m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding:10px 0}

.loupe{position:fixed;z-index:9;pointer-events:none;display:none;grid-template-columns:1fr 1fr;gap:2px;background:var(--line);padding:2px;box-shadow:0 1px 0 rgba(255,255,255,.08) inset,2px 3px 5px rgba(0,0,0,.62),8px 14px 30px rgba(0,0,0,.36)}
.loupe.one{grid-template-columns:1fr}.loupe.one > div:first-child{display:none}
.loupe canvas{display:block;width:160px;height:160px;background:var(--pane)}
.loupe.on{display:grid}
.loupe span{position:absolute;left:4px;top:4px;font-family:var(--m);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:rgba(17,16,16,.7);padding:2px 5px}
.loupe span.r{left:auto;right:4px}
@media (max-width:900px){nav.idx{grid-template-columns:1fr 1fr}.head{grid-template-columns:1fr}.head h2,.head .read,.head .side{grid-column:1;grid-row:auto}.head .side{border-left:0;padding-left:0;margin-top:14px}.pair{grid-template-columns:1fr}.t,.t3{grid-template-columns:1fr}.boards,.passes{grid-template-columns:1fr 1fr}.loop{grid-template-columns:1fr}.wrong{columns:1}.ctl .ms{margin-left:0;width:100%}.loupe{display:none!important}}
</style></head><body>
<div class="wrap">
<header>
  <p class="kicker" id="kicker"></p>
  <h1>Identity is a distance<em> · built from the concept end</em></h1>
  <p class="lede" id="lede"></p>
  <p class="meta" id="meta"></p>
  <nav class="idx" id="idx"></nav>
</header>
<main id="main"></main>
<footer id="foot"></footer>
</div>
<div class="loupe" id="loupe"><div style="position:relative"><canvas width="480" height="480"></canvas><span>Pin 048</span></div><div style="position:relative"><canvas width="480" height="480"></canvas><span class="r">ST-04</span></div></div>
<img id="refimg" alt="" src="{{REF}}" style="display:none">
<script type="application/json" id="spec-st-04">{{SPEC}}</script>
<script>{{PLATE_JS}}</script>
<script>
(() => {
const SPEC = JSON.parse(document.getElementById('spec-st-04').textContent);
const REF = document.getElementById('refimg');
const LOOP_IMGS = { 'pass 1': '{{P01}}', 'pass 2': '{{P02}}' };
const $ = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h !== undefined) e.innerHTML = h; return e; };
const dpr = () => Math.min(window.devicePixelRatio || 1, 2);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const fmt = v => Array.isArray(v) ? v.join(' – ') : (v === '' || v == null ? '' : v);
const LAYERS = ['mottle', 'wood', 'marks', 'shadow', 'person', 'key', 'press', 'grain'];

/* ---------- header ---------- */
document.getElementById('kicker').textContent = `Mindgut · studies · ST-04 · ${SPEC.subtitle} · ${SPEC.version} · ${SPEC.date}`;
document.getElementById('lede').innerHTML = `<b>${esc(SPEC.primary_read)}</b>`;
document.getElementById('lede').insertAdjacentHTML('afterend', `<p class="lede" style="margin-top:14px;font-size:15px">${esc(SPEC.what_this_tests)}</p>`);
document.getElementById('meta').innerHTML = `Lands in <b>${esc(SPEC.lands)}</b><br>Units <b>${esc(SPEC.units)}</b><br>Inherited <b>the B-10 grammar as ST-02 measured it · nothing else</b>`;
const idx = document.getElementById('idx');
[['00', 'The plate', 'plate'], ...SPEC.phases.map(p => [p[0], p[1], 'ph-' + p[2]]), ['07', 'Quality pass', 'quality'], ['08', 'Spec', 'spec']].forEach(([n, t, id]) => { const a = $('a', '', `<b>${n}</b>${esc(t)}`); a.href = '#' + id; idx.appendChild(a); });

/* ---------- helpers ---------- */
const refCanvas = (W, H, view, nearest) => { const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d'); x.imageSmoothingEnabled = !nearest; x.imageSmoothingQuality = 'high'; x.drawImage(REF, view.x0, view.y0, view.x1 - view.x0, view.y1 - view.y0, 0, 0, W, H); return c; };
const CL = { green: (r, g, b, l) => g > r + 20 && g > b + 5 && g > 60 && l < 150, cream: (r, g, b) => r > 200 && g > 190 && b > 160, brown: (r, g, b, l) => r > g + 30 && r > b + 50 && r < 200 && l > 45 && l < 130, yellow: (r, g, b) => r > 200 && g > 170 && b < 130, red: (r, g, b) => r > 180 && g < 120 && b < 100, blue: (r, g, b) => b > 150 && b > r + 60 && b > g + 20, ink: (r, g, b, l) => l < 40 };
function stats(c) { // one canvas → mean L, dark share, colour-class shares
  const W = c.width, H = c.height, A = c.getContext('2d').getImageData(0, 0, W, H).data; let la = 0, da = 0; const n = W * H; const sh = {}; for (const k in CL) sh[k] = 0;
  for (let i = 0; i < A.length; i += 4) { const l = A[i] * .299 + A[i + 1] * .587 + A[i + 2] * .114; la += l; if (l < 40) da++; for (const k in CL) if (CL[k](A[i], A[i + 1], A[i + 2], l)) sh[k]++; }
  for (const k in CL) sh[k] /= n; return { L: la / n, dark: da / n, share: sh };
}
const pct = v => (v * 100).toFixed(1) + '%';

/* ---------- a single pane: the plate or a crop of it ---------- */
function makePane(view, layers, opts = {}) {
  const wrap = $('div', opts.single === false ? 'pair' : 'single'); const pb = $('div', 'pane'); const cb = document.createElement('canvas'); pb.appendChild(cb);
  const marks = $('div', 'marks'); pb.appendChild(marks); const tag = $('span', 'tagp', opts.tag || 'ST-04 · live'); pb.appendChild(tag); wrap.appendChild(pb);
  const st = { pair: wrap, pb, cb, marks, tag, view, layers: Object.assign({}, layers || {}), seed: 1, m: null };
  st.draw = () => { const cssW = pb.clientWidth || 600; const d = dpr(); const vw = view.x1 - view.x0, vh = view.y1 - view.y0; const W = Math.round(cssW * d), H = Math.round(W * vh / vw); st.scale = W / vw;
    const t0 = performance.now(); PLATE.render(cb, W, H, view, st.layers, st.seed); const ms = Math.round(performance.now() - t0);
    st.m = stats(cb); tag.textContent = `${opts.tag || 'ST-04 · live'} · ${W} × ${H} · ${ms} ms · ${(st.scale / d).toFixed(2)}× of the sheet`; if (opts.onDraw) opts.onDraw(st); if (window.__fillQuality) window.__fillQuality(); };
  return st;
}
function controls(st, withLayers) {
  const c = $('div', 'ctl'); const bS = $('button', '', '<kbd>S</kbd> re-seed'); bS.onclick = () => { st.seed++; st.draw(); }; c.appendChild(bS);
  if (withLayers) LAYERS.forEach(k => { const l = $('label'); const i = document.createElement('input'); i.type = 'checkbox'; i.checked = st.layers[k] !== false; i.onchange = () => { st.layers[k] = i.checked; st.draw(); }; l.appendChild(i); l.appendChild(document.createTextNode(k)); c.appendChild(l); });
  if (st.oneToOne) { const b = $('button', '', '<kbd>1</kbd> 1:1'); b.title = 'the pane at the sheet\'s size (822 CSS px when the window allows)'; b.onclick = () => { st.one = !st.one; b.classList.toggle('on', st.one); st.pair.classList.toggle('one', st.one); st.pair.classList.toggle('single', !st.one); st.pair.classList.toggle('pair', st.one); st.draw(); }; c.appendChild(b); }
  if (st.without) { const b = $('button', '', '<kbd>W</kbd> without the grammar'); b.onclick = () => { st.off = !st.off; b.classList.toggle('on', st.off); st.layers = st.off ? { mottle: false, wood: false, key: false, press: false, grain: false, shadow: false } : {}; c.querySelectorAll('input').forEach(i => i.checked = st.layers[i.nextSibling.textContent] !== false); st.draw(); }; c.appendChild(b); }
  const ms = $('span', 'ms', 'hover the pane for the 3× loupe'); c.appendChild(ms);
  st.pair.parentElement.addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (k === 's') bS.click(); if (k === '1' && st.oneToOne) c.querySelector('button:nth-of-type(2)').click(); if (k === 'w' && st.without) c.querySelector('button:nth-of-type(3)').click(); });
  st.pair.parentElement.tabIndex = 0; return c;
}
function readout(st, pinStats) {
  const r = $('div', 'readout'); const cells = {};
  [['L', 'mean luminance', 'pin 048 · ST-04'], ['dark', 'dark pixels (L < 40)', 'pin 048 · ST-04'], ['ink', 'ink shares green · cream · brown', 'pin 048 / ST-04'], ['ink2', 'ink shares yellow · red · blue', 'pin 048 / ST-04']].forEach(([k, label, unit]) => { const d = $('div', '', `<span class="k">${label}</span><span class="v">—<small>${unit}</small></span>`); cells[k] = d.querySelector('.v'); r.appendChild(d); });
  st.fill = () => { const m = st.m, p = pinStats(); if (!m || !p) return; cells.L.innerHTML = `${p.L.toFixed(1)} · ${m.L.toFixed(1)}<small>pin 048 · ST-04</small>`; cells.dark.innerHTML = `${pct(p.dark)} · ${pct(m.dark)}<small>pin 048 · ST-04</small>`;
    cells.ink.innerHTML = `<span style="font-size:15px">${['green', 'cream', 'brown'].map(k => `${pct(p.share[k])} / ${pct(m.share[k])}`).join(' · ')}</span><small>green · cream · brown</small>`; cells.ink2.innerHTML = `<span style="font-size:15px">${['yellow', 'red', 'blue'].map(k => `${pct(p.share[k])} / ${pct(m.share[k])}`).join(' · ')}</span><small>yellow · red · blue</small>`; };
  return r;
}
/* ---------- loupe ---------- */
const loupe = document.getElementById('loupe'); const [lr, lb] = loupe.querySelectorAll('canvas');
function wireLoupe(st, refOf) {
  const move = e => { const src = e.currentTarget === st.pr ? st.cr : st.cb; const rect = src.getBoundingClientRect(); const fx = (e.clientX - rect.left) / rect.width, fy = (e.clientY - rect.top) / rect.height;
    if (fx < 0 || fy < 0 || fx > 1 || fy > 1) { loupe.classList.remove('on'); return; }
    const W = src.width, H = src.height; const z = 3, s = 160 * dpr() / z; const sx = fx * W - s / 2, sy = fy * H - s / 2;
    const pairSrc = st.cr ? [[lr, st.cr], [lb, st.cb]] : [[lb, st.cb]]; loupe.classList.toggle('one', !st.cr);
    pairSrc.forEach(([c, srcc]) => { const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.clearRect(0, 0, 480, 480); x.drawImage(srcc, sx, sy, s, s, 0, 0, 480, 480); });
    loupe.classList.add('on'); const lx = Math.min(window.innerWidth - (st.cr ? 340 : 180), e.clientX + 18), ly = Math.min(window.innerHeight - 180, e.clientY + 18); loupe.style.left = lx + 'px'; loupe.style.top = ly + 'px'; };
  [st.pr, st.pb].filter(Boolean).forEach(p => { p.addEventListener('pointermove', move); p.addEventListener('pointerleave', () => loupe.classList.remove('on')); });
}

/* ---------- draw everything, rebuild on resize ---------- */
function drawAll() { const d = dpr(); const W = Math.round(822 * Math.min(1, (document.querySelector('#plate .pane')?.clientWidth || 822) / 822) * d); PIN = stats(refCanvas(W, Math.round(W * 810 / 822), { x0: 0, y0: 0, x1: 822, y1: 810 }, false)); panes.forEach(st => { st.draw(); if (st.fill) st.fill(); }); if (window.__fillQuality) window.__fillQuality(); window.READY = true; }
const start = () => { drawAll(); let last = window.innerWidth, t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => { if (Math.abs(window.innerWidth - last) > 70) { last = window.innerWidth; drawAll(); } }, 300); }); };
if (REF.complete && REF.naturalWidth) start(); else REF.addEventListener('load', start);
})();
