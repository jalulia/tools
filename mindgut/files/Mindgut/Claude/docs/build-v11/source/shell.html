<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="light" name="color-scheme"/><title>Mindgut — Documentation · Rev 11</title><link href="{{BRAND_ICON}}" rel="icon"/><meta content="Mindgut documentation: conversation, coded interface examples, files, memory, retrieval and recovery. Interface checked against 2.2.64; backend claims scoped to source." name="description"/><style>{{CSS}}</style></head><body>
<a class="skip" href="#main">Skip to content</a>
<header class="masthead"><div class="masthead-identity"><a aria-label="Mindgut documentation home" class="brand" href="#contents"><span class="brand-lockup"><img alt="" class="brand-mark" src="{{BRAND_MARK}}"/><img alt="Mindgut" class="brand-type" src="{{BRAND_TYPE}}"/></span><span class="brand-label">Documentation</span></a><span class="crumb" id="crumb"></span></div><nav aria-label="Documentation" class="actions"><button aria-controls="chapters-dialog" aria-expanded="false" aria-haspopup="dialog" id="chapters-btn">Guide <span aria-hidden="true">⌄</span></button><button id="find-btn">Search <kbd>⌘ K</kbd></button></nav></header>
<noscript><p class="no-js">This offline guide uses JavaScript for chapter navigation, search and demonstrations. Enable JavaScript to read it.</p></noscript>
<main id="main" tabindex="-1">{{PAGES}}</main>
<dialog aria-labelledby="chapters-title" id="chapters-dialog"><div class="dialog-head"><strong id="chapters-title">Explore the guide</strong><button autofocus="" data-close="">Close</button></div><div class="dialog-body"><div class="chapter-list" id="chapter-list"></div></div></dialog>
<dialog aria-labelledby="search-title" id="search-dialog"><div class="dialog-head"><strong id="search-title">Find in documentation</strong><button data-close="">Close</button></div><div class="dialog-body"><label for="search-input">Search chapters and terms</label><input autocomplete="off" id="search-input" placeholder="e.g. scanner, word phase, recovery" type="search"/><p class="quiet" id="search-count" role="status"></p><ul class="results" id="results"></ul></div></dialog>
<dialog aria-labelledby="zoom-title" id="image-dialog"><div class="dialog-head"><strong id="zoom-title">App capture</strong><button autofocus="" data-close="">Close</button></div><div class="dialog-body"><img alt="" id="zoom-image"/></div></dialog>
<dialog aria-labelledby="ui-title" id="ui-dialog"><div class="dialog-head"><strong id="ui-title">The workspace · example session</strong><button autofocus="" data-close="">Close</button></div><div class="ui-expanded"></div></dialog>
<script id="ui-data" type="application/json">{{UI_DATA}}</script><script>{{UI_JS}}</script>
<script id="fig-data" type="application/json">{{FIG_DATA}}</script><script id="image-data" type="application/json">{{IMAGE_DATA}}</script><script>{{JS}}</script></body></html>
