<!DOCTYPE html><html><head><meta charset="utf-8"><title>the line</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#14452F;overflow:hidden}
svg{width:100vw;height:100vh;display:block}
#p{fill:none;stroke:#F2EEE3;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.draw #p{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 5.5s cubic-bezier(.4,0,.2,1) .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
text{font:500 34px Caveat,cursive;fill:#F2EEE3;letter-spacing:.06em}
.draw text{opacity:0;animation:show .6s ease forwards}
.draw .t1{animation-delay:1.3s}.draw .t2{animation-delay:2.4s}.draw .t3{animation-delay:3.4s}.draw .t4{animation-delay:4.6s}
.t3{fill:#3DDC84}
@keyframes show{to{opacity:1}}
.dot{fill:#3DDC84}.draw .dot{opacity:0;animation:show .5s ease 5.8s forwards}
.k{font:400 10px ui-monospace,Menlo,monospace;letter-spacing:.2em;fill:#5FA46B}
</style></head><body>
<svg id="s" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
 <path id="p" pathLength="1000" d="M -40 520 C 140 500, 170 300, 300 330 C 420 360, 380 600, 520 560 C 650 520, 560 280, 700 300 C 840 320, 760 560, 900 520 C 1010 490, 1040 330, 1240 380"/>
 <text class="t1" dy="-12"><textPath href="#p" startOffset="7%">strand</textPath></text>
 <text class="t2" dy="-12"><textPath href="#p" startOffset="31%">by</textPath></text>
 <text class="t3" dy="-12"><textPath href="#p" startOffset="47%">strand</textPath></text>
 <text class="t4" dy="-12"><textPath href="#p" startOffset="72%">by strand</textPath></text>
 <circle class="dot" cx="1240" cy="380" r="7"/>
 <text class="k" x="40" y="760">ONE LINE · CLICK TO REDRAW</text>
</svg>
<script>
// Static on first paint (so it exists without motion); click draws it on from the start.
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
addEventListener('click',()=>{if(reduce)return;const s=document.getElementById('s');const c=s.cloneNode(true);c.classList.add('draw');s.replaceWith(c)});
</script></body></html>
