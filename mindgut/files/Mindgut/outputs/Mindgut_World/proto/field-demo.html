<!doctype html>
<html><head><meta charset="utf-8"><title>field demo</title>
<style>
  body{margin:0;background:#0B2A1F;display:flex;flex-direction:column;gap:12px;padding:12px}
  canvas{width:100%;display:block}
  #t{height:360px}#r{height:420px}#s{height:140px}
</style></head>
<body>
<canvas id="t"></canvas><canvas id="r"></canvas><canvas id="s"></canvas>
<script type="module">
  import { renderField } from '../lib/field.js';
  const seq = Array.from({ length: 6630 }, () => 'abc'[Math.floor(Math.random() * 3)]);
  renderField(document.getElementById('t'), seq, { mode: 'terrain', palette: 'deep', animate: true });
  renderField(document.getElementById('r'), seq, { mode: 'ring', palette: 'deep', animate: true });
  renderField(document.getElementById('s'), seq, { mode: 'strip', palette: 'deep', animate: true });
</script>
</body></html>
