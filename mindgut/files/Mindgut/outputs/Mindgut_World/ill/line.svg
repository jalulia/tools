<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
<title id="t">Mindgut — strand by strand</title>
<desc id="d">A single ink line enters from the left, makes two loops, and exits right, ending in a tiny bright green dot. The words "strand by strand" ride along the line in handwriting.</desc>
<defs>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#101210"/></pattern>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="2" fill="#101210"/></pattern>
  <g id="folder">
    <path d="M0 0 V-96 Q0 -104 8 -104 H48 L60 -92 H132 Q140 -92 140 -84 V0 Z" fill="#1F3FE0"/>
    <path d="M0 0 V-96 Q0 -104 8 -104 H48 L60 -92 H132 Q140 -92 140 -84 V0 Z" fill="none" stroke="#101210" stroke-width="3" stroke-linejoin="round"/>
    <path d="M6 -84 H134" stroke="#101210" stroke-width="3" stroke-linecap="round"/>
    <rect x="0" y="-60" width="140" height="60" fill="url(#dots)" opacity=".45"/>
    <rect x="26" y="-56" width="88" height="24" rx="3" fill="#F2EEE3" stroke="#101210" stroke-width="2"/>
  </g>
  <path id="lf" d="M0 0 Q14 -14 34 0 Q14 14 0 0 Z"/>
</defs>
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Caveat&amp;display=swap');</style>
  <path id="loop" d="M-20 220 C120 200 220 160 320 200 C420 240 400 320 320 300 C240 280 300 180 420 190 C540 200 640 240 740 220 C840 200 820 300 740 290 C660 280 720 170 860 180 C980 190 1080 210 1160 200"/>
</defs>
<rect width="1200" height="400" fill="#F2EEE3"/>
<rect x="0" y="330" width="1200" height="70" fill="url(#dots)" opacity=".08"/>
<use href="#loop" fill="none" stroke="#101210" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text font-family="Caveat, cursive" font-size="44" fill="#101210"><textPath href="#loop" startOffset="18%">strand by strand</textPath></text>
<circle cx="1160" cy="200" r="5" fill="#3DDC84"/>
</svg>
