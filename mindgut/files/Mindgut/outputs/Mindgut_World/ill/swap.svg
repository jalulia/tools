<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Mindgut — change the model, keep the record</title>
<desc id="d">Two tall arched doorways, cobalt on the left and vermillion on the right. A flat faceless figure mid-stride walks between them carrying a small cobalt folder with a leafy plant.</desc>
<defs>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#101210"/></pattern>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="2" fill="#101210"/></pattern>
  <g id="folder">
    <path d="M0 0 V-96 Q0 -104 8 -104 H48 L60 -92 H132 Q140 -92 140 -84 V0 Z" fill="#1F3FE0"/>
    <path d="M0 0 V-96 Q0 -104 8 -104 H48 L60 -92 H132 Q140 -92 140 -84 V0 Z" fill="none" stroke="#101210" stroke-width="3" stroke-linejoin="round"/>
    <path d="M6 -84 H134" stroke="#101210" stroke-width="3" stroke-linecap="round"/>
    <rect x="0" y="-60" width="140" height="60" fill="url(#dots)" opacity=".45"/>
    <rect x="26" y="-56" width="88" height="24" rx="3" fill="#F2EEE3" stroke="#101210" stroke-width="2"/>
  </g>
  <path id="lf" d="M0 0 Q14 -14 34 0 Q14 14 0 0 Z"/>
</defs>
<rect width="800" height="600" fill="#F2EEE3"/>
<path d="M40 500 H760" stroke="#101210" stroke-width="3" stroke-linecap="round"/>
<rect x="40" y="502" width="720" height="26" fill="url(#hatch)" opacity=".35"/>
<!-- left door: cobalt -->
<g transform="translate(110 500)">
  <path d="M0 0 V-270 A90 90 0 0 1 180 -270 V0 Z" fill="#1F3FE0" stroke="#101210" stroke-width="3" stroke-linejoin="round"/>
  <path d="M0 0 V-270 A90 90 0 0 1 180 -270 V0 Z" fill="url(#dots)" opacity=".35"/>
  <path d="M26 0 V-262 A64 64 0 0 1 154 -262 V0" fill="#F2EEE3" opacity=".9"/>
</g>
<!-- right door: vermillion -->
<g transform="translate(510 500)">
  <path d="M0 0 V-270 A90 90 0 0 1 180 -270 V0 Z" fill="#E8541E" stroke="#101210" stroke-width="3" stroke-linejoin="round"/>
  <path d="M0 0 V-270 A90 90 0 0 1 180 -270 V0 Z" fill="url(#dots)" opacity=".35"/>
  <path d="M26 0 V-262 A64 64 0 0 1 154 -262 V0" fill="#F2EEE3" opacity=".9"/>
</g>
<!-- figure mid-stride, origin at feet -->
<g transform="translate(400 500)" stroke="#101210" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <circle cx="0" cy="-196" r="18" fill="#101210" stroke="none"/>
  <path d="M0 -176 V-96"/>
  <path d="M0 -96 L-34 -40 L-44 0"/>
  <path d="M0 -96 L30 -50 L48 -4"/>
  <path d="M0 -160 L-30 -120 L-6 -100"/>
  <path d="M0 -160 L32 -130 L26 -104"/>
  <g transform="translate(-20 -100) scale(.5)">
    <use href="#folder"/>
    <path d="M70 -84 V-150" stroke="#101210" stroke-width="5"/>
    <g fill="#5FA46B" stroke="none">
      <use href="#lf" transform="translate(70 -120) rotate(-160)"/>
      <use href="#lf" transform="translate(70 -135) rotate(-20)"/>
      <use href="#lf" transform="translate(70 -150) rotate(-110) scale(.8)"/>
    </g>
  </g>
</g>
<circle cx="400" cy="120" r="3" fill="#3DDC84"/>
<text x="400" y="565" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" text-anchor="middle" fill="#101210">CHANGE THE MODEL · KEEP THE RECORD</text>
</svg>
