<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Mindgut — a record that grows</title>
<desc id="d">Four cobalt folders used as planters, each holding the same plant at a later stage of growth: seedling, small, full, flowering. A tiny green dot floats above the last.</desc>
<defs>
  <!-- riso dot screen: shading without gradients -->
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.1" fill="#101210"/>
  </pattern>
  <!-- 45° hatch: alternate shade -->
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="2" fill="#101210"/>
  </pattern>
  <!-- one folder-planter, origin at bottom-left -->
  <g id="folder">
    <path d="M0 0 V-96 Q0 -104 8 -104 H48 L60 -92 H132 Q140 -92 140 -84 V0 Z" fill="#1F3FE0"/>
    <path d="M0 0 V-96 Q0 -104 8 -104 H48 L60 -92 H132 Q140 -92 140 -84 V0 Z" fill="none" stroke="#101210" stroke-width="3" stroke-linejoin="round"/>
    <!-- soil line visible above rim -->
    <path d="M6 -84 H134" stroke="#101210" stroke-width="3" stroke-linecap="round"/>
    <!-- shade band -->
    <rect x="0" y="-60" width="140" height="60" fill="url(#dots)" opacity=".45"/>
    <!-- paper label -->
    <rect x="26" y="-56" width="88" height="24" rx="3" fill="#F2EEE3" stroke="#101210" stroke-width="2"/>
  </g>
  <!-- leaf: a pointed oval on the x axis, 0..L -->
  <path id="lf" d="M0 0 Q14 -14 34 0 Q14 14 0 0 Z"/>
</defs>

<rect width="800" height="600" fill="#F2EEE3"/>

<!-- faint sky dots top-right, print-feel -->
<rect x="560" y="40" width="200" height="120" fill="url(#dots)" opacity=".12"/>

<!-- shelf / ground -->
<path d="M40 480 H760" stroke="#101210" stroke-width="3" stroke-linecap="round"/>
<rect x="40" y="482" width="720" height="26" fill="url(#hatch)" opacity=".35"/>

<!-- ============ 1 · seedling ============ -->
<g transform="translate(70 480)">
  <use href="#folder"/>
  <g stroke="#101210" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 -84 V-118" fill="none"/>
    <g fill="#5FA46B">
      <use href="#lf" transform="translate(70 -116) rotate(-150) scale(.55)"/>
      <use href="#lf" transform="translate(70 -116) rotate(-30) scale(.55)"/>
    </g>
  </g>
  <text x="70" y="-39" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#101210">STRAND 01</text>
</g>

<!-- ============ 2 · small ============ -->
<g transform="translate(250 480)">
  <use href="#folder"/>
  <g stroke="#101210" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 -84 Q68 -150 72 -190" fill="none"/>
    <g fill="#5FA46B">
      <use href="#lf" transform="translate(69 -130) rotate(-160) scale(.8)"/>
      <use href="#lf" transform="translate(69 -150) rotate(-20) scale(.8)"/>
      <use href="#lf" transform="translate(70 -168) rotate(-155) scale(.7)"/>
      <use href="#lf" transform="translate(72 -190) rotate(-70) scale(.6)"/>
    </g>
  </g>
  <text x="70" y="-39" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#101210">STRAND 12</text>
</g>

<!-- ============ 3 · full ============ -->
<g transform="translate(430 480)">
  <use href="#folder"/>
  <g stroke="#101210" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- main stem + two side stems -->
    <path d="M70 -84 Q66 -180 74 -270" fill="none"/>
    <path d="M69 -150 Q40 -170 26 -210" fill="none"/>
    <path d="M71 -190 Q104 -205 118 -240" fill="none"/>
    <g fill="#5FA46B">
      <use href="#lf" transform="translate(69 -120) rotate(-165)"/>
      <use href="#lf" transform="translate(69 -138) rotate(-15)"/>
      <use href="#lf" transform="translate(40 -178) rotate(-200) scale(.85)"/>
      <use href="#lf" transform="translate(26 -210) rotate(-120) scale(.8)"/>
      <use href="#lf" transform="translate(70 -205) rotate(-170) scale(.9)"/>
      <use href="#lf" transform="translate(100 -210) rotate(10) scale(.85)"/>
      <use href="#lf" transform="translate(118 -240) rotate(-60) scale(.8)"/>
      <use href="#lf" transform="translate(72 -240) rotate(-20) scale(.9)"/>
      <use href="#lf" transform="translate(74 -270) rotate(-95) scale(.75)"/>
    </g>
    <!-- darker moss leaves tucked behind for depth, no shadows -->
    <g fill="#2E6B45">
      <use href="#lf" transform="translate(68 -165) rotate(-190) scale(.8)"/>
      <use href="#lf" transform="translate(72 -225) rotate(-150) scale(.8)"/>
    </g>
  </g>
  <text x="70" y="-39" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#101210">STRAND 140</text>
</g>

<!-- ============ 4 · flowering ============ -->
<g transform="translate(610 480)">
  <use href="#folder"/>
  <g stroke="#101210" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 -84 Q64 -200 72 -300" fill="none"/>
    <path d="M68 -170 Q36 -190 22 -236" fill="none"/>
    <path d="M70 -210 Q106 -230 122 -272" fill="none"/>
    <g fill="#5FA46B">
      <use href="#lf" transform="translate(69 -125) rotate(-165)"/>
      <use href="#lf" transform="translate(69 -145) rotate(-15)"/>
      <use href="#lf" transform="translate(44 -192) rotate(-200) scale(.85)"/>
      <use href="#lf" transform="translate(68 -200) rotate(-175) scale(.9)"/>
      <use href="#lf" transform="translate(100 -236) rotate(5) scale(.85)"/>
      <use href="#lf" transform="translate(70 -250) rotate(-20) scale(.9)"/>
    </g>
    <g fill="#2E6B45">
      <use href="#lf" transform="translate(68 -175) rotate(-190) scale(.8)"/>
      <use href="#lf" transform="translate(70 -230) rotate(-150) scale(.8)"/>
    </g>
    <!-- lilac flowers: five-petal rosettes, vermillion centre -->
    <g fill="#B8ADD6">
      <g transform="translate(22 -236)">
        <circle r="9" transform="translate(0 -10)"/><circle r="9" transform="translate(9 -3)"/><circle r="9" transform="translate(6 8)"/><circle r="9" transform="translate(-6 8)"/><circle r="9" transform="translate(-9 -3)"/>
        <circle r="4.5" fill="#E8541E"/>
      </g>
      <g transform="translate(122 -272) scale(.85)">
        <circle r="9" transform="translate(0 -10)"/><circle r="9" transform="translate(9 -3)"/><circle r="9" transform="translate(6 8)"/><circle r="9" transform="translate(-6 8)"/><circle r="9" transform="translate(-9 -3)"/>
        <circle r="4.5" fill="#E8541E"/>
      </g>
      <g transform="translate(72 -304) scale(1.15)">
        <circle r="9" transform="translate(0 -10)"/><circle r="9" transform="translate(9 -3)"/><circle r="9" transform="translate(6 8)"/><circle r="9" transform="translate(-6 8)"/><circle r="9" transform="translate(-9 -3)"/>
        <circle r="4.5" fill="#E8541E"/>
      </g>
    </g>
  </g>
  <!-- the one living accent: a tiny alive dot above the flowering plant -->
  <circle cx="72" cy="-352" r="5" fill="#3DDC84"/>
  <text x="70" y="-39" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#101210">STRAND 1 024</text>
</g>

<!-- caption -->
<text x="40" y="556" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2" fill="#101210">A RECORD THAT GROWS</text>
<text x="760" y="556" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2" text-anchor="end" fill="#2E6B45">MINDGUT · HELIX</text>
</svg>
