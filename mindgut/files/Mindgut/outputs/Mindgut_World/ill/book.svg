<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Mindgut — every exchange kept</title>
<desc id="d">A closed forest-green hardback seen from the fore-edge, slightly rotated, with twelve coloured ribbon markers spilling from the top edge. One ribbon ends in a tiny bright green dot.</desc>
<defs>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#101210"/></pattern>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="2" fill="#101210"/></pattern>
  <g id="folder">
    <path d="M0 0 V-96 Q0 -104 8 -104 H48 L60 -92 H132 Q140 -92 140 -84 V0 Z" fill="#1F3FE0"/>
    <path d="M0 0 V-96 Q0 -104 8 -104 H48 L60 -92 H132 Q140 -92 140 -84 V0 Z" fill="none" stroke="#101210" stroke-width="3" stroke-linejoin="round"/>
    <path d="M6 -84 H134" stroke="#101210" stroke-width="3" stroke-linecap="round"/>
    <rect x="0" y="-60" width="140" height="60" fill="url(#dots)" opacity=".45"/>
    <rect x="26" y="-56" width="88" height="24" rx="3" fill="#F2EEE3" stroke="#101210" stroke-width="2"/>
  </g>
  <path id="lf" d="M0 0 Q14 -14 34 0 Q14 14 0 0 Z"/>
</defs>
<rect width="800" height="600" fill="#F2EEE3"/>
<rect x="560" y="40" width="200" height="120" fill="url(#dots)" opacity=".12"/>
<g transform="translate(400 330) rotate(-12)">
  <!-- back board -->
  <rect x="-200" y="-150" width="400" height="300" rx="6" fill="#14452F" stroke="#101210" stroke-width="3"/>
  <!-- spine edge -->
  <rect x="-200" y="-150" width="40" height="300" rx="6" fill="#14452F" stroke="#101210" stroke-width="3"/>
  <rect x="-200" y="-150" width="40" height="300" fill="url(#dots)" opacity=".35"/>
  <!-- page block seen from fore-edge -->
  <rect x="-150" y="-138" width="340" height="276" fill="#F2EEE3" stroke="#101210" stroke-width="3"/>
  <rect x="-150" y="-138" width="340" height="276" fill="url(#hatch)" opacity=".3"/>
  <!-- front cover slab overhanging -->
  <rect x="-160" y="-150" width="364" height="16" rx="4" fill="#14452F" stroke="#101210" stroke-width="3"/>
  <rect x="-160" y="134" width="364" height="16" rx="4" fill="#14452F" stroke="#101210" stroke-width="3"/>
  <!-- twelve ribbons from the top edge -->
  <g fill="none" stroke-width="10" stroke-linecap="round">
    <path d="M-120 -150 C-130 -200 -170 -210 -190 -260" stroke="#14452F"/>
    <path d="M-95 -150 C-100 -200 -140 -230 -150 -290" stroke="#2E6B45"/>
    <path d="M-70 -150 C-70 -210 -90 -240 -80 -300" stroke="#1F3FE0"/>
    <path d="M-45 -150 C-40 -200 -60 -250 -30 -280" stroke="#E8541E"/>
    <path d="M-20 -150 C-15 -210 -30 -240 0 -310" stroke="#B8ADD6"/>
    <path d="M5 -150 C10 -200 20 -230 10 -270" stroke="#14452F"/>
    <path d="M30 -150 C40 -200 60 -230 50 -300" stroke="#2E6B45"/>
    <path d="M55 -150 C60 -210 100 -230 110 -280" stroke="#1F3FE0"/>
    <path d="M80 -150 C90 -200 120 -220 160 -260" stroke="#E8541E"/>
    <path d="M105 -150 C110 -200 140 -240 150 -310" stroke="#B8ADD6"/>
    <path d="M130 -150 C140 -190 180 -210 200 -240" stroke="#14452F"/>
    <path d="M155 -150 C170 -200 210 -220 240 -290" stroke="#2E6B45"/>
  </g>
  <circle cx="240" cy="-290" r="5" fill="#3DDC84"/>
</g>
<text x="40" y="560" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#101210">EVERY EXCHANGE KEPT · MARKERS YOU CAN RETURN TO</text>
</svg>
