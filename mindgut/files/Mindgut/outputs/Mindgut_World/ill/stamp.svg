<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="300" height="380" role="img" aria-labelledby="t d">
<title id="t">Mindgut stamp 01</title>
<desc id="d">A moss-green postage stamp with perforated edges, an inner paper panel holding one large leaf, MINDGUT across the top and HELIX · CONSTANTLY GROWING along the bottom, numbered 01.</desc>
<defs>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#101210"/></pattern>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="2" fill="#101210"/></pattern>
  <g id="folder">
    <path d="M0 0 V-96 Q0 -104 8 -104 H48 L60 -92 H132 Q140 -92 140 -84 V0 Z" fill="#1F3FE0"/>
    <path d="M0 0 V-96 Q0 -104 8 -104 H48 L60 -92 H132 Q140 -92 140 -84 V0 Z" fill="none" stroke="#101210" stroke-width="3" stroke-linejoin="round"/>
    <path d="M6 -84 H134" stroke="#101210" stroke-width="3" stroke-linecap="round"/>
    <rect x="0" y="-60" width="140" height="60" fill="url(#dots)" opacity=".45"/>
    <rect x="26" y="-56" width="88" height="24" rx="3" fill="#F2EEE3" stroke="#101210" stroke-width="2"/>
  </g>
  <path id="lf" d="M0 0 Q14 -14 34 0 Q14 14 0 0 Z"/>
</defs>
<defs>
  <pattern id="perf" width="14" height="14" patternUnits="userSpaceOnUse" x="-7" y="-7"><circle cx="7" cy="7" r="5" fill="#101210"/></pattern>
  <mask id="perfmask">
    <rect x="0" y="0" width="300" height="380" fill="#fff"/>
    <rect x="0" y="0" width="300" height="14" fill="url(#perf)"/>
    <rect x="0" y="366" width="300" height="14" fill="url(#perf)"/>
    <rect x="0" y="0" width="14" height="380" fill="url(#perf)"/>
    <rect x="286" y="0" width="14" height="380" fill="url(#perf)"/>
  </mask>
</defs>
<rect width="300" height="380" fill="#F2EEE3"/>
<rect x="7" y="7" width="286" height="366" fill="#2E6B45" mask="url(#perfmask)"/>
<rect x="7" y="7" width="286" height="366" fill="url(#dots)" opacity=".15" mask="url(#perfmask)"/>
<rect x="34" y="34" width="232" height="312" fill="#F2EEE3" stroke="#101210" stroke-width="2"/>
<rect x="34" y="246" width="232" height="100" fill="url(#hatch)" opacity=".12"/>
<!-- large leaf -->
<g transform="translate(150 200) rotate(-70)">
  <use href="#lf" fill="#2E6B45" stroke="#101210" stroke-width="1.2" transform="translate(-80 0) scale(4.7 4.2)"/>
  <path d="M-78 0 H78" stroke="#14452F" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#14452F" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M-40 0 L-20 -26"/><path d="M-40 0 L-20 26"/>
    <path d="M-10 0 L10 -30"/><path d="M-10 0 L10 30"/>
    <path d="M20 0 L36 -22"/><path d="M20 0 L36 22"/>
  </g>
</g>
<circle cx="236" cy="62" r="3" fill="#3DDC84"/>
<text x="150" y="68" font-family="ui-monospace, Menlo, monospace" font-size="20" letter-spacing="4" text-anchor="middle" fill="#101210">MINDGUT</text>
<text x="150" y="326" font-family="ui-monospace, Menlo, monospace" font-size="9" letter-spacing="2" text-anchor="middle" fill="#101210">HELIX · CONSTANTLY GROWING</text>
<text x="256" y="336" font-family="ui-monospace, Menlo, monospace" font-size="14" text-anchor="end" fill="#E8541E">01</text>
</svg>
