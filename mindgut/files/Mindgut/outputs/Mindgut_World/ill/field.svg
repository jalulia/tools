<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-labelledby="t d">
<title id="t">Mindgut — the record as terrain</title>
<desc id="d">Nine rows of short vertical dashes recede toward a horizon like a planted field; a pale path snakes from bottom-left toward the horizon and a small figure walks along it.</desc>
<defs>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#101210"/></pattern>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="2" fill="#101210"/></pattern>
  <g id="folder">
    <path d="M0 0 V-96 Q0 -104 8 -104 H48 L60 -92 H132 Q140 -92 140 -84 V0 Z" fill="#1F3FE0"/>
    <path d="M0 0 V-96 Q0 -104 8 -104 H48 L60 -92 H132 Q140 -92 140 -84 V0 Z" fill="none" stroke="#101210" stroke-width="3" stroke-linejoin="round"/>
    <path d="M6 -84 H134" stroke="#101210" stroke-width="3" stroke-linecap="round"/>
    <rect x="0" y="-60" width="140" height="60" fill="url(#dots)" opacity=".45"/>
    <rect x="26" y="-56" width="88" height="24" rx="3" fill="#F2EEE3" stroke="#101210" stroke-width="2"/>
  </g>
  <path id="lf" d="M0 0 Q14 -14 34 0 Q14 14 0 0 Z"/>
</defs>
<defs>
  <pattern id="far" width="22" height="30" patternUnits="userSpaceOnUse"><rect x="10" y="12" width="2" height="6" fill="#5FA46B"/></pattern>
  <pattern id="mid" width="14" height="40" patternUnits="userSpaceOnUse"><rect x="6" y="15" width="2.5" height="10" fill="#2E6B45"/></pattern>
  <pattern id="near" width="8" height="60" patternUnits="userSpaceOnUse"><rect x="3" y="22" width="3" height="16" fill="#14452F"/></pattern>
</defs>
<rect width="1600" height="600" fill="#F2EEE3"/>
<rect x="0" y="0" width="1600" height="150" fill="url(#dots)" opacity=".08"/>
<path d="M0 150 H1600" stroke="#101210" stroke-width="2"/>
<!-- far rows -->
<rect x="0" y="150" width="1600" height="30" fill="url(#far)"/>
<rect x="0" y="180" width="1600" height="30" fill="url(#far)"/>
<rect x="0" y="210" width="1600" height="30" fill="url(#far)"/>
<!-- mid rows -->
<rect x="0" y="240" width="1600" height="40" fill="url(#mid)"/>
<rect x="0" y="280" width="1600" height="40" fill="url(#mid)"/>
<rect x="0" y="320" width="1600" height="40" fill="url(#mid)"/>
<!-- near rows -->
<rect x="0" y="360" width="1600" height="60" fill="url(#near)"/>
<rect x="0" y="420" width="1600" height="60" fill="url(#near)"/>
<rect x="0" y="480" width="1600" height="60" fill="url(#near)"/>
<!-- path -->
<path d="M40 580 C300 540 200 440 460 400 C700 360 760 300 900 260 C1000 230 1080 190 1180 152" fill="none" stroke="#F2EEE3" stroke-width="14" stroke-linecap="round"/>
<path d="M40 580 C300 540 200 440 460 400 C700 360 760 300 900 260 C1000 230 1080 190 1180 152" fill="none" stroke="#101210" stroke-width="1.5" stroke-dasharray="4 8" opacity=".5"/>
<!-- figure about one third along, origin at feet -->
<g transform="translate(400 420)" stroke="#101210" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <circle cx="0" cy="-34" r="5" fill="#101210" stroke="none"/>
  <path d="M0 -28 V-14"/>
  <path d="M0 -14 L-6 0"/><path d="M0 -14 L7 -1"/>
  <path d="M0 -24 L-7 -16"/><path d="M0 -24 L7 -18"/>
</g>
<circle cx="1180" cy="152" r="3" fill="#3DDC84"/>
<text x="40" y="40" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="3" fill="#101210">THE RECORD AS TERRAIN</text>
</svg>
